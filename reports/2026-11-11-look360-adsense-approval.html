<h1 id="look360kr-%EC%95%A0%EB%93%9C%EC%84%BC%EC%8A%A4-%EC%8A%B9%EC%9D%B8-%EC%A7%84%EB%8B%A8">look360.kr 애드센스 승인 진단</h1>
<h2 id="%EC%99%9C-%EB%91%90-%EB%B2%88-%EB%A7%89%ED%98%94%EA%B3%A0-%EB%AC%B4%EC%97%87%EC%9D%84-%EA%B3%A0%EC%B9%98%EB%A9%B4-%EC%8A%B9%EC%9D%B8-%EA%B0%80%EB%8A%A5%EC%84%B1%EC%9D%B4-%EB%86%92%EC%95%84%EC%A7%80%EB%8A%94%EA%B0%80">왜 두 번 막혔고, 무엇을 고치면 승인 가능성이 높아지는가</h2>
<hr />
<p>공개 페이지 4,002개 전수 점검  ·  2026-11-11</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="clean" data-style=".stats .card .lab { font-size: 0.55em; }

<h2 id="%EA%B2%B0%EB%A1%A0-%EB%A8%BC%EC%A0%80--%EC%82%AC%EC%9D%B4%ED%8A%B8%EA%B0%80-%EB%82%98%EC%81%9C-%EA%B2%8C-%EC%95%84%EB%8B%88%EB%9D%BC-%EC%8B%AC%EC%82%AC%EC%97%90%EC%84%9C-%EC%A2%8B%EC%9D%80-%EB%A9%B4%EC%9D%B4-%EC%95%88-%EB%B3%B4%EC%9E%85%EB%8B%88%EB%8B%A4">결론 먼저 — 사이트가 나쁜 게 아니라, 심사에서 좋은 면이 안 보입니다</h2>
<div class="stats">
<div class="card"><div class="num">0건</div><div class="lab">성인·도박·스팸 등<br />명백한 금지 콘텐츠</div></div>
<div class="card"><div class="num">52%</div><div class="lab">VR 페이지의 설명글을<br />방문자가 읽을 수 없음</div></div>
<div class="card"><div class="num">약 1,300</div><div class="lab">4,002개 중 심사에<br />보여줄 만한 페이지(추정)</div></div>
</div>
<ul>
<li><strong>가장 큰 원인 추정:</strong> VR 화면만 보이고 읽을 글이 없는 페이지가 과반이고, 얇거나 겹치는 페이지도 전부 심사 대상으로 열려 있습니다</li>
<li><strong>권고:</strong> 지금 상태로 재신청하지 말고, <span class="hl-blue">약 6주</span> 정비 후 신청하세요. 4,000개를 다 고칠 필요는 없습니다</li>
<li><strong>먼저 알아둘 한계:</strong> 구글은 페이지별 거절 이유를 알려주지 않습니다. 원인은 공식 기준과 실측에 근거한 판단이며, 승인을 보장하지는 못합니다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="clean" data-style=".stats .card .lab { font-size: 0.55em; }

<h2 id="%EC%99%9C-%EC%98%A4%EB%9E%98-%EC%9A%B4%EC%98%81%ED%96%88%EA%B3%A0-%EC%BD%98%ED%85%90%EC%B8%A0%EB%8F%84-%EB%A7%8E%EC%9D%80%EB%8D%B0-%EB%96%A8%EC%96%B4%EC%A1%8C%EC%9D%84%EA%B9%8C">왜 오래 운영했고 콘텐츠도 많은데 떨어졌을까</h2>
<p>운영 기간과 콘텐츠 수는 애드센스의 합격 기준이 아닙니다. 구글은 <strong>글로 읽히는 고유한 콘텐츠</strong>를 먼저 봅니다.</p>
<table>
<thead>
<tr>
<th>구글 공식 문서의 문장</th>
<th>look360.kr에 대입하면</th>
</tr>
</thead>
<tbody>
<tr>
<td>「콘텐츠의 대부분이 이미지, 동영상 또는 플래시 애니메이션인 사이트는 승인되지 않을 가능성이 큽니다.」</td>
<td>핵심 콘텐츠가 360° 이미지 뷰어입니다</td>
</tr>
<tr>
<td>「콘텐츠에는 완전한 문장이나 구문이 있어야 하며, 제목만 나열하는 것은 허용되지 않습니다.」</td>
<td>장소 이름·주소·장면 이름 위주인 페이지가 많습니다</td>
</tr>
<tr>
<td>「자동 생성 페이지 또는 자체 제작 콘텐츠가 거의 없거나 전혀 없는 페이지에 광고 코드를 삽입해서는 안 됩니다.」</td>
<td>모든 페이지에 광고 코드가 들어가 있습니다</td>
</tr>
</tbody>
</table>
<p>직접 촬영한 VR은 큰 강점입니다. 다만 <strong>VR의 가치를 글로 설명해 주지 않으면 심사에서 드러나지 않습니다.</strong></p>
<div class="links"><span class="lbl">출처</span>
<a class="lnk" href="https://support.google.com/adsense/answer/81904?hl=ko" target="_blank">애드센스 계정이 승인되지 않았습니다</a></div>
</section>

<h1 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EC%8A%B9%EC%9D%B8%EC%9D%84-%EB%A7%89%EA%B3%A0-%EC%9E%88%EB%82%98">무엇이 승인을 막고 있나</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="clean" data-style=".stats .card .lab { font-size: 0.55em; }

<h2 id="%EB%AC%B8%EC%A0%9C-%E2%91%A0-vr-%ED%8E%98%EC%9D%B4%EC%A7%80%EC%97%90%EB%8A%94-%EC%82%AC%EB%9E%8C%EC%9D%B4-%EC%9D%BD%EC%9D%84-%EA%B8%80%EC%9D%B4-%EC%97%86%EC%8A%B5%EB%8B%88%EB%8B%A4">문제 ① VR 페이지에는 사람이 읽을 글이 없습니다</h2>
<p><img src="assets/2026-11-11-adsense/vr-viewer.jpg" alt="" style="width:570px;" /></p>
<p>뷰어가 화면을 100% 채우고 설명글은 그 아래 화면 밖에 있습니다. 스크롤도 되지 않아 <strong>VR·VR스토리 2,081개(전체의 52%)</strong> 가 해당합니다.</p>
<div class="links"><span class="lbl">직접 확인</span>
<a class="lnk" href="https://look360.kr/vr/vridge_seoul_history_course/vridge1" target="_blank">VRIDGE 서울 무장애 코스</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" data-style=".stats .card .lab { font-size: 0.55em; }
" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:clean;--style:.stats .card .lab { font-size: 0.55em; }
;" data-marpit-pagination-total="29">
<h2 id="%EB%AC%B8%EC%A0%9C-%E2%91%A0%EC%9D%B4-%ED%8A%B9%ED%9E%88-%EC%9C%84%ED%97%98%ED%95%9C-%EC%9D%B4%EC%9C%A0--8%EC%9B%94-%EB%8C%80%EC%9D%91%EC%9D%B4-%EC%97%AD%ED%9A%A8%EA%B3%BC%EB%A5%BC-%EB%83%88%EC%9D%84-%EC%88%98-%EC%9E%88%EC%8A%B5%EB%8B%88%EB%8B%A4">문제 ①이 특히 위험한 이유 — 8월 대응이 역효과를 냈을 수 있습니다</h2>
<ul>
<li>8월에 구글 로봇이 읽도록 VR 페이지에 설명글을 넣었습니다. 하지만 <strong>로봇만 읽고 방문자는 볼 수 없는</strong> 구조가 되었습니다</li>
<li>구글 스팸 정책은 숨겨진 텍스트를 이렇게 정의합니다</li>
</ul>
<blockquote>
<p>「검색엔진만 조작하고 인간인 방문자에게는 쉽게 드러나지 않는 방식으로 페이지에 콘텐츠를 배치하는 행위」 — 예시: 「CSS를 사용하여 텍스트를 화면에 보이지 않도록 배치」</p>
</blockquote>
<ul>
<li>조작 의도는 없었더라도 <strong>겉으로는 같은 모양</strong>입니다. 8월에 이 작업 후에도 반려되었습니다</li>
<li>실측: 화면 높이 900px, 글 시작 위치 920px, 마우스 휠을 굴려도 이동 0px, 오른쪽 위 메뉴를 열어도 설명 없음(표본 확인)</li>
</ul>
<p><span class="hl-blue">조치</span> 뷰어 아래로 스크롤하면 글이 나오도록 바꾸거나, 해당 페이지를 검색 제외로 돌립니다.</p>
<div class="links"><span class="lbl">출처</span>
<a class="lnk" href="https://developers.google.com/search/docs/essentials/spam-policies?hl=ko" target="_blank">구글 검색 스팸 정책</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="clean" data-style=".stats .card .lab { font-size: 0.55em; }
" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:clean;--style:.stats .card .lab { font-size: 0.55em; }
;" data-marpit-pagination-total="29">
<h2 id="%EB%AC%B8%EC%A0%9C-%E2%91%A1-%EB%82%B4%EC%9A%A9%EC%9D%B4-%EC%96%87%EC%9D%80-%ED%8E%98%EC%9D%B4%EC%A7%80%EA%B0%80-%EA%B7%B8%EB%8C%80%EB%A1%9C-%EC%8B%AC%EC%82%AC-%EB%8C%80%EC%83%81%EC%9E%85%EB%8B%88%EB%8B%A4">문제 ② 내용이 얇은 페이지가 그대로 심사 대상입니다</h2>
<div class="stats">
<div class="card"><div class="num">626개</div><div class="lab">장소 페이지 설명 100자 미만<br />(1,636개 중 38%, 0자 226개 포함)</div></div>
<div class="card"><div class="num">45개</div><div class="lab">회원 페이지 56개 중<br />「등록된 VR스토리가 없습니다」</div></div>
<div class="card"><div class="num">0개</div><div class="lab">검색 제외(noindex) 처리된<br />사이트맵 페이지</div></div>
</div>
<p><strong>120개 표본을 직접 읽은 결과 (추정)</strong></p>
<table>
<thead>
<tr>
<th>A 충분한 정보</th>
<th>B 쓸 만하지만 얇음</th>
<th>C 이름·주소 수준</th>
<th>D 거의 비어 있음</th>
</tr>
</thead>
<tbody>
<tr>
<td><span class="hl-green">약 11%</span></td>
<td>약 56%</td>
<td><span class="hl-amber">약 32%</span></td>
<td><span class="hl-red">약 1%</span></td>
</tr>
</tbody>
</table>
<p>애드센스는 <strong>사이트 전체</strong>를 검토합니다. 좋은 페이지가 있어도 약 1,300개의 C·D 페이지가 첫인상을 깎습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="clean" data-style=".stats .card .lab { font-size: 0.55em; }
" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:clean;--style:.stats .card .lab { font-size: 0.55em; }
;" data-marpit-pagination-total="29">
<h2 id="%EB%AC%B8%EC%A0%9C-%E2%91%A2-%ED%8E%98%EC%9D%B4%EC%A7%80%EB%81%BC%EB%A6%AC-%EB%82%B4%EC%9A%A9%EC%9D%B4-%EA%B2%B9%EC%B9%98%EA%B3%A0-%EC%9E%90%EB%8F%99-%EB%AC%B8%EC%9E%A5%EC%9D%B4-%EB%A7%8E%EC%8A%B5%EB%8B%88%EB%8B%A4">문제 ③ 페이지끼리 내용이 겹치고, 자동 문장이 많습니다</h2>
<table>
<thead>
<tr>
<th>무엇이 겹치나</th>
<th>규모</th>
</tr>
</thead>
<tbody>
<tr>
<td>거의 똑같은 페이지</td>
<td><strong>622개</strong>(15.6%), 인디스팟 계정 38개 묶음이 최대</td>
</tr>
<tr>
<td>VR 페이지 중 장소 페이지에 없는 설명이 있는 곳</td>
<td>2,001개 중 <strong>137개뿐</strong>(6.8%)</td>
</tr>
<tr>
<td>같은 장소의 VR끼리 설명이 사실상 동일</td>
<td>86.7%</td>
</tr>
<tr>
<td>프로그램이 자동으로 붙이는 문장</td>
<td><strong>810개</strong>(20.2%)</td>
</tr>
<tr>
<td>제목이 겹치는 VR 페이지</td>
<td>526개</td>
</tr>
</tbody>
</table>
<p>실제 자동 문장 예시입니다.</p>
<blockquote>
<p>「개포중학교는 서울시 강남구에 자리한 학교 · 중학교입니다. 이 VR 투어는 총 3개 장면으로 구성되어 있습니다. 마우스 드래그 또는 화면 터치로 시점을 360도 돌려볼 수 있으며…」</p>
</blockquote>
<p>구글은 사람의 검토 없이 자동으로 만든 콘텐츠에는 광고를 게재할 수 없다고 명시합니다. <span class="hl-red">8월에 지운 복제 문장과 같은 성격의 문장이 프로그램으로 계속 생성되고 있습니다.</span></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="clean" data-style=".stats .card .lab { font-size: 0.55em; }
" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:clean;--style:.stats .card .lab { font-size: 0.55em; }
;" data-marpit-pagination-total="29">
<h2 id="%EB%AC%B8%EC%A0%9C-%E2%91%A3-%EB%8B%A4%EB%A5%B8-%EA%B3%B3%EC%97%90%EC%84%9C-%EA%B0%80%EC%A0%B8%EC%98%A8-%EA%B8%80%EC%9D%B4-%EB%A7%8E%EC%8A%B5%EB%8B%88%EB%8B%A4">문제 ④ 다른 곳에서 가져온 글이 많습니다</h2>
<table>
<thead>
<tr>
<th>유형</th>
<th>규모</th>
<th>위험도</th>
<th>조치</th>
</tr>
</thead>
<tbody>
<tr>
<td>설명문 끝에 「위키백과」 표기</td>
<td><strong>525쪽</strong>(대부분 대학·학교)</td>
<td><span class="hl-red">높음</span></td>
<td>자체 글로 교체, 그 전까지 검색 제외·광고 제외</td>
</tr>
<tr>
<td>뉴스 기사 전재</td>
<td><strong>11쪽</strong>, 「무단 전재 금지」 포함 1건</td>
<td><span class="hl-red">높음</span></td>
<td>기사 링크 + 2~3줄 자체 요약</td>
</tr>
<tr>
<td>각주 번호 <code>[1]</code>이 남은 글</td>
<td>장소 50, VR 57</td>
<td>중간</td>
<td>다듬거나 교체</td>
</tr>
<tr>
<td>관광공사 블로그 등 출처 표기</td>
<td>다수</td>
<td>중간</td>
<td>제휴·납품 여부 확인 후 글 추가</td>
</tr>
</tbody>
</table>
<p>구글 정책은 <strong>논평, 선별, 부가 가치 없이 복사한 콘텐츠가 있는 화면</strong>에 광고 게재를 금지합니다. 위키백과는 재사용이 허용되는 글이지만, 그것만으로는 <strong>독창적인 콘텐츠로 인정받지 못합니다.</strong></p>
<p>외부 출처 신호가 있는 페이지는 장소·VR 각각 약 17%입니다(자동 측정). 실제 복제 여부는 일부만 대조했습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="clean" data-style=".stats .card .lab { font-size: 0.55em; }
" lang="C" data-marpit-pagination="13" style="--paginate:true;--theme:clean;--style:.stats .card .lab { font-size: 0.55em; }
;" data-marpit-pagination-total="29">
<h2 id="%EB%AC%B8%EC%A0%9C-%E2%91%A4-%EB%88%84%EA%B0%80-%EC%9A%B4%EC%98%81%ED%95%98%EB%8A%94-%EC%82%AC%EC%9D%B4%ED%8A%B8%EC%9D%B8%EC%A7%80-%EC%95%8C%EA%B8%B0-%EC%96%B4%EB%A0%B5%EC%8A%B5%EB%8B%88%EB%8B%A4">문제 ⑤ 누가 운영하는 사이트인지 알기 어렵습니다</h2>
<div class="cols">
<div class="col">
<h3 id="%ED%9A%8C%EC%82%AC%EC%9A%B4%EC%98%81%EC%9E%90-%EC%A0%95%EB%B3%B4">회사·운영자 정보</h3>
<ul>
<li><strong>회사 소개 페이지가 없습니다.</strong> 메뉴의 「LOOK360이란?」은 2016년 FAQ 글로 연결됩니다</li>
<li>indyspot.kr도 look360.kr로 되돌아옵니다</li>
<li>대표자·사업자번호·통신판매번호는 코드에만 있고 <strong>화면에 보이지 않습니다</strong> (약관 제3조와 어긋남)</li>
<li>푸터 호스팅 사업자가 Azure로 남아 있지만 실제는 AWS입니다</li>
</ul>
</div>
<div class="col">
<h3 id="%EB%B0%A9%EC%B9%98%EB%90%9C-%EA%B3%B5%EA%B0%9C-%EA%B2%8C%EC%8B%9C%EB%AC%BC">방치된 공개 게시물</h3>
<ul>
<li>파노라마 신청 게시판 공개 글 91건: <span class="hl-red">빈 글 86건, 공격 문자열 노출 5건</span></li>
<li>360동영상 게시글 45건: 영상 없이 주소만 있음</li>
<li>FAQ의 약 90%가 2016년 글</li>
<li>2018년 행사가 지금도 「개최될 예정」으로 표시</li>
<li>내부 메모 글이 사이트맵에 포함</li>
<li>게시글 신고 버튼이 꺼져 있음</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="clean" data-style=".stats .card .lab { font-size: 0.55em; }

<div class="cols">
<div class="col">
<h3 id="%EA%B4%91%EA%B3%A0-%EC%BD%94%EB%93%9C%EA%B0%80-%EB%84%88%EB%AC%B4-%EB%84%93%EA%B2%8C-%EB%93%A4%EC%96%B4%EA%B0%80-%EC%9E%88%EC%9D%8C">광고 코드가 너무 넓게 들어가 있음</h3>
<ul>
<li>관리자·임베드 화면만 빼고 <strong>전 페이지</strong>에 출력</li>
<li>로그인, 없는 페이지 안내, 전체화면 뷰어까지 포함</li>
<li>공식 기준: 콘텐츠 없는 화면과 자동 생성 페이지에는 광고 코드를 넣지 말 것</li>

<div class="col">
<h3 id="%EA%B5%AC%EA%B8%80-%EB%A1%9C%EB%B4%87%EC%9D%B4-%EC%97%89%EB%9A%B1%ED%95%9C-%EA%B3%B3%EC%97%90-%EC%8B%9C%EA%B0%84%EC%9D%84-%EC%94%80-14%EC%9D%BC">구글 로봇이 엉뚱한 곳에 시간을 씀 (14일)</h3>
<ul>
<li>전체 방문 10,778건 중 <span class="hl-amber">63%</span>가 삭제된 스티커 주소</li>
<li>실제 콘텐츠 방문은 약 30%</li>
<li>사이트맵 대비 방문률: 장소 약 28%, VR 약 7%</li>
</ul>
</div>
</div>
<p>스티커 주소를 삭제 처리(410)한 것은 올바른 조치이고, 시간이 지나면 줄어듭니다. 다만 <strong>고친 내용을 구글이 다시 읽는 데 몇 주가 걸린다</strong>는 뜻이므로, 수정 직후 재신청하면 안 됩니다.</p>
</section>

<div class="cols">
<div class="col">

</div>
<div class="col">

</ol>

</div>
<p>AI는 초안을 돕는 데만 쓰고, <strong>촬영 담당자가 사실을 확인한 뒤</strong> 발행합니다.</p>

</tr>
<tr>
<td><strong>Google Ad Manager 파트너</strong></td>

<td>애드센스 반려가 해당되는지 파트너에게 사전 확인 필요</td>
</tr>
<tr>

</tr>
</tbody>
</table>
<p><strong>광고가 아닌 수익도 함께 보세요.</strong> 이번 정비의 결과물은 애드센스 외에도 쓸모가 있습니다.</p>

<li>검색 유입 품질 개선: 얇은 페이지가 줄고 대표 콘텐츠가 늘어납니다</li>

<h2 id="%EC%A7%81%EC%A0%91-%EA%B2%B0%EC%A0%95%ED%95%B4-%EC%A3%BC%EC%85%94%EC%95%BC-%ED%95%98%EB%8A%94-%EB%84%A4-%EA%B0%80%EC%A7%80">직접 결정해 주셔야 하는 네 가지</h2>
<table>
<thead>
<tr>
<th>결정 사항</th>
<th>추천</th>
<th>이유</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1. VR 페이지 처리</strong></td>
<td>뷰어 아래 설명 영역 추가 + 고유 글이 없는 VR은 검색 제외</td>
<td>사용자 경험은 지키고 숨은 글은 없앰</td>
</tr>
<tr>
<td><strong>2. 검색 제외 범위</strong></td>
<td>약 2,700개 제외, 유입 있는 페이지는 예외</td>
<td>제외 없이는 사이트 평가가 좋아지기 어려움</td>
</tr>
<tr>
<td><strong>3. 대표 글 300개 작성</strong></td>
<td>촬영 담당자 + AI 초안 + 사람 검수</td>
<td>직접 촬영 정보가 유일한 차별점</td>
</tr>
<tr>
<td><strong>4. 위키백과 글 525쪽</strong></td>
<td>자체 글 교체 전까지 검색·광고 제외</td>
<td>고쳐 쓰는 양이 많아 우선순위로 나눠야 함</td>
</tr>
</tbody>
</table>
<p><span class="hl-amber">주의</span> 검색 제외는 일시적으로 해당 페이지의 검색 유입을 줄일 수 있습니다. 서치 콘솔 수치를 보고 제외 범위를 정해야 합니다.</p>
<p><strong>추가로 확인해 주시면 정확도가 올라갑니다:</strong> 애드센스 콘솔의 최근 거절 문구, 서치 콘솔의 색인 현황과 유입 상위 페이지.</p>
</section>

<h1 id="%EC%A0%95%EB%A6%AC">정리</h1>
<p><strong>VR의 가치가 글로 보이도록 고치고, 심사받을 페이지를 약 1,300개로 좁힌 뒤, 300개를 제대로 쓰고 6주 후 한 번 신청합니다.</strong></p>
<hr />

  const im = document.createElement('img');
  im.draggable = false;
  im.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;' +
    'border-radius:4px;box-shadow:0 12px 44px rgba(0,0,0,.5);will-change:transform';
  ov.appendChild(im);

  const hud = document.createElement('div');
  hud.style.cssText = 'position:absolute;right:16px;top:14px;display:flex;gap:8px;align-items:center;' +
    'font:600 13px/1 system-ui,-apple-system,sans-serif;color:#eaf0fb;pointer-events:none';
  const chip = 'background:rgba(255,255,255,.15);padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px)';
  const tip = document.createElement('span'); tip.style.cssText = chip + ';transition:opacity .4s';
  const pct = document.createElement('span'); pct.style.cssText = chip + ';font-variant-numeric:tabular-nums';
  const xb  = document.createElement('button'); xb.textContent = '✕'; xb.setAttribute('aria-label', '닫기');
  xb.style.cssText = chip + ';pointer-events:auto;border:0;color:#fff;width:36px;height:36px;padding:0;' +
    'font:600 16px/1 system-ui;cursor:pointer';
  hud.append(tip, pct, xb);
  ov.appendChild(hud);

  let nw = 0, nh = 0, fit = 1, s = 1, tx = 0, ty = 0;
  let drag = false, lx = 0, ly = 0, moved = false, tipT = 0;

  const clamp = () => {
    const W = innerWidth, H = innerHeight, w = nw * s, h = nh * s;
    tx = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, tx));
    ty = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, ty));
  };
  const draw = () => {
    im.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    pct.textContent = Math.round(s * 100) + '%';
    const big = nw * s > innerWidth + 1 || nh * s > innerHeight + 1;
    im.style.cursor = big ? (drag ? 'grabbing' : 'grab') : (s < 1 ? 'zoom-in' : 'zoom-out');
  };
  const zoom = (ns, cx, cy) => {
    ns = Math.max(Math.min(fit, 1) * 0.9, Math.min(ns, MAXZ));
    const k = ns / s;
    tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k;
    s = ns; clamp(); draw();
  };
  const showTip = (t) => {
    tip.textContent = t; tip.style.opacity = '1';
    clearTimeout(tipT); tipT = setTimeout(() => { tip.style.opacity = '0'; }, 2600);
  };
  const close = () => { ov.style.display = 'none'; im.removeAttribute('src'); document.body.style.overflow = ''; };

  const open = (src) => {
    im.onload = () => {
      nw = im.naturalWidth; nh = im.naturalHeight;
      im.style.width = nw + 'px'; im.style.height = nh + 'px';
      fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
      s = Math.min(fit, 1);            // 원본보다 크게는 띄우지 않는다
      tx = ty = 0; clamp(); draw();
      showTip(fit < 0.995 ? '클릭하면 원본 크기 · 드래그 이동 · ESC 닫기' : '휠로 확대 · ESC 닫기');
    };
    im.src = src;
    ov.style.display = 'block';
    document.body.style.overflow = 'hidden';
  };

  // 배경 클릭 → 닫기 / 이미지 클릭 → 맞춤 ↔ 원본 토글
  ov.addEventListener('click', (e) => {
    e.stopPropagation();
    if (moved) { moved = false; return; }
    if (e.target === xb || e.target === ov) { close(); return; }
    if (e.target === im) {
      const f = Math.min(fit, 1);
      zoom(s > f + 0.005 ? f : Math.max(1, f * 2), e.clientX, e.clientY);
    }
  });

  // 드래그 이동 (마우스 · 터치 공통)
  im.addEventListener('pointerdown', (e) => {
    if (nw * s <= innerWidth && nh * s <= innerHeight) return;
    drag = true; moved = false; lx = e.clientX; ly = e.clientY;
    im.setPointerCapture(e.pointerId); draw(); e.preventDefault();
  });
  im.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    tx += dx; ty += dy; lx = e.clientX; ly = e.clientY; clamp(); draw();
  });
  const endDrag = (e) => { if (drag) { drag = false; try { im.releasePointerCapture(e.pointerId); } catch (_) {} draw(); } };
  im.addEventListener('pointerup', endDrag);
  im.addEventListener('pointercancel', endDrag);

  // 휠 줌 (슬라이드 전환으로 새지 않게 차단)
  ov.addEventListener('wheel', (e) => {
    e.preventDefault(); e.stopPropagation();
    zoom(s * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY);
  }, { passive: false });

  // 핀치 줌
  let pts = new Map(), pd = 0;
  ov.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') pts.set(e.pointerId, e); });
  ov.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'touch' || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pts.size !== 2) return;
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pd) { moved = true; zoom(s * (d / pd), (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); }
    pd = d;
  });
  const dropPt = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pd = 0; };
  ov.addEventListener('pointerup', dropPt);
  ov.addEventListener('pointercancel', dropPt);

  // 열려 있는 동안 키보드는 전부 여기서 소비 (화살표가 슬라이드를 넘기면 안 된다)
  document.addEventListener('keydown', (e) => {
    if (ov.style.display === 'none') return;
    const cx = innerWidth / 2, cy = innerHeight / 2;
    if (e.key === 'Escape') close();
    else if (e.key === '+' || e.key === '=') zoom(s * 1.25, cx, cy);
    else if (e.key === '-' || e.key === '_') zoom(s / 1.25, cx, cy);
    else if (e.key === '0') zoom(Math.min(fit, 1), cx, cy);
    else if (e.key === '1') zoom(1, cx, cy);
    else if (e.key === 'ArrowLeft') { tx += 60; clamp(); draw(); }
    else if (e.key === 'ArrowRight') { tx -= 60; clamp(); draw(); }
    else if (e.key === 'ArrowUp') { ty += 60; clamp(); draw(); }
    else if (e.key === 'ArrowDown') { ty -= 60; clamp(); draw(); }
    else return;
    e.preventDefault(); e.stopPropagation();
  }, true);

  addEventListener('resize', () => {
    if (ov.style.display === 'none' || !nw) return;
    fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
    clamp(); draw();
  });

  const ready = () => {
    document.body.appendChild(ov);
    document.addEventListener('click', (e) => {
      const t = e.target;
      if (t && t.tagName === 'IMG' && t.closest('section') && !t.classList.contains('emoji')) {
        e.preventDefault(); e.stopPropagation(); open(t.currentSrc || t.src);
      }
    }, true);
  };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', ready) : ready();
})();
</script>
</body></html>
