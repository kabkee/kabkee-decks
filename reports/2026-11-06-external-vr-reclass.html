<h2 id="%F0%9F%9A%A8-%EB%B0%B0%EA%B2%BD--%EC%99%B8%EB%B6%80vr-%EC%9D%B4-%EB%AA%A9%EB%A1%9D%EC%97%90%EB%8F%84-%EA%B2%80%EC%83%89%EC%97%90%EB%8F%84-%EC%95%88-%EB%82%98%EC%98%A4%EB%8A%94-%EC%9D%B4%EC%9C%A0-span-classbadge-date1106span"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> 배경 — 외부VR 이 목록에도 검색에도 안 나오는 이유 <span class="badge-date">11/06</span></h2>
<table>
<thead>
<tr>
<th>화면</th>
<th>현재 동작</th>
<th>외부VR</th>
</tr>
</thead>
<tbody>
<tr>
<td>vr-list</td>
<td>업종(카테고리)이 있는 콘텐츠만 노출</td>

</tr>
<tr>
<td>검색결과 VR 탭</td>
<td>업종 조건 없이 노출</td>
<td>「서울」 검색 540건 중 403건이 외부VR</td>
</tr>
<tr>
<td>검색결과를 vr-list 기준으로 통일하면</td>
<td>vr-list 와 같은 조건</td>
<td>검색에서도 <span class="hl-red">0건</span></td>
</tr>
</tbody>
</table>
<ul>
<li>9/23 오너 결정은 「자동 분류 → 관리자 검증 → 이관」이었지만 검토가 승인 105건에서 멈춰 있었습니다</li>
<li>그래서 검색 방향 카드(IND-8592)에 답하기 전에 <span class="hl-green">분류부터 채우기</span>로 했습니다</li>
</ul>

<h2 id="%F0%9F%94%81-%EC%9E%91%EC%97%85-%ED%9D%90%EB%A6%84--1%EC%B0%A8-%EC%8B%9C%EB%8F%84%EC%97%90%EC%84%9C-%EB%AC%B8%EC%A0%9C%EB%A5%BC-%EC%B0%BE%EA%B3%A0-%EB%B0%A9%EC%8B%9D%EC%9D%84-%EB%B0%94%EA%BF%A8%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge-date1106span"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> 작업 흐름 — 1차 시도에서 문제를 찾고 방식을 바꿨습니다 <span class="badge-date">11/06</span></h2>

</ul>
</section>

<p><span class="sec-num">Section 02</span></p>
<h2 id="%EC%A7%80%EC%97%AD--area15-%EB%A5%BC-%EC%96%B4%EB%96%BB%EA%B2%8C-%EC%B1%84%EC%9B%A0%EB%82%98">지역 — area1~5 를 어떻게 채웠나</h2>
<p>GPS 를 기본으로, 의심스러운 좌표는 주소로 다시 찾았습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="18">
<h2 id="%F0%9F%93%8D-%EC%A7%80%EC%97%AD-%ED%8C%90%EC%A0%95-%EB%B0%A9%EC%8B%9D-span-classbadge-date1106span"><img class="emoji" draggable="false" alt="📍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cd.svg" data-marp-twemoji=""/> 지역 판정 방식 <span class="badge-date">11/06</span></h2>
<table>
<thead>
<tr>
<th>단계</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>① GPS 역지오코딩</td>
<td>구글이 주는 「시·도 → 시 → 구·군 → 읍·면 → 동·리」 이름을 받음</td>
</tr>
<tr>
<td>② 지역 테이블 매칭</td>
<td>위에서부터 차례로 찾아 내려감 · area 번호 = 지역 테이블 레벨</td>
</tr>
<tr>
<td>③ 의심 좌표 재판정</td>
<td>다른 장소와 좌표 공유 · 주소와 시·도 불일치 → 주소로 다시 지오코딩</td>
</tr>
<tr>
<td>④ 없는 단계</td>
<td>한국은 신규 노드(구글 이름) · 해외는 dr5hn 도시 승격으로 채움</td>
</tr>
</tbody>
</table>
<ul>
<li>서울은 area1·3·5(시·구·동), 경기 일반시는 area1·2·4·5 처럼 기존 360VIEW 장소와 같은 방식입니다</li>
<li>결과: 한국 1,526건 중 <span class="hl-green">1,509건이 area5 까지</span> · 해외 539건이 도시(area2)까지</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="18">
<h2 id="%E2%9A%A0%EF%B8%8F-gps-%ED%95%A8%EC%A0%95--%EC%A2%8C%ED%91%9C%EA%B0%80-%EB%B3%B5%EC%82%AC%EB%90%9C-%EC%BD%98%ED%85%90%EC%B8%A0%EA%B0%80-%EB%A7%8E%EC%95%98%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge-date1106span"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> GPS 함정 — 좌표가 복사된 콘텐츠가 많았습니다 <span class="badge-date">11/06</span></h2>
<table>
<thead>
<tr>
<th>같은 좌표</th>
<th>몰린 콘텐츠</th>
</tr>
</thead>
<tbody>
<tr>
<td>예산군 응봉면 1곳</td>
<td>국립민속박물관 · 국립한글박물관 · 천리포수목원 · 신두리 해안사구 등 <span class="hl-red">43건</span></td>
</tr>
<tr>
<td>정선군 화암면 1곳</td>
<td>강릉 선교장 · 뮤지엄산 · 코엑스 별마당 도서관 등 12건</td>
</tr>
<tr>
<td>포항 송라면 1곳</td>
<td>김천 직지사 · 보은 법주사 · 안동 봉정사 등 사찰 8건</td>
</tr>
</tbody>
</table>
<ul>
<li>같은 좌표를 3건 이상 공유하는 묶음이 83개(581건)였습니다</li>
<li>이 중 서로 다른 장소이거나 주소와 시·도가 어긋난 <span class="hl-amber">425건</span>은 주소로 다시 찾았습니다 → 불일치 187건 → <span class="hl-green">9건</span></li>
</ul>
<blockquote>
<p>«GPS 는 정확하다»는 전제는 이번 데이터에선 성립하지 않았습니다. 원본 좌표 정리는 별도 과제입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="18">

<td>신규 노드 193개</td>
<td></td>

<tr>
<td>한국 5단계(동·리)</td>
<td>신규 노드 567개</td>
<td>한국 합계 약 800건</td>
</tr>
<tr>
<td>해외 도시</td>
<td>dr5hn 에서 승격할 도시 362개</td>
<td>444건</td>
</tr>
<tr>
<td>해외 미해결</td>
<td>dr5hn 에도 없음 14건 · 위치 불명 10건</td>
<td>24건</td>
</tr>
</tbody>
</table>
<ul>
<li>해외 도시가 비어 있던 이유: dr5hn 원본엔 있는데 <span class="hl-blue">«states 전량 + 매핑용 도시»만</span> 시드했기 때문</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 오너 결정(11/06): dr5hn 전체를 넣지 않고 <span class="hl-green">필요한 도시만 그때그때 승격</span>합니다</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="18">
<h2 id="%F0%9F%8C%8F-%ED%8C%90%EB%8B%A8-%EA%B8%B0%EC%A4%80--%ED%95%B4%EC%99%B8%EB%8A%94-%C2%AB%EC%A3%BC%EB%8F%84%EC%8B%9C%C2%BB%EA%B9%8C%EC%A7%80%EB%A7%8C-%EC%B1%84%EC%9B%81%EB%8B%88%EB%8B%A4-span-classbadge-date1106span"><img class="emoji" draggable="false" alt="🌏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30f.svg" data-marp-twemoji=""/> 판단 기준 — 해외는 «주·도시»까지만 채웁니다 <span class="badge-date">11/06</span></h2>

<thead>
<tr>
<th>근거</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>콘텐츠 밀도</td>
<td>해외 571건 중 절반 이상이 대학 투어 · 도시당 대개 1건 → 더 내리면 1건짜리 노드만 늘어남</td>
</tr>
<tr>
<td>사용자 동선</td>
<td>한국은 동 단위로 좁힐 가치가 있지만, 해외는 국가 → 주 → 도시면 충분</td>
</tr>
<tr>
<td>데이터 근거</td>
<td>dr5hn 에는 미국 카운티·동네 단계가 없음(도쿄 구·이스탄불 구처럼 필요한 곳은 이미 도시로 존재)</td>
</tr>
<tr>
<td>일관성</td>
<td>카운티·카운슬·町 등 나라마다 의미가 달라 L3~L5 칸에 섞으면 필터가 혼란</td>
</tr>
</tbody>
</table>
<ul>
<li>상세 위치는 지역 계층이 아니라 <span class="hl-blue">구글 주소 문자열</span>(도로명·번지)로 보여줍니다</li>
<li>예외: 한 도시에 콘텐츠가 수십 건 쌓이면 그 도시만 한 단계 내립니다</li>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="sec" data-theme="clean" lang="C" class="sec" data-marpit-pagination="13" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="18">

<h2 id="%EA%B2%80%ED%86%A0-%EB%B0%A9%EB%B2%95--%EB%AC%B4%EC%97%87%EC%9D%84-%EC%96%B4%EB%96%A4-%EC%88%9C%EC%84%9C%EB%A1%9C">검토 방법 — 무엇을 어떤 순서로</h2>

/* 스크린샷 클릭 → 확대 보기
   · 열면 먼저 화면에 꽉 맞춰 보여주고, 한 번 더 누르면 원본 100% 크기로 확대
   · 확대 상태에서 드래그(모바일은 한 손가락)로 이동, 휠·핀치로 자유 배율
   · ESC·✕·배경 클릭으로 닫기 (오너 상시 요구 · 2026-10-06 도입)                      */
(() => {
  if (window.__lb) return; window.__lb = 2;   // 2 = 원본 크기 확대판(2026-11-04)

  const PAD = 28, MAXZ = 4;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:99999;display:none;overflow:hidden;' +
    'background:rgba(10,14,22,.93);touch-action:none;-webkit-user-select:none;user-select:none';

  const im = document.createElement('img');
  im.draggable = false;
  im.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;' +
    'border-radius:4px;box-shadow:0 12px 44px rgba(0,0,0,.5);will-change:transform';
  ov.appendChild(im);

  const hud = document.createElement('div');
  hud.style.cssText = 'position:absolute;right:16px;top:14px;display:flex;gap:8px;align-items:center;' +
    'font:600 13px/1 system-ui,-apple-system,sans-serif;color:#eaf0fb;pointer-events:none';
  const chip = 'background:rgba(255,255,255,.15);padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px)';
  const tip = document.createElement('span'); tip.style.cssText = chip + ';transition:opacity .4s';
  const pct = document.createElement('span'); pct.style.cssText = chip + ';font-variant-numeric:tabular-nums';
  const xb  = document.createElement('button'); xb.textContent = '✕'; xb.setAttribute('aria-label', '닫기');
  xb.style.cssText = chip + ';pointer-events:auto;border:0;color:#fff;width:36px;height:36px;padding:0;' +
    'font:600 16px/1 system-ui;cursor:pointer';
  hud.append(tip, pct, xb);
  ov.appendChild(hud);

  let nw = 0, nh = 0, fit = 1, s = 1, tx = 0, ty = 0;
  let drag = false, lx = 0, ly = 0, moved = false, tipT = 0;

  const clamp = () => {
    const W = innerWidth, H = innerHeight, w = nw * s, h = nh * s;
    tx = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, tx));
    ty = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, ty));
  };
  const draw = () => {
    im.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    pct.textContent = Math.round(s * 100) + '%';
    const big = nw * s > innerWidth + 1 || nh * s > innerHeight + 1;
    im.style.cursor = big ? (drag ? 'grabbing' : 'grab') : (s < 1 ? 'zoom-in' : 'zoom-out');
  };
  const zoom = (ns, cx, cy) => {
    ns = Math.max(Math.min(fit, 1) * 0.9, Math.min(ns, MAXZ));
    const k = ns / s;
    tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k;
    s = ns; clamp(); draw();

  const showTip = (t) => {
    tip.textContent = t; tip.style.opacity = '1';
    clearTimeout(tipT); tipT = setTimeout(() => { tip.style.opacity = '0'; }, 2600);
  };
  const close = () => { ov.style.display = 'none'; im.removeAttribute('src'); document.body.style.overflow = ''; };

  const open = (src) => {
    im.onload = () => {
      nw = im.naturalWidth; nh = im.naturalHeight;
      im.style.width = nw + 'px'; im.style.height = nh + 'px';
      fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
      s = Math.min(fit, 1);            // 원본보다 크게는 띄우지 않는다
      tx = ty = 0; clamp(); draw();
      showTip(fit < 0.995 ? '클릭하면 원본 크기 · 드래그 이동 · ESC 닫기' : '휠로 확대 · ESC 닫기');
    };
    im.src = src;
    ov.style.display = 'block';
    document.body.style.overflow = 'hidden';
  };

  // 배경 클릭 → 닫기 / 이미지 클릭 → 맞춤 ↔ 원본 토글
  ov.addEventListener('click', (e) => {
    e.stopPropagation();
    if (moved) { moved = false; return; }
    if (e.target === xb || e.target === ov) { close(); return; }
    if (e.target === im) {
      const f = Math.min(fit, 1);
      zoom(s > f + 0.005 ? f : Math.max(1, f * 2), e.clientX, e.clientY);
    }
  });

  // 드래그 이동 (마우스 · 터치 공통)
  im.addEventListener('pointerdown', (e) => {
    if (nw * s <= innerWidth && nh * s <= innerHeight) return;
    drag = true; moved = false; lx = e.clientX; ly = e.clientY;
    im.setPointerCapture(e.pointerId); draw(); e.preventDefault();
  });
  im.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    tx += dx; ty += dy; lx = e.clientX; ly = e.clientY; clamp(); draw();
  });
  const endDrag = (e) => { if (drag) { drag = false; try { im.releasePointerCapture(e.pointerId); } catch (_) {} draw(); } };
  im.addEventListener('pointerup', endDrag);
  im.addEventListener('pointercancel', endDrag);

  // 휠 줌 (슬라이드 전환으로 새지 않게 차단)
  ov.addEventListener('wheel', (e) => {
    e.preventDefault(); e.stopPropagation();
    zoom(s * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY);
  }, { passive: false });

  // 핀치 줌
  let pts = new Map(), pd = 0;
  ov.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') pts.set(e.pointerId, e); });
  ov.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'touch' || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pts.size !== 2) return;
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pd) { moved = true; zoom(s * (d / pd), (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); }
    pd = d;
  });
  const dropPt = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pd = 0; };
  ov.addEventListener('pointerup', dropPt);
  ov.addEventListener('pointercancel', dropPt);

  // 열려 있는 동안 키보드는 전부 여기서 소비 (화살표가 슬라이드를 넘기면 안 된다)
  document.addEventListener('keydown', (e) => {
    if (ov.style.display === 'none') return;
    const cx = innerWidth / 2, cy = innerHeight / 2;
    if (e.key === 'Escape') close();
    else if (e.key === '+' || e.key === '=') zoom(s * 1.25, cx, cy);
    else if (e.key === '-' || e.key === '_') zoom(s / 1.25, cx, cy);
    else if (e.key === '0') zoom(Math.min(fit, 1), cx, cy);
    else if (e.key === '1') zoom(1, cx, cy);
    else if (e.key === 'ArrowLeft') { tx += 60; clamp(); draw(); }
    else if (e.key === 'ArrowRight') { tx -= 60; clamp(); draw(); }
    else if (e.key === 'ArrowUp') { ty += 60; clamp(); draw(); }
    else if (e.key === 'ArrowDown') { ty -= 60; clamp(); draw(); }
    else return;
    e.preventDefault(); e.stopPropagation();
  }, true);

  addEventListener('resize', () => {
    if (ov.style.display === 'none' || !nw) return;
    fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
    clamp(); draw();
  });

  const ready = () => {
    document.body.appendChild(ov);
    document.addEventListener('click', (e) => {
      const t = e.target;
      if (t && t.tagName === 'IMG' && t.closest('section') && !t.classList.contains('emoji')) {
        e.preventDefault(); e.stopPropagation(); open(t.currentSrc || t.src);
      }
    }, true);
  };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', ready) : ready();
})();
</script>
