<h2 id="s3-files-%EB%B9%84%EC%9A%A9-%EC%82%AC%EA%B3%A0-%EC%A0%95%EB%A6%AC--%ED%8C%8C%EC%9D%BC%EC%8B%9C%EC%8A%A4%ED%85%9C-%EA%B5%90%EC%B2%B4--%EB%A1%9C%EC%BB%AC-%EC%A0%84%EC%B2%B4-%EB%B0%B1%EC%97%85--%EC%9E%A5%EC%86%8C-%EB%8B%A8%EC%9C%84-%EC%A6%9D%EB%B6%84-%EA%B0%B1%EC%8B%A0">S3 Files 비용 사고 정리  ·  파일시스템 교체  ·  로컬 전체 백업  ·  장소 단위 증분 갱신</h2>

<h2 id="%ED%95%9C-%EC%9E%A5-%EC%9A%94%EC%95%BD--%EC%BA%90%EC%8B%9C%EA%B0%80-%EB%A7%8C%EB%93%A0-%EB%B9%84%EC%9A%A9%EC%9D%84-%EB%81%84%EA%B3%A0-%EB%B0%B1%EC%97%85%EC%9D%80-aws-%EB%B0%96%EC%97%90-%EB%91%90%EA%B8%B0%EB%A1%9C">한 장 요약 — 「캐시가 만든 비용을 끄고, 백업은 AWS 밖에 두기로」</h2>
<div class="cols">
<div class="col">
<h3 id="%F0%9F%92%B8-%EB%AC%B4%EC%8A%A8-%EC%9D%BC%EC%9D%B4-%EC%9E%88%EC%97%88%EB%82%98"><img class="emoji" draggable="false" alt="💸" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b8.svg" data-marp-twemoji=""/> 무슨 일이 있었나</h3>
<ul>
<li>9/3 권한 복구 작업이 파일 1,657만 개를 다시 쓰면서 <span class="hl-red">9월 12일간 평소보다 $228</span> 추가 청구</li>
<li>서버용 캐시(고성능 스토리지)에 <span class="hl-red">439GB</span>가 쌓여 매일 $4.84씩 과금</li>
</ul>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%EC%A7%80%EA%B8%88%EA%B9%8C%EC%A7%80-%ED%95%9C-%EC%A1%B0%EC%B9%98"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 지금까지 한 조치</h3>
<ul>
<li>캐시 자동 적재 끄기 + 만료 1일 → 439GB가 <span class="hl-amber">158.9GB에서 멈춤</span> (파일 항목 최소 과금)</li>
<li><span class="hl-green">9/14 19:31 파일시스템 교체</span>로 남은 158.9GB 제거 · 서버 전환 1.2초</li>
<li>파일 현재 버전 <span class="hl-green">16,566,507개 전체를 dsgn에 백업·전수 검증</span></li>
<li>중복 구버전 약 1,630만 개 정리 착수 (고유본 21,192개는 먼저 백업)</li>
</ul>
</div>
<div class="col">
<h3 id="%E2%9C%85-%EB%B0%B1%EC%97%85-%EA%B2%B0%EC%A0%95-%ED%99%95%EC%A0%95"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 백업 결정 (확정)</h3>
<ul>
<li>AWS Backup(월 <span class="hl-red">11.5~16.4만원</span>) 대신 <span class="hl-green">로컬 백업 + 버저닝 30일</span></li>
<li><span class="hl-green">매일 04:00</span> dsgn에서 <span class="hl-green">바뀐 장소만 다시 받는 증분 갱신</span>, 예상 월 <span class="hl-blue">1,500~4,500원</span></li>
<li>보관은 <span class="hl-green">기간 기준</span>: 30일 전부 + 월간 12개월 + 기준본</li>
</ul>
<h3 id="%F0%9F%8E%AF-%ED%98%84%EC%9E%AC-%EB%8B%A8%EA%B3%84-914"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 현재 단계 (9/14)</h3>
<ul>
<li><span class="hl-green">구현·가동 시작</span>: 목록 생성 설정 · dsgn 04:00 증분 갱신 · 이 컴퓨터 06:00 2차 백업</li>
<li><span class="hl-green">완료</span>: 파일시스템 교체 · 2차 백업 archive1 복사·sha256 검증 (문제 0)</li>
<li><span class="hl-amber">대기</span>: 첫 S3 목록 도착(최대 48시간) · archive2 복사 진행 중 · 기존 파일시스템 삭제(2~3일 관찰 후)</li>
</ul>

<p><span class="sec-num">Section 01</span></p>
<h2 id="%EB%B9%84%EC%9A%A9-%EC%82%AC%EA%B3%A0--%EB%AC%B4%EC%97%87%EC%9D%B4-%EC%96%BC%EB%A7%88%EB%82%98-%EB%82%98%EC%99%94%EB%82%98">비용 사고 — 무엇이 얼마나 나왔나</h2>
<p>9월 청구서가 평소의 두 배를 넘었습니다. 원인은 한 번의 대량 작업과, 그 작업이 채워 넣은 서버용 캐시였습니다.</p>

<h2 id="%F0%9F%92%B8-9%EC%9B%94-%EC%B6%94%EA%B0%80-%EB%B9%84%EC%9A%A9%EC%9D%98-%EA%B5%AC%EC%84%B1-span-classbadge-date91912-%EC%B2%AD%EA%B5%AC-%EC%8B%A4%EC%B8%A1span"><img class="emoji" draggable="false" alt="💸" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b8.svg" data-marp-twemoji=""/> 9월 추가 비용의 구성 <span class="badge-date">9/1~9/12 청구 실측</span></h2>

<h2 id="%F0%9F%A7%AD-%EC%BA%90%EC%8B%9C%EB%8A%94-%EB%B0%A9%EB%AC%B8%EC%9E%90-%EC%86%8D%EB%8F%84%EC%99%80-%EB%AC%B4%EA%B4%80%ED%96%88%EC%8A%B5%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 캐시는 방문자 속도와 무관했습니다</h2>
<table>
<thead>
<tr>
<th>누가 읽나</th>
<th>경로</th>
<th>캐시 필요 여부</th>
</tr>
</thead>
<tbody>
<tr>
<td>사이트 방문자</td>

</tr>
<tr>
<td>서버 PHP (파일 읽기)</td>
<td>마운트 → S3</td>
<td><span class="hl-green">불필요</span> — 월 0.46GB, 재읽기는 서버 메모리가 처리</td>
</tr>
<tr>
<td>서버 PHP (업로드)</td>
<td>마운트 → 캐시 → S3</td>
<td>구조상 항상 거침 · 금방 비워져 비용 미미</td>
</tr>
</tbody>
</table>
<div class="cols">
<div class="col">
<h3 id="%EB%8B%A8%EA%B0%80%EA%B0%80-13%EB%B0%B0">단가가 13배</h3>
<ul>
<li>S3 저장 <span class="hl-blue">GB당 37원</span></li>
<li>캐시 저장 <span class="hl-red">GB당 488원</span></li>
<li>참고: Azure HDD <span class="hl-gray">GB당 51.5원</span></li>
</ul>
</div>
<div class="col">
<h3 id="%EC%A1%B0%EC%B9%98">조치</h3>
<ul>
<li>9/13 21:12 자동 적재 <span class="hl-green">끄기</span></li>
<li>9/14 12:05 만료 <span class="hl-green">7일 → 1일</span></li>
<li>캐시 <span class="hl-blue">439GB → 158.9GB</span>에서 멈춤 (9/14 12:36)</li>
<li>9/14 19:31 <span class="hl-green">파일시스템 교체</span>로 남은 분량 제거</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="6" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="24">
<h2 id="%E2%9A%96%EF%B8%8F-azure-%EC%8B%9C%EC%A0%88%EA%B3%BC-%EB%B9%84%EA%B5%90%ED%95%9C-%EC%9B%94-%EB%B9%84%EC%9A%A9"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> Azure 시절과 비교한 월 비용</h2>
<p>파일 저장 계층만 비교했습니다. Azure는 7월 실청구, AWS는 실측 용량 × 청구서 단가입니다(환율 1,479.5원).</p>
<table>
<thead>
<tr>
<th>구분</th>
<th>월 비용</th>
<th>Azure 대비</th>
</tr>
</thead>
<tbody>
<tr>
<td>Azure (데이터 디스크 + 스냅샷 + 백업 볼트)</td>
<td>154,781원</td>
<td>기준</td>
</tr>
<tr>
<td>AWS — 캐시 439GB가 쌓였을 때</td>
<td><span class="hl-red">256,383원</span></td>
<td><span class="hl-red">+66%</span></td>
</tr>
<tr>
<td>AWS — 캐시 데이터를 비운 뒤 (파일 항목 158.9GB 남음 · 교체 전)</td>
<td><span class="hl-amber">약 116,000원</span></td>
<td><span class="hl-amber">−25%</span></td>
</tr>
<tr>
<td>AWS — 파일시스템 교체 후</td>
<td><span class="hl-green">약 38,500원</span></td>
<td><span class="hl-green">−75%</span></td>
</tr>
<tr>
<td>AWS — 교체 + 중복 구버전 정리</td>
<td><span class="hl-green">약 20,000원</span></td>
<td><span class="hl-green">−87%</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>이전 결정 자체는 옳았습니다. <span class="hl-amber">S3 Files의 기본 캐시 설정</span>이 켜진 채 대량 작업을 만난 것이 비용을 뒤집었습니다. 교체 후 금액은 새 파일시스템 용량을 0에 가깝게 본 추정이며, <span class="hl-blue">9/17 자동 보고</span>로 확인합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="7" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="24">
<h2 id="%F0%9F%94%81-%ED%8C%8C%EC%9D%BC%EC%8B%9C%EC%8A%A4%ED%85%9C-%EA%B5%90%EC%B2%B4--%EB%82%A8%EC%9D%80-1589gb%EB%8A%94-%C2%AB%ED%8C%8C%EC%9D%BC-%ED%95%AD%EB%AA%A9-%EA%B8%B0%EB%A1%9D%C2%BB%EC%9D%B4%EC%97%88%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge-date914span"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> 파일시스템 교체 — 남은 158.9GB는 «파일 항목 기록»이었습니다 <span class="badge-date">9/14</span></h2>
<div class="stats">
<div class="card"><div class="num">158.9GB</div><div class="lab">만료로 안 빠진 용량 (월 약 7.8만원)</div></div>
<div class="card"><div class="num">1,661만</div><div class="lab">기록된 파일 항목 수</div></div>
<div class="card"><div class="num">10KiB</div><div class="lab">항목 1개 최소 과금 크기</div></div>
<div class="card"><div class="num">1.2초</div><div class="lab">서버 연결 전환 시간</div></div>
</div>
<div class="cols">
<div class="col">
<h3 id="%EC%99%9C-%EC%95%88-%EC%A4%84%EC%97%88%EB%82%98">왜 안 줄었나</h3>
<ul>
<li>캐시에 담긴 <span class="hl-green">파일 내용은 만료로 전부 빠졌습니다</span></li>
<li>남은 것은 파일시스템이 기억하는 <span class="hl-amber">파일 목록(이름·크기·권한)</span>입니다</li>
<li>9/3 권한 복구가 모든 폴더를 열어 <span class="hl-red">1,661만 항목 × 10KiB = 158.9GB</span></li>
<li>목록 기록은 <span class="hl-red">만료 대상이 아니라</span> 설정으로 지울 수 없습니다</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%96%B4%EB%96%BB%EA%B2%8C-%EC%97%86%EC%95%B4%EB%82%98">어떻게 없앴나</h3>
<ul>
<li>S3의 파일은 그대로 두고, 서버가 붙는 <span class="hl-green">파일시스템만 새로 만들어</span> 연결했습니다</li>
<li>새 파일시스템은 <span class="hl-green">실제로 연 폴더만</span> 기록해서 작게 유지됩니다</li>
<li>기존 파일시스템은 연결만 끊고 보관 → <span class="hl-amber">2~3일 관찰 후 삭제</span> (보관 중 하루 약 $1.7)</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="8" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="24">
<h2 id="%E2%9C%85-%EA%B5%90%EC%B2%B4-%EC%A0%88%EC%B0%A8%EC%99%80-%EA%B2%80%EC%A6%9D--%EC%9A%B4%EC%98%81-%ED%8F%B4%EB%8D%94%EB%A5%BC-%EA%B1%B4%EB%93%9C%EB%A6%AC%EA%B8%B0-%EC%A0%84%EC%97%90-%EB%A8%BC%EC%A0%80-%EB%8C%80%EC%A1%B0%ED%96%88%EC%8A%B5%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 교체 절차와 검증 — 운영 폴더를 건드리기 전에 먼저 대조했습니다</h2>
<table>
<thead>
<tr>
<th>순서</th>
<th>작업</th>
<th>확인 결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>①</td>
<td>새 파일시스템 생성 → <span class="hl-green">연결 전에</span> 자동 적재 끄기·만료 1일 적용</td>
<td>기본값(적재 켬·만료 30일)이 한 번도 동작하지 않음</td>
</tr>
<tr>
<td>②</td>
<td>서버 임시 경로에 새 파일시스템을 <span class="hl-blue">나란히 연결</span>해 기존과 대조</td>
<td>폴더 23개·항목 2,960개 — 이름·소유자 차이 <span class="hl-green">0</span>, 업로드 계정 쓰기 권한 상실 <span class="hl-green">0</span></td>
</tr>
<tr>
<td>③</td>
<td>파일 내용 대조 + 업로드 계정(www-data) 쓰기 시험</td>
<td>내용 일치 · 쓴 파일이 <span class="hl-green">약 1분 뒤 S3 반영</span></td>
</tr>
<tr>
<td>④</td>
<td>S3로 아직 안 넘어간 변경 <span class="hl-green">0건</span> 확인 → 서버 연결 교체</td>
<td>전환 1.2초 · 사이트·파일 응답 정상</td>
</tr>
<tr>
<td>⑤</td>
<td>기존 파일시스템 보관 · 9/17 자동 보고에 새 용량과 삭제 알림 추가</td>
<td>되돌리기 = 백업한 설정 파일 복원 후 재연결</td>
</tr>
</tbody>
</table>
<blockquote>
<p>폴더 권한(www-data)은 S3의 폴더 표시 객체에도 저장돼 있어 새 파일시스템이 그대로 읽습니다. 교체 직후 본 타일 이미지 403은 장소 폴더 안의 <code>.htaccess</code>가 직접 접근을 막는 기존 동작이었습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="9" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="24">
<h2 id="%F0%9F%A7%AD-%EB%8B%A4%EC%9D%8C%EC%97%90-%EA%B6%8C%ED%95%9C%EC%9D%84-%EB%98%90-%EB%B0%94%EA%BF%94%EC%95%BC-%ED%95%9C%EB%8B%A4%EB%A9%B4"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 다음에 권한을 또 바꿔야 한다면</h2>
<p>권한 변경은 폴더 규모와 상관없이 <span class="hl-amber">S3 파일을 한 번씩 다시 쓰는 작업</span>입니다. 9/3의 S3 요청비 $125와 구버전 1,630만 개가 여기서 나왔습니다. 피할 수 있는 것은 <span class="hl-green">파일 항목 기록(바닥값)</span> 쪽입니다.</p>
<table>
<thead>
<tr>
<th>상황</th>
<th>방법</th>
<th>운영 파일시스템의 항목 기록</th>
<th>비용 (추정)</th>
</tr>
</thead>
<tbody>
<tr>
<td>특정 장소·폴더만 문제</td>
<td><span class="hl-green">그 폴더만</span> 권한 수정</td>
<td>그 폴더 항목만 (수천 개 · 수 원)</td>
<td>거의 0</td>
</tr>
<tr>
<td>전체 변경 — <span class="hl-green">권장</span></td>
<td><span class="hl-green">작업용 임시 파일시스템</span>을 만들어 거기서 실행 → 끝나면 삭제</td>
<td><span class="hl-green">생기지 않음</span> (추정) · 임시분만 하루 약 $1.7</td>
<td>S3 재기록 약 $75~125</td>
</tr>
<tr>
<td>전체 변경 — 대안</td>
<td>S3 일괄 작업(Batch Operations)으로 권한 정보만 교체</td>
<td><span class="hl-green">생기지 않음</span> (추정)</td>
<td>요청 약 $75 + 작업비 약 $17</td>
</tr>
<tr>
<td>이번 방식</td>
<td>운영 파일시스템에서 실행 → 나중에 교체</td>
<td><span class="hl-red">교체 전까지 매일 과금</span></td>
<td>교체 작업 약 15분</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> 재발을 막는 쪽이 가장 쌉니다: 서버 업로드는 권한 정보가 자동으로 기록되고(9/14 업로드 실측), S3에 직접 올리는 파일만 <span class="hl-blue">권한 정보(file-owner 등)를 함께 넣으면</span> 복구 작업 자체가 필요 없습니다. 어떤 방법이든 전체 재기록은 구버전이 한 벌 생기므로 <span class="hl-amber">30일 구버전 규칙</span>이 정리합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="sec" data-theme="clean" lang="ko-KR" class="sec" data-marpit-pagination="10" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="24">
<p><span class="sec-num">Section 02</span></p>
<h2 id="%EA%B5%AC%EB%B2%84%EC%A0%84-%EC%A0%95%EB%A6%AC%EC%99%80-%EC%A0%84%EC%B2%B4-%EB%B0%B1%EC%97%85">구버전 정리와 전체 백업</h2>
<p>지우기 전에 먼저 받아두고, 받은 것은 파일 하나까지 검증했습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="11" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="24">
<h2 id="%F0%9F%97%82%EF%B8%8F-%EA%B5%AC%EB%B2%84%EC%A0%84-%EC%A0%84%EC%88%98%EC%A1%B0%EC%82%AC-%EA%B2%B0%EA%B3%BC-span-classbadge-date913-2238-%EA%B8%B0%EC%A4%80span"><img class="emoji" draggable="false" alt="🗂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c2.svg" data-marp-twemoji=""/> 구버전 전수조사 결과 <span class="badge-date">9/13 22:38 기준</span></h2>
<table>
<thead>
<tr>
<th>구분</th>
<th>수량</th>
<th>처리</th>
</tr>
</thead>
<tbody>
<tr>
<td>현재 버전 (사이트에 나가는 파일)</td>
<td><span class="hl-blue">16,566,507개 · 429GiB</span></td>
<td>로컬 백업 완료</td>
</tr>
<tr>
<td>구버전 — 현재 파일과 내용이 같은 사본</td>

<td><span class="hl-green">먼저 백업 후 삭제</span></td>

<tr>

<h2 id="%F0%9F%93%A6-%EB%A1%9C%EC%BB%AC-%EC%A0%84%EC%B2%B4-%EB%B0%B1%EC%97%85--aws-%EC%95%88%EC%97%90%EC%84%9C-%EB%AC%B6%EA%B3%A0-%ED%95%9C-%EB%B2%88%EC%97%90-%EB%B0%9B%EA%B8%B0-span-classbadge-date913914span"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> 로컬 전체 백업 — AWS 안에서 묶고 한 번에 받기 <span class="badge-date">9/13~9/14</span></h2>
<div class="stats">
<div class="card"><div class="num">16,566,507</div><div class="lab">검증 통과 파일</div></div>
<div class="card"><div class="num">2,311</div><div class="lab">장소·경로별 tar</div></div>
<div class="card"><div class="num">456GiB</div><div class="lab">dsgn H: 저장 용량</div></div>
<div class="card"><div class="num">약 $55</div><div class="lab">총비용 (추정)</div></div>
</div>
<table>
<thead>
<tr>
<th>단계</th>
<th>방법</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>묶기</td>
<td>서울 리전 임시 서버가 장소 폴더별로 tar 생성</td>
<td>1시간 5분 · 초당 약 4,000개 · 실패 0</td>
</tr>
<tr>
<td>받기</td>
<td>dsgn이 완성된 tar를 반복해서 내려받기</td>

</tr>
<tr>
<td>검증</td>

<td>누락 0 · 불일치 0</td>
</tr>
<tr>
<td>정리</td>
<td>임시 서버·버킷·권한 삭제</td>
<td>재조회로 삭제 확인</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="sec" data-theme="clean" lang="ko-KR" class="sec" data-marpit-pagination="13" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="24">
<p><span class="sec-num">Section 03</span></p>
<h2 id="%EC%95%9E%EC%9C%BC%EB%A1%9C%EC%9D%98-%EB%B0%B1%EC%97%85--%EB%B0%A9%EB%B2%95-%EB%B9%84%EA%B5%90%EC%99%80-%EC%84%A0%ED%83%9D">앞으로의 백업 — 방법 비교와 선택</h2>
<p>AWS Backup, 로컬 백업, 버저닝만 쓰는 방법을 비용·보호 범위·운영 수고로 비교했습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="14" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="24">
<h2 id="%F0%9F%94%8D-%EC%84%B8-%EA%B0%80%EC%A7%80-%EB%B0%A9%EB%B2%95-%EB%B9%84%EA%B5%90"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 세 가지 방법 비교</h2>
<table>
<thead>
<tr>
<th>항목</th>
<th>A. AWS Backup</th>
<th><span class="hl-green">B. 로컬 백업 + 버저닝 30일</span></th>
<th>C. 버저닝 30일만</th>
</tr>
</thead>
<tbody>
<tr>
<td>월 고정비</td>
<td><span class="hl-red">11.5~16.4만원</span></td>
<td><span class="hl-green">약 1,500~4,500원</span></td>
<td>거의 0</td>
</tr>
<tr>
<td>최근 실수 복구</td>
<td>35일 안 아무 시점</td>
<td>30일 (버저닝)</td>
<td>30일 (버저닝)</td>
</tr>
<tr>
<td>버킷 삭제·계정 사고</td>
<td>복구 가능 (같은 계정)</td>
<td><span class="hl-green">복구 가능 (AWS 밖 사본)</span></td>
<td><span class="hl-red">불가</span></td>
</tr>
<tr>
<td>전체를 로컬로 꺼내기</td>
<td><span class="hl-red">복원+다운로드 약 21~26만원</span></td>
<td><span class="hl-green">이미 로컬에 있음</span></td>
<td>원본에서 다시 받기 약 8만원</td>
</tr>
<tr>
<td>운영 수고</td>
<td>없음 (자동)</td>
<td>자동화 스크립트 관리</td>
<td>없음</td>
</tr>
<tr>
<td>대량 작업의 영향</td>
<td>백업 대상 급증 → 보관비 최대 2배</td>
<td>내용이 같으면 다시 받지 않음</td>
<td>구버전 30일치 증가</td>
</tr>
</tbody>
</table>
<blockquote>
<p>금액은 서울 리전 가격표 기준 추정입니다. AWS Backup은 <span class="hl-amber">128KB 미만 파일을 128KB로 과금</span>합니다(요금 페이지 원문 확인). 타일 평균이 30KB라 실제 429GB가 약 2TB로 계산됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="15" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="24">
<h2 id="%E2%9C%85-%EC%99%9C-b%EB%A5%BC-%EC%84%A0%ED%83%9D%ED%96%88%EB%82%98"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 왜 B를 선택했나</h2>
<div class="cols">
<div class="col">
<h3 id="%EB%B9%84%EC%9A%A9">비용</h3>
<ul>
<li>AWS Backup 보관비만으로 <span class="hl-red">Azure 시절 파일 저장 비용 전체를 넘습니다</span></li>
<li>B는 바뀐 장소만 받아서 대부분 <span class="hl-green">월 100GB 무료 전송분 안</span>에서 끝납니다</li>
</ul>
<h3 id="%EB%8F%85%EB%A6%BD%EC%84%B1">독립성</h3>
<ul>
<li>사본이 <span class="hl-green">AWS 계정 밖(dsgn)</span>에 있어 계정 사고·버킷 삭제에도 남습니다</li>
<li>필요할 때 <span class="hl-green">장소 tar 하나만 풀면</span> 바로 복원됩니다</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%9D%B4%EB%AF%B8-%EA%B0%96%EC%B6%98-%EA%B2%83">이미 갖춘 것</h3>
<ul>
<li>검증된 전체 백업과 <span class="hl-blue">묶기·검증 스크립트</span>가 있습니다</li>
<li>최근 실수는 <span class="hl-green">버저닝 30일</span>이 S3 안에서 무료로 막아줍니다</li>
</ul>
<h3 id="%EA%B0%90%EC%88%98%ED%95%98%EB%8A%94-%EA%B2%83%EA%B3%BC-%EB%8C%80%EC%9D%91">감수하는 것과 대응</h3>
<ul>
<li>dsgn이 <span class="hl-amber">켜져 있어야</span> 갱신됩니다 → 절전 안 함 설정 확인</li>
<li><span class="hl-amber">윈도우 업데이트 재부팅</span> 가능 (9/9 05:49 사례) → 끊겨도 다음 날 이어서 하는 구조</li>
<li>갱신 사이의 변경은 버저닝 30일 창에 의존합니다</li>
<li>디스크 1개 위험 → <span class="hl-green">2차 사본을 이 컴퓨터 디스크 2개에</span></li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="16" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="24">
<h2 id="%F0%9F%94%84-%EA%B5%AC%ED%98%84-%EB%B0%A9%EC%8B%9D--%EB%A7%A4%EC%9D%BC-0400-%EC%9E%A5%EC%86%8C-%EB%8B%A8%EC%9C%84-%EC%A6%9D%EB%B6%84-%EA%B0%B1%EC%8B%A0-span-classbadge-new%ED%99%95%EC%A0%95span"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> 구현 방식 — 매일 04:00 장소 단위 증분 갱신 <span class="badge-new">확정</span></h2>
<table>
<thead>
<tr>
<th>순서</th>
<th>동작</th>
<th>이유</th>
</tr>
</thead>
<tbody>
<tr>
<td>①</td>
<td>S3 Inventory가 매일 파일 목록(키·크기·ETag·수정시각) 생성</td>
<td>1,657만 개를 직접 조회하지 않음 · 1회 약 $0.04</td>
</tr>
<tr>
<td>②</td>
<td>어제 목록과 <span class="hl-blue">장소 폴더별로 비교</span> — ETag가 달라도 크기가 같으면 <span class="hl-blue">체크섬(CRC64) 재확인</span></td>
<td>내용이 같은 재기록(9/5, 9.65GB)은 기록만 하고 받지 않음</td>
</tr>
<tr>
<td>③</td>
<td>한 번에 <span class="hl-amber">샤드 200곳 또는 50GB 이상</span>이면 멈추고 Slack 확인 요청</td>
<td>대량 작업이 모르는 사이 대량 다운로드로 번지는 것 차단</td>
</tr>
<tr>
<td>④</td>
<td>바뀐 장소는 <span class="hl-green">현재 상태 전체를 새 tar로</span> dsgn이 원본에서 직접 받기</td>
<td>복원 시 최신 tar 하나만 풀면 끝 · S3에 사본을 두지 않음</td>
</tr>
<tr>
<td>⑤</td>
<td>tar sha256 + 파일별 md5 검증</td>
<td>기존 검증 스크립트 재사용</td>
</tr>
<tr>
<td>⑥</td>
<td><span class="hl-green">기간 기준 보관</span> 적용 (다음 장)</td>
<td>자주 바뀌는 장소의 수정 전 원본 보존</td>
</tr>
</tbody>
</table>
<blockquote>
<p>장소 하나를 통째로 다시 받아도 비용은 작습니다: 중간값 49MB는 1원 미만, 재생성된 <code>pano/1/1773/</code>(0.5GB)은 약 80원, 가장 큰 <code>pano/0/100/</code>(8GB)도 약 1,500원입니다(추정).</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="17" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="24">
<h2 id="%F0%9F%93%85-%EC%A3%BC%EA%B8%B0%EC%99%80-%EB%B3%B4%EA%B4%80-%EA%B7%9C%EC%B9%99--%EC%8B%A4%EC%B8%A1-%EB%B3%80%EA%B2%BD-%EB%B9%88%EB%8F%84%EB%A1%9C-%EC%A0%95%ED%96%88%EC%8A%B5%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="📅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c5.svg" data-marp-twemoji=""/> 주기와 보관 규칙 — 실측 변경 빈도로 정했습니다</h2>
<div class="cols">
<div class="col">
<h3 id="%EC%8B%A4%EC%A0%9C-%EB%B3%80%EA%B2%BD-%EB%B9%88%EB%8F%84-%EB%AA%A9%EB%A1%9D%ED%91%9C-%EC%8B%A4%EC%B8%A1">실제 변경 빈도 (목록표 실측)</h3>
<table>
<thead>
<tr>
<th>날짜</th>
<th>바뀐 파일</th>
<th>성격</th>
</tr>
</thead>
<tbody>
<tr>
<td>9/5</td>
<td>40,169개 · 545샤드</td>
<td><span class="hl-gray">ETag 형식만 바뀐 재기록</span></td>
</tr>
<tr>
<td>9/7</td>
<td>17,379개 · 2샤드</td>
<td><span class="hl-red">1773 타일 재생성</span></td>
</tr>
<tr>
<td>9/8~9/13</td>
<td>하루 4~11개</td>
<td><span class="hl-green">평소 수준</span></td>
</tr>
</tbody>
</table>
<ul>
<li>평소엔 <span class="hl-green">매일 돌려도 받을 게 거의 없음</span> → <span class="hl-green">매일 04:00</span></li>
<li>새 장소는 짧게 여러 번 바뀜 — <code>1773</code>은 <span class="hl-amber">열흘 중 4일</span></li>
</ul>
</div>
<div class="col">
<h3 id="%EB%B3%B4%EA%B4%80-%EA%B7%9C%EC%B9%99--%EA%B0%9C%EC%88%98%EA%B0%80-%EC%95%84%EB%8B%88%EB%9D%BC-%EA%B8%B0%EA%B0%84">보관 규칙 — 개수가 아니라 기간</h3>
<table>
<thead>
<tr>
<th>대상</th>
<th>보관</th>
</tr>
</thead>
<tbody>
<tr>
<td>기준본 (9/13 전체)</td>
<td>1년 뒤 새 기준본까지</td>
</tr>
<tr>
<td>최근 30일 세대</td>
<td><span class="hl-green">전부</span></td>
</tr>
<tr>
<td>30일 지난 세대</td>
<td>장소별 <span class="hl-green">월 1개 · 12개월</span></td>
</tr>
<tr>
<td>12개월 지난 월간 세대</td>
<td>삭제</td>
</tr>
</tbody>
</table>
<ul>
<li>«최근 3세대»는 <code>1773</code> 같은 장소에서 <span class="hl-red">일주일 안에 원본이 밀려남</span></li>
<li>30일은 <span class="hl-blue">S3 버저닝 30일</span>과 복원 가능 기간을 맞춤</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="18" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="24">
<h2 id="%F0%9F%95%93-%EC%9D%BC%EC%A0%95%EA%B3%BC-%EC%9E%AC%EB%B6%80%ED%8C%85--%EC%84%9C%EB%A1%9C-%EA%B2%B9%EC%B9%98%EC%A7%80-%EC%95%8A%EA%B2%8C-%EB%B0%B0%EC%B9%98%ED%96%88%EC%8A%B5%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🕓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f553.svg" data-marp-twemoji=""/> 일정과 재부팅 — 서로 겹치지 않게 배치했습니다</h2>
<table>
<thead>
<tr>
<th>시각</th>
<th>무엇이</th>
<th>어디서</th>
<th>비고</th>
</tr>
</thead>
<tbody>
<tr>
<td>04:00</td>
<td>증분 갱신 (목록 비교 → 바뀐 장소 받기 → 검증)</td>
<td>dsgn</td>
<td>평소 몇 초~몇 분 · 대량 변경은 확인 요청으로 멈춤</td>
</tr>
<tr>
<td>05:00</td>
<td>재부팅 검사 (<span class="hl-amber">가동 3.5일 초과 시 재부팅</span>, 약 4일마다)</td>
<td>이 컴퓨터</td>
<td>T2 브릿지 하드정지 예방 장치 (8/10 설정)</td>
</tr>
<tr>
<td>06:00</td>

<h2 id="%EC%A0%95%EB%A6%AC">정리</h2>
<p>캐시가 만든 비용은 <span class="hl-green">설정으로 끄고</span>, 설정으로 못 지우는 파일 항목 기록은 <span class="hl-green">파일시스템 교체로 없앴습니다</span>. 파일 1,657만 개는 <span class="hl-green">AWS 밖에 검증된 사본</span>으로 확보했습니다. 9/14부터 dsgn이 <span class="hl-green">매일 04:00 바뀐 장소만 받고</span>, 이 컴퓨터가 <span class="hl-green">06:00 디스크 2개에 똑같이 복사</span>합니다. 첫 S3 목록이 도착하면 자동으로 동작을 시작합니다.</p>
<hr />
