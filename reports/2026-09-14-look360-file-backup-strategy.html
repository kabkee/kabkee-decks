<h1 id="look360-%ED%8C%8C%EC%9D%BC-%EB%B0%B1%EC%97%85-%EC%A0%84%EB%9E%B5">Look360 파일 백업 전략</h1>
<h2 id="s3-files-%EB%B9%84%EC%9A%A9-%EC%82%AC%EA%B3%A0-%EC%A0%95%EB%A6%AC--%ED%8C%8C%EC%9D%BC%EC%8B%9C%EC%8A%A4%ED%85%9C-%EA%B5%90%EC%B2%B4--%EB%A1%9C%EC%BB%AC-%EC%A0%84%EC%B2%B4-%EB%B0%B1%EC%97%85--%EC%A6%9D%EB%B6%84-%EA%B0%B1%EC%8B%A0-1022-%EB%B3%80%EA%B2%BD%EB%B6%84-%EC%84%B8%EB%8C%80%EB%A1%9C-%EC%A0%84%ED%99%98">S3 Files 비용 사고 정리  ·  파일시스템 교체  ·  로컬 전체 백업  ·  증분 갱신 (10/22 변경분 세대로 전환)</h2>
<hr />
<p>Indyspot AI Corp  ·  Engineering Manager  ·  2026-09-14 작성  ·  2026-10-23 개정</p>
</section>

<h2 id="%F0%9F%93%9C-%EA%B0%9C%EC%A0%95-%EC%9D%B4%EB%A0%A5--%EB%AC%B4%EC%97%87%EC%9D%B4-%EC%96%B8%EC%A0%9C-%EC%99%9C-%EB%B0%94%EB%80%8C%EC%97%88%EB%82%98"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dc.svg" data-marp-twemoji=""/> 개정 이력 — 무엇이 언제 왜 바뀌었나</h2>
<p>원안 슬라이드는 <span class="hl-amber">지우지 않고 남겼습니다</span>. 바뀐 슬라이드 제목에는 <span class="badge">변경됨</span> 표시를 달고, 새 내용은 <span class="hl-blue">Section 04</span>에 따로 정리했습니다.</p>
<table>
<thead>
<tr>
<th>날짜</th>
<th>무엇이 바뀌었나</th>
<th>왜</th>
<th>근거</th>
</tr>
</thead>
<tbody>
<tr>
<td>9/14</td>
<td>원안 — 바뀐 장소는 <span class="hl-blue">장소 전체를 새 tar로</span> 다시 받기</td>
<td>복원 시 tar 하나만 풀면 끝나는 단순함</td>
<td>Section 01~03</td>
</tr>
<tr>
<td>10/08</td>
<td>백업 대상에 <span class="hl-green"><code>l3-platform-file-storage</code> 버킷 추가</span> · 버전관리 + 구버전 30일</td>
<td>플랫폼 파일(영상·XML 등)이 백업 0이었음 · 오너 카드 「둘 다」</td>
<td>IND-8045</td>
</tr>
<tr>
<td>10/14~15</td>
<td>실행 머신 표기 dsgn → <span class="hl-blue">kabkee-main</span> · 2차 백업도 같은 머신의 D:·E:</td>
<td>개발 서버 이전</td>
<td>cron <code>813e106</code></td>
</tr>
<tr>
<td>10/15</td>
<td>Azure 비교표 «교체 후» 금액을 9/29 실측으로 정정</td>
<td>9/14 추정이 틀림</td>
<td>덱 <code>2278b2e</code></td>
</tr>
<tr>
<td>10/22</td>
<td>04:00 갱신이 <span class="hl-red">57.2GiB 안전장치</span>에 걸려 멈춤 → <span class="hl-amber">승인 안 함</span></td>
<td>실제 변경은 XML 88개(2.3MB)뿐 · 오너 결정</td>
<td>IND-8672</td>
</tr>
<tr>
<td>10/22</td>
<td>증분 방식을 <span class="hl-green">바뀐 파일만 담는 변경분(delta) 세대</span>로 전환</td>
<td>작은 변경이 여러 장소에 흩어지면 전송량 폭증</td>
<td>IND-8673</td>
</tr>
<tr>
<td>10/23</td>
<td>검증 7축 통과 · 첫 정기 실행 3건 정상</td>
<td>—</td>
<td>IND-8685</td>
</tr>
<tr>
<td>10/23</td>
<td>복원 도구가 <span class="hl-green">권한을 살리도록</span> 수정</td>
<td>권한을 버리고 있었음</td>
<td>백업 <code>fd1c54e</code></td>
</tr>
<tr>
<td>10/23</td>
<td>추가 백업을 <span class="hl-amber">주간회의 안건</span>으로 (선호안 Deep Archive)</td>
<td>사본 3벌이 한 컴퓨터 → 랜섬웨어에 함께 노출</td>
<td>오너 지시</td>
</tr>

<h2 id="%ED%95%9C-%EC%9E%A5-%EC%9A%94%EC%95%BD-1023-%ED%98%84%EC%9E%AC--%EB%B0%94%EB%80%90-%EC%9E%A5%EC%86%8C%EA%B0%80-%EC%95%84%EB%8B%88%EB%9D%BC-%EB%B0%94%EB%80%90-%ED%8C%8C%EC%9D%BC%EB%A7%8C-%EB%B0%9B%EC%8A%B5%EB%8B%88%EB%8B%A4">한 장 요약 (10/23 현재) — 「바뀐 장소」가 아니라 「바뀐 파일」만 받습니다</h2>
<div class="cols">
<div class="col">
<h3 id="%F0%9F%94%81-%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%B0%94%EB%80%8C%EC%97%88%EB%82%98"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> 무엇이 바뀌었나</h3>
<ul>
<li>9/14 원안: 파일 1개만 바뀌어도 <span class="hl-red">그 장소 전체(평균 0.8GB)</span>를 다시 받음</li>
<li>10/22 XML 88개 일괄 수정이 장소 71곳에 흩어져 <span class="hl-red">57.2GiB</span> 예정 → 안전장치가 멈춤</li>
<li>10/22부터 <span class="hl-green">바뀐 파일만 tar에 담고</span>, 목록표에는 장소의 <span class="hl-green">모든 파일과 «어느 tar에 있는지»</span>를 기록</li>
<li>같은 변경을 <span class="hl-green">2.3MB</span>로 처리 (약 2만 6천 분의 1)</li>
</ul>

<h2 id="%ED%95%9C-%EC%9E%A5-%EC%9A%94%EC%95%BD-914-%EC%9B%90%EC%95%88--%EC%BA%90%EC%8B%9C%EA%B0%80-%EB%A7%8C%EB%93%A0-%EB%B9%84%EC%9A%A9%EC%9D%84-%EB%81%84%EA%B3%A0-%EB%B0%B1%EC%97%85%EC%9D%80-aws-%EB%B0%96%EC%97%90-%EB%91%90%EA%B8%B0%EB%A1%9C">한 장 요약 (9/14 원안) — 「캐시가 만든 비용을 끄고, 백업은 AWS 밖에 두기로」</h2>
<div class="cols">
<div class="col">
<h3 id="%F0%9F%92%B8-%EB%AC%B4%EC%8A%A8-%EC%9D%BC%EC%9D%B4-%EC%9E%88%EC%97%88%EB%82%98"><img class="emoji" draggable="false" alt="💸" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b8.svg" data-marp-twemoji=""/> 무슨 일이 있었나</h3>
<ul>
<li>9/3 권한 복구 작업이 파일 1,657만 개를 다시 쓰면서 <span class="hl-red">9월 12일간 평소보다 $228</span> 추가 청구</li>
<li>서버용 캐시(고성능 스토리지)에 <span class="hl-red">439GB</span>가 쌓여 매일 $4.84씩 과금</li>
</ul>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%EC%A7%80%EA%B8%88%EA%B9%8C%EC%A7%80-%ED%95%9C-%EC%A1%B0%EC%B9%98"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 지금까지 한 조치</h3>
<ul>
<li>캐시 자동 적재 끄기 + 만료 1일 → 439GB가 <span class="hl-amber">158.9GB에서 멈춤</span> (파일 항목 최소 과금)</li>
<li><span class="hl-green">9/14 19:31 파일시스템 교체</span>로 남은 158.9GB 제거 · 서버 전환 1.2초</li>
<li>파일 현재 버전 <span class="hl-green">16,566,507개 전체를 dsgn에 백업·전수 검증</span></li>
<li>중복 구버전 약 1,630만 개 정리 착수 (고유본 21,192개는 먼저 백업)</li>
</ul>
</div>
<div class="col">
<h3 id="%E2%9C%85-%EB%B0%B1%EC%97%85-%EA%B2%B0%EC%A0%95-%ED%99%95%EC%A0%95"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 백업 결정 (확정)</h3>
<ul>
<li>AWS Backup(월 <span class="hl-red">11.5~16.4만원</span>) 대신 <span class="hl-green">로컬 백업 + 버저닝 30일</span></li>
<li><span class="hl-green">매일 04:00</span> dsgn에서 <span class="hl-green">바뀐 장소만 다시 받는 증분 갱신</span>, 예상 월 <span class="hl-blue">1,500~4,500원</span></li>
<li>보관은 <span class="hl-green">기간 기준</span>: 30일 전부 + 월간 12개월 + 기준본</li>
</ul>
<h3 id="%F0%9F%8E%AF-%ED%98%84%EC%9E%AC-%EB%8B%A8%EA%B3%84-914"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 현재 단계 (9/14)</h3>
<ul>
<li><span class="hl-green">구현·가동 시작</span>: 목록 생성 설정 · dsgn 04:00 증분 갱신 · 이 컴퓨터 06:00 2차 백업</li>
<li><span class="hl-green">완료</span>: 파일시스템 교체 · 2차 백업 archive1 복사·sha256 검증 (문제 0)</li>
<li><span class="hl-amber">대기</span>: 첫 S3 목록 도착(최대 48시간) · archive2 복사 진행 중 · 기존 파일시스템 삭제(2~3일 관찰 후)</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="sec" data-theme="clean" lang="C" class="sec" data-marpit-pagination="5" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="39">
<p><span class="sec-num">Section 01</span></p>
<h2 id="%EB%B9%84%EC%9A%A9-%EC%82%AC%EA%B3%A0--%EB%AC%B4%EC%97%87%EC%9D%B4-%EC%96%BC%EB%A7%88%EB%82%98-%EB%82%98%EC%99%94%EB%82%98">비용 사고 — 무엇이 얼마나 나왔나</h2>
<p>9월 청구서가 평소의 두 배를 넘었습니다. 원인은 한 번의 대량 작업과, 그 작업이 채워 넣은 서버용 캐시였습니다.</p>
</section>

<h2 id="%F0%9F%A7%AD-%EC%BA%90%EC%8B%9C%EB%8A%94-%EB%B0%A9%EB%AC%B8%EC%9E%90-%EC%86%8D%EB%8F%84%EC%99%80-%EB%AC%B4%EA%B4%80%ED%96%88%EC%8A%B5%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 캐시는 방문자 속도와 무관했습니다</h2>

<h2 id="%E2%9A%96%EF%B8%8F-azure-%EC%8B%9C%EC%A0%88%EA%B3%BC-%EB%B9%84%EA%B5%90%ED%95%9C-%EC%9B%94-%EB%B9%84%EC%9A%A9"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> Azure 시절과 비교한 월 비용</h2>
<p>파일 저장 계층만 비교했습니다. Azure는 7월 실청구, AWS는 실측 용량 × 청구서 단가입니다(환율 1,479.5원).</p>
<table>
<thead>
<tr>
<th>구분</th>
<th>월 비용</th>
<th>Azure 대비</th>
</tr>
</thead>
<tbody>
<tr>
<td>Azure (데이터 디스크 + 스냅샷 + 백업 볼트)</td>
<td>154,781원</td>
<td>기준</td>
</tr>
<tr>
<td>AWS — 캐시 439GB가 쌓였을 때</td>
<td><span class="hl-red">256,383원</span></td>
<td><span class="hl-red">+66%</span></td>
</tr>
<tr>
<td>AWS — 캐시 데이터를 비운 뒤 (파일 항목 158.9GB 남음 · 교체 전)</td>
<td><span class="hl-amber">약 116,000원</span></td>
<td><span class="hl-amber">−25%</span></td>
</tr>
<tr>
<td>AWS — 파일시스템 교체 후 (9/29 실측 · 고성능 계층 78,000 + 버킷 23,000)</td>
<td><span class="hl-green">약 101,000원</span></td>
<td><span class="hl-green">−35%</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>이전 결정 자체는 옳았습니다. <span class="hl-amber">S3 Files의 기본 캐시 설정</span>이 켜진 채 대량 작업을 만난 것이 비용을 뒤집었습니다. 9/14 작성 당시 «교체 후 약 38,500원(−75%)» · «교체 + 정리 약 20,000원(−87%)» 은 새 파일시스템 용량을 0에 가깝게 본 추정이었고, <span class="hl-red">틀린 값</span>으로 확인돼 9/29 실측으로 정정했습니다. 새 파일시스템도 9/18~9/20 마운트 전체 탐색으로 파일 항목 기록이 169.92GB까지 다시 찼고(항목 기록은 만료되지 않음), 이 값이 상한이라 월 비용은 더 늘지 않고 고정됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%94%81-%ED%8C%8C%EC%9D%BC%EC%8B%9C%EC%8A%A4%ED%85%9C-%EA%B5%90%EC%B2%B4--%EB%82%A8%EC%9D%80-1589gb%EB%8A%94-%C2%AB%ED%8C%8C%EC%9D%BC-%ED%95%AD%EB%AA%A9-%EA%B8%B0%EB%A1%9D%C2%BB%EC%9D%B4%EC%97%88%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge-date914span"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> 파일시스템 교체 — 남은 158.9GB는 «파일 항목 기록»이었습니다 <span class="badge-date">9/14</span></h2>
<div class="stats">
<div class="card"><div class="num">158.9GB</div><div class="lab">만료로 안 빠진 용량 (월 약 7.8만원)</div></div>
<div class="card"><div class="num">1,661만</div><div class="lab">기록된 파일 항목 수</div></div>
<div class="card"><div class="num">10KiB</div><div class="lab">항목 1개 최소 과금 크기</div></div>
<div class="card"><div class="num">1.2초</div><div class="lab">서버 연결 전환 시간</div></div>
</div>
<div class="cols">
<div class="col">
<h3 id="%EC%99%9C-%EC%95%88-%EC%A4%84%EC%97%88%EB%82%98">왜 안 줄었나</h3>
<ul>
<li>캐시에 담긴 <span class="hl-green">파일 내용은 만료로 전부 빠졌습니다</span></li>
<li>남은 것은 파일시스템이 기억하는 <span class="hl-amber">파일 목록(이름·크기·권한)</span>입니다</li>
<li>9/3 권한 복구가 모든 폴더를 열어 <span class="hl-red">1,661만 항목 × 10KiB = 158.9GB</span></li>
<li>목록 기록은 <span class="hl-red">만료 대상이 아니라</span> 설정으로 지울 수 없습니다</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%96%B4%EB%96%BB%EA%B2%8C-%EC%97%86%EC%95%B4%EB%82%98">어떻게 없앴나</h3>
<ul>
<li>S3의 파일은 그대로 두고, 서버가 붙는 <span class="hl-green">파일시스템만 새로 만들어</span> 연결했습니다</li>
<li>새 파일시스템은 <span class="hl-green">실제로 연 폴더만</span> 기록해서 작게 유지됩니다</li>
<li>기존 파일시스템은 연결만 끊고 보관 → <span class="hl-amber">2~3일 관찰 후 삭제</span> (보관 중 하루 약 $1.7)</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%E2%9C%85-%EA%B5%90%EC%B2%B4-%EC%A0%88%EC%B0%A8%EC%99%80-%EA%B2%80%EC%A6%9D--%EC%9A%B4%EC%98%81-%ED%8F%B4%EB%8D%94%EB%A5%BC-%EA%B1%B4%EB%93%9C%EB%A6%AC%EA%B8%B0-%EC%A0%84%EC%97%90-%EB%A8%BC%EC%A0%80-%EB%8C%80%EC%A1%B0%ED%96%88%EC%8A%B5%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 교체 절차와 검증 — 운영 폴더를 건드리기 전에 먼저 대조했습니다</h2>
<table>
<thead>
<tr>
<th>순서</th>
<th>작업</th>
<th>확인 결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>①</td>
<td>새 파일시스템 생성 → <span class="hl-green">연결 전에</span> 자동 적재 끄기·만료 1일 적용</td>
<td>기본값(적재 켬·만료 30일)이 한 번도 동작하지 않음</td>
</tr>
<tr>
<td>②</td>
<td>서버 임시 경로에 새 파일시스템을 <span class="hl-blue">나란히 연결</span>해 기존과 대조</td>
<td>폴더 23개·항목 2,960개 — 이름·소유자 차이 <span class="hl-green">0</span>, 업로드 계정 쓰기 권한 상실 <span class="hl-green">0</span></td>
</tr>
<tr>
<td>③</td>
<td>파일 내용 대조 + 업로드 계정(www-data) 쓰기 시험</td>
<td>내용 일치 · 쓴 파일이 <span class="hl-green">약 1분 뒤 S3 반영</span></td>
</tr>
<tr>
<td>④</td>
<td>S3로 아직 안 넘어간 변경 <span class="hl-green">0건</span> 확인 → 서버 연결 교체</td>
<td>전환 1.2초 · 사이트·파일 응답 정상</td>
</tr>
<tr>
<td>⑤</td>
<td>기존 파일시스템 보관 · 9/17 자동 보고에 새 용량과 삭제 알림 추가</td>
<td>되돌리기 = 백업한 설정 파일 복원 후 재연결</td>
</tr>
</tbody>
</table>
<blockquote>
<p>폴더 권한(www-data)은 S3의 폴더 표시 객체에도 저장돼 있어 새 파일시스템이 그대로 읽습니다. 교체 직후 본 타일 이미지 403은 장소 폴더 안의 <code>.htaccess</code>가 직접 접근을 막는 기존 동작이었습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%A7%AD-%EB%8B%A4%EC%9D%8C%EC%97%90-%EA%B6%8C%ED%95%9C%EC%9D%84-%EB%98%90-%EB%B0%94%EA%BF%94%EC%95%BC-%ED%95%9C%EB%8B%A4%EB%A9%B4"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 다음에 권한을 또 바꿔야 한다면</h2>
<p>권한 변경은 폴더 규모와 상관없이 <span class="hl-amber">S3 파일을 한 번씩 다시 쓰는 작업</span>입니다. 9/3의 S3 요청비 $125와 구버전 1,630만 개가 여기서 나왔습니다. 피할 수 있는 것은 <span class="hl-green">파일 항목 기록(바닥값)</span> 쪽입니다.</p>
<table>
<thead>
<tr>
<th>상황</th>
<th>방법</th>
<th>운영 파일시스템의 항목 기록</th>
<th>비용 (추정)</th>
</tr>
</thead>
<tbody>
<tr>
<td>특정 장소·폴더만 문제</td>
<td><span class="hl-green">그 폴더만</span> 권한 수정</td>
<td>그 폴더 항목만 (수천 개 · 수 원)</td>
<td>거의 0</td>
</tr>
<tr>
<td>전체 변경 — <span class="hl-green">권장</span></td>
<td><span class="hl-green">작업용 임시 파일시스템</span>을 만들어 거기서 실행 → 끝나면 삭제</td>
<td><span class="hl-green">생기지 않음</span> (추정) · 임시분만 하루 약 $1.7</td>
<td>S3 재기록 약 $75~125</td>
</tr>
<tr>
<td>전체 변경 — 대안</td>
<td>S3 일괄 작업(Batch Operations)으로 권한 정보만 교체</td>
<td><span class="hl-green">생기지 않음</span> (추정)</td>
<td>요청 약 $75 + 작업비 약 $17</td>
</tr>
<tr>
<td>이번 방식</td>
<td>운영 파일시스템에서 실행 → 나중에 교체</td>
<td><span class="hl-red">교체 전까지 매일 과금</span></td>
<td>교체 작업 약 15분</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> 재발을 막는 쪽이 가장 쌉니다: 서버 업로드는 권한 정보가 자동으로 기록되고(9/14 업로드 실측), S3에 직접 올리는 파일만 <span class="hl-blue">권한 정보(file-owner 등)를 함께 넣으면</span> 복구 작업 자체가 필요 없습니다. 어떤 방법이든 전체 재기록은 구버전이 한 벌 생기므로 <span class="hl-amber">30일 구버전 규칙</span>이 정리합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="sec" data-theme="clean" lang="C" class="sec" data-marpit-pagination="12" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="39">
<p><span class="sec-num">Section 02</span></p>
<h2 id="%EA%B5%AC%EB%B2%84%EC%A0%84-%EC%A0%95%EB%A6%AC%EC%99%80-%EC%A0%84%EC%B2%B4-%EB%B0%B1%EC%97%85">구버전 정리와 전체 백업</h2>
<p>지우기 전에 먼저 받아두고, 받은 것은 파일 하나까지 검증했습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="13" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%93%A6-%EB%A1%9C%EC%BB%AC-%EC%A0%84%EC%B2%B4-%EB%B0%B1%EC%97%85--aws-%EC%95%88%EC%97%90%EC%84%9C-%EB%AC%B6%EA%B3%A0-%ED%95%9C-%EB%B2%88%EC%97%90-%EB%B0%9B%EA%B8%B0-span-classbadge-date913914span"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> 로컬 전체 백업 — AWS 안에서 묶고 한 번에 받기 <span class="badge-date">9/13~9/14</span></h2>
<div class="stats">
<div class="card"><div class="num">16,566,507</div><div class="lab">검증 통과 파일</div></div>
<div class="card"><div class="num">2,311</div><div class="lab">장소·경로별 tar</div></div>
<div class="card"><div class="num">456GiB</div><div class="lab">dsgn H: 저장 용량</div></div>
<div class="card"><div class="num">약 $55</div><div class="lab">총비용 (추정)</div></div>
</div>
<table>
<thead>
<tr>
<th>단계</th>
<th>방법</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>묶기</td>
<td>서울 리전 임시 서버가 장소 폴더별로 tar 생성</td>
<td>1시간 5분 · 초당 약 4,000개 · 실패 0</td>
</tr>
<tr>
<td>받기</td>
<td>dsgn이 완성된 tar를 반복해서 내려받기</td>
<td>인터넷 전송은 tar 2,311개뿐</td>
</tr>
<tr>
<td>검증</td>
<td>tar sha256 + 파일별 md5를 목록표와 대조</td>
<td>누락 0 · 불일치 0</td>
</tr>
<tr>
<td>정리</td>
<td>임시 서버·버킷·권한 삭제</td>
<td>재조회로 삭제 확인</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="sec" data-theme="clean" lang="C" class="sec" data-marpit-pagination="15" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="39">
<p><span class="sec-num">Section 03</span></p>
<h2 id="%EC%95%9E%EC%9C%BC%EB%A1%9C%EC%9D%98-%EB%B0%B1%EC%97%85--%EB%B0%A9%EB%B2%95-%EB%B9%84%EA%B5%90%EC%99%80-%EC%84%A0%ED%83%9D">앞으로의 백업 — 방법 비교와 선택</h2>
<p>AWS Backup, 로컬 백업, 버저닝만 쓰는 방법을 비용·보호 범위·운영 수고로 비교했습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%94%8D-%EC%84%B8-%EA%B0%80%EC%A7%80-%EB%B0%A9%EB%B2%95-%EB%B9%84%EA%B5%90"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 세 가지 방법 비교</h2>
<table>
<thead>
<tr>
<th>항목</th>
<th>A. AWS Backup</th>
<th><span class="hl-green">B. 로컬 백업 + 버저닝 30일</span></th>
<th>C. 버저닝 30일만</th>
</tr>
</thead>
<tbody>
<tr>
<td>월 고정비</td>
<td><span class="hl-red">11.5~16.4만원</span></td>
<td><span class="hl-green">약 1,500~4,500원</span></td>
<td>거의 0</td>
</tr>
<tr>
<td>최근 실수 복구</td>
<td>35일 안 아무 시점</td>
<td>30일 (버저닝)</td>
<td>30일 (버저닝)</td>
</tr>
<tr>
<td>버킷 삭제·계정 사고</td>
<td>복구 가능 (같은 계정)</td>
<td><span class="hl-green">복구 가능 (AWS 밖 사본)</span></td>
<td><span class="hl-red">불가</span></td>
</tr>
<tr>
<td>전체를 로컬로 꺼내기</td>
<td><span class="hl-red">복원+다운로드 약 21~26만원</span></td>
<td><span class="hl-green">이미 로컬에 있음</span></td>
<td>원본에서 다시 받기 약 8만원</td>
</tr>
<tr>
<td>운영 수고</td>
<td>없음 (자동)</td>
<td>자동화 스크립트 관리</td>
<td>없음</td>
</tr>
<tr>
<td>대량 작업의 영향</td>
<td>백업 대상 급증 → 보관비 최대 2배</td>
<td>내용이 같으면 다시 받지 않음</td>
<td>구버전 30일치 증가</td>
</tr>
</tbody>
</table>
<blockquote>
<p>금액은 서울 리전 가격표 기준 추정입니다. AWS Backup은 <span class="hl-amber">128KB 미만 파일을 128KB로 과금</span>합니다(요금 페이지 원문 확인). 타일 평균이 30KB라 실제 429GB가 약 2TB로 계산됩니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="17" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%E2%9C%85-%EC%99%9C-b%EB%A5%BC-%EC%84%A0%ED%83%9D%ED%96%88%EB%82%98-span-classbadge%EB%B3%B5%EC%9B%90-%EB%B6%80%EB%B6%84-%EB%B3%80%EA%B2%BD-%E2%86%92-p34span"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 왜 B를 선택했나 <span class="badge">복원 부분 변경 → p.34</span></h2>
<div class="cols">
<div class="col">
<h3 id="%EB%B9%84%EC%9A%A9">비용</h3>
<ul>
<li>AWS Backup 보관비만으로 <span class="hl-red">Azure 시절 파일 저장 비용 전체를 넘습니다</span></li>
<li>B는 바뀐 장소만 받아서 대부분 <span class="hl-green">월 100GB 무료 전송분 안</span>에서 끝납니다</li>
</ul>
<h3 id="%EB%8F%85%EB%A6%BD%EC%84%B1">독립성</h3>
<ul>
<li>사본이 <span class="hl-green">AWS 계정 밖(dsgn)</span>에 있어 계정 사고·버킷 삭제에도 남습니다</li>
<li>필요할 때 <span class="hl-green">장소 tar 하나만 풀면</span> 바로 복원됩니다</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%9D%B4%EB%AF%B8-%EA%B0%96%EC%B6%98-%EA%B2%83">이미 갖춘 것</h3>
<ul>
<li>검증된 전체 백업과 <span class="hl-blue">묶기·검증 스크립트</span>가 있습니다</li>
<li>최근 실수는 <span class="hl-green">버저닝 30일</span>이 S3 안에서 무료로 막아줍니다</li>
</ul>
<h3 id="%EA%B0%90%EC%88%98%ED%95%98%EB%8A%94-%EA%B2%83%EA%B3%BC-%EB%8C%80%EC%9D%91">감수하는 것과 대응</h3>
<ul>
<li>dsgn이 <span class="hl-amber">켜져 있어야</span> 갱신됩니다 → 절전 안 함 설정 확인</li>
<li><span class="hl-amber">윈도우 업데이트 재부팅</span> 가능 (9/9 05:49 사례) → 끊겨도 다음 날 이어서 하는 구조</li>
<li>갱신 사이의 변경은 버저닝 30일 창에 의존합니다</li>
<li>디스크 1개 위험 → <span class="hl-green">2차 사본을 이 컴퓨터 디스크 2개에</span></li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="18" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%94%84-%EA%B5%AC%ED%98%84-%EB%B0%A9%EC%8B%9D--%EB%A7%A4%EC%9D%BC-0400-%EC%9E%A5%EC%86%8C-%EB%8B%A8%EC%9C%84-%EC%A6%9D%EB%B6%84-%EA%B0%B1%EC%8B%A0-span-classbadge%E2%91%A3-%EB%B3%80%EA%B2%BD%EB%90%A8-1022-%E2%86%92-section-04span"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> 구현 방식 — 매일 04:00 장소 단위 증분 갱신 <span class="badge">④ 변경됨 10/22 → Section 04</span></h2>
<table>
<thead>
<tr>
<th>순서</th>
<th>동작</th>
<th>이유</th>
</tr>
</thead>
<tbody>
<tr>
<td>①</td>
<td>S3 Inventory가 매일 파일 목록(키·크기·ETag·수정시각) 생성</td>
<td>1,657만 개를 직접 조회하지 않음 · 1회 약 $0.04</td>
</tr>
<tr>
<td>②</td>
<td>어제 목록과 <span class="hl-blue">장소 폴더별로 비교</span> — ETag가 달라도 크기가 같으면 <span class="hl-blue">체크섬(CRC64) 재확인</span></td>
<td>내용이 같은 재기록(9/5, 9.65GB)은 기록만 하고 받지 않음</td>
</tr>
<tr>
<td>③</td>
<td>한 번에 <span class="hl-amber">샤드 200곳 또는 50GB 이상</span>이면 멈추고 Slack 확인 요청</td>
<td>대량 작업이 모르는 사이 대량 다운로드로 번지는 것 차단</td>
</tr>
<tr>
<td>④</td>
<td>바뀐 장소는 <span class="hl-green">현재 상태 전체를 새 tar로</span> dsgn이 원본에서 직접 받기</td>
<td>복원 시 최신 tar 하나만 풀면 끝 · S3에 사본을 두지 않음</td>
</tr>
<tr>
<td>⑤</td>
<td>tar sha256 + 파일별 md5 검증</td>
<td>기존 검증 스크립트 재사용</td>
</tr>
<tr>
<td>⑥</td>
<td><span class="hl-green">기간 기준 보관</span> 적용 (다음 장)</td>
<td>자주 바뀌는 장소의 수정 전 원본 보존</td>
</tr>
</tbody>
</table>
<blockquote>
<p>장소 하나를 통째로 다시 받아도 비용은 작습니다: 중간값 49MB는 1원 미만, 재생성된 <code>pano/1/1773/</code>(0.5GB)은 약 80원, 가장 큰 <code>pano/0/100/</code>(8GB)도 약 1,500원입니다(추정).</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="19" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%93%85-%EC%A3%BC%EA%B8%B0%EC%99%80-%EB%B3%B4%EA%B4%80-%EA%B7%9C%EC%B9%99--%EC%8B%A4%EC%B8%A1-%EB%B3%80%EA%B2%BD-%EB%B9%88%EB%8F%84%EB%A1%9C-%EC%A0%95%ED%96%88%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge%EC%9C%A0%EC%A7%80--%EC%82%AD%EC%A0%9C-%EB%B0%A9%EC%8B%9D-%EB%B3%B4%EC%99%84-%E2%86%92-p32span"><img class="emoji" draggable="false" alt="📅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c5.svg" data-marp-twemoji=""/> 주기와 보관 규칙 — 실측 변경 빈도로 정했습니다 <span class="badge">유지 · 삭제 방식 보완 → p.32</span></h2>
<div class="cols">
<div class="col">
<h3 id="%EC%8B%A4%EC%A0%9C-%EB%B3%80%EA%B2%BD-%EB%B9%88%EB%8F%84-%EB%AA%A9%EB%A1%9D%ED%91%9C-%EC%8B%A4%EC%B8%A1">실제 변경 빈도 (목록표 실측)</h3>
<table>
<thead>
<tr>
<th>날짜</th>
<th>바뀐 파일</th>
<th>성격</th>
</tr>
</thead>
<tbody>
<tr>
<td>9/5</td>
<td>40,169개 · 545샤드</td>
<td><span class="hl-gray">ETag 형식만 바뀐 재기록</span></td>
</tr>
<tr>
<td>9/7</td>
<td>17,379개 · 2샤드</td>
<td><span class="hl-red">1773 타일 재생성</span></td>

<tr>
<td>9/8~9/13</td>
<td>하루 4~11개</td>
<td><span class="hl-green">평소 수준</span></td>

</tbody>
</table>
<ul>
<li>평소엔 <span class="hl-green">매일 돌려도 받을 게 거의 없음</span> → <span class="hl-green">매일 04:00</span></li>
<li>새 장소는 짧게 여러 번 바뀜 — <code>1773</code>은 <span class="hl-amber">열흘 중 4일</span></li>
</ul>
</div>
<div class="col">
<h3 id="%EB%B3%B4%EA%B4%80-%EA%B7%9C%EC%B9%99--%EA%B0%9C%EC%88%98%EA%B0%80-%EC%95%84%EB%8B%88%EB%9D%BC-%EA%B8%B0%EA%B0%84">보관 규칙 — 개수가 아니라 기간</h3>
<table>
<thead>
<tr>
<th>대상</th>
<th>보관</th>
</tr>
</thead>
<tbody>
<tr>
<td>기준본 (9/13 전체)</td>
<td>1년 뒤 새 기준본까지</td>
</tr>
<tr>
<td>최근 30일 세대</td>
<td><span class="hl-green">전부</span></td>
</tr>
<tr>
<td>30일 지난 세대</td>
<td>장소별 <span class="hl-green">월 1개 · 12개월</span></td>
</tr>
<tr>
<td>12개월 지난 월간 세대</td>
<td>삭제</td>
</tr>
</tbody>
</table>
<ul>
<li>«최근 3세대»는 <code>1773</code> 같은 장소에서 <span class="hl-red">일주일 안에 원본이 밀려남</span></li>
<li>30일은 <span class="hl-blue">S3 버저닝 30일</span>과 복원 가능 기간을 맞춤</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%95%93-%EC%9D%BC%EC%A0%95%EA%B3%BC-%EC%9E%AC%EB%B6%80%ED%8C%85-914-%EC%9B%90%EC%95%88-span-classbadge%EB%B3%80%EA%B2%BD%EB%90%A8-%E2%86%92-p35span"><img class="emoji" draggable="false" alt="🕓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f553.svg" data-marp-twemoji=""/> 일정과 재부팅 (9/14 원안) <span class="badge">변경됨 → p.35</span></h2>
<table>
<thead>
<tr>
<th>시각</th>
<th>무엇이</th>
<th>어디서</th>
<th>비고</th>
</tr>
</thead>
<tbody>
<tr>
<td>04:00</td>
<td>증분 갱신 (목록 비교 → 바뀐 장소 받기 → 검증)</td>
<td>dsgn</td>
<td>평소 몇 초~몇 분 · 대량 변경은 확인 요청으로 멈춤</td>
</tr>
<tr>
<td>05:00</td>
<td>재부팅 검사 (<span class="hl-amber">가동 3.5일 초과 시 재부팅</span>, 약 4일마다)</td>
<td>이 컴퓨터</td>
<td>T2 브릿지 하드정지 예방 장치 (8/10 설정)</td>
</tr>
<tr>
<td>06:00</td>
<td>2차 백업 (dsgn → archive1 → archive2 복사 + sha256 대조)</td>
<td>이 컴퓨터</td>
<td>dsgn 작업이 아직 돌면 그날은 건너뜀</td>
</tr>
<tr>
<td>불규칙</td>
<td>윈도우 업데이트 재부팅</td>
<td>dsgn</td>
<td>9/9 05:49 사례 · 정기 재부팅은 없음</td>
</tr>
</tbody>
</table>
<div class="cols">
<div class="col">
<h3 id="%EB%81%8A%EA%B2%A8%EB%8F%84-%EC%95%88%EC%A0%84%ED%95%9C-%EA%B5%AC%EC%A1%B0">끊겨도 안전한 구조</h3>
<ul>
<li>tar는 <span class="hl-blue"><code>.partial</code></span>로 받고 → 다시 읽어 md5 검증 → 정식 이름으로 변경</li>
<li>상태 기록은 <span class="hl-green">검증이 끝난 뒤에만</span> 갱신 → 다음 날 같은 지점부터 재시도</li>
</ul>
</div>
<div class="col">
<h3 id="%EB%8F%99%EC%8B%9C-%EC%8B%A4%ED%96%89-%EB%B0%A9%EC%A7%80">동시 실행 방지</h3>
<ul>
<li>dsgn·이 컴퓨터 모두 <span class="hl-blue">잠금 파일</span>로 중복 실행 차단</li>
<li>2차 백업은 dsgn 잠금을 확인해 <span class="hl-green">쓰는 중인 파일을 복사하지 않음</span></li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%E2%9A%96%EF%B8%8F-%EC%9E%A5%EC%86%8C-%EB%8B%A8%EC%9C%84-vs-%ED%8C%8C%EC%9D%BC-%EB%8B%A8%EC%9C%84-914-%ED%8C%90%EB%8B%A8-span-classbadge1022-%EB%B2%88%EB%B3%B5-%E2%86%92-p29span"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 장소 단위 vs 파일 단위 (9/14 판단) <span class="badge">10/22 번복 → p.29</span></h2>
<table>
<thead>
<tr>
<th>항목</th>
<th>파일 단위 증분</th>
<th><span class="hl-green">장소 단위 갱신 (선택)</span></th>
</tr>
</thead>
<tbody>
<tr>
<td>장소 일부만 수정됐을 때 받는 양</td>
<td><span class="hl-green">바뀐 파일만</span></td>
<td>장소 전체</td>
</tr>
<tr>
<td>파노라마 재생성·신규 업로드</td>
<td>사실상 장소 전체</td>
<td>장소 전체</td>
</tr>
<tr>
<td>복원 절차</td>
<td>기준 tar + 증분 tar를 날짜순으로 전부 풀고 삭제 기록 반영</td>
<td><span class="hl-green">최신 tar 하나</span></td>
</tr>
<tr>
<td>복원 실수 가능성</td>
<td><span class="hl-red">높음</span> (순서·누락)</td>
<td><span class="hl-green">낮음</span></td>
</tr>
<tr>
<td>로컬 용량</td>
<td>가장 적음</td>
<td>바뀐 장소 × 보관 기간만큼 증가 (1년 수십 GB 추정)</td>
</tr>
<tr>
<td>기존 백업과의 연속성</td>
<td>새 구조 필요</td>
<td><span class="hl-green">장소별 tar 구조 그대로</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>사고가 났을 때 필요한 것은 <span class="hl-amber">빠르고 틀리지 않는 복원</span>입니다. 약간의 추가 다운로드를 감수하고 복원 단순성을 택했습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="22" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%E2%99%BB%EF%B8%8F-%EB%B3%B5%EC%9B%90%ED%95%A0-%EB%95%8C-%EC%A3%BC%EC%9D%98--%EA%B6%8C%ED%95%9C%EA%B9%8C%EC%A7%80-%EC%82%B4%EB%A6%AC%EB%A0%A4%EB%A9%B4-%C2%AB%EC%84%9C%EB%B2%84-%ED%8F%B4%EB%8D%94%C2%BB%EC%97%90-%ED%92%89%EB%8B%88%EB%8B%A4-span-classbadge%EC%A0%88%EC%B0%A8-%EB%B3%80%EA%B2%BD-%E2%86%92-p34span"><img class="emoji" draggable="false" alt="♻️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/267b.svg" data-marp-twemoji=""/> 복원할 때 주의 — 권한까지 살리려면 «서버 폴더»에 풉니다 <span class="badge">절차 변경 → p.34</span></h2>
<p>백업 tar에는 파일마다 <span class="hl-green">주인·권한(www-data)</span>이 함께 기록돼 있습니다. 어디에 푸느냐에 따라 이 정보가 살기도 하고 사라지기도 합니다.</p>
<table>
<thead>
<tr>
<th>복원 방법</th>
<th>절차</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td><span class="hl-green"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 서버 폴더에 풀기 (기본)</span></td>
<td>장소 tar를 서버로 옮긴 뒤 root로 <code>tar -xp --numeric-owner --warning=no-unknown-keyword -f &lt;장소&gt;.tar -C /var/www/html/files</code></td>
<td><span class="hl-green">주인·권한 그대로</span> · 약 1분 안에 S3 반영</td>
</tr>
<tr>
<td><span class="hl-red"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> S3에 직접 올리기</span></td>
<td>tar를 풀어 <code>aws s3 cp</code> · <code>sync</code> 로 업로드</td>
<td><span class="hl-red">권한 정보가 빠져 root 소유·읽기 전용</span> → 업로드·수정 실패 → 권한 복구 재발</td>
</tr>
<tr>
<td>불가피하게 S3에 직접 올릴 때</td>
<td>파일마다 <code>file-owner</code> <code>33</code> · <code>file-group</code> <code>33</code> · <code>file-permissions</code> <code>0100664</code>, 폴더 표시 객체(<code>pano/0/</code> 같은 빈 객체)에는 <code>0042775</code> 를 함께 넣기</td>
<td>권한 유지</td>
</tr>
</tbody>
</table>
<blockquote>
<p>9/3 권한 복구가 필요했던 이유가 이것입니다. S3에 직접 올린 파일은 권한 정보가 없어 <span class="hl-amber">root 소유로 보입니다</span>(AWS 문서 기본값). 복원은 덮어쓰기라 복원 전 상태도 <span class="hl-blue">구버전으로 30일</span> 남습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="23" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%A7%B0-%ED%95%84%EC%9A%94%ED%95%9C-%EA%B2%83%EA%B3%BC-%EB%B9%84%EC%9A%A9-914-%EC%9B%90%EC%95%88-span-classbadge%EB%8C%80%EC%83%81-%EB%B2%84%ED%82%B7-%EC%B6%94%EA%B0%80-%E2%86%92-p35span"><img class="emoji" draggable="false" alt="🧰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f0.svg" data-marp-twemoji=""/> 필요한 것과 비용 (9/14 원안) <span class="badge">대상 버킷 추가 → p.35</span></h2>
<div class="cols">
<div class="col">

<li>기준은 <span class="hl-green">파일 종류가 아니라 «바뀐 파일»</span>이어야 합니다</li>
</ul>
</div>
<div class="col">
<h3 id="%F0%9F%94%91-%EB%82%A8%EA%B8%B8-%EA%B5%90%ED%9B%88"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> 남길 교훈</h3>
<ul>
<li>«평소 변경 빈도»(하루 4~11개)만 보고 <span class="hl-amber">변경이 흩어지는 패턴</span>을 시험하지 않았습니다</li>
<li>안전장치를 둔 덕분에 <span class="hl-green">받기 전에 멈췄습니다</span> — 계속 유지합니다</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="30" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%93%8C-%EC%98%A4%EB%84%88-%EA%B2%B0%EC%A0%95-1022--572gib%EB%8A%94-%EC%98%9B-%EB%B0%A9%EC%8B%9D%EC%9C%BC%EB%A1%9C-%EC%8A%B9%EC%9D%B8%ED%95%98%EC%A7%80-%EC%95%8A%EB%8A%94%EB%8B%A4"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> 오너 결정 (10/22) — 57.2GiB는 옛 방식으로 승인하지 않는다</h2>
<table>
<thead>
<tr>
<th>선택지</th>
<th>내용</th>
<th>판단</th>
</tr>
</thead>
<tbody>
<tr>
<td>A. 그날 바로 <code>--approve</code></td>
<td>원안 방식으로 장소 71곳 전체 57.2GiB 다운로드 (전송비 약 $7 추정)</td>
<td><span class="hl-red">채택 안 함</span></td>
</tr>
<tr>
<td><span class="hl-green">B. 고친 뒤 새 방식으로 처리</span></td>
<td>변경분 방식을 만든 다음, 막힌 같은 목록(<code>2026-10-21T01-00Z</code>)을 새 방식으로 처리</td>
<td><span class="hl-green">채택</span></td>
</tr>
</tbody>
</table>
<div class="cols">
<div class="col">
<h3 id="%EC%99%9C-b%EC%9D%B8%EA%B0%80">왜 B인가</h3>
<ul>
<li>막힌 동안에도 바뀐 파일은 <span class="hl-green">S3에 그대로</span> 있고, <span class="hl-green">구버전 30일</span>이 덮어쓴 이전 내용까지 지킵니다 → 며칠 기다려도 잃는 것이 없습니다</li>
<li>A로 받으면 57GB짜리 세대 71개가 <span class="hl-amber">보관 규칙상 최대 12개월</span> 남고, 2차 디스크 2개에도 같은 양이 복사됩니다</li>
</ul>
</div>
<div class="col">
<h3 id="%EA%B2%B0%EA%B3%BC-1022-2039-%EC%88%98%EB%8F%99-1%ED%9A%8C">결과 (10/22 20:39 수동 1회)</h3>
<ul>
<li>같은 목록을 새 방식으로 처리 → <span class="hl-green">2,380,411바이트</span>만 다운로드</li>
<li>변경분 세대 70개 + 새 장소 <code>bbs__2026__10</code> 전체 세대 1개</li>
<li>이후 정기 실행은 다시 <span class="hl-green">매일 자동</span>입니다</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 이번 건에서 <span class="hl-red"><code>--approve</code> 실행 기록 0건</span> (cron.log 확인)</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="31" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%94%84-%EC%83%88-%EA%B5%AC%EC%A1%B0--%EB%B0%94%EB%80%90-%ED%8C%8C%EC%9D%BC%EB%A7%8C-%EB%8B%B4%EA%B3%A0-%EB%AA%A9%EB%A1%9D%ED%91%9C%EB%8A%94-%EC%9E%A5%EC%86%8C-%EC%A0%84%EC%B2%B4%EB%A5%BC-%EC%A0%81%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge-new1022-%ED%99%95%EC%A0%95span"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> 새 구조 — 바뀐 파일만 담고, 목록표는 장소 전체를 적습니다 <span class="badge-new">10/22 확정</span></h2>
<table>
<thead>
<tr>
<th>구성</th>
<th>기준(전체) 세대</th>
<th><span class="hl-green">변경분(delta) 세대</span></th>
</tr>
</thead>
<tbody>
<tr>
<td>본문 tar</td>
<td>장소 전체 (<code>.tar</code>)</td>
<td><span class="hl-green">바뀐(추가·수정) 파일만</span> (<code>.delta.tar</code>) · 삭제만 있으면 tar 없음</td>
</tr>
<tr>
<td>목록표 (<code>.csv.gz</code>)</td>
<td>모든 파일</td>
<td><span class="hl-green">그 시점의 모든 파일</span> + 파일마다 <span class="hl-blue">«본문이 든 tar»</span> (삭제된 파일은 빠짐)</td>
</tr>
<tr>
<td>기록 (<code>.json</code>)</td>
<td>tar 이름·크기·sha256</td>
<td>같은 3개 항목 유지 → <span class="hl-green">2차 백업 검증 스크립트 그대로</span></td>
</tr>
</tbody>
</table>
<div class="cols">
<div class="col">
<h3 id="913-%EA%B8%B0%EC%A4%80%EB%B3%B8%EC%9D%80-%EA%B7%B8%EB%8C%80%EB%A1%9C-%EC%B2%AB-%EA%B8%B0%EC%A4%80%EC%A0%90">9/13 기준본은 그대로 첫 기준점</h3>
<ul>
<li>9/13 전체 백업 tar 2,311개를 목록표가 <span class="hl-blue"><code>@base/&lt;장소&gt;.tar</code></span>로 가리킵니다</li>
<li>기준본은 <span class="hl-green">읽기만 하고</span> 수정·이동·삭제하지 않습니다 (작업 전후 4,622개 파일 크기·시각 동일)</li>
<li>9/14~10/21에 만든 전체 세대도 그대로 기준점으로 인정됩니다</li>
</ul>
</div>
<div class="col">
<h3 id="%EB%B3%B5%EC%9B%90%EC%9D%80-%EC%97%AC%EC%A0%84%ED%9E%88-%C2%AB%EB%AA%A9%EB%A1%9D%ED%91%9C-%ED%95%98%EB%82%98%C2%BB%EC%97%90%EC%84%9C-%EC%8B%9C%EC%9E%91">복원은 여전히 «목록표 하나»에서 시작</h3>
<ul>
<li>원하는 날짜의 목록표를 열면 <span class="hl-green">파일마다 꺼낼 tar가 적혀 있습니다</span></li>
<li>열어야 하는 tar는 <span class="hl-amber">최대 10개</span>로 제한 (다음 장 규칙)</li>
<li>꺼낸 파일마다 <span class="hl-green">md5·크기를 목록표와 대조</span>하고, 하나라도 틀리면 실패 처리</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="32" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%E2%99%BB%EF%B8%8F-%EA%B8%B0%EC%A4%80%EC%A0%90-%EB%8B%A4%EC%8B%9C-%EB%A7%8C%EB%93%A4%EA%B8%B0--%EC%98%A4%EB%9E%98%EB%90%9C-%EC%84%B8%EB%8C%80-%EC%A7%80%EC%9A%B0%EA%B8%B0--%EC%95%88%EC%A0%84%EC%9E%A5%EC%B9%98"><img class="emoji" draggable="false" alt="♻️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/267b.svg" data-marp-twemoji=""/> 기준점 다시 만들기 · 오래된 세대 지우기 · 안전장치</h2>
<div class="cols">
<div class="col">
<h3 id="%EA%B8%B0%EC%A4%80%EC%A0%84%EC%B2%B4-%EC%84%B8%EB%8C%80%EB%A5%BC-%EB%8B%A4%EC%8B%9C-%EB%A7%8C%EB%93%9C%EB%8A%94-%EC%A1%B0%EA%B1%B4--%EB%B0%94%EB%80%90-%EC%9E%A5%EC%86%8C%EC%97%90%EC%84%9C%EB%A7%8C-%ED%8C%90%EB%8B%A8">기준(전체) 세대를 다시 만드는 조건 — 바뀐 장소에서만 판단</h3>
<table>
<thead>
<tr>
<th>조건</th>
<th>이유</th>
</tr>
</thead>
<tbody>
<tr>
<td>기준점이 없음 (새 장소)</td>
<td>기댈 곳이 없음</td>
</tr>
<tr>
<td>참조할 tar가 없거나 위치 불명</td>
<td>안전 우선</td>
</tr>
<tr>
<td>이번 변경이 장소의 <span class="hl-blue">50% 이상</span></td>
<td>전체로 받아도 비용이 같음</td>
</tr>
<tr>
<td>열어야 할 tar가 <span class="hl-blue">10개 이상</span></td>
<td>복원 단계 수 상한</td>
</tr>
<tr>
<td>쌓인 변경분이 장소의 <span class="hl-blue">30% 이상</span></td>
<td>변경분이 기준보다 커지는 것 방지</td>
</tr>
<tr>
<td>기준점 나이 <span class="hl-blue">45~59일</span> (장소마다 다름)</td>
<td>다시 만드는 날을 분산</td>
</tr>
</tbody>
</table>
<ul>
<li>나이·사슬·누적 조건의 재생성은 <span class="hl-amber">하루 20GiB까지</span>만 · 넘치면 다음 날로 미룸</li>
<li>기준본 나이는 9/13이 아니라 <span class="hl-blue">채택일 10/22부터</span> 셈 (9/13부터 세면 첫날 2,311곳이 전부 만기)</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%98%A4%EB%9E%98%EB%90%9C-%EC%84%B8%EB%8C%80-%EC%A7%80%EC%9A%B0%EA%B8%B0--%C2%AB%EC%B0%B8%EC%A1%B0-%EC%A4%91%EC%9D%B4%EB%A9%B4-%EC%95%88-%EC%A7%80%EC%9A%B4%EB%8B%A4%C2%BB">오래된 세대 지우기 — «참조 중이면 안 지운다»</h3>
<ul>
<li>남길 목록표는 원안 규칙 그대로: <span class="hl-green">30일 전부 + 월 1개 12개월</span></li>
<li>남긴 목록표가 <span class="hl-red">하나라도 가리키는 tar는 절대 지우지 않음</span></li>
<li>목록표를 못 읽거나 tar가 없으면 <span class="hl-amber">그 장소는 아무것도 안 지움</span></li>
<li>1회 500개 초과·<code>generations/</code> 밖 경로는 삭제 중단 (원안 가드 유지)</li>
</ul>
<h3 id="%EC%95%88%EC%A0%84%EC%9E%A5%EC%B9%98">안전장치</h3>
<ul>
<li>기준은 그대로 <span class="hl-blue">200곳 또는 50GiB</span></li>
<li>판정 대상이 «장소 크기 합» → <span class="hl-green">«실제로 받을 양»</span>으로 바뀜</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="33" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%E2%9C%85-%EA%B2%80%EC%A6%9D--%EC%9A%B4%EC%98%81%EC%97%90-%EB%84%A3%EA%B8%B0-%EC%A0%84%EA%B3%BC-%ED%9B%84-span-classbadge-date10221023span"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 검증 — 운영에 넣기 전과 후 <span class="badge-date">10/22~10/23</span></h2>
<div class="stats">
<div class="card"><div class="num">39,342</div><div class="lab">복원 후 md5 대조 · 불일치 0</div></div>
<div class="card"><div class="num">0</div><div class="lab">목록표가 가리키는데 없는 tar (v1 149 · l3 216)</div></div>
<div class="card"><div class="num">46/46</div><div class="lab">자체 시험 통과 (QC 재실행)</div></div>
<div class="card"><div class="num">19KB</div><div class="lab">10/23 04:00 첫 정기 실행 다운로드</div></div>
</div>
<table>
<thead>
<tr>
<th>시험</th>
<th>방법</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>변경분에 바뀐 파일만 들어가나</td>
<td>수정·추가·삭제를 흉내 낸 세대를 만들어 tar 내용 대조</td>
<td><span class="hl-green">통과</span> · 삭제만 있으면 tar 없음</td>
</tr>
<tr>
<td>오래된 세대 삭제가 참조 tar를 지키나</td>
<td>시계를 과거로 돌려 삭제를 실제로 발동</td>
<td>목록표 4개 정리 · <span class="hl-green">참조 tar 2개 보호</span> · 미참조 1개만 삭제</td>
</tr>
<tr>
<td>목록표가 S3와 같은가</td>
<td>장소 7곳 목록표 ↔ S3 현재 목록</td>
<td>추가 0 · 누락 0 · 크기 차이 0</td>
</tr>
<tr>
<td>정기 실행</td>
<td>10/23 04:00 · 04:30 · 06:00</td>
<td>3건 모두 <span class="hl-green">정상</span> · 2차 디스크 2개 검증 문제 0</td>
</tr>
</tbody>
</table>
<blockquote>
<p>시험은 운영 폴더가 아닌 <span class="hl-blue">별도 폴더</span>에서 했고, S3에는 쓰지 않았습니다. QC 관찰 1건: 리포트의 장소 목록이 50건에서 잘려 보이지만 합계 수치는 정확합니다(판정 영향 없음).</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="34" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%E2%99%BB%EF%B8%8F-%EB%B3%B5%EC%9B%90-%EB%B0%A9%EB%B2%95-1022-%EC%9D%B4%ED%9B%84--%EC%9D%B4%EC%A0%9C-%C2%ABtar-%ED%95%98%EB%82%98-%ED%92%80%EA%B8%B0%C2%BB%EA%B0%80-%EC%95%84%EB%8B%99%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="♻️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/267b.svg" data-marp-twemoji=""/> 복원 방법 (10/22 이후) — 이제 «tar 하나 풀기»가 아닙니다</h2>
<p>변경분 세대가 생긴 장소는 <span class="hl-red">tar 하나에 장소 전체가 들어 있지 않습니다</span>. 최신 <code>.delta.tar</code>만 풀면 바뀐 파일 몇 개만 나옵니다.</p>
<table>
<thead>
<tr>
<th>단계</th>
<th>방법</th>
<th>주의</th>
</tr>
</thead>
<tbody>
<tr>
<td>① 재구성</td>
<td>kabkee-main에서 <code>incremental_backup.py [--src 버킷] --restore &lt;장소&gt; [--at YYYYMMDD] --out &lt;빈 폴더&gt; --out-tar &lt;장소&gt;.tar</code></td>
<td>목록표대로 필요한 tar에서 꺼내고 md5 대조 · <span class="hl-green">원래 소유자·권한을 담은 tar 1개</span> 생성</td>
</tr>
<tr>
<td>② 반영</td>
<td>tar를 서버로 옮겨 root로 <code>tar -xp --numeric-owner -f &lt;장소&gt;.tar -C /var/www/html/files</code></td>
<td><span class="hl-green">9/14 절차와 같은 명령</span> · 약 1분 안에 S3 반영 · 기존 파일은 구버전으로 30일 남음</td>
</tr>
<tr>
<td>기록</td>
<td>리포트 <code>owners</code> 에 소유자·권한 분포가 찍힘</td>
<td><code>0:33 0644</code>가 보이면 복원 후 그 파일만 <code>chown 33:33</code> · <span class="hl-amber">권한만 바뀐 변경은 백업이 감지 못함</span>(내용·ETag 동일 — 10/23 XML 80개)</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> 금지</td>

<h2 id="%F0%9F%A7%AF-10%EC%9B%94%EC%97%90-%EC%B6%94%EA%B0%80%EB%90%9C-%EC%9A%B4%EC%98%81-%ED%95%A8%EC%A0%95"><img class="emoji" draggable="false" alt="🧯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ef.svg" data-marp-twemoji=""/> 10월에 추가된 운영 함정</h2>
<table>
<thead>
<tr>
<th>함정</th>
<th>무슨 일이 있었나</th>
<th>앞으로의 원칙</th>
</tr>
</thead>
<tbody>
<tr>
<td>평소 변경이 적으면 장소 단위로 충분하다?</td>
<td>하루 4~11개였지만 <span class="hl-red">XML 일괄 수정 하루</span>가 장소 71곳을 건드림</td>
<td><span class="hl-green">«얼마나 자주»가 아니라 «얼마나 흩어지나»</span>까지 시험</td>
</tr>
<tr>
<td>안전장치에 걸리면 승인하면 된다?</td>
<td>승인했다면 57GB가 1년 보관 + 디스크 2개에 복사</td>
<td><span class="hl-green">먼저 실제 변경을 확인</span>하고, 방식이 틀렸으면 고친 뒤 처리</td>
</tr>
<tr>
<td>파일 종류별로 따로 백업하면 효율적이다?</td>
<td>XML만 따로 하면 jpg 대량 변경 날 같은 문제 재발</td>
<td><span class="hl-green">«바뀐 파일만»</span>이 기준</td>
</tr>
<tr>
<td>오래된 tar는 날짜만 보고 지우면 된다?</td>
<td>변경분 방식에선 오래된 기준 tar를 <span class="hl-red">최신 목록표가 계속 참조</span></td>
<td><span class="hl-green">참조 계산 후 삭제</span> · 못 읽으면 안 지움</td>
</tr>
<tr>
<td>기준본 나이는 만든 날부터 센다?</td>
<td>9/13부터 세면 전환 첫날 <span class="hl-red">2,311곳이 한꺼번에 만기</span></td>
<td>채택일(10/22)부터 세고 장소마다 분산</td>
</tr>
<tr>
<td>복원은 tar 하나 풀면 된다?</td>
<td>변경분 tar엔 바뀐 파일만 있음 · 첫 복원 도구는 권한까지 버림</td>
<td><span class="hl-green"><code>--restore --out-tar</code> → 서버에서 <code>tar -xp</code></span></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="37" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%A7%8A-%EC%B6%94%EA%B0%80-%EB%B0%B1%EC%97%85-%EC%84%A0%ED%98%B8%EC%95%88--%EB%B3%84%EB%8F%84-aws-%EA%B3%84%EC%A0%95-glacier-deep-archive-span-classbadge%EC%A3%BC%EA%B0%84%ED%9A%8C%EC%9D%98-%EB%85%BC%EC%9D%98--%EB%AF%B8%EA%B2%B0%EC%A0%95span"><img class="emoji" draggable="false" alt="🧊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ca.svg" data-marp-twemoji=""/> 추가 백업 선호안 — 별도 AWS 계정 Glacier Deep Archive <span class="badge">주간회의 논의 · 미결정</span></h2>
<div class="cols">
<div class="col">
<h3 id="%F0%9F%92%B0-%EB%B9%84%EC%9A%A9--%EB%84%A3%EA%B3%A0-%EB%91%90%EB%8A%94-%EA%B1%B4-%EA%B1%B0%EC%9D%98-%EA%B3%B5%EC%A7%9C-%C2%AB%EA%BA%BC%EB%82%BC-%EB%95%8C%C2%BB%EB%A7%8C-%EB%B9%84%EC%9A%A9"><img class="emoji" draggable="false" alt="💰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b0.svg" data-marp-twemoji=""/> 비용 — 넣고 두는 건 거의 공짜, «꺼낼 때»만 비용</h3>
<table>
<thead>
<tr>
<th>항목 (서울 리전 · AWS 공식 가격표)</th>
<th>단가</th>
<th>이번 규모 약 490GB</th>
</tr>
</thead>
<tbody>
<tr>
<td>저장</td>
<td><span class="hl-green">$0.002 / GB·월</span></td>
<td><span class="hl-green">월 약 $1 (약 1,450원)</span></td>
</tr>
<tr>
<td>올리기 (PUT 요청)</td>
<td>$0.06 / 1,000건</td>
<td>첫 업로드 tar 2,311개 약 $0.2 · 매일 몇 개는 사실상 0</td>
</tr>
<tr>
<td>올리기 (전송)</td>
<td>무료</td>
<td>0</td>
</tr>
<tr>
<td>꺼내기 준비 (대량 · 최대 48시간)</td>
<td>$0.005 / GB</td>
<td>전체 약 $2.5 · 장소 1GB 약 7원</td>
</tr>
<tr>
<td>내려받기 (인터넷 전송)</td>
<td>$0.126 / GB</td>
<td><span class="hl-amber">전체 약 $50~62</span> · 장소 1GB 약 190원</td>
</tr>
</tbody>
</table>
</div>
<div class="col">
<h3 id="%F0%9F%97%91%EF%B8%8F-%EC%82%AD%EC%A0%9C-%EA%B7%9C%EC%B9%99--span-classhl-red180%EC%9D%BC-%EC%A0%84%EC%97%90-%EC%A7%80%EC%9A%B0%EB%A9%B4-6%EA%B0%9C%EC%9B%94%EC%B9%98%EB%8A%94-%EB%82%B8%EB%8B%A4span"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5d1.svg" data-marp-twemoji=""/> 삭제 규칙 — <span class="hl-red">180일 전에 지우면 6개월치는 낸다</span></h3>
<ul>
<li>올리자마자 지워도 <span class="hl-amber">월 비용 × 6개월</span>이 청구됩니다 (490GB 기준 약 $6) → 계산과 예시는 p.38</li>
</ul>
<h3 id="%F0%9F%94%90-%EC%84%A4%EA%B3%84-%EC%9B%90%EC%B9%99"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> 설계 원칙</h3>
<ul>
<li><span class="hl-green">별도 AWS 계정</span> → 지금 계정에 사고가 나도 남음</li>
<li>kabkee-main에는 <span class="hl-green">«올리기만 되고 지우기는 안 되는»</span> 권한만 부여 → 이 컴퓨터가 감염돼도 못 지움</li>
</ul>
</div>
</div>
<blockquote>
<p>출처: AWS 공식 가격 파일 <code>AmazonS3GlacierDeepArchive</code> · <code>AmazonS3</code> · <code>AWSDataTransfer</code> (서울 리전, 10/23 조회) · S3 문서 「Comparing the Amazon S3 storage classes」(최소 보관 180일 · 객체당 메타데이터 40KB — tar 묶음이라 무시 수준). 내려받기 금액은 월 100GB 무료 전송분 사용 여부에 따라 달라집니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="38" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
<h2 id="%F0%9F%97%91%EF%B8%8F-deep-archive-%EC%82%AD%EC%A0%9C-%EB%B9%84%EC%9A%A9--180%EC%9D%BC-%EC%A0%84%EC%97%90-%EC%A7%80%EC%9A%B0%EB%A9%B4-%C2%AB%EC%9B%94-%EB%B9%84%EC%9A%A9-%C3%97-6%EA%B0%9C%EC%9B%94%C2%BB%EC%9D%84-%EB%83%85%EB%8B%88%EB%8B%A4"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5d1.svg" data-marp-twemoji=""/> Deep Archive 삭제 비용 — 180일 전에 지우면 «월 비용 × 6개월»을 냅니다</h2>
<div class="cols">
<div class="col">
<h3 id="%EA%B7%9C%EC%B9%99-s3-%EB%AC%B8%EC%84%9C--%EC%84%9C%EC%9A%B8-%EA%B3%B5%EC%8B%9D-%EA%B0%80%EA%B2%A9%ED%91%9C">규칙 (S3 문서 · 서울 공식 가격표)</h3>
<ul>
<li>최소 보관 기간 <span class="hl-red">180일</span></li>
<li>그 전에 <span class="hl-amber">지우거나 덮어쓰면</span> 남은 일수만큼의 저장비를 그 자리에서 한 번에 청구 (<code>EarlyDelete-GDA</code> $0.002 / GB·월, 일할 계산)</li>
<li>계산식: <span class="hl-blue">용량(GB) × $0.002 × (180 − 보관한 날) ÷ 30</span></li>
<li>그래서 «언제 지우든» 객체 하나당 <span class="hl-amber">최소 180일치 저장비</span>는 반드시 나갑니다. 그 이상의 위약금은 없습니다</li>
</ul>
<h3 id="490gb-%EC%A0%84%EC%B2%B4%EB%A5%BC-%EC%98%AC%EB%A0%B8%EB%8B%A4%EA%B0%80-%EC%A7%80%EC%9A%B0%EB%8A%94-%EA%B2%BD%EC%9A%B0">490GB 전체를 올렸다가 지우는 경우</h3>
<table>
<thead>
<tr>
<th>지운 시점</th>
<th>이미 낸 저장비</th>
<th>삭제 때 추가 청구</th>
<th>총액</th>
</tr>
</thead>
<tbody>
<tr>
<td><span class="hl-red">올리자마자 (0일)</span></td>
<td>$0</td>
<td><span class="hl-red">$5.88 = 월 $0.98 × 6</span></td>
<td>약 8,700원</td>
</tr>
<tr>
<td>30일 뒤</td>
<td>$0.98</td>
<td>$4.90 (5개월치)</td>
<td>약 8,700원</td>
</tr>
<tr>
<td>90일 뒤</td>
<td>$2.94</td>
<td>$2.94 (3개월치)</td>
<td>약 8,700원</td>
</tr>
<tr>
<td>180일 뒤</td>
<td>$5.88</td>
<td><span class="hl-green">$0</span></td>
<td>약 8,700원</td>
</tr>
</tbody>
</table>
</div>
<div class="col">
<h3 id="%EC%9A%B0%EB%A6%AC-%EC%9A%B4%EC%98%81%EC%97%90%EC%84%9C-%EC%83%9D%EA%B8%B0%EB%8A%94-%EA%B2%BD%EC%9A%B0">우리 운영에서 생기는 경우</h3>
<table>
<thead>
<tr>
<th>상황</th>
<th>영향 (추정)</th>
</tr>
</thead>
<tbody>
<tr>
<td>매일 올리는 변경분 tar (평소 수십 KB~수 MB)</td>
<td>30일 보관 뒤 지워도 180일치 — <span class="hl-green">1원 미만</span></td>
</tr>
<tr>
<td>기준점 재생성 (장소마다 45~59일) → 옛 기준 tar 삭제</td>
<td>1GB 장소 1곳당 약 $0.009 (약 13원)</td>
</tr>
<tr>
<td>10/22 같은 일괄 변경 71곳이 한꺼번에 기준 재생성</td>
<td>57GB 기준 약 $0.5 (약 730원)</td>
</tr>
<tr>
<td>시험 삼아 전체를 올렸다가 «안 쓰기로» 하고 바로 삭제</td>
<td><span class="hl-red">약 $6 (약 8,700원)</span></td>
</tr>
</tbody>
</table>
<h3 id="%F0%9F%94%91-%EA%B7%B8%EB%9E%98%EC%84%9C"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> 그래서</h3>
<ul>
<li>Deep Archive 사본은 <span class="hl-green">로컬 보관 규칙(30일·월 1개 12개월)을 그대로 따르지 않고</span>, 180일 미만 삭제를 피하는 쪽으로 따로 정하는 것이 맞습니다 (구현 때 결정)</li>
<li>금액 자체가 작아서 «실수로 지워도 큰돈은 안 나간다» — 다만 <span class="hl-amber">0원은 아니다</span></li>
</ul>
</div>
</div>
</section>

<h2 id="%EC%A0%95%EB%A6%AC">정리</h2>
<p><span class="hl-gray">9/14 원안</span> — 캐시가 만든 비용은 <span class="hl-green">설정으로 끄고</span>, 설정으로 못 지우는 파일 항목 기록은 <span class="hl-green">파일시스템 교체로 없앴습니다</span>. 파일 1,657만 개는 <span class="hl-green">AWS 밖에 검증된 사본</span>으로 확보했고, 매일 바뀐 장소를 받아 디스크 2개에 복사하기로 했습니다.</p>
<p><span class="hl-blue">10/23 개정</span> — 10/22 XML 88개 수정이 장소 71곳 57.2GiB 재다운로드로 번질 뻔해, <span class="hl-green">바뀐 파일만 받는 변경분 세대</span>로 전환했습니다. 막힌 57.2GiB는 승인하지 않고 새 방식으로 <span class="hl-green">2.3MB</span>에 처리했습니다. 복원 도구의 권한 보존도 <span class="hl-green">10/23에 고쳤습니다</span>. 사본 3벌이 한 컴퓨터에 있는 문제(랜섬웨어 한 번에 전부 손실 가능)는 <span class="hl-amber">주간회의에서 추가 백업 방식을 논의</span>합니다(선호안 Deep Archive).</p>
<hr />
<p>Indyspot AI Corp  ·  Engineering Manager  ·  2026-09-14 작성  ·  2026-10-23 개정</p>
