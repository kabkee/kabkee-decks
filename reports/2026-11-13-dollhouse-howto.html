<h1 id="360-%EC%82%AC%EC%A7%84-%ED%95%9C-%EC%9E%A5%EC%9C%BC%EB%A1%9C-%EB%B0%A9%EC%9D%84-%EC%84%B8%EC%9A%B0%EB%8A%94-%EB%B2%95">360 사진 한 장으로 방을 세우는 법</h1>
<h2 id="%EB%8F%8C%ED%95%98%EC%9A%B0%EC%8A%A4%EA%B0%80-%EB%A7%8C%EB%93%A4%EC%96%B4%EC%A7%80%EB%8A%94-%EC%9B%90%EB%A6%AC%EC%99%80-ai-%ED%95%99%EC%8A%B5--%EC%B2%98%EC%9D%8C-%EB%B3%B4%EB%8A%94-%EB%B6%84%EC%9D%84-%EC%9C%84%ED%95%9C-%EC%84%A4%EB%AA%85">돌하우스가 만들어지는 원리와 AI 학습 — 처음 보는 분을 위한 설명</h2>
<hr />
<p>Indyspot AI Corp  ·  Engineering Manager  ·  2026-11-13</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-class="agenda" data-theme="clean" lang="C" class="agenda" data-marpit-pagination="2" style="--paginate:true;--class:agenda;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%ED%95%9C-%EC%A4%84-%EC%9A%94%EC%95%BD--%EC%82%AC%EC%A7%84-%EC%86%8D-%C2%AB%EB%B2%BD%EC%9D%B4-%EB%B0%94%EB%8B%A5%EC%97%90-%EB%8B%BF%EB%8A%94-%EC%84%A0%C2%BB%EB%A7%8C-%EC%B0%BE%EC%9C%BC%EB%A9%B4-%EB%B0%A9%EC%9D%B4-%EC%84%B8%EC%9B%8C%EC%A7%91%EB%8B%88%EB%8B%A4">한 줄 요약 — 사진 속 «벽이 바닥에 닿는 선»만 찾으면 방이 세워집니다</h2>
<div class="cols">
<div class="col">
<h3 id="%EC%9B%90%EB%A6%AC">원리</h3>
<ul>
<li>360 사진은 방 전체를 한 장에 담은 «펼친 지도»</li>
<li>바닥 모서리를 내려다본 <strong>각도</strong>와 <strong>카메라 높이</strong>로 거리를 계산</li>
<li>모서리를 이으면 방 모양, 벽을 세우고 사진을 입히면 3D</li>
</ul>
</div>
<div class="col">
<h3 id="ai-%EC%9D%98-%EC%97%AD%ED%95%A0">AI 의 역할</h3>
<ul>
<li>사람 대신 «벽-바닥 경계선»을 찾아 줌</li>
<li>우리 사진 349장에 사람이 정답을 그려 직접 학습</li>
<li>3차 학습(정답 349장)에서 일반 방 정확도 <strong>79%</strong> — 실제 돌하우스 기준으로 외부 모델(74%)보다 크게 앞서고, 경계선 자체는 비슷한 수준(83.2% vs 82.5%)</li>
</ul>
</div>
</div>
<div class="links"><span class="lbl">직접 보기</span>
<a class="lnk" href="https://kabkee-decks.netlify.app/reports/2026-11-13-dollhouse-models/" target="_blank">돌하우스 비교 뷰어 (미노네집 외 5곳)</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="sec" data-theme="clean" lang="C" class="sec" data-marpit-pagination="3" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="33">
<p><span class="sec-num">Part 1</span></p>
<h2 id="%EC%82%AC%EC%A7%84-%ED%95%9C-%EC%9E%A5%EC%97%90%EC%84%9C-%EB%B0%A9-%EB%AA%A8%EC%96%91%EC%9D%84-%EC%95%8C%EC%95%84%EB%82%B4%EB%8A%94-%EC%9B%90%EB%A6%AC">사진 한 장에서 방 모양을 알아내는 원리</h2>
<p>계산은 중학교 삼각형 수준입니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="4" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="360-%EC%82%AC%EC%A7%84--%EB%B0%A9%EC%9D%84-%ED%86%B5%EC%A7%B8%EB%A1%9C-%ED%8E%BC%EC%B9%9C-%EC%A7%80%EB%8F%84">360 사진 = 방을 통째로 펼친 지도</h2>
<p><img src="assets/2026-11-13-dollhouse/equi-s3.jpg" alt="" style="width:700px;" /></p>
<p>지구본을 펼친 세계지도처럼 카메라 주변 360°를 한 장에 담았습니다. <strong>가로 = 방향, 세로 = 위아래 각도</strong>(가운데 줄 = 눈높이). 사진 속 위치가 곧 «카메라에서 본 각도»입니다.</p>
<div class="links"><span class="lbl">직접 보기</span>
<a class="lnk" href="https://kabkee-decks.netlify.app/reports/2026-11-13-dollhouse-models/" target="_blank">신발장 사진 — 뷰어에서 신발장 더블클릭</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="5" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EA%B0%81%EB%8F%84--%EC%B9%B4%EB%A9%94%EB%9D%BC-%EB%86%92%EC%9D%B4--%EA%B1%B0%EB%A6%AC">각도 + 카메라 높이 = 거리</h2>
<div class="cols">
<div class="col">
<svg viewBox="0 0 420 230" width="420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <line x1="20" y1="200" x2="400" y2="200" stroke="#555" stroke-width="3" />
  <text x="300" y="222" font-size="14" fill="#555">바닥</text>
  <line x1="60" y1="200" x2="60" y2="60" stroke="#888" stroke-width="2" stroke-dasharray="5 4" />
  <circle cx="60" cy="60" r="10" fill="#e4572e" />
  <text x="76" y="56" font-size="14" fill="#e4572e">카메라</text>
  <text x="14" y="135" font-size="14" fill="#555">1.5m</text>
  <line x1="60" y1="60" x2="340" y2="200" stroke="#3c8cff" stroke-width="3" />
  <line x1="340" y1="60" x2="340" y2="200" stroke="#2e9e5b" stroke-width="6" />
  <text x="350" y="120" font-size="14" fill="#2e9e5b">벽</text>
  <circle cx="340" cy="200" r="7" fill="#2e9e5b" />
  <text x="222" y="190" font-size="13" fill="#2e9e5b">벽-바닥 모서리</text>
  <line x1="60" y1="60" x2="200" y2="60" stroke="#aaa" stroke-width="1.5" />
  <text x="120" y="80" font-size="14" fill="#3c8cff">내려다본 각도</text>
  <text x="150" y="218" font-size="14" fill="#555">← 거리 = ? →</text>
</svg>
</div>
<div class="col">
<ul>
<li>카메라는 <strong>삼각대 위 1.5m</strong> 높이에 있습니다.</li>
<li>사진에서 모서리가 «눈높이보다 몇 도 아래»인지 압니다.</li>
<li>높이와 각도를 알면 직각삼각형으로 <strong>거리</strong>가 나옵니다.<br />
거리 = 1.5m ÷ tan(내려다본 각도)</li>
<li>모서리 몇 개의 거리·방향을 알면 <strong>방의 평면 모양</strong>이 그려집니다.</li>
<li>천장도 같은 원리로 <strong>천장 높이</strong>가 나옵니다.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="ai-%EA%B0%80-%ED%95%98%EB%8A%94-%EC%9D%BC--%EB%B2%BD%EA%B3%BC-%EB%B0%94%EB%8B%A5%EC%B2%9C%EC%9E%A5%EC%9D%B4-%EB%A7%8C%EB%82%98%EB%8A%94-%EC%84%A0-%EC%B0%BE%EA%B8%B0">AI 가 하는 일 — 벽과 바닥·천장이 만나는 선 찾기</h2>
<p><img src="assets/2026-11-13-dollhouse/layout-pair.jpg" alt="" style="width:1080px;" /></p>
<p>초록 선이 AI 가 찾은 경계(위 = 벽-천장, 아래 = 벽-바닥), 노란 세로선이 방 모서리입니다. 침대·쓰레기통이 벽 아래를 가려도 «있을 법한 위치»로 이어서 추정합니다. 이 선만 찾으면 앞 장의 계산으로 방 모양이 나옵니다.</p>
<div class="links"><span class="lbl">직접 보기</span>
<a class="lnk" href="https://kabkee-decks.netlify.app/reports/2026-11-13-dollhouse-models/" target="_blank">뷰어 «위에서 보기» — 이 선으로 만든 방 모양</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="7" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EB%B0%A9-%ED%95%98%EB%82%98%EB%A5%BC-3d-%EB%A1%9C--%EB%B2%BD-%EC%84%B8%EC%9A%B0%EA%B8%B0--%EC%82%AC%EC%A7%84-%EC%9E%85%ED%9E%88%EA%B8%B0">방 하나를 3D 로 — 벽 세우기 + 사진 입히기</h2>
<table>
<thead>
<tr>
<th>단계</th>
<th>하는 일</th>
<th>비유</th>
</tr>
</thead>
<tbody>
<tr>
<td>① 방 모양</td>
<td>모서리를 이어 바닥 다각형</td>
<td>바닥에 테이프로 방 윤곽 붙이기</td>
</tr>
<tr>
<td>② 벽 세우기</td>
<td>다각형 둘레에 천장 높이만큼 벽</td>
<td>테이프 선을 따라 종이벽 세우기</td>
</tr>
<tr>
<td>③ 사진 입히기</td>
<td>벽 각 점에 «카메라에서 그 방향으로 본 사진 색»</td>
<td>방 한가운데서 빔프로젝터를 쏘는 것</td>
</tr>
<tr>
<td>④ 돌하우스</td>
<td>바깥에서 볼 때 앞쪽 벽만 투명하게</td>
<td>인형의 집 앞판 떼기</td>
</tr>
</tbody>
</table>
<p>③ 덕분에 <strong>촬영 위치에서 보면 원본 360 사진과 똑같고</strong>, 벽 위치가 조금 틀려도 위에서 보면 자연스럽습니다. «재미·공간감» 용도에는 이 성질이 큰 장점입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EC%97%AC%EB%9F%AC-%EB%B0%A9-%EC%9E%87%EA%B8%B0--%EA%B8%B0%EC%A1%B4-%ED%88%AC%EC%96%B4%EC%9D%98-%C2%AB%EC%9D%B4%EB%8F%99-%ED%99%94%EC%82%B4%ED%91%9C%C2%BB%EB%A5%BC-%ED%99%9C%EC%9A%A9">여러 방 잇기 — 기존 투어의 «이동 화살표»를 활용</h2>
<table>
<thead>
<tr>
<th>단서</th>
<th>쓰는 방법</th>
</tr>
</thead>
<tbody>
<tr>
<td>이동 핫스팟 (방 A → 방 B 화살표)</td>
<td>화살표가 찍힌 바닥 위치 = 두 방을 잇는 문 근처 → 방 B 의 대략적 위치</td>
</tr>
<tr>
<td>되돌아오는 화살표 (B → A)</td>
<td>두 화살표의 방향 차이 → 방 B 가 몇 도 돌아가 있는지</td>
</tr>
<tr>
<td>벽은 대부분 직각</td>
<td>회전을 90° 단위로 맞춰 반듯하게</td>
</tr>
<tr>
<td>사람 보정</td>
<td>어긋난 방은 평면도에서 끌어서 맞춤 (장소당 1회, 몇 분)</td>
</tr>
</tbody>
</table>
<p>완전 자동은 아직 어렵고, <strong>«자동 배치 + 사람 한 번 보정» 반자동</strong>이 현실적인 방식입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EA%B2%B0%EA%B3%BC--%EB%AF%B8%EB%85%B8%EB%84%A4%EC%A7%91-%EB%8F%8C%ED%95%98%EC%9A%B0%EC%8A%A4">결과 — 미노네집 돌하우스</h2>
<p><img src="assets/2026-11-13-dollhouse/dh-doll-manual-3d.jpg" alt="" style="width:500px;" /></p>
<p>360 사진 5장 + 사람 보정 1회. 방을 더블클릭하면 촬영 위치로 들어가 원본 360 사진과 같은 화면이 됩니다.</p>
<div class="links"><span class="lbl">직접 보기</span>
<a class="lnk" href="https://kabkee-decks.netlify.app/reports/2026-11-13-dollhouse-models/" target="_blank">드래그 = 회전 · 휠 = 확대 · 더블클릭 = 방 안으로</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%ED%94%8C%EB%9E%AB%ED%8F%BC-krpano-%EC%97%90-%EC%96%B9%EA%B8%B0--%EB%8F%8C%ED%95%98%EC%9A%B0%EC%8A%A4%EC%97%90%EC%84%9C-%EB%B0%A9%EC%9C%BC%EB%A1%9C-%EB%82%A0%EC%95%84-%EB%93%A4%EC%96%B4%EA%B0%80%EA%B8%B0">플랫폼 krpano 에 얹기 — 돌하우스에서 방으로 날아 들어가기</h2>
<p><img src="assets/2026-11-13-dollhouse/krpano-moves.jpg" alt="" style="width:1000px;" /></p>
<p>l3 플랫폼의 VR 엔진(krpano)으로 띄운 같은 결과입니다. 빨간 점을 누르면 카메라가 3D 공간을 날아 원본 360 사진으로 이어지고, 방 사이도 걸어서 이동합니다.</p>
<div class="links"><span class="lbl">직접 보기</span>
<a class="lnk" href="http://100.64.25.50:5174/dollhouse-sample/index.html" target="_blank">krpano 접목 샘플 (개발 서버 · 내부망 전용)</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="sec" data-theme="clean" lang="C" class="sec" data-marpit-pagination="11" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="33">
<p><span class="sec-num">Part 2</span></p>
<h2 id="ai-%EB%8A%94-%EC%96%B4%EB%96%BB%EA%B2%8C-%EB%B0%B0%EC%9A%B0%EB%82%98--%ED%95%99%EC%8A%B5-%EB%B0%A9%EC%8B%9D">AI 는 어떻게 배우나 — 학습 방식</h2>
<p>정답을 보여주고, 틀린 만큼 고치기를 반복합니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%ED%95%99%EC%8A%B5--%EC%A0%95%EB%8B%B5%EC%A7%80%EB%A5%BC-%EB%B3%B4%EA%B3%A0-%EB%AC%B8%EC%A0%9C%EB%A5%BC-%EB%B0%98%EB%B3%B5%ED%95%B4%EC%84%9C-%ED%91%B8%EB%8A%94-%EA%B2%83">학습 = 정답지를 보고 문제를 반복해서 푸는 것</h2>
<table>
<thead>
<tr>
<th>단계</th>
<th>하는 일</th>
<th>비유</th>
</tr>
</thead>
<tbody>
<tr>
<td>① 정답 만들기 (라벨링)</td>
<td>사람이 360 사진에 벽-바닥 모서리를 찍음</td>
<td>문제집 정답지 만들기</td>
</tr>
<tr>
<td>② 학습</td>
<td>AI 가 사진마다 경계선을 예측 → 정답과 차이만큼 스스로 조정</td>
<td>문제를 풀고 채점해 오답 고치기</td>
</tr>
<tr>
<td>③ 반복 (에포크)</td>
<td>학습 사진 전체를 300바퀴 반복, 매번 사진을 돌리고 뒤집어 변형</td>
<td>같은 문제집을 순서·숫자를 바꿔 300번</td>
</tr>
<tr>
<td>④ 평가</td>
<td>학습에 <strong>한 번도 안 쓴</strong> 사진으로 시험</td>
<td>처음 보는 모의고사</td>
</tr>
</tbody>
</table>
<p>AI 의 바탕 모델 구조는 공개된 <strong>HorizonNet</strong>(MIT 라이선스, 상업 사용 가능)을 쓰고, 가르치는 «정답지»는 우리가 직접 만듭니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="13" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%E2%91%A0-%EC%A0%95%EB%8B%B5-%EB%A7%8C%EB%93%A4%EA%B8%B0--%EB%9D%BC%EB%B2%A8%EB%A7%81-%EB%8F%84%EA%B5%AC">① 정답 만들기 — 라벨링 도구</h2>
<p><img src="assets/2026-11-13-dollhouse/labeler-sample.jpg" alt="" style="width:580px;" /></p>
<p>사진에서 <strong>바닥 모서리만 클릭</strong>하면 천장선은 자동으로 계산되고, 오른쪽에 위에서 본 방 모양이 바로 그려져 틀린 곳이 보입니다. 사진 1장에 1~3분.</p>
<div class="links"><span class="lbl">직접 보기</span>
<a class="lnk" href="http://100.64.25.50:8791/" target="_blank">라벨링 도구 (내부망)</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EB%9D%BC%EB%B2%A8%EB%A7%81-3%EC%9B%90%EC%B9%99%EA%B3%BC-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EB%AA%A8%EC%9C%BC%EA%B8%B0">라벨링 3원칙과 데이터 모으기</h2>
<div class="cols">
<div class="col">
<h3 id="3%EC%9B%90%EC%B9%99">3원칙</h3>
<ol>
<li><strong>카메라가 있는 방 하나의 큰 윤곽만</strong> — 문·유리 너머는 무시</li>
<li><strong>작은 꺾임은 펴고 큰 꺾임만</strong> 모서리로 (기둥 50cm 미만은 무시)</li>
<li><strong>같은 기준으로 일관되게</strong> — 픽셀보다 «빠뜨리지 않기»가 중요</li>
</ol>
</div>
<div class="col">
<h3 id="%EB%8D%B0%EC%9D%B4%ED%84%B0">데이터</h3>
<ul>
<li>레거시 Look360 에서 실내 방 후보 사진을 골라 995장 라벨링</li>
<li>쓸 수 있는 방 사진 = <strong>349장</strong></li>
<li>나머지 646장은 실외·복도·모서리 안 보임 등으로 제외</li>
<li>교실·객실·사무실·치료실 등 «직각 실내»가 학습 재료</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="15" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%E2%91%A3-%ED%8F%89%EA%B0%80-%EC%A0%90%EC%88%98-%EC%9D%BD%EB%8A%94-%EB%B2%95--3d-iou">④ 평가 점수 읽는 법 — 3D IoU</h2>
<div class="cols">
<div class="col">
<svg viewBox="0 0 300 200" width="300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="30" y="30" width="160" height="120" fill="rgba(46,158,91,.25)" stroke="#2e9e5b" stroke-width="3" />
  <rect x="70" y="50" width="160" height="120" fill="rgba(228,87,46,.25)" stroke="#e4572e" stroke-width="3" />
  <text x="34" y="24" font-size="14" fill="#2e9e5b">정답 방</text>
  <text x="170" y="190" font-size="14" fill="#e4572e">AI 가 본 방</text>
  <text x="95" y="110" font-size="14" fill="#333">겹친 부분</text>
</svg>
</div>
<div class="col">
<ul>
<li><strong>IoU = Intersection over Union</strong> (교집합 ÷ 합집합) — «겹친 부분 ÷ 합친 부분»</li>
<li>정답 방과 AI 가 본 방을 3D 로 겹쳐서</li>
<li><strong>겹친 부피 ÷ 합친 부피</strong> = 점수</li>
<li>100% 면 완벽히 일치, 방 크기·모양이 조금씩 틀릴수록 내려감</li>
<li>75% 안팎이면 «모양과 크기를 대체로 맞힘» 수준</li>
<li>평가 사진은 학습에 <strong>절대 쓰지 않습니다</strong> (같은 이미지 사본도 자동으로 걸러냄)</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%ED%95%99%EC%8A%B5-%EA%B2%B0%EA%B3%BC--%EB%8D%B0%EC%9D%B4%ED%84%B0%EA%B0%80-%EB%8A%98%EC%88%98%EB%A1%9D-%EC%98%AC%EB%9D%BC%EA%B0%91%EB%8B%88%EB%8B%A4">학습 결과 — 데이터가 늘수록 올라갑니다</h2>
<table>
<thead>
<tr>
<th>학습</th>
<th>정답 사진</th>
<th>일반 방 점수</th>
<th>전체 점수</th>
<th>비고</th>
</tr>
</thead>
<tbody>
<tr>
<td>1차</td>
<td>103장</td>
<td>69.3%</td>
<td>60.6%</td>
<td>평가 사진 11장 (2차부터와 직접 비교 불가)</td>
</tr>
<tr>
<td>2차</td>
<td>189장</td>
<td>76.2%</td>
<td>71.9%</td>
<td>목표 70% 달성</td>
</tr>
<tr>
<td><strong>3차</strong></td>
<td><strong>349장</strong></td>
<td><strong>79.1%</strong></td>
<td><strong>75.7%</strong></td>
<td>실제 돌하우스 기준으로 외부 모델보다 5점 이상 앞섬</td>
</tr>
<tr>
<td>비교용 외부 모델 (ZInD)</td>
<td>20,077장</td>
<td>73.8%</td>
<td>71.3%</td>
<td>상업 불가 · 후처리 없음 기준 82.5% (3차 83.2% — 비슷)</td>
</tr>
</tbody>
</table>
<p>«일반 방» = 아파트·사무실 같은 보통 방 14장, «전체» = 가벽·복층까지 포함한 18장입니다. 평가 사진이 적어 2~3점 차이는 우연일 수 있습니다.<br /><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 정정(11-14): 평가 사진 1장이 학습 사진과 같은 이미지(레거시 중복 사본)로 확인돼 빼고 다시 잰 점수입니다. 2차·3차·ZInD 모두 같은 사진으로 재채점했습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="17" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%ED%9B%84%EC%B2%98%EB%A6%AC--%EB%B0%98%EB%93%AF%ED%95%9C-%EB%B2%BD%EC%9C%BC%EB%A1%9C-%EC%A0%95%EB%A6%AC%ED%95%98%EB%8A%94-%EB%8B%A8%EA%B3%84">후처리 — 반듯한 벽으로 정리하는 단계</h2>
<table>
<thead>
<tr>
<th></th>
<th>후처리 없음 (날것)</th>
<th>후처리 있음 (우리 돌하우스)</th>
</tr>
</thead>
<tbody>
<tr>
<td>결과</td>
<td>사진 세로줄 1,024개마다 경계 높이 → 점 2,048개의 울퉁불퉁한 윤곽</td>
<td>경계선을 <strong>직각으로 만나는 반듯한 벽 몇 개</strong>로 정리</td>
</tr>
<tr>
<td>돌하우스 모양</td>
<td>벽이 물결침</td>
<td>벽이 평평 — 처음 목표한 «깔끔한» 모양</td>
</tr>
<tr>
<td>점수</td>
<td>경계를 그대로 따라가 높게 나옴</td>
<td>직각이 아닌 방을 억지로 펴면서 깎임</td>
</tr>
<tr>
<td>의미</td>
<td>«AI 가 경계를 얼마나 잘 보나»</td>
<td><strong>«실제로 쓰는 결과물이 얼마나 맞나»</strong></td>
</tr>
</tbody>
</table>
<p>그래서 점수를 <strong>두 가지 모두</strong> 기록합니다. 후처리 없음 점수가 오르면 «모델이 좋아진 것», 두 점수 차이가 크면 «후처리를 다듬을 여지가 있는 것»입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="18" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="3d-iou-%EB%B9%84%EA%B5%90--%EC%9A%B0%EB%A6%AC-%EA%B3%B5%EA%B0%84%EC%97%90%EC%84%9C-%ED%8F%89%EA%B0%80-18%EC%9E%A5-%EA%B0%99%EC%9D%80-%EC%82%AC%EC%A7%84">3D IoU 비교 — 우리 공간에서 (평가 18장, 같은 사진)</h2>
<table>
<thead>
<tr>
<th>모델</th>
<th>학습 사진</th>
<th>후처리 있음 · 일반 방 14장</th>
<th>후처리 없음 · 일반 방 14장</th>
<th>후처리 없음 · 전체 18장</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>3차 자체 학습</strong></td>
<td>283장</td>
<td><strong>79.1%</strong></td>
<td><strong>83.2%</strong></td>
<td><strong>79.7%</strong></td>
</tr>
<tr>
<td>2차 자체 학습</td>
<td>170장</td>
<td>76.2%</td>
<td>78.7%</td>
<td>73.8%</td>
</tr>
<tr>
<td>ZInD 공개 모델 (비상업)</td>
<td>20,077장</td>
<td>73.8%</td>
<td>82.5%</td>
<td>77.7%</td>
</tr>
</tbody>
</table>
<ul>
<li>2차에서는 <strong>경계선 자체(후처리 없음)</strong> 를 ZInD 가 3.8점 앞섰습니다.</li>
<li>학습 사진을 170장 → 283장으로 늘린 3차는 <strong>실제 돌하우스(후처리 있음)</strong> 기준 ZInD 보다 <strong>5.3점</strong> 높고, <strong>경계선 자체는 0.7점 차이로 사실상 비슷</strong>해졌습니다. ZInD 학습 사진의 70분의 1입니다.</li>
<li>3차에서 늘린 평가 사진까지 합친 36장으로 재도 3차 <strong>78.5%</strong>(후처리 있음) · 83.4%(없음), ZInD 72.3% · 78.4% 입니다. 평가 사진이 적어 2~3점 차이는 우연일 수 있습니다.</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 정정(11-14): 처음 발표한 «경계선 자체도 1.9점 앞섬»은 평가 사진 1장이 학습 사진과 같은 이미지여서 부풀려진 값이었습니다. 이제 학습 데이터를 만들 때 같은 이미지를 자동으로 걸러냅니다.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="19" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="3d-iou-%EB%B9%84%EA%B5%90--%EA%B3%B5%EA%B0%9C-%EB%85%BC%EB%AC%B8%EC%A0%80%EC%9E%A5%EC%86%8C-%EA%B3%B5%EC%8B%9D-%EC%88%98%EC%B9%98">3D IoU 비교 — 공개 논문·저장소 공식 수치</h2>
<table>
<thead>
<tr>
<th>데이터셋</th>
<th>학습 사진</th>
<th>HorizonNet</th>
<th>LGT-Net (2022 최신)</th>
</tr>
</thead>
<tbody>
<tr>
<td>PanoContext (직육면체 방)</td>
<td>약 800장 (두 데이터셋 합)</td>
<td>82.63%</td>
<td>85.16%</td>
</tr>
<tr>
<td>Stanford 2D-3D (직육면체 방)</td>
<td>〃</td>
<td>82.72%</td>
<td>85.76%</td>
</tr>
<tr>
<td>MatterportLayout (실제 집, 일반 모양)</td>
<td>총 2,295장</td>
<td>79.11%</td>
<td>81.11%</td>
</tr>
<tr>
<td>ZInD (미국 주택)</td>
<td>2만~2.5만 장</td>
<td>88.59%</td>
<td>89.95%</td>
</tr>
<tr>
<td>ZInD · 후처리 있음</td>
<td>20,077장</td>
<td>67.52%</td>
<td>—</td>
</tr>
</tbody>
</table>
<ul>
<li>공개 모델은 <strong>수백~수만 장</strong>으로 학습해 자기 데이터에서 <strong>80~90%</strong>. 우리와 가장 비슷한 «실제 집·일반 모양»(MatterportLayout)은 <strong>79~81%</strong>.</li>
<li>우리 3차(학습 283장)는 후처리 없음 기준 <strong>83.2%</strong>(2차 78.7%) — 데이터셋이 달라 직접 비교는 조심해야 하지만 같은 수준대.</li>
<li>출처: HorizonNet 저장소 README(sunset1995/HorizonNet) · LGT-Net 논문(CVPR 2022, arXiv 2203.01824)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EA%B8%B0%EC%88%A0-%E2%91%A0-3d-iou--%EC%A0%90%EC%88%98%EB%A5%BC-%EC%8B%A4%EC%A0%9C%EB%A1%9C-%EC%9D%B4%EB%A0%87%EA%B2%8C-%EA%B3%84%EC%82%B0%ED%95%A9%EB%8B%88%EB%8B%A4">기술 ① 3D IoU — 점수를 실제로 이렇게 계산합니다</h2>
<p><strong>IoU</strong> = <strong>I</strong>ntersection <strong>o</strong>ver <strong>U</strong>nion (교집합 ÷ 합집합) · «3D» = 면적이 아니라 <strong>부피</strong>로 잰다는 뜻</p>
<ol>
<li>정답·AI 모서리를 각각 <strong>위에서 본 바닥 다각형</strong>으로 바꿉니다 (카메라 높이는 같은 값으로 가정)</li>
<li>두 다각형의 <strong>겹친 바닥 면적</strong>을 구합니다 — 다각형 계산 라이브러리 Shapely</li>
<li>방 높이 = 바닥선과 천장선 사이 높이. <strong>겹친 부피 = 겹친 면적 × 둘 중 낮은 높이</strong></li>
<li><strong>3D IoU = 겹친 부피 ÷ (AI 부피 + 정답 부피 − 겹친 부피)</strong> → 평가 사진마다 구해 평균</li>
</ol>
<table>
<thead>
<tr>
<th>예시</th>
<th>바닥 면적</th>
<th>높이</th>
<th>부피</th>
</tr>
</thead>
<tbody>
<tr>
<td>정답</td>
<td>20㎡</td>
<td>2.5m</td>
<td>50</td>
</tr>
<tr>
<td>AI</td>
<td>18㎡ (그중 17㎡ 겹침)</td>
<td>2.4m</td>
<td>43.2</td>
</tr>
<tr>
<td>겹침</td>
<td>17㎡</td>
<td>2.4m (낮은 쪽)</td>
<td>40.8</td>
</tr>
</tbody>
</table>
<p>→ 40.8 ÷ (43.2 + 50 − 40.8) = <strong>77.9%</strong> · 모양·크기·높이 중 하나라도 틀리면 내려감 (채점: HorizonNet <code>eval_general.py</code>)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EA%B8%B0%EC%88%A0-%E2%91%A1-%EC%82%AC%EC%9A%A9%ED%95%9C-%EB%8F%84%EA%B5%AC%EB%9D%BC%EC%9D%B4%EB%B8%8C%EB%9F%AC%EB%A6%AC">기술 ② 사용한 도구(라이브러리)</h2>
<table>
<thead>
<tr>
<th>도구</th>
<th>역할</th>
<th>비고</th>
</tr>
</thead>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="22" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EA%B8%B0%EC%88%A0-%E2%91%A2-ai-%EB%AA%A8%EB%8D%B8-%EA%B5%AC%EC%A1%B0--%EC%82%AC%EC%A7%84%EC%9D%84-%C2%AB%EC%84%B8%EB%A1%9C%EC%A4%84-1024%EA%B0%9C-%EB%AC%B8%EC%A0%9C%C2%BB%EB%A1%9C-%EB%B0%94%EA%BE%BC%EB%8B%A4">기술 ③ AI 모델 구조 — 사진을 «세로줄 1,024개 문제»로 바꾼다</h2>
<p><strong>360 사진(1024×512)</strong> → <strong>ResNet-50</strong> (사진 특징 추출) → <strong>세로 방향 압축</strong> (세로줄마다 특징 한 줄) → <strong>양방향 LSTM 2층</strong> (왼쪽·오른쪽 세로줄의 맥락을 함께 봄, 360° 끝과 끝이 이어짐) → <strong>세로줄마다 숫자 3개</strong></p>
<ul>
<li>세로줄마다 맞히는 것: <strong>천장선 높이 · 바닥선 높이 · 이 줄에 모서리가 있을 확률</strong></li>
<li>후처리: 모서리 확률의 봉우리를 찾고, 벽이 직각으로 만나도록 정리 → 모서리 좌표(JSON)</li>
<li>우리 코드가 모서리 좌표 → 방 바닥 다각형(미터) → 돌하우스 3D 로 바꿉니다</li>
<li>핵심 아이디어: 방 전체를 한 번에 맞히지 않고 <strong>«이 세로줄에서 천장선·바닥선이 어디냐»</strong> 를 1,024번 맞히는 문제로 바꾼 것</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="23" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EA%B8%B0%EC%88%A0-%E2%91%A3-%EA%B0%80%EC%A4%91%EC%B9%98--%EC%96%B8%EC%A0%9C-%EB%A7%8C%EB%93%A4%EC%96%B4%EC%A7%80%EA%B3%A0-%EC%96%B8%EC%A0%9C-%EC%93%B0%EC%9D%B4%EB%82%98">기술 ④ 가중치 — 언제 만들어지고 언제 쓰이나</h2>
<table>
<thead>
<tr>
<th>단계</th>
<th>하는 일</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>가중치란</strong></td>
<td>모델 안의 숫자 <strong>약 8,157만 개</strong> (ResNet-50 2,351만 · LSTM 1,260만 · 나머지 압축·출력층). 파일 하나 311MB</td>
</tr>
<tr>
<td><strong>학습 전</strong></td>
<td>ResNet-50 부분만 <strong>ImageNet 사진으로 미리 학습된 초기값</strong>(사물을 보는 일반적인 눈)으로 시작, 나머지는 무작위</td>
</tr>
<tr>
<td><strong>학습 중</strong></td>
<td>우리 정답 283장으로 <strong>전체 가중치를 조금씩 조정</strong> · 오차 = 경계선 높이 오차 + 모서리 위치 오차 · 300바퀴(에포크), GPU 약 1시간 50분</td>
</tr>
<tr>
<td><strong>고르기</strong></td>
<td>바퀴마다 검증 사진 29장으로 3D IoU 를 재서 <strong>가장 좋았던 순간(252번째)</strong> 을 저장 → <code>v3_349_best.pth</code></td>
</tr>
<tr>
<td><strong>사용(추론)</strong></td>
<td>파일을 GPU 에 한 번 올려 두고 사진마다 계산 — <strong>사진 1장 46ms</strong>(모델 부분 실측). 사진 받기·변환이 더 오래 걸림</td>
</tr>
</tbody>
</table>
<ul>
<li>ZInD 가중치는 <strong>비교 채점에만</strong> 씁니다(서비스·라벨 초안 금지).</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 확인 필요: ImageNet 초기값은 업계에서 흔히 쓰지만, 상업 서비스 사용 범위는 법무 확인을 권장합니다.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="24" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="imagenet-%EC%97%86%EC%9D%B4-%EA%B0%80%EB%8A%94-%EA%B8%B8--%EC%9A%B0%EB%A6%AC-%EC%82%AC%EC%A7%84%EC%9C%BC%EB%A1%9C-%C2%AB%EB%B3%B4%EB%8A%94-%EB%88%88%C2%BB-%EB%A7%8C%EB%93%A4%EA%B8%B0-%EC%B6%94%EC%B2%9C-%EC%A7%84%ED%96%89-%EC%88%9C%EC%84%9C">ImageNet 없이 가는 길 — 우리 사진으로 «보는 눈» 만들기 (추천 진행 순서)</h2>
<p>ImageNet 초기값은 권리가 불명확(데이터 약관은 비상업) → <strong>우리 360 사진으로 직접 초기값을 만드는 것</strong>이 장기적으로 가장 깔끔합니다.<br />
후보: 레거시 공개 360 사진 <strong>30,888장</strong> (회원 업로드 83장 제외) · 라벨 없이 학습(자기지도 — 같은 사진의 다른 조각끼리 비슷하게 보도록)</p>
<table>
<thead>
<tr>
<th>단계</th>
<th>할 일</th>
<th>담당</th>
<th>예상</th>
</tr>
</thead>
<tbody>
<tr>
<td>①</td>
<td><strong>ImageNet 없이(무작위 초기값) 학습</strong> → 점수가 얼마나 떨어지는지 측정 · 이후 모든 비교의 기준</td>
<td>개발</td>
<td>GPU 약 2시간</td>
</tr>
<tr>
<td>②</td>
<td>촬영 대행 계약서 기준 <strong>AI 학습에 써도 되는 장소·기간</strong> 확인 (고객사 저작권 귀속 여부)</td>
<td><strong>오너</strong></td>
<td>—</td>
</tr>
<tr>
<td>③</td>
<td>쓸 수 있는 사진만 S3 에서 받기 (1024 큐브 6면 → 360 사진)</td>
<td>개발</td>
<td>밤새 · 약 45GB</td>
</tr>
<tr>
<td>④</td>
<td>자기지도 사전학습 → 그 «눈»으로 방 구조 모델 학습</td>
<td>개발</td>
<td>GPU 1~3일</td>
</tr>
<tr>
<td>⑤</td>
<td>같은 평가 사진으로 <strong>ImageNet 버전 vs 우리 사진 버전</strong> 비교 → 채택 결정</td>
<td>개발·오너</td>
<td>—</td>
</tr>
</tbody>
</table>
<ul>
<li>①에서 거의 안 떨어지면 ImageNet 을 바로 빼고, 많이 떨어지면 ③~⑤의 가치가 커집니다. 시간·용량은 추정입니다.</li>
</ul>
</section>

<h2 id="%EC%8B%A4%EC%A0%9C-%EA%B3%B5%EA%B0%84-%EB%B9%84%EA%B5%90--%EC%9E%AC%ED%99%9C%EC%B9%98%EB%A3%8C%EC%8B%A4-%EC%B2%98%EC%9D%8C-%EB%B3%B4%EB%8A%94-%EC%82%AC%EC%A7%84">실제 공간 비교 — 재활치료실 (처음 보는 사진)</h2>
<p><img src="assets/2026-11-13-dollhouse/nulbom-rehab-4versions.jpg" alt="" style="width:470px;" /></p>
<p>학습·평가에 한 번도 안 쓴 요양병원 재활치료실 5개 방을 4개 모델로 세운 결과입니다(방 위치는 같고 방 모양만 모델마다 다름). 외부 모델(왼쪽 위)은 «재활치료실_1»을 건물 밖까지 길게 봤고, 우리 모델(1·2차)은 건물 안에 담았습니다.</p>
<div class="links"><span class="lbl">직접 보기</span>
<a class="lnk" href="https://kabkee-decks.netlify.app/reports/2026-11-13-dollhouse-places/nulbom-rehab/" target="_blank">재활치료실 — 모델 버튼으로 4개 버전 전환</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="sec" data-theme="clean" lang="C" class="sec" data-marpit-pagination="29" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="33">
<p><span class="sec-num">Part 3</span></p>
<h2 id="%EC%99%9C-%EB%82%A8%EC%9D%98-%EB%AA%A8%EB%8D%B8%EC%9D%84-%EA%B7%B8%EB%8C%80%EB%A1%9C-%EB%AA%BB-%EC%93%B0%EB%82%98">왜 남의 모델을 그대로 못 쓰나</h2>
<p>AI 는 «무엇으로 배웠는지»에 따라 쓸 수 있는 범위가 정해집니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="30" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="zind-%EB%9E%80--%EA%B7%B8%EB%A6%AC%EA%B3%A0-%EC%99%9C-%EB%AA%BB-%EC%93%B0%EA%B2%8C-%EB%90%90%EB%82%98">ZInD 란 — 그리고 왜 못 쓰게 됐나</h2>
<table>
<thead>
<tr>
<th>질문</th>
<th>답</th>
</tr>
</thead>
<tbody>
<tr>
<td>ZInD 는?</td>
<td>미국 부동산 회사 <strong>Zillow</strong> 가 공개한 실내 360 사진 데이터(약 7만 장, 주택 1,500여 채)와 정답</td>
</tr>
<tr>
<td>처음엔 왜 썼나</td>
<td>이 데이터로 학습된 공개 AI 가 있어서, 우리가 학습하기 전 «가능성 확인»에 가장 빨랐음</td>
</tr>
<tr>
<td>왜 못 쓰나</td>
<td>약관이 <strong>비상업 전용</strong>. 제품·서비스 개선에 쓰는 것도 금지로 명시. 출처 표기만으로 허용되는 조항 없음</td>
</tr>
<tr>
<td>다른 공개 모델은?</td>
<td>Matterport3D·Structured3D 등으로 배운 모델도 전부 비상업. Matterport 는 «3D 투어와 비슷한 서비스»까지 금지</td>
</tr>
<tr>
<td>그래서</td>
<td>모델 구조(코드)는 자유롭게 쓰고, <strong>정답지만 우리가 직접</strong> 만들어 학습</td>
</tr>
</tbody>
</table>
<p>현재 ZInD 모델은 <strong>내부 성능 비교 기준점</strong>으로만 씁니다(서비스 반영 금지). 법률 자문이 아니라 공개 약관 기준 판단입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="31" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EC%A4%91%EA%B5%AD-%EC%AA%BD-%EB%AA%A8%EB%8D%B8%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%8A%94--%EC%9E%88%EC%A7%80%EB%A7%8C-%EC%97%AD%EC%8B%9C-%EB%B9%84%EC%83%81%EC%97%85">중국 쪽 모델·데이터는? — 있지만 역시 비상업</h2>
<table>
<thead>
<tr>
<th>이름</th>
<th>만든 곳</th>
<th>규모</th>
<th>상업 사용</th>
</tr>
</thead>
<tbody>
<tr>
<td>Realsee3D</td>
<td>베이커(Beike) 산하 Realsee — 중국 최대 부동산 VR</td>
<td>실내 3D 장면 1만 개 (2025-12 공개)</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 학술·비상업. 상업은 별도 계약 협의</td>
</tr>
<tr>
<td>Structured3D</td>
<td>쿠자레(Kujiale) — 인테리어 설계 플랫폼</td>
<td>집 3,500채 · 방 2.1만 개 (합성)</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 비상업 연구·교육만</td>
</tr>
<tr>
<td>최신 방 구조 AI 들</td>
<td>중국 등 여러 대학</td>
<td>—</td>
<td>코드는 대부분 공개, 하지만 위 데이터들로 학습돼 <strong>가중치는 비상업</strong></td>
</tr>
</tbody>
</table>
<p><strong>국적이 아니라 «학습 데이터 약관»이 문제</strong>입니다. 중국 쪽이 데이터 규모는 가장 크지만 공개분은 모두 비상업이고, Realsee 처럼 <strong>상업 계약을 따로 협의</strong>하는 길은 있습니다(조건 미공개).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="32" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="33">
<h2 id="%EC%A0%95%EB%A6%AC--%EC%9A%B0%EB%A6%AC%EA%B0%80-%EA%B0%80%EB%8A%94-%EA%B8%B8">정리 — 우리가 가는 길</h2>
<table>
<thead>
<tr>
<th>선택지</th>
<th>판단</th>
</tr>
</thead>
<tbody>
<tr>
<td>남의 학습 모델 그대로 사용</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 상업 불가 (ZInD·Matterport·Structured3D·Realsee 공개분)</td>
</tr>
<tr>
<td>데이터 회사와 상업 계약</td>
<td><img class="emoji" draggable="false" alt="🟡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e1.svg" data-marp-twemoji=""/> 가능하지만 조건·비용 미정 (Zillow·Realsee 문의 경로 있음)</td>
</tr>
<tr>
<td><strong>우리 사진으로 직접 학습</strong></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 권리 깔끔 · 2차에서 이미 외부 모델 수준 도달 · 우리 공간(한국 실내)에 특화</td>
</tr>
</tbody>
</table>
<p>용도는 <strong>재미·공간감 파악용</strong>(치수 정확도는 목표 아님)으로 정했고, 이 수준에서는 <strong>직접 학습 + 반자동 배치</strong>로 충분하다는 것이 지금까지의 결론입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-class="closing" data-theme="clean" lang="C" class="closing" style="--class:closing;--theme:clean;">
<h2 id="%EA%B0%90%EC%82%AC%ED%95%A9%EB%8B%88%EB%8B%A4">감사합니다</h2>
<p>사진 속 «벽이 바닥에 닿는 선» → 각도와 높이로 방 모양 → 벽 세우고 사진 입히기 → 돌하우스</p>
<p>Indyspot AI Corp  ·  Engineering Manager  ·  2026-11-13</p>
</section>

/* 스크린샷 클릭 → 확대 보기
   · 열면 먼저 화면에 꽉 맞춰 보여주고, 한 번 더 누르면 원본 100% 크기로 확대
   · 확대 상태에서 드래그(모바일은 한 손가락)로 이동, 휠·핀치로 자유 배율
   · ESC·✕·배경 클릭으로 닫기 (오너 상시 요구 · 2026-10-06 도입)                      */
(() => {
  if (window.__lb) return; window.__lb = 2;   // 2 = 원본 크기 확대판(2026-11-04)

  const PAD = 28, MAXZ = 4;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:99999;display:none;overflow:hidden;' +
    'background:rgba(10,14,22,.93);touch-action:none;-webkit-user-select:none;user-select:none';

  const im = document.createElement('img');
  im.draggable = false;
  im.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;' +
    'border-radius:4px;box-shadow:0 12px 44px rgba(0,0,0,.5);will-change:transform';
  ov.appendChild(im);

  const hud = document.createElement('div');
  hud.style.cssText = 'position:absolute;right:16px;top:14px;display:flex;gap:8px;align-items:center;' +
    'font:600 13px/1 system-ui,-apple-system,sans-serif;color:#eaf0fb;pointer-events:none';
  const chip = 'background:rgba(255,255,255,.15);padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px)';
  const tip = document.createElement('span'); tip.style.cssText = chip + ';transition:opacity .4s';
  const pct = document.createElement('span'); pct.style.cssText = chip + ';font-variant-numeric:tabular-nums';
  const xb  = document.createElement('button'); xb.textContent = '✕'; xb.setAttribute('aria-label', '닫기');
  xb.style.cssText = chip + ';pointer-events:auto;border:0;color:#fff;width:36px;height:36px;padding:0;' +
    'font:600 16px/1 system-ui;cursor:pointer';
  hud.append(tip, pct, xb);
  ov.appendChild(hud);

  let nw = 0, nh = 0, fit = 1, s = 1, tx = 0, ty = 0;
  let drag = false, lx = 0, ly = 0, moved = false, tipT = 0;

  const clamp = () => {
    const W = innerWidth, H = innerHeight, w = nw * s, h = nh * s;
    tx = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, tx));
    ty = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, ty));
  };
  const draw = () => {
    im.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    pct.textContent = Math.round(s * 100) + '%';
    const big = nw * s > innerWidth + 1 || nh * s > innerHeight + 1;
    im.style.cursor = big ? (drag ? 'grabbing' : 'grab') : (s < 1 ? 'zoom-in' : 'zoom-out');
  };
  const zoom = (ns, cx, cy) => {
    ns = Math.max(Math.min(fit, 1) * 0.9, Math.min(ns, MAXZ));
    const k = ns / s;
    tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k;
    s = ns; clamp(); draw();

  const showTip = (t) => {
    tip.textContent = t; tip.style.opacity = '1';
    clearTimeout(tipT); tipT = setTimeout(() => { tip.style.opacity = '0'; }, 2600);
  };
  const close = () => { ov.style.display = 'none'; im.removeAttribute('src'); document.body.style.overflow = ''; };

  const open = (src) => {
    im.onload = () => {
      nw = im.naturalWidth; nh = im.naturalHeight;
      im.style.width = nw + 'px'; im.style.height = nh + 'px';
      fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
      s = Math.min(fit, 1);            // 원본보다 크게는 띄우지 않는다
      tx = ty = 0; clamp(); draw();
      showTip(fit < 0.995 ? '클릭하면 원본 크기 · 드래그 이동 · ESC 닫기' : '휠로 확대 · ESC 닫기');
    };
    im.src = src;
    ov.style.display = 'block';
    document.body.style.overflow = 'hidden';
  };

  // 배경 클릭 → 닫기 / 이미지 클릭 → 맞춤 ↔ 원본 토글
  ov.addEventListener('click', (e) => {
    e.stopPropagation();
    if (moved) { moved = false; return; }
    if (e.target === xb || e.target === ov) { close(); return; }
    if (e.target === im) {
      const f = Math.min(fit, 1);
      zoom(s > f + 0.005 ? f : Math.max(1, f * 2), e.clientX, e.clientY);
    }
  });

  // 드래그 이동 (마우스 · 터치 공통)
  im.addEventListener('pointerdown', (e) => {
    if (nw * s <= innerWidth && nh * s <= innerHeight) return;
    drag = true; moved = false; lx = e.clientX; ly = e.clientY;
    im.setPointerCapture(e.pointerId); draw(); e.preventDefault();
  });
  im.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    tx += dx; ty += dy; lx = e.clientX; ly = e.clientY; clamp(); draw();
  });
  const endDrag = (e) => { if (drag) { drag = false; try { im.releasePointerCapture(e.pointerId); } catch (_) {} draw(); } };
  im.addEventListener('pointerup', endDrag);
  im.addEventListener('pointercancel', endDrag);

  // 휠 줌 (슬라이드 전환으로 새지 않게 차단)
  ov.addEventListener('wheel', (e) => {
    e.preventDefault(); e.stopPropagation();
    zoom(s * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY);
  }, { passive: false });

  // 핀치 줌
  let pts = new Map(), pd = 0;
  ov.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') pts.set(e.pointerId, e); });
  ov.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'touch' || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pts.size !== 2) return;
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pd) { moved = true; zoom(s * (d / pd), (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); }
    pd = d;
  });
  const dropPt = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pd = 0; };
  ov.addEventListener('pointerup', dropPt);
  ov.addEventListener('pointercancel', dropPt);

  // 열려 있는 동안 키보드는 전부 여기서 소비 (화살표가 슬라이드를 넘기면 안 된다)
  document.addEventListener('keydown', (e) => {
    if (ov.style.display === 'none') return;
    const cx = innerWidth / 2, cy = innerHeight / 2;
    if (e.key === 'Escape') close();
    else if (e.key === '+' || e.key === '=') zoom(s * 1.25, cx, cy);
    else if (e.key === '-' || e.key === '_') zoom(s / 1.25, cx, cy);
    else if (e.key === '0') zoom(Math.min(fit, 1), cx, cy);
    else if (e.key === '1') zoom(1, cx, cy);
    else if (e.key === 'ArrowLeft') { tx += 60; clamp(); draw(); }
    else if (e.key === 'ArrowRight') { tx -= 60; clamp(); draw(); }
    else if (e.key === 'ArrowUp') { ty += 60; clamp(); draw(); }
    else if (e.key === 'ArrowDown') { ty -= 60; clamp(); draw(); }
    else return;
    e.preventDefault(); e.stopPropagation();
  }, true);

  addEventListener('resize', () => {
    if (ov.style.display === 'none' || !nw) return;
    fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
    clamp(); draw();
  });

  const ready = () => {
    document.body.appendChild(ov);
    document.addEventListener('click', (e) => {
      const t = e.target;
      if (t && t.tagName === 'IMG' && t.closest('section') && !t.classList.contains('emoji')) {
        e.preventDefault(); e.stopPropagation(); open(t.currentSrc || t.src);
      }
    }, true);
  };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', ready) : ready();
})();
</script>
