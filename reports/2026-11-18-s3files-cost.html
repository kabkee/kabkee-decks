<h2 id="%EC%9B%94%EB%B3%84-%EB%B9%84%EC%9A%A9--%EC%A0%80%EC%9E%A5%EC%9D%80-9%EC%9B%94-%EC%9D%B4%ED%9B%84-%EB%A7%A4%EB%8B%AC-50-%EC%95%88%ED%8C%8E%EC%9C%BC%EB%A1%9C-%EA%B3%A0%EC%A0%95%EB%8F%BC-%EC%9E%88%EC%8A%B5%EB%8B%88%EB%8B%A4">월별 비용 — 저장은 9월 이후 매달 $50 안팎으로 고정돼 있습니다</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="5" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EC%99%9C-%EB%A9%94%ED%83%80%EB%8D%B0%EC%9D%B4%ED%84%B0%EA%B0%80-%EB%8F%88%EC%9D%B4-%EB%90%98%EB%8A%94%EA%B0%80--%EA%B0%9C%EB%8B%B9-%EC%B5%9C%EC%86%8C-10kib--%EC%98%81%EA%B5%AC-%EB%B3%B4%EC%A1%B4">왜 메타데이터가 돈이 되는가 — 개당 최소 10KiB · 영구 보존</h2>
<table>
<thead>
<tr>
<th>사실</th>
<th>근거</th>
</tr>
</thead>
<tbody>
<tr>
<td>마운트에서 파일·폴더를 «한 번이라도» 열거하거나 조회하면 그 항목의 inode 가 생깁니다</td>
<td>CloudWatch <code>AWS/S3/Files</code> <code>Inodes</code></td>
</tr>
<tr>
<td>inode 는 개당 최소 10KiB 로 고성능 저장소 요금($0.33/GB-월)이 붙습니다</td>
<td>1,661만 × 10KiB ≈ 158GB = Cost Explorer 158.3 GB-월</td>
</tr>
<tr>
<td>데이터 가져오기는 꺼져 있고(<code>ON_FILE_ACCESS</code> · <code>sizeLessThan 0</code>) 만료 1일 규칙도 있지만, <strong>메타데이터는 만료되지 않습니다</strong></td>
<td><code>get-synchronization-configuration</code> · 09-13 실측 (바닥 158.9GB 유지)</td>
</tr>
<tr>
<td>그래서 <code>find</code> · <code>du</code> · <code>ls -R</code> · <code>rsync</code> · <code>grep -r</code> 한 번이면 버킷 전체가 영구 과금 대상이 됩니다</td>
<td>09-18~20 재발</td>
</tr>
</tbody>
</table>
<p><span class="hl-amber">핵심</span> 데이터 캐시 비용은 09-13 설정으로 이미 막았습니다. 남은 것은 <strong>«한 번 생기면 지워지지 않는» 메타데이터</strong> 이고, 지우는 방법은 <strong>파일시스템을 새로 만드는 것뿐</strong>입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EA%B2%BD%EA%B3%BC--%EA%B5%90%EC%B2%B4%EB%A1%9C-%EC%97%86%EC%95%B4%EB%8D%98-%EB%B0%94%EB%8B%A5%EA%B0%92%EC%9D%B4-%EB%82%98%ED%9D%98-%EB%A7%8C%EC%97%90-%EB%8F%8C%EC%95%84%EC%99%94%EC%8A%B5%EB%8B%88%EB%8B%A4">경과 — 교체로 없앴던 바닥값이 나흘 만에 돌아왔습니다</h2>

<tr>
<td>09-14 19:31</td>
<td><strong>새 파일시스템으로 교체</strong> (오너 지시)</td>
<td>—</td>
</tr>
<tr>
<td>09-16 · 09-17</td>
<td>교체 효과</td>
<td><span class="hl-green">18.8GB · 23.4GB</span></td>
</tr>
<tr>
<td>09-18 ~ 09-20</td>
<td><strong>전체 순회 재발</strong> (원인 run 미확정)</td>

</tr>
<tr>
<td>09-20 ~ 현재</td>

</tr>
<tr>
<td>10-23</td>

<p><span class="hl-red">교훈</span> 09-14 교체 뒤 감시 스크립트는 테스트용(<code>~/look360-fs-swap/s3files_storage_check_test.py</code>)만 있었고 정기 실행이 없었습니다. 그래서 재발을 두 달 동안 아무도 몰랐습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="7" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EC%9D%BD%EA%B8%B0-%EB%B9%84%EC%9A%A9--10%EC%9B%94%EC%9D%80-%EC%88%9C%ED%9A%8C-%EC%82%AC%EA%B3%A0-6%EC%9D%BC%EC%9D%B4-19-%EB%A5%BC-%EB%A7%8C%EB%93%A4%EC%97%88%EC%8A%B5%EB%8B%88%EB%8B%A4">읽기 비용 — 10월은 순회 사고 6일이 $19 를 만들었습니다</h2>
<table>
<thead>
<tr>
<th>날짜</th>
<th>읽기</th>
<th>비용</th>
<th>비고</th>
</tr>
</thead>
<tbody>
<tr>
<td>10-01 · 10-02</td>
<td>71.6GB · 82.5GB</td>
<td>$2.15 · $2.47</td>
<td>순회 사고</td>
</tr>
<tr>
<td>10-16</td>
<td>171.7GB</td>
<td>$5.15</td>
<td>순회 사고</td>
</tr>
<tr>
<td>10-19</td>
<td>33.9GB</td>
<td>$1.02</td>
<td>순회 사고</td>
</tr>
<tr>
<td>10-21</td>
<td>169.0GB</td>
<td>$5.07</td>
<td>순회 사고</td>
</tr>
<tr>
<td>10-23</td>
<td>106.0GB</td>
<td>$3.18</td>
<td>순회 사고 (IND-8731) → 같은 날 금지 규칙</td>
</tr>
<tr>
<td>그 외 평일</td>

<td>하루 $0.04~0.09</td>

<ul>
<li>사고 6일 합계 <strong>$19.04</strong> = 10월 읽기 비용의 94%.</li>
<li>11월에는 튀는 날이 없습니다. 다만 메타데이터 읽기가 <strong>11-01 1.5GB → 11-17 8.0GB</strong> 로 조금씩 늘고 있습니다(월 $3~5 수준).</li>
<li>같은 기간 봇 요청도 하루 1.4만 → 3.4만 건으로 늘었지만 날짜별로 맞아떨어지지는 않아 원인은 확인하지 못했습니다.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EC%A0%95%EC%A0%95--agetimgphp-%ED%94%84%EB%A1%9D%EC%8B%9C%EB%8A%94-%EC%9B%90%EC%9D%B8%EC%9D%B4-%EC%95%84%EB%8B%99%EB%8B%88%EB%8B%A4">정정 — <code>a.getImg.php</code> 프록시는 원인이 아닙니다</h2>
<p>WebP 덱(11-18)에서 «프록시 투어 495개가 타일을 마운트로 읽어 S3 Files 비용을 만들 수 있다»고 추정했던 부분을 실측으로 확인했습니다.</p>
<table>
<thead>
<tr>
<th>확인</th>
<th>값</th>
</tr>
</thead>
<tbody>
<tr>
<td>Apache 로그의 <code>a=getImg</code> 호출 (11-04 ~ 11-18, 15일)</td>
<td>하루 0~576건 · 대부분 0</td>
</tr>
<tr>
<td>CloudWatch <code>DataReadBytes</code> (11월)</td>
<td>하루 0~0.34GB</td>
</tr>
<tr>
<td>CloudWatch <code>MetadataReadBytes</code> (11월)</td>
<td>하루 1.5~8.0GB ← 읽기 비용의 실체</td>
</tr>
</tbody>
</table>
<p><span class="hl-gray">결론</span> 읽기 비용은 파일 «내용»이 아니라 «목록·속성 조회»에서 나옵니다. 프록시 경로는 비용 원인 목록에서 뺍니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EB%8C%80%EC%95%88-%EB%B9%84%EA%B5%90--a-%EC%95%88%EC%9D%84-%EC%B6%94%EC%B2%9C%ED%95%A9%EB%8B%88%EB%8B%A4">대안 비교 — A 안을 추천합니다</h2>
<table>
<thead>
<tr>
<th>안</th>
<th>내용</th>
<th>월 절감 (추정)</th>
<th>일회성 작업</th>
<th>위험</th>
</tr>
</thead>
<tbody>
<tr>
<td><span class="hl-green">A</span></td>
<td>파일시스템 재교체 + 재발 경보</td>
<td><strong>약 $40~46</strong></td>
<td>반나절 (09-14 절차 재사용)</td>
<td>낮음 · 업로드 중 교체만 피하면 됨</td>
</tr>
<tr>
<td>B</td>
<td>재발 경보만 추가</td>
<td>$0</td>
<td>1~2시간</td>
<td>없음 · 지금 바닥값은 그대로</td>
</tr>
<tr>
<td>C</td>
<td>마운트 제거 · PHP 쓰기를 S3 API 로</td>
<td>약 $52 + 읽기 전액</td>
<td>레거시 쓰기 경로 전수 수정 (수주)</td>
<td>높음 · 업로드·XML 저장 경로 전부</td>
</tr>
</tbody>
</table>
<ul>
<li>A 의 절감을 $52 전액이 아니라 $40~46 으로 잡은 이유: 교체 직후에도 정상 사용만으로 18.8GB → 23.4GB(이틀) 가 늘었고, <strong>자연 증가가 어디서 멈추는지는 확인하지 못했습니다.</strong> 교체 후 <code>Inodes</code> 추이로 최종 판정합니다.</li>
<li>A 와 B 는 경보가 핵심입니다. 경보가 없으면 A 의 효과는 다음 순회 사고 한 번으로 사라집니다.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="a-%EC%95%88-%EC%A0%88%EC%B0%A8--09-14-%EC%97%90-%EA%B2%80%EC%A6%9D%EB%90%9C-%EC%88%9C%EC%84%9C%EB%A5%BC-%EA%B7%B8%EB%8C%80%EB%A1%9C-%EC%94%81%EB%8B%88%EB%8B%A4">A 안 절차 — 09-14 에 검증된 순서를 그대로 씁니다</h2>
<table>
<thead>
<tr>
<th>단계</th>
<th>할 일</th>
<th>확인</th>
</tr>
</thead>
<tbody>
<tr>
<td>1 준비</td>
<td>새 파일시스템 생성 (같은 버킷 · 같은 역할 <code>look360-v1-s3files-role</code>)</td>
<td>—</td>
</tr>
<tr>
<td>2 설정 선적용</td>
<td><strong>첫 마운트 전에</strong> 가져오기 끔(<code>ON_FILE_ACCESS</code> · <code>sizeLessThan 0</code>) + 만료 1일</td>
<td>기본값(128KiB · 30일)으로 마운트하면 안 됨</td>
</tr>
<tr>
<td>3 병행 마운트</td>
<td>임시 경로에 마운트 → 상위 폴더 몇 개만 이름·소유자·권한 대조</td>
<td>전체 대조 금지 (그 자체가 순회)</td>
</tr>
<tr>
<td>4 전환</td>
<td>쓰기성 POST 와 <code>PendingExports</code> 0 확인 → <code>/etc/fstab</code> 한 줄 교체 → <code>umount -l</code> → <code>mount</code></td>
<td>약 1.2초</td>
</tr>
<tr>
<td>5 확인</td>
<td>업로드 1건 · XML 저장 1건 · 정확한 경로 몇 개 조회</td>
<td>403 은 장소 폴더 <code>.htaccess</code> 일 수 있음 (오판 주의)</td>
</tr>
<tr>
<td>6 경보 가동</td>
<td>아래 경보를 <strong>전환 당일</strong> 켬</td>
<td>Slack 시험 발송</td>
</tr>
<tr>
<td>7 정리</td>
<td>7일 관찰 후 기존 파일시스템 삭제</td>
<td>접근 지점 → 마운트 타깃 → 파일시스템 순서</td>
</tr>
</tbody>
</table>
<p>롤백: 백업한 fstab 을 되돌리고 같은 절차로 다시 마운트합니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EC%9E%AC%EB%B0%9C-%EA%B2%BD%EB%B3%B4--%EC%88%9C%ED%9A%8C%EA%B0%80-%EC%9D%BC%EC%96%B4%EB%82%9C-%C2%AB%EA%B7%B8%EB%82%A0%C2%BB-%EC%95%8C%EC%95%84%EC%95%BC-%ED%95%A9%EB%8B%88%EB%8B%A4">재발 경보 — 순회가 일어난 «그날» 알아야 합니다</h2>
<table>
<thead>
<tr>
<th>항목</th>
<th>설계</th>
</tr>
</thead>
<tbody>
<tr>
<td>지표</td>
<td>CloudWatch <code>AWS/S3/Files</code> · <code>Inodes</code> (파일시스템 단위)</td>
</tr>
<tr>
<td>기준</td>
<td>교체 직후 값 + 200만 개 초과 · 또는 하루 증가 50만 개 초과</td>
</tr>
<tr>
<td>실행</td>
<td>kabkee-main 크론이 매일 1회 조회 → Slack 알림 (기존 <code>s3files_storage_check_test.py</code> 를 정식화)</td>
</tr>
<tr>
<td>권한</td>
<td>지금 프로필(<code>look360-backup-reader</code> · <code>look360-cf-invalidator</code> · EC2 역할)은 CloudWatch 조회 불가 → <strong><code>cloudwatch:GetMetricStatistics</code> 만 가진 사용자 1개</strong> 필요</td>
</tr>
<tr>
<td>같이 볼 것</td>
<td><code>MetadataReadBytes</code> 하루 20GB 초과 (순회 사고의 읽기 신호)</td>
</tr>
<tr>
<td>비용</td>
<td>사실상 0원 (지표 조회 하루 2회)</td>
</tr>
</tbody>
</table>
<p><span class="hl-amber">왜 하루 단위인가</span> 순회 한 번에 바닥값이 다시 생기고, 그 뒤로는 매일 $1.7 씩 나갑니다. 발견이 하루 늦을 때마다 $1.7 이고, 두 달 늦으면 이번처럼 약 $100 입니다.</p>
</section>

<h2 id="%ED%95%A8%EC%A0%95">함정</h2>
<table>
<thead>
<tr>
<th>함정</th>
<th>대응</th>
</tr>
</thead>
<tbody>
<tr>
<td>설정 없이 첫 마운트</td>
<td>기본값(128KiB 미만 자동 가져오기 · 30일 만료)이 적용돼 데이터 캐시 비용이 다시 생김 → 설정 선적용</td>
</tr>
<tr>
<td>교체 중 업로드</td>
<td>09-14 에 «신규 장소는 S3 로 직접 올라간다»는 가정이 틀렸음 (마운트 경유 · 객체 <code>x-amz-meta-fs-id</code> 로 판별) → 쓰기성 POST 확인</td>
</tr>
<tr>
<td>교체 검증을 위한 전체 대조</td>
<td>대조 자체가 순회 → 상위 폴더 몇 개 + 정확한 경로만</td>
</tr>
<tr>
<td>권한 일괄 변경 (<code>chown -R</code> 등)</td>
<td>새 파일시스템에서 하면 바닥값 재발 → 임시 파일시스템에서 하고 삭제, 또는 S3 Batch Operations</td>
</tr>
<tr>
<td><code>grep -r</code> · <code>find</code> 를 <code>/var/www/html</code> 에서 실행</td>
<td><code>--exclude-dir=files</code> 또는 <code>-path ./files -prune</code> 필수 (결과 필터로는 못 막음)</td>
</tr>
<tr>
<td>403 을 교체 실패로 오판</td>
<td>장소 폴더 <code>.htaccess</code> 의 타일 직접 접근 차단일 수 있음</td>
</tr>
</tbody>
</table>
</section>

/* 스크린샷 클릭 → 확대 보기
   · 열면 먼저 화면에 꽉 맞춰 보여주고, 한 번 더 누르면 원본 100% 크기로 확대
   · 확대 상태에서 드래그(모바일은 한 손가락)로 이동, 휠·핀치로 자유 배율
   · ESC·✕·배경 클릭으로 닫기 (오너 상시 요구 · 2026-10-06 도입)                      */
(() => {
  if (window.__lb) return; window.__lb = 2;   // 2 = 원본 크기 확대판(2026-11-04)

  const PAD = 28, MAXZ = 4;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:99999;display:none;overflow:hidden;' +
    'background:rgba(10,14,22,.93);touch-action:none;-webkit-user-select:none;user-select:none';

  const im = document.createElement('img');
  im.draggable = false;
  im.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;' +
    'border-radius:4px;box-shadow:0 12px 44px rgba(0,0,0,.5);will-change:transform';
  ov.appendChild(im);

  const hud = document.createElement('div');
  hud.style.cssText = 'position:absolute;right:16px;top:14px;display:flex;gap:8px;align-items:center;' +
    'font:600 13px/1 system-ui,-apple-system,sans-serif;color:#eaf0fb;pointer-events:none';
  const chip = 'background:rgba(255,255,255,.15);padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px)';
  const tip = document.createElement('span'); tip.style.cssText = chip + ';transition:opacity .4s';
  const pct = document.createElement('span'); pct.style.cssText = chip + ';font-variant-numeric:tabular-nums';
  const xb  = document.createElement('button'); xb.textContent = '✕'; xb.setAttribute('aria-label', '닫기');
  xb.style.cssText = chip + ';pointer-events:auto;border:0;color:#fff;width:36px;height:36px;padding:0;' +
    'font:600 16px/1 system-ui;cursor:pointer';
  hud.append(tip, pct, xb);
  ov.appendChild(hud);

  let nw = 0, nh = 0, fit = 1, s = 1, tx = 0, ty = 0;
  let drag = false, lx = 0, ly = 0, moved = false, tipT = 0;

  const clamp = () => {
    const W = innerWidth, H = innerHeight, w = nw * s, h = nh * s;
    tx = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, tx));
    ty = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, ty));
  };
  const draw = () => {
    im.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    pct.textContent = Math.round(s * 100) + '%';
    const big = nw * s > innerWidth + 1 || nh * s > innerHeight + 1;
    im.style.cursor = big ? (drag ? 'grabbing' : 'grab') : (s < 1 ? 'zoom-in' : 'zoom-out');
  };
  const zoom = (ns, cx, cy) => {
    ns = Math.max(Math.min(fit, 1) * 0.9, Math.min(ns, MAXZ));
    const k = ns / s;
    tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k;
    s = ns; clamp(); draw();
  };
  const showTip = (t) => {
    tip.textContent = t; tip.style.opacity = '1';
    clearTimeout(tipT); tipT = setTimeout(() => { tip.style.opacity = '0'; }, 2600);
  };
  const close = () => { ov.style.display = 'none'; im.removeAttribute('src'); document.body.style.overflow = ''; };

  const open = (src) => {
    im.onload = () => {
      nw = im.naturalWidth; nh = im.naturalHeight;
      im.style.width = nw + 'px'; im.style.height = nh + 'px';
      fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
      s = Math.min(fit, 1);            // 원본보다 크게는 띄우지 않는다
      tx = ty = 0; clamp(); draw();
      showTip(fit < 0.995 ? '클릭하면 원본 크기 · 드래그 이동 · ESC 닫기' : '휠로 확대 · ESC 닫기');
    };
    im.src = src;
    ov.style.display = 'block';
    document.body.style.overflow = 'hidden';
  };

  // 배경 클릭 → 닫기 / 이미지 클릭 → 맞춤 ↔ 원본 토글
  ov.addEventListener('click', (e) => {
    e.stopPropagation();
    if (moved) { moved = false; return; }
    if (e.target === xb || e.target === ov) { close(); return; }
    if (e.target === im) {
      const f = Math.min(fit, 1);
      zoom(s > f + 0.005 ? f : Math.max(1, f * 2), e.clientX, e.clientY);
    }
  });

  // 드래그 이동 (마우스 · 터치 공통)
  im.addEventListener('pointerdown', (e) => {
    if (nw * s <= innerWidth && nh * s <= innerHeight) return;
    drag = true; moved = false; lx = e.clientX; ly = e.clientY;
    im.setPointerCapture(e.pointerId); draw(); e.preventDefault();
  });
  im.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    tx += dx; ty += dy; lx = e.clientX; ly = e.clientY; clamp(); draw();
  });
  const endDrag = (e) => { if (drag) { drag = false; try { im.releasePointerCapture(e.pointerId); } catch (_) {} draw(); } };
  im.addEventListener('pointerup', endDrag);
  im.addEventListener('pointercancel', endDrag);

  // 휠 줌 (슬라이드 전환으로 새지 않게 차단)
  ov.addEventListener('wheel', (e) => {
    e.preventDefault(); e.stopPropagation();
    zoom(s * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY);
  }, { passive: false });

  // 핀치 줌
  let pts = new Map(), pd = 0;
  ov.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') pts.set(e.pointerId, e); });
  ov.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'touch' || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pts.size !== 2) return;
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pd) { moved = true; zoom(s * (d / pd), (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); }
    pd = d;
  });
  const dropPt = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pd = 0; };
  ov.addEventListener('pointerup', dropPt);
  ov.addEventListener('pointercancel', dropPt);

  // 열려 있는 동안 키보드는 전부 여기서 소비 (화살표가 슬라이드를 넘기면 안 된다)
  document.addEventListener('keydown', (e) => {
    if (ov.style.display === 'none') return;
    const cx = innerWidth / 2, cy = innerHeight / 2;
    if (e.key === 'Escape') close();
    else if (e.key === '+' || e.key === '=') zoom(s * 1.25, cx, cy);
    else if (e.key === '-' || e.key === '_') zoom(s / 1.25, cx, cy);
    else if (e.key === '0') zoom(Math.min(fit, 1), cx, cy);
    else if (e.key === '1') zoom(1, cx, cy);
    else if (e.key === 'ArrowLeft') { tx += 60; clamp(); draw(); }
    else if (e.key === 'ArrowRight') { tx -= 60; clamp(); draw(); }
    else if (e.key === 'ArrowUp') { ty += 60; clamp(); draw(); }
    else if (e.key === 'ArrowDown') { ty -= 60; clamp(); draw(); }
    else return;
    e.preventDefault(); e.stopPropagation();
  }, true);

  addEventListener('resize', () => {
    if (ov.style.display === 'none' || !nw) return;
    fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
    clamp(); draw();
  });

  const ready = () => {
    document.body.appendChild(ov);
    document.addEventListener('click', (e) => {
      const t = e.target;
      if (t && t.tagName === 'IMG' && t.closest('section') && !t.classList.contains('emoji')) {
        e.preventDefault(); e.stopPropagation(); open(t.currentSrc || t.src);
      }
    }, true);
  };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', ready) : ready();
})();
</script>

   · 종류: 수정 요청 / 의사결정으로 앞으로 / 다음 주로 미루기 / 질문 / 기타 — Claude 가 읽고 덱을 고칠 때 분류 기준으로 쓴다.
   · 저장: /api/comments (Netlify 함수 · netlify/functions/comments.mjs). 로컬(:8088)에서 열면 배포된 API 로 보내고,
     API 가 이 덱을 받지 않으면 이 브라우저(localStorage)에만 저장한 뒤 「복사」로 Claude 에게 넘긴다.
   · 덱 id 는 <meta name="deck-comments" content="..."> (빌드가 주입). 없으면 동작하지 않는다.                       */
(() => {
  if (window.__dc) return; window.__dc = 1;
  const DECK = document.querySelector('meta[name="deck-comments"]')?.content;
  if (!DECK) return;

  const REMOTE = 'https://kabkee-decks.netlify.app/api/comments';
  const API = /netlify\.app$/.test(location.hostname) ? '/api/comments' : REMOTE;
  const LS = 'deck-comments:' + DECK;
  const SEL = 'h1,h2,h3,h4,p,li,tr,blockquote,figure,img:not(.emoji),figcaption,pre,.card,.links,.lnk';
  const KINDS = [
    ['fix', '수정 요청'], ['decision', '의사결정으로 앞으로'], ['later', '다음 주로 미루기'],
    ['question', '질문'], ['etc', '기타'],
  ];
  const KLABEL = Object.fromEntries(KINDS);

  // ── 스타일 ──
  const st = document.createElement('style');
  st.textContent = `
  .dc-fab{position:fixed;right:18px;bottom:18px;z-index:99990;display:flex;gap:8px;align-items:center;font:600 14px/1 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .dc-fab button{border:0;border-radius:999px;padding:11px 16px;cursor:pointer;background:#1f2937;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);font:inherit}
  .dc-fab button.on{background:#16a34a}
  .dc-fab .dc-n{background:#f59e0b;color:#1a1204;border-radius:999px;padding:2px 8px;margin-left:6px;font-size:12px}
  body.dc-on section [data-dc-hot]{outline:3px solid #16a34a!important;outline-offset:2px;cursor:copy!important;background:rgba(22,163,74,.07)}
  body.dc-on section [data-dc-has]{outline:2px dashed #f59e0b;outline-offset:2px}
  body.dc-on section{cursor:crosshair;position:relative}
  .dc-pin{position:absolute;z-index:5;background:#f59e0b;color:#1a1204;font:700 12px/1 system-ui;border-radius:999px;padding:3px 7px;pointer-events:none}
  .dc-drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:99995;background:#fff;color:#111827;border-left:1px solid #e5e7eb;box-shadow:-12px 0 32px rgba(0,0,0,.18);padding:18px 18px 28px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .dc-drawer[hidden]{display:none}
  .dc-drawer h3{margin:0;font-size:17px}
  .dc-drawer .dc-row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .dc-drawer .dc-target{font:600 12px/1.4 ui-monospace,Menlo,monospace;color:#b45309}
  .dc-drawer .dc-detail{font-size:13px;color:#4b5563;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;max-height:8.5em;overflow:auto;white-space:pre-wrap}
  .dc-drawer label{display:grid;gap:4px;font-size:13px;color:#4b5563}
  .dc-drawer input,.dc-drawer textarea{font:15px/1.5 inherit;font-family:inherit;color:#111827;border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box}
  .dc-drawer textarea{min-height:130px;resize:vertical}
  .dc-kinds{display:flex;flex-wrap:wrap;gap:6px}
  .dc-kinds button{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:6px 11px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer;color:#374151}
  .dc-kinds button.sel{background:#111827;color:#fff;border-color:#111827}
  .dc-btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px 12px;font:600 14px/1 inherit;font-family:inherit;cursor:pointer;color:#111827}
  .dc-btn.pri{background:#16a34a;border-color:#16a34a;color:#fff}
  .dc-status{font-size:13px;color:#6b7280}
  .dc-warn{font-size:13px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:8px 10px}
  .dc-list{display:grid;gap:8px}
  .dc-c{border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;background:#fafafa}
  .dc-c .dc-meta{font-size:12px;color:#6b7280}
  .dc-c .dc-where{font:600 12px/1.4 ui-monospace,Menlo,monospace;color:#b45309;cursor:pointer}
  .dc-c p{margin:4px 0 0;white-space:pre-wrap}
  .dc-tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:6px;background:#e5e7eb;color:#111827}
  .dc-tag.decision{background:#fee2e2;color:#991b1b}.dc-tag.fix{background:#dbeafe;color:#1e40af}.dc-tag.later{background:#f3f4f6;color:#4b5563}.dc-tag.question{background:#fef3c7;color:#92400e}
  `;
  document.head.appendChild(st);

  // ── 상태 ──
  let on = false, comments = [], remoteOk = false, current = null, kind = 'fix';
  const $ = (t, a = {}, ...kids) => { const e = document.createElement(t); Object.assign(e, a); kids.forEach(k => e.append(k)); return e; };
  const pad = (n) => String(n).padStart(2, '0');
  const sections = () => [...document.querySelectorAll('svg[data-marpit-svg] > foreignObject > section, section[data-marpit-pagination]')]
    .filter((s, i, a) => a.indexOf(s) === i);
  const slideNo = (sec) => {
    const all = sections(); const i = all.indexOf(sec);
    return i >= 0 ? i + 1 : Number(sec.id) || 0;
  };
  const short = (t, n) => { t = (t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
  const textOf = (el) => el.tagName === 'IMG' ? '[이미지] ' + (el.getAttribute('alt') || el.getAttribute('src') || '') : (el.innerText || el.textContent || '');
  const slideTitle = (sec) => short(sec.querySelector('h1,h2')?.innerText || '', 80);
  const anchorOf = (el) => {
    const sec = el.closest('section'); const n = slideNo(sec);
    if (el === sec) return { anchor: `s${pad(n)}-slide`, sec, n };
    const idx = [...sec.querySelectorAll(SEL)].indexOf(el);
    return { anchor: `s${pad(n)}-e${String(idx + 1).padStart(2, '0')}`, sec, n };
  };
  const elOf = (anchor) => {
    const m = /^s(\d+)-(slide|e(\d+))$/.exec(anchor || ''); if (!m) return null;
    const sec = sections()[Number(m[1]) - 1]; if (!sec) return null;
    return m[2] === 'slide' ? sec : sec.querySelectorAll(SEL)[Number(m[3]) - 1] || null;
  };
  const goSlide = (n) => { location.hash = '#' + n; };

  // ── 저장소 ──
  const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch { return []; } };
  const saveLocal = (list) => localStorage.setItem(LS, JSON.stringify(list));
  async function load() {
    let remote = [];
    try {
      const r = await fetch(API + '?deck=' + encodeURIComponent(DECK), { cache: 'no-store' });
      if (r.ok) { remote = await r.json(); remoteOk = true; } else remoteOk = false;
    } catch { remoteOk = false; }
    comments = [...remote, ...loadLocal().map(c => ({ ...c, local: true }))];
    paint();
  }
  async function post(c) {
    if (remoteOk) {
      try {
        const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(c) });
        if (r.ok) return { ...(await r.json()), local: false };
      } catch { /* 아래 로컬 저장으로 */ }
    }
    const lc = { ...c, id: 'L' + Math.random().toString(36).slice(2, 9), createdAt: new Date().toISOString(), local: true };
    saveLocal([...loadLocal(), lc]);
    return lc;
  }

  // ── 표시 ──
  const fab = $('div', { className: 'dc-fab' });
  const bAll = $('button', { type: 'button', title: '이 덱의 코멘트 전체 보기' }, '목록');
  const bOn = $('button', { type: 'button', title: '코멘트 모드 켜기/끄기 (C)' }, '💬 코멘트');
  const nBadge = $('span', { className: 'dc-n' }, '0');
  bOn.append(nBadge);
  fab.append(bAll, bOn);
  document.body.appendChild(fab);

  const dr = $('aside', { className: 'dc-drawer', hidden: true });
  dr.setAttribute('aria-label', '슬라이드 코멘트');
  document.body.appendChild(dr);

  function paint() {
    nBadge.textContent = String(comments.length);
    document.querySelectorAll('[data-dc-has]').forEach(e => e.removeAttribute('data-dc-has'));
    document.querySelectorAll('.dc-pin').forEach(e => e.remove());
    const by = new Map();
    comments.forEach(c => by.set(c.anchor, (by.get(c.anchor) || 0) + 1));
    by.forEach((cnt, a) => {
      const el = elOf(a); if (!el) return;
      el.setAttribute('data-dc-has', '1');
      if (on && el.tagName !== 'SECTION' && el.tagName !== 'TR' && el.tagName !== 'IMG') {
        const sec = el.closest('section'); const sr = sec.getBoundingClientRect(), er = el.getBoundingClientRect();
        const k = sec.offsetWidth ? sr.width / sec.offsetWidth : 1;
        const pin = $('span', { className: 'dc-pin' }, String(cnt));
        pin.style.left = ((er.right - sr.left) / k - 8) + 'px'; pin.style.top = ((er.top - sr.top) / k - 10) + 'px';
        sec.appendChild(pin);
      }
    });
  }

  const card = (c) => {
    const where = $('div', { className: 'dc-where' }, `${c.anchor} · ${short(c.label, 60)}`);
    where.onclick = () => { const m = /^s(\d+)/.exec(c.anchor); if (m) goSlide(Number(m[1])); };
    const tag = $('span', { className: 'dc-tag ' + (c.kind || '') }, KLABEL[c.kind] || '코멘트');
    const meta = $('div', { className: 'dc-meta' }, `${c.author || '익명'} · ${(c.createdAt || '').slice(5, 16).replace('T', ' ')}${c.local ? ' · 이 브라우저에만 저장' : ''}`);
    return $('div', { className: 'dc-c' }, where, meta, $('p', {}, tag, c.text));
  };

  function openFor(el) {
    const { anchor, sec, n } = anchorOf(el);
    const isTitle = el === sec.querySelector('h1,h2');
    const label = el === sec ? `${n}쪽 슬라이드 전체 — ${slideTitle(sec)}` : isTitle ? `${n}쪽 · 제목 — ${slideTitle(sec)}` : `${n}쪽 · ${slideTitle(sec)} › ${short(textOf(el), 60)}`;
    current = { anchor, label, detail: short(textOf(el), 800), n };
    dr.replaceChildren();
    const close = $('button', { className: 'dc-btn', type: 'button' }, '닫기'); close.onclick = hide;
    const whole = $('button', { className: 'dc-btn', type: 'button' }, '이 슬라이드 전체에 달기'); whole.onclick = () => openFor(sec);
    dr.append($('div', { className: 'dc-row' }, $('h3', {}, '코멘트 달기'), close));
    dr.append($('div', { className: 'dc-target' }, `${anchor} · ${short(label, 90)}`));
    if (el !== sec) dr.append($('div', { className: 'dc-detail' }, current.detail), whole);
    if (!remoteOk) dr.append($('div', { className: 'dc-warn' }, '지금은 공유 저장소에 연결되지 않아 이 브라우저에만 저장돼요. 「목록」 → 「Claude 용으로 복사」로 넘겨 주세요.'));
    const mine = comments.filter(c => c.anchor === anchor);
    if (mine.length) dr.append($('div', { className: 'dc-list' }, ...mine.map(card)));
    const kinds = $('div', { className: 'dc-kinds' });
    KINDS.forEach(([k, l]) => {
      const b = $('button', { type: 'button', className: k === kind ? 'sel' : '' }, l);
      b.onclick = () => { kind = k; kinds.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); };
      kinds.append(b);
    });
    const name = $('input', { maxLength: 60, value: localStorage.getItem('deck-comments:name') || '', placeholder: '예: 오빠' });
    const ta = $('textarea', { maxLength: 4000, required: true, placeholder: '무엇을 어떻게 바꾸면 좋을지 적어 주세요' });
    const stat = $('span', { className: 'dc-status' });
    const send = $('button', { className: 'dc-btn pri', type: 'submit' }, '저장');
    const form = $('form', {},
      $('div', { style: 'display:grid;gap:10px' },
        $('label', {}, '종류', kinds), $('label', {}, '이름', name), $('label', {}, '코멘트', ta),
        $('div', { className: 'dc-row' }, stat, send)));
    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = ta.value.trim(); if (!text) { stat.textContent = '내용을 적어 주세요.'; return; }
      send.disabled = true; stat.textContent = '저장 중…';
      localStorage.setItem('deck-comments:name', name.value.trim());
      const c = await post({ deck: DECK, anchor: current.anchor, label: current.label, detail: current.detail, kind, author: name.value.trim() || '익명', text });
      comments.push(c); paint(); openFor(el);
      dr.querySelector('.dc-status').textContent = c.local ? '이 브라우저에 저장했어요.' : '저장했어요.';
    };
    dr.append(form);
    dr.hidden = false;
    setTimeout(() => ta.focus(), 30);
  }

  function showAll() {
    dr.replaceChildren();
    const close = $('button', { className: 'dc-btn', type: 'button' }, '닫기'); close.onclick = hide;
    const copy = $('button', { className: 'dc-btn', type: 'button' }, 'Claude 용으로 복사');
    copy.onclick = async () => {
      const lines = [`덱 코멘트 — ${DECK} (${comments.length}건)`, `파일: ${location.pathname}`, ''];
      [...comments].sort((a, b) => a.anchor.localeCompare(b.anchor)).forEach(c =>
        lines.push(`- [${KLABEL[c.kind] || '코멘트'}] ${c.anchor} · ${c.label}\n  대상 원문: ${short(c.detail, 200)}\n  코멘트(${c.author || '익명'}): ${c.text.replace(/\n/g, '\n  ')}`));
      try { await navigator.clipboard.writeText(lines.join('\n')); copy.textContent = '복사했어요'; }
      catch { const t = $('textarea', { value: lines.join('\n'), style: 'min-height:240px' }); dr.append(t); t.select(); }
    };
    dr.append($('div', { className: 'dc-row' }, $('h3', {}, `코멘트 ${comments.length}건`), close));
    dr.append($('div', { className: 'dc-status' }, remoteOk ? '공유 저장소에 연결됨 — Claude 가 직접 읽을 수 있어요.' : '공유 저장소 미연결 — 이 브라우저 저장분은 「Claude 용으로 복사」로 넘겨 주세요.'), copy);
    // 이 브라우저(localStorage)에만 저장된 코멘트 지우기 — 공유 저장소의 코멘트는 건드리지 않는다.
    // 실수로 지우지 않게 두 번 눌러야 지운다(브라우저 확인 창은 쓰지 않음).
    const nLocal = comments.filter(c => c.local).length;
    if (nLocal) {
      const del = $('button', { className: 'dc-btn', type: 'button' }, `이 브라우저 저장분 ${nLocal}건 지우기`);
      let armed = false;
      del.onclick = () => {
        if (!armed) { armed = true; del.textContent = `한 번 더 누르면 ${nLocal}건을 지워요 (공유 저장소는 그대로)`; del.style.borderColor = '#dc2626'; del.style.color = '#dc2626'; return; }
        localStorage.removeItem(LS);
        comments = comments.filter(c => !c.local); paint(); showAll();
      };
      dr.append(del);
    }
    const list = [...comments].sort((a, b) => a.anchor.localeCompare(b.anchor));
    dr.append(list.length ? $('div', { className: 'dc-list' }, ...list.map(card)) : $('div', { className: 'dc-status' }, '아직 코멘트가 없어요.'));
    dr.hidden = false;
  }
  function hide() { dr.hidden = true; current = null; }

  function setOn(v) {
    on = v; document.body.classList.toggle('dc-on', on); bOn.classList.toggle('on', on);
    bOn.firstChild.textContent = on ? '💬 코멘트 모드 켜짐' : '💬 코멘트';
    if (!on) { hide(); clearHot(); }
    paint();
  }
  let hot = null;
  const clearHot = () => { if (hot) hot.removeAttribute('data-dc-hot'); hot = null; };
  const pick = (t) => { const sec = t.closest?.('section'); if (!sec || dr.contains(t)) return null; const el = t.closest(SEL); return el && sec.contains(el) ? el : sec; };

  bOn.onclick = () => setOn(!on);
  bAll.onclick = () => (dr.hidden ? showAll() : hide());
  document.addEventListener('mouseover', (e) => {
    if (!on) return; const el = pick(e.target); if (el === hot) return;
    clearHot(); if (el && el.tagName !== 'SECTION') { hot = el; el.setAttribute('data-dc-hot', '1'); }
  }, true);
  // 캡처 단계에서 가로채서 링크 이동·이미지 확대(lightbox)·슬라이드 넘김보다 먼저 처리한다
  document.addEventListener('click', (e) => {
    if (!on || dr.contains(e.target) || fab.contains(e.target)) return;
    const el = pick(e.target); if (!el) return;
    e.preventDefault(); e.stopImmediatePropagation(); openFor(el);
  }, true);
  // 입력 중 키가 슬라이드 넘김(bespoke 단축키)으로 새지 않게 막는다
  addEventListener('keydown', (e) => {
    if (dr.contains(e.target)) { if (e.key === 'Escape') hide(); e.stopPropagation(); return; }
    if ((e.key === 'c' || e.key === 'C') && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA/.test(e.target.tagName)) { setOn(!on); e.stopPropagation(); }
  }, true);
  addEventListener('hashchange', () => setTimeout(paint, 300));
  addEventListener('resize', () => setTimeout(paint, 300));
  load();
})();
</script>
</body></html>
