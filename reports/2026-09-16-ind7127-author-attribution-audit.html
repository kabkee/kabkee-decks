<div id="root"></div>
<script>
(function () {
  'use strict';

  var TITLE = 'IND-7127 귀속 검수';
  var FONTS = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap';
  var LS_CHECKS = 'ind7127.checks';
  var LS_FILTER = 'ind7127.filter';

  var raw = document.getElementById('app-state');
  var state = JSON.parse(raw.textContent);
  state.checks = state.checks || {};

  var base = state.base;          // netlify — 외부에서 접속되는 배포본
  var devBase = state.devBase;    // tailscale dev — netlify 에 안 뜨는 건만
  var items = state.items;
  var filter = 'all';
  var ns = null;          // artifact capability namespace
  var mode = 'pending';   // 'pending' | 'artifact' | 'local'
  var saveTimer = null;

  try {
    var f = localStorage.getItem(LS_FILTER);
    if (f) filter = f;
  } catch (e) { /* 프라이빗 창 등에서 접근 불가 */ }

  var root = document.getElementById('root');

  /* ---------- 저장 ---------- */

  function buildDoc(s) {
    var json = JSON.stringify(s).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="ko">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>' + TITLE + '</title>\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link rel="stylesheet" href="' + FONTS + '">\n' +
      '<link rel="stylesheet" href="app.css">\n' +
      '</head>\n<body>\n' +
      '<script id="app-state" type="application/json">' + json + '<\/script>\n' +
      '<div id="root"></div>\n' +
      '<script src="app.js"><\/script>\n' +
      '</body>\n</html>';
  }

  function saveLocal() {
    try {
      localStorage.setItem(LS_CHECKS, JSON.stringify(state.checks));
      flag('로컬에 저장됨');
    } catch (e) {
      flag('저장 실패 — 브라우저가 저장을 막고 있어');
    }
  }

  function queueSave() {
    flag('저장 중…', true);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(commit, 1200);
  }

  function commit() {
    state.updatedAt = new Date().toISOString();
    if (mode === 'artifact' && ns) {
      ns.publish(buildDoc(state)).then(function () {
        flag('저장됨');
      }, function () {
        // conflict 는 정상 — 모든 뷰가 승자 버전으로 리로드된다. 재시도하지 않는다.
        mode = 'local';
        saveLocal();
      });
    } else {
      saveLocal();
    }
  }

  function flag(text, active) {
    var el = document.getElementById('saveflag');
    if (!el) return;
    el.textContent = text;
    el.classList.toggle('is-active', !!active);
  }

  /* ---------- 집계 ---------- */

  function counts() {
    var c = { all: items.length, ok: 0, issue: 0, pending: 0 };
    items.forEach(function (it) {
      var v = (state.checks[it.viewUid] || {}).status || 'pending';
      c[v] = (c[v] || 0) + 1;
    });
    return c;
  }

  /* ---------- 렌더 ---------- */

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function render() {
    var c = counts();
    var done = c.ok + c.issue;
    var pct = function (n) { return items.length ? (n / items.length * 100) : 0; };

    var html = '<div class="wrap">';

    html += '<header class="masthead">' +
      '<div>' +
        '<span class="eyebrow">IND-7127 · 육안 검수</span>' +
        '<h1>360포스트 작성자 귀속 검수</h1>' +
        '<p>작성자가 <code>look360.kr@gmail.com</code>에서 콘텐츠 소유 채널로 넘어간 360포스트 ' +
        state.totalPosts + '건이 붙어 있는 VR 콘텐츠 전수야. 링크는 사내망 밖에서도 열리는 ' +
        '<code>look360-v3-client.netlify.app</code> 배포본을 가리켜. 콘텐츠를 열어 포스트 작성자가 채널 이름·프로필로 뜨는지 확인해줘.</p>' +
      '</div>' +
      '<div class="gauges">' +
        '<div class="gauge"><b>' + items.length + '</b><span>콘텐츠</span></div>' +
        '<div class="gauge"><b>' + state.channelCount + '</b><span>채널</span></div>' +
        '<div class="gauge"><b>' + state.totalPosts + '</b><span>포스트</span></div>' +
        '<div class="gauge is-ok"><b>' + c.ok + '</b><span>정상</span></div>' +
        '<div class="gauge is-issue"><b>' + c.issue + '</b><span>문제</span></div>' +
      '</div>' +
    '</header>';

    html += '<div class="progress">' +
      '<div class="progress-track">' +
        '<i class="seg-ok" style="width:' + pct(c.ok).toFixed(2) + '%"></i>' +
        '<i class="seg-issue" style="width:' + pct(c.issue).toFixed(2) + '%"></i>' +
      '</div>' +
      '<p class="progress-note">' + done + ' / ' + items.length + ' 확인 완료 · 미확인 ' + c.pending + '건</p>' +
    '</div>';

    html += '<div class="toolbar"><div class="filters">' +
      chip('all', '전체', c.all) +
      chip('pending', '미확인', c.pending) +
      chip('ok', '정상', c.ok) +
      chip('issue', '문제', c.issue) +
      '</div><span class="saveflag" id="saveflag"></span></div>';

    // 채널별 그룹 — 대상 포스트가 많은 채널부터
    var groups = {};
    var order = [];
    items.forEach(function (it) {
      if (!groups[it.channelUid]) { groups[it.channelUid] = []; order.push(it.channelUid); }
      groups[it.channelUid].push(it);
    });

    var shown = 0;
    order.forEach(function (cid) {
      var list = groups[cid].filter(function (it) {
        if (filter === 'all') return true;
        return ((state.checks[it.viewUid] || {}).status || 'pending') === filter;
      });
      if (!list.length) return;
      shown += list.length;

      var head = groups[cid][0];
      var gDone = groups[cid].filter(function (it) {
        return ((state.checks[it.viewUid] || {}).status || 'pending') !== 'pending';
      }).length;
      var gPosts = groups[cid].reduce(function (a, it) { return a + it.posts; }, 0);

      html += '<section class="channel">' +
        '<div class="channel-head">' +
          '<h2>' + esc(head.channelName) + '</h2>' +
          '<span class="channel-meta">channel ' + cid + ' · ' + esc(head.ownerId || '소유자 미상') + '</span>' +
          '<span class="channel-tally">' + gDone + '/' + groups[cid].length + ' 확인 · 포스트 ' + gPosts + '건</span>' +
        '</div><ul class="rows">';

      list.forEach(function (it) { html += rowHtml(it); });
      html += '</ul></section>';
    });

    if (!shown) {
      html += '<p class="empty">이 필터에 해당하는 콘텐츠가 없어.</p>';
    }

    html += '<footer class="colophon">' +
      '<p>대상 판정 정본은 백업 테이블 <code>look360_v3_migration._backup_ind7127_author_20260912</code>의 <code>DISTINCT post_uid</code> ' + state.totalPosts + '건이고, ' +
      '<code>l3_360post_idx.post_uid</code> → <code>view360_uid</code> → <code>l3_vc_360view</code>로 콘텐츠를 집계했어.</p>' +
      '<p>링크 기준은 <code>' + esc(base) + '</code> (netlify · 프록시로 <code>api.look360.co.kr</code>를 봄). ' +
      '대상 포스트 표본 15건을 dev API와 대조하니 작성자 <code>id</code>가 전건 동일했고, VR 콘텐츠는 ' +
      state.netlifyOk + '/' + items.length + '건이 netlify에서 확인됐어. ' +
      '나머지 1건은 <code>hidden=1</code>이라 netlify에 안 떠서 dev <code>' + esc(devBase) + '</code> 링크로 남겼어.</p>' +
      '</footer>';

    html += '</div>';
    root.innerHTML = html;
    bind();
  }

  function chip(key, label, n) {
    return '<button class="chip" type="button" data-filter="' + key + '" aria-pressed="' +
      (filter === key) + '">' + label + '<span class="n">' + n + '</span></button>';
  }

  function rowHtml(it) {
    var chk = state.checks[it.viewUid] || {};
    var v = chk.status || 'pending';
    var cls = v === 'ok' ? ' is-ok' : (v === 'issue' ? ' is-issue' : '');

    var offsite = it.netlify !== 'OK';   // netlify 에서 콘텐츠를 못 찾은 건
    var host = offsite ? devBase : base;

    var flags = '';
    if (offsite) flags += '<span class="flag">netlify 미노출 · dev 전용</span>';
    if (it.hidden) flags += '<span class="flag">숨김 콘텐츠</span>';
    if (it.usePassword) flags += '<span class="flag">암호 걸림</span>';
    if (!it.published) flags += '<span class="flag">미공개</span>';
    if (it.hiddenPosts) flags += '<span class="flag">대상 포스트 ' + it.hiddenPosts + '건 숨김</span>';

    var h = '<li class="row' + cls + '" data-uid="' + it.viewUid + '">' +
      '<div class="row-main">' +
        '<div class="row-title"><span class="name">' + esc(it.contentName) + '</span>' + flags + '</div>' +
        '<div class="row-coords">' + esc(it.domain) + ' · view ' + it.viewUid +
          ' · 파노 ' + it.panoCount + '장 · <span class="posts">대상 포스트 ' + it.posts + '건</span></div>' +
      '</div>' +
      '<div class="row-side">' +
        '<span class="links">' +
          '<a href="' + host + '/vr/' + encodeURIComponent(it.domain) + '" target="_blank" rel="noopener">VR 열기 ↗</a>' +
          (it.samplePost
            ? '<a href="' + host + '/post360/' + it.samplePost + '" target="_blank" rel="noopener">포스트 ' + it.samplePost + ' ↗</a>'
            : '<span class="nolink">공개 포스트 없음</span>') +
        '</span>' +
        '<span class="verdict">' +
          vbtn(it.viewUid, 'pending', '미확인', v) +
          vbtn(it.viewUid, 'ok', '정상', v) +
          vbtn(it.viewUid, 'issue', '문제', v) +
        '</span>' +
      '</div>';

    if (v === 'issue') {
      h += '<div class="note"><textarea id="note-' + it.viewUid + '" data-note="' + it.viewUid +
        '" placeholder="뭐가 잘못됐는지 적어줘 — 작성자가 그대로 look360.kr@gmail.com이다, 포스트가 안 보인다 등">' +
        esc(chk.note || '') + '</textarea></div>';
    }

    return h + '</li>';
  }

  function vbtn(uid, val, label, cur) {
    return '<button type="button" data-v="' + val + '" data-target="' + uid +
      '" aria-pressed="' + (cur === val) + '">' + label + '</button>';
  }

  /* ---------- 이벤트 ---------- */

  function bind() {
    root.querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        filter = b.dataset.filter;
        try { localStorage.setItem(LS_FILTER, filter); } catch (e) { /* 저장 불가 시 무시 */ }
        render();
      });
    });

    root.querySelectorAll('.verdict button').forEach(function (b) {
      b.addEventListener('click', function () {
        var uid = b.dataset.target;
        var cur = state.checks[uid] || {};
        if ((cur.status || 'pending') === b.dataset.v) return;
        cur.status = b.dataset.v;
        if (cur.status !== 'issue') delete cur.note;
        state.checks[uid] = cur;
        render();
        queueSave();
      });
    });

    root.querySelectorAll('textarea[data-note]').forEach(function (t) {
      t.addEventListener('input', function () {
        var uid = t.dataset.note;
        state.checks[uid] = state.checks[uid] || { status: 'issue' };
        state.checks[uid].note = t.value;
        queueSave();
      });
    });
  }

  /* ---------- 부팅 ---------- */

  render();
  flag('저장 위치 확인 중…');

  var use = window.claude && window.claude.use;
  if (!use) {
    mode = 'local';
    mergeLocal();
  } else {
    window.claude.use('artifact').then(function (a) {
      if (a) {
        ns = a;
        mode = 'artifact';
        flag('체크하면 이 페이지에 저장돼');
      } else {
        mode = 'local';
        mergeLocal();
      }
    }, function () {
      mode = 'local';
      mergeLocal();
    });
  }

  function mergeLocal() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(LS_CHECKS) || 'null'); } catch (e) { /* 접근 불가 */ }
    if (saved) {
      Object.keys(saved).forEach(function (k) {
        if (!state.checks[k]) state.checks[k] = saved[k];
      });
      render();
    }
    flag('이 브라우저에만 저장돼');
  }
})();
</script>
</body>
</html>
