<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>돌하우스 모델 비교 — 장소 목록</title>
<meta name="robots" content="noindex">
<style>
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:#f6f5f2; color:#222; }
  main { max-width:880px; margin:0 auto; padding:32px 20px 60px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:#666; font-size:14px; line-height:1.6; margin-bottom:22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  a.card { display:block; background:#fff; border:1px solid #e3e1dc; border-radius:10px; padding:14px 16px; text-decoration:none; color:inherit; }
  a.card:hover { border-color:#e4572e; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .t { font-weight:700; font-size:15px; margin-bottom:4px; }
  .g { font-size:12px; color:#999; }
  .links { margin-top:24px; font-size:13px; line-height:2; }
  .links a { color:#3c6fd8; }
</style>
</head>
<body>
<main>
  <h1>🏠 돌하우스 모델 비교 — 장소 목록</h1>
  <div class="sub">360 사진만으로 세운 돌하우스입니다. 장소를 고르면 «모델 버전» 버튼으로 ZInD 기준점 · 자체 학습 1차 · 2차(가벽 포함/제외)를 바꿔 볼 수 있습니다. 방 위치는 오너가 보정했습니다.</div>
  <div class="grid" id="grid"></div>
  <div class="links">
    📑 <a href="/reports/2026-11-13-dollhouse-howto.html">입문 덱 — 원리·AI 학습·3D IoU 비교</a><br>
    📑 <a href="/reports/2026-11-13-dollhouse-guide.html">첫 PoC 정리 덱 — 제작 방식·촬영 주의점</a>
  </div>
</main>
<script src="/reports/2026-11-13-dollhouse-places/places.js"></script>
<script>
  // 장소 목록은 places.js(파이프라인이 장소를 만들 때마다 갱신)를 그대로 읽는다
  const groups = { mino: '주거', nulbom: '요양병원', starhue: '리조트', indyspot: '인디스팟 사무실·창고', munhyeong: '인디스팟 사무실·창고' };
  const grp = slug => groups[Object.keys(groups).find(k => slug.startsWith(k))] || '기타';
  document.getElementById('grid').innerHTML = (window.__PLACES__ || []).map(p =>
    `<a class="card" href="${p.href}"><div class="t">${p.title}</div><div class="g">${grp(p.slug)}</div></a>`).join('');
</script>
</body>
</html>
