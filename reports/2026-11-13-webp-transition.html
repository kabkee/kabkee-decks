<h1 id="filespano-webp-%EC%A0%84%ED%99%98-%EA%B2%80%ED%86%A0">files/pano WebP 전환 검토</h1>
<h2 id="krpano-%ED%98%B8%ED%99%98--%EA%B8%B0%EC%A1%B4-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%A0%84%EC%88%98-%EB%B3%80%ED%99%98--%EC%8B%A0%EA%B7%9C-%ED%83%80%EC%9D%BC-%EC%83%9D%EC%84%B1--%EC%BD%94%EB%93%9C-%EC%A0%84%ED%99%98-%EA%B3%84%ED%9A%8D">krpano 호환 · 기존 데이터 전수 변환 · 신규 타일 생성 · 코드 전환 계획</h2>
<hr />
<p>Indyspot AI Corp  ·  Engineering Manager  ·  2026-11-13</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-class="agenda" data-theme="clean" lang="C" class="agenda" data-marpit-pagination="2" style="--paginate:true;--class:agenda;--theme:clean;" data-marpit-pagination-total="22">
<h2 id="%EA%B2%B0%EB%A1%A0--%EC%8B%A0%EA%B7%9C%EB%8A%94-webp%EB%A1%9C-%EC%A0%84%ED%99%98%ED%95%98%EA%B3%A0-%EA%B8%B0%EC%A1%B4-%EC%A0%84%EC%88%98-%EB%B3%80%ED%99%98%EC%9D%80-%EC%A7%80%EA%B8%88-%ED%95%98%EC%A7%80-%EC%95%8A%EB%8A%94-%EA%B2%83%EC%9D%84-%EA%B6%8C%ED%95%A9%EB%8B%88%EB%8B%A4">결론 — 신규는 WebP로 전환하고, 기존 전수 변환은 지금 하지 않는 것을 권합니다</h2>
<div class="cols">
<div class="col">
<h3 id="%E2%91%A0-krpano-%ED%98%B8%ED%99%98">① krpano 호환</h3>
<ul>
<li>뷰어 <span class="hl-green">가능</span> · 브라우저가 디코딩 (client·레거시 1.23.3, admin 1.22.4)</li>
<li>타일 도구 <span class="hl-amber">불가</span> · krpanotools 는 JPEG·TIFF 만 출력 → 변환 단계 추가</li>
</ul>
<h3 id="%E2%91%A1-%EC%8B%A0%EA%B7%9C-%ED%83%80%EC%9D%BC-webp">② 신규 타일 WebP</h3>
<ul>
<li><span class="hl-green">권장</span> · 현재 JPG q60 과 같은 화질 = WebP <span class="hl-blue">q45 (−31%)</span></li>
<li>여유를 두면 WebP q50 (−25%, 화질 약간 ↑)</li>
<li>단, krpanotools 는 <span class="hl-blue">JPG q100 · 4:4:4</span> 로 출력한 뒤 변환</li>
</ul>
</div>
<div class="col">
<h3 id="%E2%91%A2-%EA%B8%B0%EC%A1%B4-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%A0%84%EC%88%98-%EB%B3%80%ED%99%98">③ 기존 데이터 전수 변환</h3>
<ul>
<li><span class="hl-amber">보류 권장</span> · 대상 JPG 352GB · 1,322만 개</li>
<li>이미 JPG q60 이라 재인코딩하면 화질이 한 번 더 떨어짐</li>
<li>타일 −26%(q60) 줄여도 월 저장비 절감은 약 $2 수준 (추정)</li>
</ul>
<h3 id="%E2%91%A3-%EC%A0%84%EC%A0%9C-%EC%A1%B0%EA%B1%B4">④ 전제 조건</h3>
<ul>
<li>JPG·WebP 가 장면마다 섞이므로 <span class="hl-blue">파노마다 확장자 값</span>을 두고 읽어야 함</li>
<li>og:image·메일 이미지는 JPG 유지</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="3" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="22">
<h2 id="%F0%9F%8E%AF-%EA%B2%B0%EC%A0%95-%ED%95%84%EC%9A%94--%EC%98%A4%EB%84%88-%ED%99%95%EC%9D%B8-%EC%82%AC%ED%95%AD"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 결정 필요 — 오너 확인 사항</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>결정할 것</th>
<th>제안</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>신규 타일 품질</td>
<td><span class="hl-blue">WebP q50</span> (−25%, 화질 약간 ↑) · 용량 우선이면 q45 (−31%, 지금과 같은 화질)</td>
</tr>
<tr>
<td>2</td>
<td>기존 1,322만 개 전수 변환</td>
<td><span class="hl-amber">보류</span> · 대신 조회 상위 장면만 원본에서 다시 생성 (선택)</td>
</tr>
<tr>
<td>3</td>
<td>모바일·VR 큐브 (<code>512_</code> · <code>1024_</code>)</td>
<td><span class="hl-blue">WebP 로 통일</span> · JPG 대체본을 따로 두지 않음</td>
</tr>
<tr>
<td>4</td>
<td>지원 하한</td>
<td>iOS 14 · macOS 11 Safari 미만 제외 · 실제 사용자 약 0.002% (GA4 90일 실측)</td>
</tr>
<tr>
<td>5</td>
<td>진행 방식</td>
<td>에픽 발주 또는 직접 구현 (오빠 지시 필요)</td>
</tr>
</tbody>
</table>
<p>전환 작업 순서는 «읽는 쪽 먼저(확장자 값 지원) → 만드는 쪽(utils) → 신규 1~2건 시범» 입니다. 읽는 쪽을 먼저 배포하면 모든 값이 <code>jpg</code> 인 상태라 서비스 동작은 바뀌지 않습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="4" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="22">
<h2 id="%EB%8C%80%EC%83%81-%EA%B7%9C%EB%AA%A8--filespano-%EC%8B%A4%EC%B8%A1-4477gb-%EA%B7%B8%EC%A4%91-jpg-352gb">대상 규모 — files/pano 실측 447.7GB, 그중 JPG 352GB</h2>
<p>백업 목록표(2026-11-12 기준, 현재 버전만 집계)로 셌습니다. 서버 마운트는 순회하지 않았습니다.</p>
<table>
<thead>
<tr>
<th>구분</th>
<th>개수</th>
<th>용량</th>
<th>전환 대상</th>
</tr>
</thead>

<h2 id="ssim-%EC%9D%B4%EB%9E%80--%EC%9B%90%EB%B3%B8%EA%B3%BC-%C2%AB%EC%82%AC%EB%9E%8C-%EB%88%88%EC%97%90%C2%BB-%EC%96%BC%EB%A7%88%EB%82%98-%EB%B9%84%EC%8A%B7%ED%95%9C%EC%A7%80%EB%A5%BC-01-%EB%A1%9C-%EB%82%98%ED%83%80%EB%82%B8-%EA%B0%92">SSIM 이란 — 원본과 «사람 눈에» 얼마나 비슷한지를 0~1 로 나타낸 값</h2>
<p>SSIM(Structural Similarity, 구조적 유사도)은 1 이면 원본과 같고, 낮을수록 많이 망가진 것입니다. 픽셀을 하나씩 빼는 대신 작은 창(약 11픽셀)으로 훑으며 세 가지를 비교하고, 창마다 나온 점수를 평균합니다.</p>
<table>
<thead>
<tr>
<th>비교 항목</th>
<th>의미</th>
<th>망가지는 예</th>
</tr>
</thead>
<tbody>
<tr>
<td>밝기</td>
<td>그 영역의 평균 밝기가 같은가</td>
<td>전체가 어두워짐</td>
</tr>
<tr>
<td>대비</td>
<td>밝고 어두운 차이의 폭이 같은가</td>
<td>질감이 뭉개져 밋밋해짐</td>
</tr>
<tr>
<td>구조</td>
<td>무늬·경계의 모양이 같은가</td>
<td>블록 무늬, 선이 흐려짐</td>
</tr>
</tbody>
</table>
<ul>
<li>이 덱의 값은 모두 <strong>보정 원본(retouched.jpg) 대비</strong>입니다. WebP q45 = 0.8517 은 «원본에서 벗어난 정도가 지금 JPG q60(0.8515)과 같다»는 뜻입니다.</li>
<li>0.85 는 512 타일의 미세 질감까지 따진 값이라 낮아 보일 뿐입니다. <strong>절대값이 아니라 같은 원본끼리 비교</strong>하는 용도입니다.</li>
<li>밝기 채널만 계산했으므로 색 번짐은 거의 반영되지 않습니다.</li>
</ul>
<p><span class="hl-amber">한계</span> SSIM 이 같아도 손실 모양은 다릅니다. JPG 는 8×8 블록 무늬, WebP 는 질감이 부드럽게 뭉개집니다. 그래서 q45 를 «같은 화질»로 보되 기본값은 q50 으로 제안하고, 결정 전에는 신규 장면 1개를 뷰어에서 직접 비교하는 것을 권합니다.</p>

/* 스크린샷 클릭 → 확대 보기
   · 열면 먼저 화면에 꽉 맞춰 보여주고, 한 번 더 누르면 원본 100% 크기로 확대
   · 확대 상태에서 드래그(모바일은 한 손가락)로 이동, 휠·핀치로 자유 배율
   · ESC·✕·배경 클릭으로 닫기 (오너 상시 요구 · 2026-10-06 도입)                      */
(() => {
  if (window.__lb) return; window.__lb = 2;   // 2 = 원본 크기 확대판(2026-11-04)

  const PAD = 28, MAXZ = 4;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:99999;display:none;overflow:hidden;' +
    'background:rgba(10,14,22,.93);touch-action:none;-webkit-user-select:none;user-select:none';

  const im = document.createElement('img');
  im.draggable = false;
  im.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;' +
    'border-radius:4px;box-shadow:0 12px 44px rgba(0,0,0,.5);will-change:transform';
  ov.appendChild(im);

  const hud = document.createElement('div');
  hud.style.cssText = 'position:absolute;right:16px;top:14px;display:flex;gap:8px;align-items:center;' +
    'font:600 13px/1 system-ui,-apple-system,sans-serif;color:#eaf0fb;pointer-events:none';
  const chip = 'background:rgba(255,255,255,.15);padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px)';
  const tip = document.createElement('span'); tip.style.cssText = chip + ';transition:opacity .4s';
  const pct = document.createElement('span'); pct.style.cssText = chip + ';font-variant-numeric:tabular-nums';
  const xb  = document.createElement('button'); xb.textContent = '✕'; xb.setAttribute('aria-label', '닫기');
  xb.style.cssText = chip + ';pointer-events:auto;border:0;color:#fff;width:36px;height:36px;padding:0;' +
    'font:600 16px/1 system-ui;cursor:pointer';
  hud.append(tip, pct, xb);
  ov.appendChild(hud);

  let nw = 0, nh = 0, fit = 1, s = 1, tx = 0, ty = 0;
  let drag = false, lx = 0, ly = 0, moved = false, tipT = 0;

  const clamp = () => {
    const W = innerWidth, H = innerHeight, w = nw * s, h = nh * s;
    tx = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, tx));
    ty = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, ty));
  };
  const draw = () => {
    im.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    pct.textContent = Math.round(s * 100) + '%';
    const big = nw * s > innerWidth + 1 || nh * s > innerHeight + 1;
    im.style.cursor = big ? (drag ? 'grabbing' : 'grab') : (s < 1 ? 'zoom-in' : 'zoom-out');
  };
  const zoom = (ns, cx, cy) => {
    ns = Math.max(Math.min(fit, 1) * 0.9, Math.min(ns, MAXZ));
    const k = ns / s;
    tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k;
    s = ns; clamp(); draw();
  };
  const showTip = (t) => {
    tip.textContent = t; tip.style.opacity = '1';
    clearTimeout(tipT); tipT = setTimeout(() => { tip.style.opacity = '0'; }, 2600);
  };
  const close = () => { ov.style.display = 'none'; im.removeAttribute('src'); document.body.style.overflow = ''; };

  const open = (src) => {
    im.onload = () => {
      nw = im.naturalWidth; nh = im.naturalHeight;
      im.style.width = nw + 'px'; im.style.height = nh + 'px';
      fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
      s = Math.min(fit, 1);            // 원본보다 크게는 띄우지 않는다
      tx = ty = 0; clamp(); draw();
      showTip(fit < 0.995 ? '클릭하면 원본 크기 · 드래그 이동 · ESC 닫기' : '휠로 확대 · ESC 닫기');
    };
    im.src = src;
    ov.style.display = 'block';
    document.body.style.overflow = 'hidden';
  };

  // 배경 클릭 → 닫기 / 이미지 클릭 → 맞춤 ↔ 원본 토글
  ov.addEventListener('click', (e) => {
    e.stopPropagation();
    if (moved) { moved = false; return; }
    if (e.target === xb || e.target === ov) { close(); return; }
    if (e.target === im) {
      const f = Math.min(fit, 1);
      zoom(s > f + 0.005 ? f : Math.max(1, f * 2), e.clientX, e.clientY);
    }
  });

  // 드래그 이동 (마우스 · 터치 공통)
  im.addEventListener('pointerdown', (e) => {
    if (nw * s <= innerWidth && nh * s <= innerHeight) return;
    drag = true; moved = false; lx = e.clientX; ly = e.clientY;
    im.setPointerCapture(e.pointerId); draw(); e.preventDefault();
  });
  im.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    tx += dx; ty += dy; lx = e.clientX; ly = e.clientY; clamp(); draw();
  });
  const endDrag = (e) => { if (drag) { drag = false; try { im.releasePointerCapture(e.pointerId); } catch (_) {} draw(); } };
  im.addEventListener('pointerup', endDrag);
  im.addEventListener('pointercancel', endDrag);

  // 휠 줌 (슬라이드 전환으로 새지 않게 차단)
  ov.addEventListener('wheel', (e) => {
    e.preventDefault(); e.stopPropagation();
    zoom(s * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY);
  }, { passive: false });

  // 핀치 줌
  let pts = new Map(), pd = 0;
  ov.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') pts.set(e.pointerId, e); });
  ov.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'touch' || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pts.size !== 2) return;
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pd) { moved = true; zoom(s * (d / pd), (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); }
    pd = d;
  });
  const dropPt = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pd = 0; };
  ov.addEventListener('pointerup', dropPt);
  ov.addEventListener('pointercancel', dropPt);

  // 열려 있는 동안 키보드는 전부 여기서 소비 (화살표가 슬라이드를 넘기면 안 된다)
  document.addEventListener('keydown', (e) => {
    if (ov.style.display === 'none') return;
    const cx = innerWidth / 2, cy = innerHeight / 2;
    if (e.key === 'Escape') close();
    else if (e.key === '+' || e.key === '=') zoom(s * 1.25, cx, cy);
    else if (e.key === '-' || e.key === '_') zoom(s / 1.25, cx, cy);
    else if (e.key === '0') zoom(Math.min(fit, 1), cx, cy);
    else if (e.key === '1') zoom(1, cx, cy);
    else if (e.key === 'ArrowLeft') { tx += 60; clamp(); draw(); }
    else if (e.key === 'ArrowRight') { tx -= 60; clamp(); draw(); }
    else if (e.key === 'ArrowUp') { ty += 60; clamp(); draw(); }
    else if (e.key === 'ArrowDown') { ty -= 60; clamp(); draw(); }
    else return;
    e.preventDefault(); e.stopPropagation();
  }, true);

  addEventListener('resize', () => {
    if (ov.style.display === 'none' || !nw) return;
    fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
    clamp(); draw();
  });

  const ready = () => {
    document.body.appendChild(ov);
    document.addEventListener('click', (e) => {
      const t = e.target;
      if (t && t.tagName === 'IMG' && t.closest('section') && !t.classList.contains('emoji')) {
        e.preventDefault(); e.stopPropagation(); open(t.currentSrc || t.src);
      }
    }, true);
  };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', ready) : ready();
})();
</script>
