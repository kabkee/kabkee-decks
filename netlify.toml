[build]
  publish = "dist"

# ===== 검색엔진 색인 전면 차단 (2026-10-24 오너 결정) =====
# kabkee-decks 는 주간 업무 보고·보안 사고 보고·내부 감사 자료가 섞인
# 개인 작업물 저장소다. 링크를 직접 받은 사람은 그대로 볼 수 있지만,
# 검색 결과에는 어떤 페이지도 노출되지 않아야 한다.
#   · X-Robots-Tag  : 이미 색인된 페이지를 "색인에서 빼라"고 적극 지시 (robots.txt 보다 강력)
#   · robots.txt    : 신규 크롤링 자체를 차단
# 공개용 콘텐츠는 Netlify 가 아니라 kabkee.github.io 블로그에 올린다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"

# ===== 장소 글 검토 페이지 — 버전별 공유 주소 (2026-11-18 오너 요청) =====
# 파일 이름(날짜 포함) 대신 고정 주소로 링크를 공유한다. status 200 = rewrite(주소창은 공유 주소 그대로).
#   /reports/place-scores     → 현재 버전(v3 가이드) · 새 버전이 나오면 이 줄만 바꾼다
#   /reports/place-scores/v1  → v1 블로그 감성 4편(보관)
#   /reports/place-scores/v2  → v2 현장 리포트 10편(보관)
#   /reports/place-scores/v3  → v3 가이드 10편
# 생성: look360_content_studio/scripts/visitor-place-text/version-nav.mjs (탭이 이 주소를 절대 경로로 가리킨다)
[[redirects]]
  from = "/reports/place-scores/v1"
  to = "/reports/2026-11-18-place-feel-scores.html"
  status = 200
[[redirects]]
  from = "/reports/place-scores/v2"
  to = "/reports/2026-11-18-place-report-scores.html"
  status = 200
[[redirects]]
  from = "/reports/place-scores/v3"
  to = "/reports/2026-11-18-place-guide-scores.html"
  status = 200
[[redirects]]
  from = "/reports/place-scores"
  to = "/reports/2026-11-18-place-guide-scores.html"
  status = 200

# ===== 레거시 번역 문제 문구 수정 요청 페이지 (2026-11-25 · IND-9870) =====
# 날짜 파일명 대신 고정 주소로 공유한다. status 200 = rewrite(주소창은 공유 주소 그대로).
# 🚫 `reports/translation-issues/` 폴더를 만들지 말 것 — 폴더와 파일이 같은 이름이면 Netlify
#    pretty URL 이 충돌해 «배포 성공인데 다른 화면» 이 된다(2026-11-13 실측).
[[redirects]]
  from = "/reports/translation-issues"
  to = "/reports/2026-11-25-legacy-translation-issues.html"
  status = 200
