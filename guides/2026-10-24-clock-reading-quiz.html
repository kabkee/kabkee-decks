<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="초등학교 1학년 시계 읽기(몇 시 몇 분) 인지 능력 테스트 — 모바일 최적화, 즉시 정답 확인">
<title>시계 읽기 테스트 · 몇 시 몇 분일까? (초1)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='white' stroke='%232563eb' stroke-width='8'/><line x1='50' y1='50' x2='50' y2='24' stroke='%231e293b' stroke-width='8' stroke-linecap='round'/><line x1='50' y1='50' x2='72' y2='58' stroke='%232563eb' stroke-width='6' stroke-linecap='round'/></svg>">
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --blue:#2563eb; --blue-d:#1d4ed8; --green:#16a34a; --green-bg:#dcfce7;
    --red:#dc2626; --red-bg:#fee2e2; --yellow:#f59e0b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 14px calc(16px + env(safe-area-inset-bottom))}
  /* ---------- 공통 ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
  h2{font-size:1.1rem;font-weight:800;margin-bottom:10px}
  .muted{color:var(--sub);font-size:.86rem}
  button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;background:none;color:inherit}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:56px;border-radius:14px;font-weight:800;font-size:1.05rem;
    background:var(--blue);color:#fff;transition:transform .08s,background .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue)}
  .btn.gray{background:#e2e8f0;color:#334155}
  .btn:disabled{opacity:.45}
  /* ---------- 헤더 ---------- */
  header{padding:18px 4px 12px;text-align:center}
  header .sub{color:var(--sub);font-size:.85rem;margin-top:4px}
  /* ---------- 설정 화면 ---------- */
  .opt-group{margin-bottom:18px}
  .opt-group > .label{font-size:.78rem;font-weight:800;color:var(--blue);letter-spacing:.06em;margin-bottom:8px;text-transform:uppercase}
  .opts{display:grid;gap:8px}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    border:2px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;
  }
  .opt .t{display:block;font-weight:700}
  .opt .d{display:block;font-size:.78rem;color:var(--sub);margin-top:2px;line-height:1.35}
  .opt[aria-pressed="true"]{border-color:var(--blue);background:#eff6ff}
  .opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;flex:none;position:relative}
  .opt[aria-pressed="true"] .dot{border-color:var(--blue)}
  .opt[aria-pressed="true"] .dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--blue)}
  .opts.row{grid-template-columns:repeat(3,1fr)}
  .opts.row .opt{justify-content:center;text-align:center;flex-direction:column;gap:2px;padding:14px 6px}
  .opts.row .dot{display:none}
  /* ---------- 진행바 ---------- */
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 2px 12px}
  .bar{flex:1;height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
  .count{font-size:.85rem;font-weight:800;color:var(--sub);font-variant-numeric:tabular-nums}
  .score-chip{font-size:.8rem;font-weight:800;background:var(--green-bg);color:#15803d;padding:4px 10px;border-radius:99px}
  /* ---------- 문제 ---------- */
  .qtype{display:inline-block;font-size:.72rem;font-weight:800;color:#fff;background:var(--yellow);padding:3px 10px;border-radius:99px;margin-bottom:10px}
  .qtext{font-size:1.2rem;font-weight:800;line-height:1.45;margin-bottom:14px}
  .clock-wrap{display:flex;justify-content:center;padding:4px 0 14px}
  .clock-wrap svg{width:min(78vw,280px);height:auto}
  .digital{
    text-align:center;font-weight:800;font-size:2.6rem;letter-spacing:.02em;
    background:#0f172a;color:#4ade80;border-radius:16px;padding:16px 10px;margin:4px 0 16px;
    font-variant-numeric:tabular-nums;
  }
  /* 선택지 */
  .choices{display:grid;gap:10px}
  .choice{
    width:100%;min-height:58px;border:2px solid var(--line);border-radius:14px;background:#fff;
    font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:12px;padding:10px 14px;text-align:left;
  }
  .choice .num{width:28px;height:28px;flex:none;border-radius:8px;background:#f1f5f9;color:var(--sub);
    font-size:.85rem;display:flex;align-items:center;justify-content:center;font-weight:800}
  .choice:active{transform:scale(.99)}
  .choice.ok{border-color:var(--green);background:var(--green-bg)}
  .choice.no{border-color:var(--red);background:var(--red-bg)}
  .choices.clocks{grid-template-columns:1fr 1fr}
  .choices.clocks .choice{flex-direction:column;justify-content:center;gap:4px;padding:10px 4px}
  .choices.clocks .choice svg{width:100%;height:auto;max-width:150px}
  /* 직접 입력 */
  .inputs{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:14px}
  .inputs .f{text-align:center}
  .inputs .f span{display:block;font-size:.78rem;color:var(--sub);font-weight:700;margin-bottom:4px}
  .inputs input{
    width:92px;height:76px;border:3px solid var(--line);border-radius:14px;text-align:center;
    font-size:2.1rem;font-weight:800;font-family:inherit;color:var(--ink);background:#fff;
    font-variant-numeric:tabular-nums;
  }
  .inputs input:focus{outline:none;border-color:var(--blue);background:#eff6ff}
  .inputs .unit{font-size:1.4rem;font-weight:800;padding-bottom:22px}
  /* 피드백 */
  .fb{border-radius:16px;padding:14px;margin-top:14px;display:none}
  .fb.show{display:block;animation:pop .25s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .fb.ok{background:var(--green-bg);border:2px solid #86efac}
  .fb.no{background:var(--red-bg);border:2px solid #fca5a5}
  .fb .head{font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:8px}
  .fb.ok .head{color:#15803d}
  .fb.no .head{color:#b91c1c}
  .fb .exp{font-size:.92rem;margin-top:8px;color:#334155;line-height:1.6}
  .fb .btn{margin-top:12px}
  .hintbtn{display:block;margin:0 auto 6px;font-size:.82rem;color:var(--blue);font-weight:800;padding:8px 14px;border-radius:99px;background:#eff6ff}
  /* ---------- 결과 ---------- */
  .big-score{text-align:center;padding:10px 0 4px}
  .big-score .emo{font-size:3.4rem;line-height:1}
  .big-score .n{font-size:3rem;font-weight:800;letter-spacing:-.03em;margin-top:4px}
  .big-score .n small{font-size:1.2rem;color:var(--sub);font-weight:700}
  .big-score .msg{font-weight:800;color:var(--blue);margin-top:6px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
  .stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat .v{font-size:1.3rem;font-weight:800}
  .stat .k{font-size:.72rem;color:var(--sub);font-weight:700;margin-top:2px}
  .bd-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:.85rem}
  .bd-row .nm{width:92px;flex:none;font-weight:700;color:#334155}
  .bd-row .bar{height:8px}
  .bd-row .vv{width:52px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--sub)}
  .review{margin-top:14px}
  .rv{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff;display:flex;gap:12px;align-items:center}
  .rv svg{width:62px;height:62px;flex:none}
  .rv .q{font-size:.8rem;color:var(--sub);font-weight:700}
  .rv .a{font-size:.92rem;font-weight:800;margin-top:3px}
  .rv .a .bad{color:var(--red);text-decoration:line-through;font-weight:700}
  .rv .a .good{color:var(--green)}
  footer{text-align:center;padding:22px 0 8px;color:#94a3b8;font-size:.74rem;line-height:1.7}
  .hide{display:none !important}
  .spacer{flex:1}
</style>
</head>
<body>
<div class="app">

  <!-- ======== 시작 화면 ======== -->
  <div id="view-home">
    <header>
      <h1>🕐 몇 시 몇 분일까?</h1>
      <div class="sub">초등학교 1학년 시계 읽기 인지 능력 테스트</div>
    </header>

    <div class="card">
      <div class="opt-group">
        <div class="label">난이도</div>
        <div class="opts" id="sel-level"></div>
      </div>

      <div class="opt-group">
        <div class="label">문제 수</div>
        <div class="opts row" id="sel-count"></div>
      </div>

      <div class="opt-group">
        <div class="label">도움 설정</div>
        <div class="opts" id="sel-help"></div>
      </div>

      <button class="btn" id="btn-start">시작하기 →</button>
    </div>

    <div class="card" id="history-card" style="margin-top:12px;display:none">
      <h2>📋 지난 기록</h2>
      <div id="history-list"></div>
    </div>

    <footer>
      짧은바늘 = 시(時) · 긴바늘 = 분(分)<br>
      kabkee-decks · 2026-10-24
    </footer>
  </div>

  <!-- ======== 퀴즈 화면 ======== -->
  <div id="view-quiz" class="hide">
    <div class="topbar">
      <span class="count" id="q-count">1 / 10</span>
      <div class="bar"><i id="q-bar" style="width:0%"></i></div>
      <span class="score-chip" id="q-score">0점</span>
    </div>
    <div class="card" id="q-card"></div>
    <div class="spacer"></div>
    <footer><button class="hintbtn" id="btn-quit">그만하기</button></footer>
  </div>

  <!-- ======== 결과 화면 ======== -->
  <div id="view-result" class="hide">
    <header><h1>결과</h1></header>
    <div class="card" id="result-card"></div>
    <footer>kabkee-decks · 시계 읽기 테스트</footer>
  </div>

</div>

<script>
(function(){
"use strict";

/* =========================================================
   1. 설정 데이터
   ========================================================= */
var LEVELS = [
  { id:'lv1', t:'1단계 · 정각',        d:'1시, 2시 … 긴바늘이 12를 가리켜요',      mins:[0] },
  { id:'lv2', t:'2단계 · 정각과 30분',  d:'3시, 3시 30분 (교과서 1학년 범위)',      mins:[0,30] },
  { id:'lv3', t:'3단계 · 5분 단위',     d:'5분, 10분, 15분 … 긴바늘이 숫자를 가리켜요', mins:[0,5,10,15,20,25,30,35,40,45,50,55] },
  { id:'lv4', t:'4단계 · 1분 단위',     d:'7시 23분처럼 눈금을 세어 읽어요',         mins:null },
  { id:'lv5', t:'5단계 · 종합(섞어서)',  d:'모든 난이도 + 「몇 분 뒤」 응용 문제',     mins:'mix' }
];
var COUNTS = [5,10,20];

var state = {
  level:'lv2', count:10, showMinuteNumbers:true,
  qs:[], idx:0, answers:[], startedAt:0, qStartedAt:0, answered:false
};

/* =========================================================
   2. 시계 SVG
   ========================================================= */
function clockSVG(h, m, o){
  o = o || {};
  var size = o.size || 300, c = size/2, r = c - 8;
  var showMin = !!o.showMinuteNumbers;
  var s = '<svg viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="시계">';
  s += '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="#fff" stroke="#1e293b" stroke-width="'+(size*0.022)+'"/>';
  // 눈금
  var i, a, r1, r2, big;
  for(i=0;i<60;i++){
    a = i*6*Math.PI/180; big = (i%5===0);
    r1 = r - (big ? size*0.055 : size*0.028); r2 = r - size*0.012;
    s += '<line x1="'+(c+r1*Math.sin(a)).toFixed(1)+'" y1="'+(c-r1*Math.cos(a)).toFixed(1)+
         '" x2="'+(c+r2*Math.sin(a)).toFixed(1)+'" y2="'+(c-r2*Math.cos(a)).toFixed(1)+
         '" stroke="'+(big?'#334155':'#cbd5e1')+'" stroke-width="'+(big?size*0.012:size*0.006)+'" stroke-linecap="round"/>';
  }
  // 시 숫자
  for(i=1;i<=12;i++){
    a = i*30*Math.PI/180; var rr = r - size*0.135;
    s += '<text x="'+(c+rr*Math.sin(a)).toFixed(1)+'" y="'+(c-rr*Math.cos(a)).toFixed(1)+
         '" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="'+(size*0.125)+
         '" font-weight="700" fill="#1e293b">'+i+'</text>';
  }
  // 분 보조 숫자
  if(showMin){
    for(i=0;i<12;i++){
      a = i*30*Math.PI/180; var rm = r - size*0.255;
      s += '<text x="'+(c+rm*Math.sin(a)).toFixed(1)+'" y="'+(c-rm*Math.cos(a)).toFixed(1)+
           '" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="'+(size*0.062)+
           '" font-weight="700" fill="#94a3b8">'+(i*5)+'</text>';
    }
  }
  // 바늘
  var ha = ((h%12)*30 + m*0.5)*Math.PI/180, ma = (m*6)*Math.PI/180;
  var hl = r*0.50, ml = r*0.80;
  s += '<line x1="'+c+'" y1="'+c+'" x2="'+(c+hl*Math.sin(ha)).toFixed(1)+'" y2="'+(c-hl*Math.cos(ha)).toFixed(1)+
       '" stroke="#0f172a" stroke-width="'+(size*0.032)+'" stroke-linecap="round"/>';
  s += '<line x1="'+c+'" y1="'+c+'" x2="'+(c+ml*Math.sin(ma)).toFixed(1)+'" y2="'+(c-ml*Math.cos(ma)).toFixed(1)+
       '" stroke="#2563eb" stroke-width="'+(size*0.021)+'" stroke-linecap="round"/>';
  s += '<circle cx="'+c+'" cy="'+c+'" r="'+(size*0.028)+'" fill="#0f172a"/>';
  s += '</svg>';
  return s;
}

/* =========================================================
   3. 유틸
   ========================================================= */
function rnd(n){ return Math.floor(Math.random()*n); }
function pick(arr){ return arr[rnd(arr.length)]; }
function shuffle(a){ var i,j,t; for(i=a.length-1;i>0;i--){ j=rnd(i+1); t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function timeText(h,m){ return m===0 ? (h+'시') : (h+'시 '+m+'분'); }
// 끝 글자 받침 유무 (한글 + 숫자)
function hasBatchim(s){
  s = String(s);
  var last = s.charAt(s.length-1);
  var code = last.charCodeAt(0);
  if(code >= 0xAC00 && code <= 0xD7A3) return ((code - 0xAC00) % 28) !== 0;
  if(/[0-9]/.test(last)) return [true,true,false,true,false,false,true,true,true,false][Number(last)];
  return true;
}
// 조사 붙이기 — josa('3시','이야','야')
function josa(s, withB, noB){ return s + (hasBatchim(s) ? withB : noB); }
function pad(n){ return (n<10?'0':'')+n; }
function hourRange(h){ var nx = (h===12)?1:h+1; return josa(String(h), '과 ', '와 ')+nx; }

// 난이도별 (시, 분) 뽑기
function randTime(levelId){
  var lv = LEVELS.filter(function(l){ return l.id===levelId; })[0];
  var mins = lv.mins;
  if(mins === 'mix'){
    mins = pick([[0],[0,30],[0,5,10,15,20,25,30,35,40,45,50,55],null]);
  }
  var h = 1 + rnd(12);
  var m = (mins === null) ? rnd(60) : pick(mins);
  return { h:h, m:m };
}

/* =========================================================
   4. 문제 생성
   ========================================================= */
function makeQuestion(levelId){
  var pool = ['read-input','read-choice','match-clock','hand'];
  if(levelId === 'lv5') pool = pool.concat(['later']);
  var type = pick(pool);
  var t = randTime(levelId);

  if(type === 'read-input'){
    return {
      type:'read-input', kind:'직접 쓰기', h:t.h, m:t.m,
      q:'시계를 보고 몇 시 몇 분인지 써 보자.',
      clock:{h:t.h,m:t.m}, answer:timeText(t.h,t.m)
    };
  }

  if(type === 'read-choice'){
    var right = timeText(t.h,t.m);
    var cand = {}; cand[right] = 1;
    var list = [right];
    var tries = 0;
    while(list.length < 4 && tries < 60){
      tries++;
      var w, mode = rnd(4);
      if(mode === 0){ // 시침 한 칸 오독
        w = timeText(t.h===12 ? 1 : t.h+1, t.m);
      } else if(mode === 1){ // 시/분 뒤바꿈 (분침 숫자를 시로 읽는 흔한 오류)
        var hh = (t.m===0) ? 12 : Math.round(t.m/5);
        if(hh===0) hh = 12;
        w = timeText(hh, (t.h%12)*5);
      } else if(mode === 2){ // 분 ±5
        var mm = t.m + (rnd(2)?5:-5);
        if(mm<0) mm += 60; if(mm>59) mm -= 60;
        w = timeText(t.h, mm);
      } else { // 랜덤
        var r2 = randTime(levelId); w = timeText(r2.h,r2.m);
      }
      if(!cand[w]){ cand[w]=1; list.push(w); }
    }
    return {
      type:'read-choice', kind:'골라 보기', h:t.h, m:t.m,
      q:'시계가 가리키는 시각을 골라 보자.',
      clock:{h:t.h,m:t.m}, choices:shuffle(list), answer:right
    };
  }

  if(type === 'match-clock'){
    var opts = [{h:t.h,m:t.m}];
    var seen = {}; seen[t.h+':'+t.m] = 1;
    var tr = 0;
    while(opts.length < 4 && tr < 80){
      tr++;
      var o, md = rnd(3);
      if(md === 0) o = {h:(t.h===12?1:t.h+1), m:t.m};
      else if(md === 1){ var m2 = t.m + pick([5,10,-5,-10,30]); if(m2<0)m2+=60; if(m2>59)m2-=60; o = {h:t.h,m:m2}; }
      else { var r3 = randTime(levelId); o = {h:r3.h,m:r3.m}; }
      var key = o.h+':'+o.m;
      if(!seen[key]){ seen[key]=1; opts.push(o); }
    }
    return {
      type:'match-clock', kind:'시계 찾기', h:t.h, m:t.m,
      q:'「'+timeText(t.h,t.m)+'」'+(hasBatchim(timeText(t.h,t.m))?'을':'를')+' 나타내는 시계는 어느 것일까?',
      clockChoices:shuffle(opts), answer:t.h+':'+t.m
    };
  }

  if(type === 'hand'){
    // 바늘 인지 문제
    if(t.m === 0) t.m = pick([5,10,15,20,25,30,35,40,45,50,55]);
    var sub = pick(['hour-between','minute-number','minute-value']);
    if(sub === 'minute-number' && t.m % 5 !== 0) sub = 'minute-value';

    if(sub === 'hour-between'){
      var ans = hourRange(t.h) + ' 사이';
      var ws = [];
      [-2,-1,1,2].forEach(function(d){
        var hh = t.h + d; if(hh<1) hh+=12; if(hh>12) hh-=12;
        ws.push(hourRange(hh)+' 사이');
      });
      var cl = [ans].concat(shuffle(ws).filter(function(x){return x!==ans;}).slice(0,3));
      return {
        type:'read-choice', kind:'바늘 보기', h:t.h, m:t.m,
        q:'짧은바늘(시침)은 어떤 숫자 사이에 있을까?',
        clock:{h:t.h,m:t.m}, choices:shuffle(cl), answer:ans,
        exp:'짧은바늘이 '+hourRange(t.h)+' 사이에 있으니까 「'+t.h+'시」가 지난 거야.'
      };
    }
    if(sub === 'minute-number'){
      var n = t.m/5; if(n===0) n=12;
      var a2 = n+'';
      var w2 = [];
      [1,2,-1,-2].forEach(function(d){ var v=n+d; if(v<1)v+=12; if(v>12)v-=12; w2.push(v+''); });
      var cl2 = [a2].concat(shuffle(w2).filter(function(x){return x!==a2;}).slice(0,3));
      return {
        type:'read-choice', kind:'바늘 보기', h:t.h, m:t.m,
        q:'긴바늘(분침)이 가리키는 숫자는 무엇일까?',
        clock:{h:t.h,m:t.m}, choices:shuffle(cl2), answer:a2,
        exp:'긴바늘이 '+josa(a2,'을','를')+' 가리키니까 '+a2+'×5 = '+t.m+'분이야.'
      };
    }
    var a3 = t.m+'분';
    var w3 = [];
    [1,-1,2,-2,5,-5].forEach(function(d){ var v=t.m+d; if(v<0)v+=60; if(v>59)v-=60; w3.push(v+'분'); });
    var cl3 = [a3].concat(shuffle(w3).filter(function(x){return x!==a3;}).slice(0,3));
    return {
      type:'read-choice', kind:'바늘 보기', h:t.h, m:t.m,
      q:'이 시계는 몇 분일까?',
      clock:{h:t.h,m:t.m}, choices:shuffle(cl3), answer:a3,
      exp:'긴바늘이 가리키는 곳은 '+t.m+'분이야.'
    };
  }

  // later : 몇 분 뒤 / 몇 시간 뒤 — 1학년 수준을 위해 5분 단위 시각만 사용
  t = { h: 1 + rnd(12), m: pick([0,0,5,10,15,20,25,30,30,35,40,45,50,55]) };
  var deltas = [[60,'1시간 뒤'],[30,'30분 뒤'],[10,'10분 뒤'],[-30,'30분 전'],[-60,'1시간 전'],[15,'15분 뒤'],[5,'5분 뒤'],[-10,'10분 전']];
  var d0 = pick(deltas);
  var total = (t.h%12)*60 + t.m + d0[0];
  total = ((total % 720) + 720) % 720;
  var nh = Math.floor(total/60); if(nh===0) nh=12;
  var nm = total%60;
  var ansT = timeText(nh,nm);
  var wl = [], seen2 = {}; seen2[ansT]=1;
  var tr2 = 0;
  while(wl.length < 3 && tr2 < 60){
    tr2++;
    var wh = nh + pick([-1,1,0]); if(wh<1) wh+=12; if(wh>12) wh-=12;
    var wm = nm + pick([0,5,10,-5,30]); if(wm<0) wm+=60; if(wm>59) wm-=60;
    var wt = timeText(wh,wm);
    if(!seen2[wt]){ seen2[wt]=1; wl.push(wt); }
  }
  return {
    type:'read-choice', kind:'생각하기', h:t.h, m:t.m,
    q:'지금은 '+josa(timeText(t.h,t.m),'이야','야')+'. '+josa(d0[1],'은','는')+' 몇 시 몇 분일까?',
    clock:{h:t.h,m:t.m}, choices:shuffle([ansT].concat(wl)), answer:ansT,
    exp:timeText(t.h,t.m)+'에서 '+josa(d0[1],'은','는')+' '+josa(ansT,'이야','야')+'.'
  };
}

function buildQuiz(){
  var qs = [], seen = {}, guard = 0;
  while(qs.length < state.count && guard < 400){
    guard++;
    var q = makeQuestion(state.level);
    var key = q.type+'|'+q.q+'|'+q.h+':'+q.m;
    if(seen[key]) continue;
    seen[key] = 1;
    qs.push(q);
  }
  return qs;
}

/* =========================================================
   5. 해설
   ========================================================= */
function explain(q){
  if(q.exp) return q.exp;
  var h=q.h, m=q.m;
  var s = '짧은바늘은 ' + (m===0 ? (josa(String(h),'을','를')+' 가리켜요 → '+h+'시')
                                  : (hourRange(h)+' 사이 → '+h+'시'));
  s += ', 긴바늘은 ';
  if(m===0) s += '12를 가리켜요 → 0분(정각)';
  else if(m%5===0) s += josa(String(m/5),'을','를')+' 가리켜요 → '+(m/5)+'×5 = '+m+'분';
  else s += (Math.floor(m/5)||12)+'에서 눈금 '+(m%5)+'칸 더 → '+m+'분';
  s += '. 그래서 정답은 「'+timeText(h,m)+'」!';
  return s;
}

/* =========================================================
   6. 렌더링 — 홈
   ========================================================= */
function el(id){ return document.getElementById(id); }

function renderHome(){
  var box = el('sel-level'); box.innerHTML = '';
  LEVELS.forEach(function(l){
    var b = document.createElement('button');
    b.className = 'opt'; b.type='button';
    b.setAttribute('aria-pressed', state.level===l.id ? 'true':'false');
    b.innerHTML = '<span class="dot"></span><span><span class="t">'+l.t+'</span><span class="d">'+l.d+'</span></span>';
    b.onclick = function(){ state.level = l.id; renderHome(); };
    box.appendChild(b);
  });

  var cb = el('sel-count'); cb.innerHTML = '';
  COUNTS.forEach(function(c){
    var b = document.createElement('button');
    b.className='opt'; b.type='button';
    b.setAttribute('aria-pressed', state.count===c ? 'true':'false');
    b.innerHTML = '<span class="t">'+c+'문제</span>';
    b.onclick = function(){ state.count = c; renderHome(); };
    cb.appendChild(b);
  });

  var hb = el('sel-help'); hb.innerHTML = '';
  var b2 = document.createElement('button');
  b2.className='opt'; b2.type='button';
  b2.setAttribute('aria-pressed', state.showMinuteNumbers ? 'true':'false');
  b2.innerHTML = '<span class="dot"></span><span><span class="t">시계에 분 숫자 보여주기</span>'+
                 '<span class="d">0·5·10·15 … 보조 숫자를 안쪽에 작게 표시</span></span>';
  b2.onclick = function(){ state.showMinuteNumbers = !state.showMinuteNumbers; renderHome(); };
  hb.appendChild(b2);

  renderHistory();
}

function renderHistory(){
  var hist = loadHistory();
  if(!hist.length){ el('history-card').style.display='none'; return; }
  el('history-card').style.display='block';
  el('history-list').innerHTML = hist.slice(0,5).map(function(h){
    return '<div class="bd-row"><span class="nm">'+h.date+'</span>'+
           '<span class="muted" style="flex:1">'+h.level+' · '+h.total+'문제</span>'+
           '<span class="vv">'+h.correct+'/'+h.total+'</span></div>';
  }).join('');
}

/* =========================================================
   7. 렌더링 — 문제
   ========================================================= */
function show(view){
  ['view-home','view-quiz','view-result'].forEach(function(v){
    el(v).classList.toggle('hide', v!==view);
  });
  window.scrollTo(0,0);
}

function renderQuestion(){
  var q = state.qs[state.idx];
  state.answered = false;
  state.qStartedAt = Date.now();

  el('q-count').textContent = (state.idx+1)+' / '+state.qs.length;
  el('q-bar').style.width = (state.idx/state.qs.length*100)+'%';
  var correct = state.answers.filter(function(a){return a.ok;}).length;
  el('q-score').textContent = correct+'점';

  var c = el('q-card');
  var html = '<span class="qtype">'+q.kind+'</span><div class="qtext">'+q.q+'</div>';

  if(q.clock){
    html += '<div class="clock-wrap">'+clockSVG(q.clock.h,q.clock.m,{showMinuteNumbers:state.showMinuteNumbers})+'</div>';
  }

  if(q.type === 'read-input'){
    html += '<div class="inputs">'+
      '<label class="f"><span>시</span><input id="in-h" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"></label>'+
      '<span class="unit">시</span>'+
      '<label class="f"><span>분</span><input id="in-m" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off"></label>'+
      '<span class="unit">분</span></div>'+
      '<button class="btn" id="btn-submit">확인하기</button>';
  } else if(q.type === 'read-choice'){
    html += '<div class="choices" id="choices">'+ q.choices.map(function(ch,i){
      return '<button class="choice" type="button" data-v="'+esc(ch)+'"><span class="num">'+(i+1)+'</span>'+esc(ch)+'</button>';
    }).join('') +'</div>';
  } else if(q.type === 'match-clock'){
    html += '<div class="choices clocks" id="choices">'+ q.clockChoices.map(function(o,i){
      return '<button class="choice" type="button" data-v="'+o.h+':'+o.m+'">'+
             clockSVG(o.h,o.m,{size:300,showMinuteNumbers:false})+'</button>';
    }).join('') +'</div>';
  }

  html += '<div class="fb" id="fb"></div>';
  c.innerHTML = html;

  if(q.type === 'read-input'){
    var ih = el('in-h'), im = el('in-m');
    ih.addEventListener('input', function(){
      ih.value = ih.value.replace(/[^0-9]/g,'');
      if(ih.value.length>=2 || Number(ih.value)>1) { if(ih.value.length>=1 && Number(ih.value)!==1) im.focus(); }
    });
    im.addEventListener('input', function(){ im.value = im.value.replace(/[^0-9]/g,''); });
    im.addEventListener('keydown', function(e){ if(e.key==='Enter') submitInput(); });
    el('btn-submit').onclick = submitInput;
    setTimeout(function(){ try{ ih.focus(); }catch(e){} }, 120);
  } else {
    Array.prototype.forEach.call(el('choices').querySelectorAll('.choice'), function(b){
      b.onclick = function(){ judge(b.getAttribute('data-v'), b); };
    });
  }
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function submitInput(){
  if(state.answered) return;
  var q = state.qs[state.idx];
  var hv = el('in-h').value.trim(), mv = el('in-m').value.trim();
  if(hv === ''){ el('in-h').focus(); return; }
  var h = Number(hv), m = (mv==='' ? 0 : Number(mv));
  var given = timeText(h,m);
  var ok = (h === q.h || (q.h===12 && h===0)) && (m === q.m);
  finish(ok, given, null);
}

function judge(val, btn){
  if(state.answered) return;
  var q = state.qs[state.idx];
  var ok = (val === q.answer);
  // 시각 표시
  Array.prototype.forEach.call(el('choices').querySelectorAll('.choice'), function(b){
    var v = b.getAttribute('data-v');
    if(v === q.answer) b.classList.add('ok');
    else if(b === btn) b.classList.add('no');
    b.disabled = true;
  });
  var shown = val;
  if(q.type === 'match-clock'){
    var p = val.split(':'); shown = timeText(Number(p[0]), Number(p[1]));
  }
  finish(ok, shown, null);
}

function finish(ok, given){
  var q = state.qs[state.idx];
  state.answered = true;
  state.answers.push({
    q:q, ok:ok, given:given,
    answer: (q.type==='match-clock') ? timeText(q.h,q.m) : q.answer,
    ms: Date.now() - state.qStartedAt
  });

  var fb = el('fb');
  fb.className = 'fb show ' + (ok ? 'ok' : 'no');
  var last = (state.idx === state.qs.length - 1);
  fb.innerHTML =
    '<div class="head">'+(ok ? '⭕ 정답이야! 잘했어' : '❌ 아쉬워')+'</div>'+
    (ok ? '' : '<div class="exp"><b>정답: '+esc(state.answers[state.answers.length-1].answer)+'</b><br>'+esc(explain(q))+'</div>')+
    (ok ? '<div class="exp">'+esc(explain(q))+'</div>' : '')+
    '<button class="btn" id="btn-next">'+(last ? '결과 보기 🎉' : '다음 문제 →')+'</button>';
  el('btn-next').onclick = next;

  var correct = state.answers.filter(function(a){return a.ok;}).length;
  el('q-score').textContent = correct+'점';
  el('q-bar').style.width = ((state.idx+1)/state.qs.length*100)+'%';
  try{ fb.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
  if(navigator.vibrate){ navigator.vibrate(ok ? 30 : [40,60,40]); }
}

function next(){
  state.idx++;
  if(state.idx >= state.qs.length){ renderResult(); show('view-result'); }
  else renderQuestion();
}

/* =========================================================
   8. 결과
   ========================================================= */
function renderResult(){
  var total = state.answers.length;
  var correct = state.answers.filter(function(a){return a.ok;}).length;
  var pct = total ? Math.round(correct/total*100) : 0;
  var secs = Math.round((Date.now() - state.startedAt)/1000);
  var avg = total ? (secs/total).toFixed(1) : 0;

  var emo, msg;
  if(pct===100){ emo='🏆'; msg='완벽해! 시계 박사님!'; }
  else if(pct>=80){ emo='🎉'; msg='아주 잘했어!'; }
  else if(pct>=60){ emo='😊'; msg='잘하고 있어! 조금만 더!'; }
  else if(pct>=40){ emo='💪'; msg='연습하면 금방 늘어!'; }
  else { emo='🌱'; msg='천천히 다시 해보자!'; }

  // 유형별 집계
  var byKind = {};
  state.answers.forEach(function(a){
    var k = a.q.kind;
    if(!byKind[k]) byKind[k] = {n:0,c:0};
    byKind[k].n++; if(a.ok) byKind[k].c++;
  });

  var lvName = LEVELS.filter(function(l){return l.id===state.level;})[0].t;

  var h = '<div class="big-score"><div class="emo">'+emo+'</div>'+
    '<div class="n">'+correct+'<small> / '+total+'</small></div>'+
    '<div class="msg">'+msg+'</div>'+
    '<div class="muted" style="margin-top:4px">'+lvName+' · 정답률 '+pct+'%</div></div>';

  h += '<div class="stats">'+
    '<div class="stat"><div class="v">'+pct+'%</div><div class="k">정답률</div></div>'+
    '<div class="stat"><div class="v">'+(total-correct)+'</div><div class="k">틀린 문제</div></div>'+
    '<div class="stat"><div class="v">'+secs+'초</div><div class="k">걸린 시간</div></div>'+
    '<div class="stat"><div class="v">'+avg+'초</div><div class="k">문제당 평균</div></div></div>';

  h += '<h2>유형별 결과</h2>';
  Object.keys(byKind).forEach(function(k){
    var o = byKind[k], p = Math.round(o.c/o.n*100);
    h += '<div class="bd-row"><span class="nm">'+k+'</span>'+
         '<span class="bar"><i style="width:'+p+'%;background:'+(p>=80?'#16a34a':p>=50?'#f59e0b':'#dc2626')+'"></i></span>'+
         '<span class="vv">'+o.c+'/'+o.n+'</span></div>';
  });

  var wrong = state.answers.filter(function(a){return !a.ok;});
  if(wrong.length){
    h += '<div class="review"><h2>틀린 문제 다시 보기</h2>';
    wrong.forEach(function(a){
      h += '<div class="rv">'+clockSVG(a.q.h,a.q.m,{size:300,showMinuteNumbers:false})+
           '<div><div class="q">'+esc(a.q.q)+'</div>'+
           '<div class="a"><span class="bad">'+esc(a.given)+'</span> → <span class="good">'+esc(a.answer)+'</span></div></div></div>';
    });
    h += '</div>';
  }

  h += '<div style="display:grid;gap:10px;margin-top:18px">';
  if(wrong.length) h += '<button class="btn" id="btn-retry-wrong">틀린 문제만 다시 풀기 ('+wrong.length+')</button>';
  h += '<button class="btn '+(wrong.length?'ghost':'')+'" id="btn-again">같은 설정으로 다시 →</button>'+
       '<button class="btn gray" id="btn-home">처음으로</button></div>';

  el('result-card').innerHTML = h;

  if(wrong.length){
    el('btn-retry-wrong').onclick = function(){
      var qs = wrong.map(function(a){ return a.q; });
      state.qs = shuffle(qs.slice()); state.idx=0; state.answers=[]; state.startedAt=Date.now();
      show('view-quiz'); renderQuestion();
    };
  }
  el('btn-again').onclick = function(){ startQuiz(); };
  el('btn-home').onclick = function(){ renderHome(); show('view-home'); };

  saveHistory({ date: fmtDate(new Date()), level: lvName, total: total, correct: correct });
  renderHistory();
}

function fmtDate(d){ return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }

/* =========================================================
   9. 기록 (localStorage)
   ========================================================= */
var HKEY = 'clockquiz.history.v1';
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HKEY) || '[]'); }catch(e){ return []; }
}
function saveHistory(rec){
  try{
    var h = loadHistory(); h.unshift(rec);
    localStorage.setItem(HKEY, JSON.stringify(h.slice(0,20)));
  }catch(e){}
}

/* =========================================================
   10. 시작
   ========================================================= */
function startQuiz(){
  state.qs = buildQuiz();
  state.idx = 0; state.answers = []; state.startedAt = Date.now();
  show('view-quiz');
  renderQuestion();
}

el('btn-start').onclick = startQuiz;
el('btn-quit').onclick = function(){
  if(state.answers.length){ renderResult(); show('view-result'); }
  else { renderHome(); show('view-home'); }
};

renderHome();
})();
</script>
