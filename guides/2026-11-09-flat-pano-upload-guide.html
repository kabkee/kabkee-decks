<h1 id="flat-%ED%8C%8C%EB%85%B8%EB%9D%BC%EB%A7%88-%EC%97%85%EB%A1%9C%EB%93%9C-%EA%B0%80%EC%9D%B4%EB%93%9C">flat 파노라마 업로드 가이드</h1>
<h2 id="look360-utils-%EB%A1%9C-%EB%A7%8C%EB%93%A4%EA%B3%A0-look360-%EC%97%90-%EB%93%B1%EB%A1%9D%ED%95%B4%EC%84%9C-%EA%B3%B5%EA%B0%9C%ED%95%98%EA%B8%B0%EA%B9%8C%EC%A7%80">Look360 Utils 로 만들고, Look360 에 등록해서 공개하기까지</h2>
<hr />
<p>Indyspot AI Corp  ·  Engineering Manager  ·  2026-11-09</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="2" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EC%A0%84%EC%B2%B4-%EA%B3%BC%EC%A0%95--utils-%EC%97%90%EC%84%9C-3%EB%8B%A8%EA%B3%84-look360-%EA%B4%80%EB%A6%AC%EC%9E%90%EC%97%90%EC%84%9C-5%EB%8B%A8%EA%B3%84%EC%9E%85%EB%8B%88%EB%8B%A4">전체 과정 — Utils 에서 3단계, Look360 관리자에서 5단계입니다</h2>
<div class="flow">
<div><b>Utils ①</b>타일 생성<br />BAT 만들고 실행</div>
<div><b>Utils ②</b>Batch XML 생성<br />tile_info 자동 포함</div>
<div><b>Utils ③</b>업로드용 zip 생성<br />{장소id}.zip</div>
<div><b>Look360 ①</b>타일 zip 업로드<br />파노zip업</div>
<div><b>Look360 ②</b>Batch XML 등록<br />신규 모두 등록</div>
<div><b>Look360 ③</b>VR투어에 추가<br />저장하기</div>
<div><b>Look360 ④</b>VR투어 XML 생성</div>
<div><b>Look360 ⑤</b>공개 설정<br />주소로 확인</div>
</div>
<br />
<ul>
<li>flat 은 2:1 이 아닌 일반 평면 사진을 확대·드래그로 보여주는 파노라마입니다.</li>
<li>필요한 버전: <strong>Look360 Utils v0.1.4-beta.5 이상</strong>. 이전 버전에는 zip 생성 기능이 없습니다.</li>
<li>이 자료의 화면은 개발 서버에 샘플 이미지 3장(flat 2장, sphere 1장)을 실제로 올린 기록입니다.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="3" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EC%9D%B4%EC%A0%9C-%ED%94%84%EB%A1%9C%EA%B7%B8%EB%9E%A8%EC%9D%84-%EB%94%B0%EB%A1%9C-%EC%84%A4%EC%B9%98%ED%95%98%EC%A7%80-%EC%95%8A%EC%95%84%EB%8F%84-%EB%90%A9%EB%8B%88%EB%8B%A4">이제 프로그램을 따로 설치하지 않아도 됩니다</h2>
<div class="cols">
<div class="col">
<h3 id="%EC%95%B1%EC%97%90-%ED%8F%AC%ED%95%A8%EB%90%9C-%ED%94%84%EB%A1%9C%EA%B7%B8%EB%9E%A8">앱에 포함된 프로그램</h3>
<table>
<thead>
<tr>
<th>프로그램</th>
<th>쓰임</th>
</tr>
</thead>
<tbody>
<tr>
<td>Hugin (<code>nona</code>)</td>
<td>리틀플래닛 이미지</td>
</tr>
<tr>
<td>ImageMagick</td>
<td>썸네일, GIF</td>
</tr>
<tr>
<td>ExifTool</td>
<td>360 메타데이터</td>
</tr>
<tr>
<td>krpanotools</td>
<td>타일 생성 (기존 포함)</td>
</tr>
</tbody>
</table>
<p>Node.js 도 더 이상 필요하지 않습니다.</p>
</div>
<div class="col">
<h3 id="%EB%8B%AC%EB%9D%BC%EC%A7%84-%EC%A0%90">달라진 점</h3>
<ul>
<li>설치 파일을 받고 PATH 를 확인하던 과정이 없어졌습니다.</li>
<li>타일 생성 화면에 <span class="hl-blue">“앱에 포함되어 있어 따로 설치하지 않아도 됩니다”</span> 문구가 보이면 준비가 끝난 것입니다.</li>
<li>세 프로그램이 없는 Windows PC 에서 파일 297개 생성을 확인했습니다.</li>
</ul>
<h3 id="mac">mac</h3>
<ul>
<li>앱 동작은 확인했고, dmg 배포는 실제 설치 확인 후 진행합니다.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="4" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EC%8B%9C%EC%9E%91-%EC%A0%84--%ED%8F%B4%EB%8D%94-%EC%9D%B4%EB%A6%84%EB%A7%8C-%EA%B7%9C%EC%B9%99%EB%8C%80%EB%A1%9C-%EB%A7%8C%EB%93%A4%EB%A9%B4-%EB%90%A9%EB%8B%88%EB%8B%A4">시작 전 — 폴더 이름만 규칙대로 만들면 됩니다</h2>
<pre><code class="language-text">20261109 샘플 장소(1641)            ← 괄호 안 숫자 = 장소 id
└─ VR
   ├─ 9801 가로형 전경 [flat]       ← 앞 숫자 = 파노 번호, [flat] = flat 표시
   │  └─ retouched.jpg
   └─ 9802 표준비율
      ├─ retouched.jpg
      └─ panorama_size.txt          ← flat,4000,3000
</code></pre>
<ul>
<li>flat 표시는 둘 중 하나면 됩니다: 폴더명 <code>[flat]</code> 또는 <code>panorama_size.txt</code> 의 <code>flat,가로,세로</code>.</li>
<li>둘 다 있으면 <code>panorama_size.txt</code> 가 우선합니다. 폴더명만 쓰면 크기 파일은 앱이 만듭니다.</li>
<li>폴더명의 <code>[flat]</code> 은 파노 이름에 그대로 들어가므로, 등록 화면의 이름 칸에서 지워 주세요.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="5" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="utils-%E2%91%A0-%ED%83%80%EC%9D%BC-%EC%83%9D%EC%84%B1--bat-%EB%A5%BC-%EB%A7%8C%EB%93%A4%EA%B3%A0-%EC%8B%A4%ED%96%89%ED%95%A9%EB%8B%88%EB%8B%A4">Utils ① 타일 생성 — BAT 를 만들고 실행합니다</h2>
<div class="split">
<div class="steps">
<ol>
<li>왼쪽 메뉴 <strong>3. 타일생성을 위한 BAT 파일 생성</strong></li>
<li>상위 폴더 선택</li>
<li><strong>KRPANOTOOLS 파일복사</strong></li>
<li><strong>타일생성 BAT파일 생성</strong></li>
<li>실행
<ul>
<li>Windows: 폴더의 <code>.bat</code> 더블클릭</li>
<li>mac: <strong>타일생성 BAT파일 실행</strong></li>
</ul>
</li>
</ol>
<p class="note">상단 Platform 전용 모드 스위치는 꺼 둡니다.</p>
</div>
<div><img class="shot" src="2026-11-09-flat-pano-upload-guide_img/utils-tile-bat.jpg" /></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="6" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="utils-%E2%91%A1-batch-xml-%EC%83%9D%EC%84%B1--%EA%B0%92%EC%9D%84-%EC%A7%81%EC%A0%91-%EC%93%B8-%ED%95%84%EC%9A%94%EA%B0%80-%EC%97%86%EC%8A%B5%EB%8B%88%EB%8B%A4">Utils ② Batch XML 생성 — 값을 직접 쓸 필요가 없습니다</h2>
<div class="split">
<div class="steps">
<ol>
<li>메뉴 <strong>4. Batch XML/JSON 생성</strong></li>
<li><strong>XML 생성하기</strong></li>
<li>상위 폴더에 <code>private_Unified_날짜.xml</code> 생성</li>
</ol>
<p class="note">flat 은 실제 픽셀 크기와 타일 정보(tile_info)가 자동으로 들어갑니다. 타일 생성을 먼저 안 하면 그 행은 건너뜁니다.</p>
</div>
<div>
<img class="shot-sm" src="2026-11-09-flat-pano-upload-guide_img/utils-batch-xml.jpg" />
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">panoramatype</span>&gt;</span>flat<span class="hljs-tag">&lt;/<span class="hljs-name">panoramatype</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">width</span>&gt;</span>6000<span class="hljs-tag">&lt;/<span class="hljs-name">width</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">height</span>&gt;</span>2000<span class="hljs-tag">&lt;/<span class="hljs-name">height</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">panono</span>&gt;</span>9801<span class="hljs-tag">&lt;/<span class="hljs-name">panono</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">tile_info</span>&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">multires</span>&gt;</span>512,3072x1024,6144x2048<span class="hljs-tag">&lt;/<span class="hljs-name">multires</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">tilepath</span>&gt;</span>l%l/%0v/l%l_%0v_%0h.jpg<span class="hljs-tag">&lt;/<span class="hljs-name">tilepath</span>&gt;</span> …<span class="hljs-tag">&lt;/<span class="hljs-name">tile_info</span>&gt;</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="7" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="utils-%E2%91%A2-%EC%97%85%EB%A1%9C%EB%93%9C%EC%9A%A9-zip-%EB%A7%8C%EB%93%A4%EA%B8%B0">Utils ③ 업로드용 zip 만들기</h2>
<div class="split">
<div class="steps">
<ol>
<li>메뉴 <strong>5. Pano 폴더 복사</strong></li>
<li><strong>ZIP 만들기</strong></li>
<li><code>upload_zip/{장소id}.zip</code> 생성</li>
</ol>
<p class="note">장소마다 zip 1개가 만들어지고, zip 안의 맨 위에는 파노 번호 폴더만 들어갑니다. 레거시 업로드 규칙에 맞춘 구조입니다.</p>
</div>
<div><img class="shot" src="2026-11-09-flat-pano-upload-guide_img/utils-zip.jpg" /></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="look360-%E2%91%A0-%ED%83%80%EC%9D%BC-zip-%EC%97%85%EB%A1%9C%EB%93%9C">Look360 ① 타일 zip 업로드</h2>
<div class="split">
<div class="steps">
<ol>
<li>관리자 <strong>파노zip업</strong> 메뉴</li>
<li><code>{장소id}.zip</code> 선택</li>
<li><strong>업로드</strong></li>
<li>“파일 반영이 완료되었습니다” 확인</li>
</ol>
<p class="note">불안하면 <b>사전 검증만(dry-run)</b> 을 먼저 체크합니다. 이미 파일이 있는 장소에 다시 올리려면 덮어쓰기를 체크하고 비밀번호나 OTP 로 인증합니다.</p>
</div>
<div><img class="shot" src="2026-11-09-flat-pano-upload-guide_img/legacy-zip-upload.jpg" /></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="look360-%E2%91%A1-batch-xml-%EB%93%B1%EB%A1%9D">Look360 ② Batch XML 등록</h2>
<div class="split">
<div class="steps">
<ol>
<li><strong>파노라마 &gt; 파노라마 XML Batch 입력</strong></li>
<li>XML 선택 후 <strong>파일 분석</strong></li>
<li>표에서 종류가 flat 인지, 크기가 맞는지 확인</li>
<li>이름의 <code>[flat]</code> 정리</li>
<li><strong>신규 모두 등록</strong></li>
</ol>
<p class="note">표의 등록구분이 NEW 인 행이 새로 등록됩니다.</p>
</div>
<div><img class="shot" src="2026-11-09-flat-pano-upload-guide_img/legacy-batch-parsed.jpg" /></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="look360-%E2%91%A2-vr%ED%88%AC%EC%96%B4%EC%97%90-%ED%8C%8C%EB%85%B8%EB%9D%BC%EB%A7%88-%EC%B6%94%EA%B0%80">Look360 ③ VR투어에 파노라마 추가</h2>
<div class="split">
<div class="steps">
<ol>
<li><strong>VR투어 관리</strong>에서 해당 투어의 목록 수정 화면 열기</li>
<li>“장소에 추가된 모든 파노라마 리스트”에서 <strong>추가하기</strong></li>
<li>위쪽 목록에 들어왔는지 확인</li>
<li>맨 위 <strong>저장하기</strong></li>
</ol>
<p class="note">화면의 빈 썸네일은 개발 서버를 IP 주소로 열어서 생긴 것입니다. 주소 차단 규칙 때문이며 운영 사이트와는 무관합니다.</p>
</div>
<div><img class="shot" src="2026-11-09-flat-pano-upload-guide_img/legacy-tour-add.jpg" /></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="look360-%E2%91%A3-xml-%EC%83%9D%EC%84%B1--%E2%91%A4-%EA%B3%B5%EA%B0%9C-%EC%84%A4%EC%A0%95">Look360 ④ XML 생성 · ⑤ 공개 설정</h2>
<div class="split">
<div class="steps">
<p><strong>XML 생성 (필수)</strong></p>
<ol>
<li><strong>xml 생성하러 가기</strong></li>
<li><strong>VR투어 XML 생성하기!!!</strong></li>
</ol>
<p><strong>공개 설정</strong></p>
<ul>
<li><strong>Publish여부</strong>: 어떤 방식이든 접근 가능한지 결정</li>
<li><strong>공개여부</strong>: 미공개면 사이트에 노출되지 않고 주소로만 열람</li>
<li><strong>비밀번호 사용</strong>: 암호 필요 시</li>
<li>변경 후 <strong>저장하기</strong></li>
</ul>
<p class="note">주소: look360.kr/vr/{장소 도메인}/{투어 도메인}</p>
</div>
<div><img class="shot" src="2026-11-09-flat-pano-upload-guide_img/legacy-tour-settings.jpg" /></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EA%B2%B0%EA%B3%BC--%EB%B7%B0%EC%96%B4%EC%97%90%EC%84%9C-flat-%EA%B3%BC-sphere-%EA%B0%80-%ED%95%A8%EA%BB%98-%EB%8F%99%EC%9E%91%ED%95%A9%EB%8B%88%EB%8B%A4">결과 — 뷰어에서 flat 과 sphere 가 함께 동작합니다</h2>
<div class="pair">
<img class="shot-sm" src="2026-11-09-flat-pano-upload-guide_img/viewer-flat-6000.jpg" />
<img class="shot-sm" src="2026-11-09-flat-pano-upload-guide_img/viewer-flat-zoom.jpg" />
<img class="shot-sm" src="2026-11-09-flat-pano-upload-guide_img/viewer-flat-4000.jpg" />
<img class="shot-sm" src="2026-11-09-flat-pano-upload-guide_img/viewer-sphere.jpg" />
</div>
<p class="note">왼쪽 위: flat 6000×2000 · 오른쪽 위: 확대 후 드래그 · 왼쪽 아래: flat 4000×3000 · 오른쪽 아래: 같은 투어의 sphere</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="13" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="14">
<h2 id="%EB%A7%89%ED%98%94%EC%9D%84-%EB%95%8C">막혔을 때</h2>
<table>
<thead>
<tr>
<th>증상</th>
<th>원인</th>
<th>해결</th>
</tr>
</thead>
<tbody>
<tr>
<td>XML 에 flat 행이 빠짐</td>
<td>타일이 아직 안 만들어짐</td>
<td>BAT 실행이 끝난 뒤 XML 다시 생성</td>
</tr>
<tr>
<td>“같은 이름으로 압축이 이미 풀려있습니다”</td>
<td>그 장소에 폴더가 이미 있음</td>
<td>덮어쓰기 체크 후 비밀번호·OTP 인증</td>
</tr>
<tr>
<td>“zip 최상위 구조가 올바르지 않습니다”</td>
<td>zip 을 직접 만들어 폴더가 한 겹 더 있음</td>
<td>Utils 의 ZIP 만들기 사용</td>
</tr>
<tr>
<td>ZIP 만들기에서 번호 관련 오류</td>
<td>파노 번호 중복, 또는 번호가 장소 id 와 같은 폴더 하나뿐</td>
<td>폴더 번호 수정</td>
</tr>
<tr>
<td>투어에 안 보임</td>
<td>XML 재생성 누락</td>
<td>VR투어 XML 생성하기 다시 실행</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-class="closing" data-theme="clean" lang="C" class="closing" style="--class:closing;--theme:clean;">
<h2 id="%EC%A0%95%EB%A6%AC">정리</h2>
<p>Utils 로 타일 · XML · zip 을 만들고, Look360 에서 업로드 · 등록 · 투어 추가 · XML 생성 · 공개 순서로 진행합니다.<br />

</section>

  };
  const showTip = (t) => {
    tip.textContent = t; tip.style.opacity = '1';
    clearTimeout(tipT); tipT = setTimeout(() => { tip.style.opacity = '0'; }, 2600);
  };
  const close = () => { ov.style.display = 'none'; im.removeAttribute('src'); document.body.style.overflow = ''; };

  const open = (src) => {
    im.onload = () => {
      nw = im.naturalWidth; nh = im.naturalHeight;
      im.style.width = nw + 'px'; im.style.height = nh + 'px';
      fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
      s = Math.min(fit, 1);            // 원본보다 크게는 띄우지 않는다
      tx = ty = 0; clamp(); draw();
      showTip(fit < 0.995 ? '클릭하면 원본 크기 · 드래그 이동 · ESC 닫기' : '휠로 확대 · ESC 닫기');
    };
    im.src = src;
    ov.style.display = 'block';
    document.body.style.overflow = 'hidden';
  };

  // 배경 클릭 → 닫기 / 이미지 클릭 → 맞춤 ↔ 원본 토글
  ov.addEventListener('click', (e) => {
    e.stopPropagation();
    if (moved) { moved = false; return; }
    if (e.target === xb || e.target === ov) { close(); return; }
    if (e.target === im) {
      const f = Math.min(fit, 1);
      zoom(s > f + 0.005 ? f : Math.max(1, f * 2), e.clientX, e.clientY);
    }
  });

  // 드래그 이동 (마우스 · 터치 공통)
  im.addEventListener('pointerdown', (e) => {
    if (nw * s <= innerWidth && nh * s <= innerHeight) return;
    drag = true; moved = false; lx = e.clientX; ly = e.clientY;
    im.setPointerCapture(e.pointerId); draw(); e.preventDefault();
  });
  im.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    tx += dx; ty += dy; lx = e.clientX; ly = e.clientY; clamp(); draw();
  });
  const endDrag = (e) => { if (drag) { drag = false; try { im.releasePointerCapture(e.pointerId); } catch (_) {} draw(); } };
  im.addEventListener('pointerup', endDrag);
  im.addEventListener('pointercancel', endDrag);

  // 휠 줌 (슬라이드 전환으로 새지 않게 차단)
  ov.addEventListener('wheel', (e) => {
    e.preventDefault(); e.stopPropagation();
    zoom(s * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY);
  }, { passive: false });

  // 핀치 줌
  let pts = new Map(), pd = 0;
  ov.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') pts.set(e.pointerId, e); });
  ov.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'touch' || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pts.size !== 2) return;
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pd) { moved = true; zoom(s * (d / pd), (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); }
    pd = d;
  });
  const dropPt = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pd = 0; };
  ov.addEventListener('pointerup', dropPt);
  ov.addEventListener('pointercancel', dropPt);

  // 열려 있는 동안 키보드는 전부 여기서 소비 (화살표가 슬라이드를 넘기면 안 된다)
  document.addEventListener('keydown', (e) => {
    if (ov.style.display === 'none') return;
    const cx = innerWidth / 2, cy = innerHeight / 2;
    if (e.key === 'Escape') close();
    else if (e.key === '+' || e.key === '=') zoom(s * 1.25, cx, cy);
    else if (e.key === '-' || e.key === '_') zoom(s / 1.25, cx, cy);
    else if (e.key === '0') zoom(Math.min(fit, 1), cx, cy);
    else if (e.key === '1') zoom(1, cx, cy);
    else if (e.key === 'ArrowLeft') { tx += 60; clamp(); draw(); }
    else if (e.key === 'ArrowRight') { tx -= 60; clamp(); draw(); }
    else if (e.key === 'ArrowUp') { ty += 60; clamp(); draw(); }
    else if (e.key === 'ArrowDown') { ty -= 60; clamp(); draw(); }
    else return;
    e.preventDefault(); e.stopPropagation();
  }, true);

  addEventListener('resize', () => {
    if (ov.style.display === 'none' || !nw) return;
    fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
    clamp(); draw();
  });

  const ready = () => {
    document.body.appendChild(ov);
    document.addEventListener('click', (e) => {
      const t = e.target;
      if (t && t.tagName === 'IMG' && t.closest('section') && !t.classList.contains('emoji')) {
        e.preventDefault(); e.stopPropagation(); open(t.currentSrc || t.src);
      }
    }, true);
  };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', ready) : ready();
})();
</script>
</body></html>
