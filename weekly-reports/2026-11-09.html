<h2 id="%F0%9F%94%91-%EC%9D%B4%EB%B2%88-%EC%A3%BC%EC%97%90-%EC%A0%95%ED%95%9C-%EA%B7%9C%EC%B9%99-span-classbadge-date11041109span"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> 이번 주에 정한 규칙 <span class="badge-date">11/04~11/09</span></h2>
<table>
<thead>
<tr>
<th>결정</th>
<th>내용</th>
<th>근거</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>장소 정보 개편 방향 전환</strong></td>
<td>장소 원장 시트 일괄 재구성은 무산. admin 에서 콘텐츠를 하나씩 검수해 장소를 구성하고, 콘텐츠 정보는 JSON info 칸으로 옮기며, 콘텐츠당 다중 장소를 둡니다</td>
<td><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9021">IND-9021</a> 오너 11/04</td>
</tr>
<tr>
<td><strong>비공개(hidden=1) 정책</strong></td>
<td>공개 목록·탐색에는 나오지 않고 URL 접속은 유지합니다. 채널 목록에서는 주인·ADMIN 에게만 보입니다. VRSTORY 도 동일합니다</td>
<td><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9247">IND-9247</a> 오너 11/09</td>
</tr>
<tr>
<td><strong>레거시 생성기 재설계</strong></td>
<td>현재 XML 고정안 대신, 어드민 수정이 재생성에 반영되는 구조로 바꿉니다</td>
<td><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9241">IND-9241</a> 오너 11/09</td>
</tr>
<tr>
<td><strong>콘텐츠 언어 필터</strong></td>
<td>언어는 1개만 선택합니다. 검색결과 외부VR 은 vr-list 와 동일하게 처리합니다(이관 전까지 검색에서도 미노출)</td>
<td><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8592">IND-8592</a> 오너 11/05 · 카드 <code>0c99edc8</code> 11/09</td>
</tr>

<h2 id="%EB%A0%88%EA%B1%B0%EC%8B%9C--xml-%EB%8F%99%EA%B8%B0%ED%99%94--%ED%83%80%EC%9D%BC--%EC%BD%98%ED%85%90%EC%B8%A0-%EC%A0%95%EB%A6%AC">레거시 — XML 동기화 · 타일 · 콘텐츠 정리</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="73">
<h2 id="%F0%9F%94%84-%ED%88%AC%EC%96%B4-xml%E2%86%94db-%EB%8F%99%EA%B8%B0%ED%99%94--%EC%A7%84%ED%96%89-%EA%B3%B5%EC%9C%A0-span-classbadge-date%EC%9A%B4%EC%98%81-%EB%B0%98%EC%98%81-%EC%A0%84--%EC%83%88-%EB%B0%B0%ED%8F%AC-%EC%8A%B9%EC%9D%B8-%EB%8C%80%EA%B8%B0span"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> 투어 XML↔DB 동기화 — 진행 공유 <span class="badge-date">운영 반영 전 · 새 배포 승인 대기</span></h2>
<p>레거시 투어는 어드민 저장 시 XML 을 DB 기준으로 다시 만들어, 손편집 제목·핫스팟·flat 장면이 사라질 수 있습니다. 이 위험은 지금도 운영에 남아 있어 해당 투어의 어드민 저장·재생성은 금지 상태입니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>방향 전환(오너 11/09)</td>
<td>첫 배포안은 71투어 343장면을 XML 원문으로 고정해 어드민 수정이 재생성에 반영되지 않습니다 → 생성기 재설계. 기존 승인 카드 <code>b83d43c3</code> 은 답하지 않고 새 카드로 대체합니다</td>
</tr>
<tr>
<td>로컬 검증(11/09 QC-W4 · 운영 쓰기 0)</td>
<td>장면 원문 대체 0 · 400장면 중 내용 차이 0 = 389 · 오너 승인 툴팁 차이 7 · 당시 결정 대기 4(1896) · 그 밖 0 · 회귀 일반 2,761·다국어 237 불일치 0 · 어드민 수정 반영 7/7</td>
</tr>
<tr>
<td>최신 배포안 v8</td>
<td>400장면 = 차이 0 388 + 승인 8 + 보류(1896) 4 · 재생성 105투어</td>
</tr>
<tr>
<td>flat 장면(<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9208">IND-9208</a>)</td>
<td>1946·2762 는 custom XML 로 원문 보존 · 2529 pano29387 은 DB panotype 을 flat 으로 정정 · 1946 의 11장면은 현재 화면 선언 유지</td>
</tr>
<tr>
<td>작성 시점 상태(11/09 조회)</td>
<td><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9134">IND-9134</a> · <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9241">IND-9241</a> <code>blocked</code> · 1896 카드 <code>c043f078</code> 응답 완료(18:32 KST) · <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9276">IND-9276</a> <code>in_progress</code></td>

<h2 id="%F0%9F%8F%B7%EF%B8%8F-%EA%B1%B4%EB%AC%BC-%ED%88%B4%ED%8C%81-%EC%B0%A8%EC%9D%B4-44%EA%B1%B4--%EB%AC%B6%EC%9D%8C%EB%B3%84-%EC%B2%98%EB%A6%AC-span-classbadge-date%EC%9A%B4%EC%98%81-%EB%B0%98%EC%98%81-%EC%A0%84--%EC%98%A4%EB%84%88-%EA%B2%B0%EC%A0%95-1109span"><img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3f7.svg" data-marp-twemoji=""/> 건물 툴팁 차이 44건 — 묶음별 처리 <span class="badge-date">운영 반영 전 · 오너 결정 11/09</span></h2>
<p>레거시 XML 2,753개의 툴팁 31,791개를 11/06 운영 덤프와 대조했습니다. 다른 것은 44건이고, 운영 화면을 직접 보고 오너가 묶음별로 정했습니다.</p>
<table>
<thead>
<tr>
<th>묶음</th>
<th style="text-align:right">건수</th>
<th>처리</th>
</tr>
</thead>
<tbody>
<tr>
<td>위치가 다름 (겹치거나 애매해서 XML 에서 옮긴 것)</td>
<td style="text-align:right">9</td>
<td>DB 위치를 XML 위치로 변경</td>
</tr>
<tr>
<td>XML 에만 있음</td>
<td style="text-align:right">5</td>
<td>DB 로 이관</td>
</tr>
<tr>
<td>«그...찻집» ↔ «기념품샵»</td>
<td style="text-align:right">8</td>
<td>DB 글자를 «그...찻집»으로 변경</td>
</tr>
<tr>
<td>2775 장충단공원 띄어쓰기·표기</td>
<td style="text-align:right">9</td>
<td>DB 기준으로 XML 재생성</td>
</tr>
<tr>
<td>2372 화면에 <code>&amp;amp;</code> 가 그대로 보임</td>
<td style="text-align:right">1</td>
<td>DB 기준으로 XML 재생성</td>
</tr>
<tr>
<td><code>&amp;</code>·대괄호 표기만 다름</td>
<td style="text-align:right">12</td>
<td>조치 없음 (krpano 는 <code>[[</code> 로 써야 <code>[</code> 로 표시)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>영향: 위치·글자를 바꾸는 DB 행은 여러 투어가 공유해 2291·2661·2757 도 재생성하면 새 값으로 바뀝니다(오너 결정 범위). 남은 일: 결정을 배포안에 반영 → 새 배포 승인 카드 → 오너 승인 후 운영 DB·XML 반영. 플랫폼 툴팁 복원 <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9253">IND-9253</a> 반영 여부는 EM 판단 대기입니다.</p>
</blockquote>

<div class="cols">
<div class="col" style="flex:1.25">

<th>내용</th>

</thead>
<tbody>
<tr>
<td>① GPS 역지오코딩</td>
<td>구글이 주는 「시·도 → 시 → 구·군 → 읍·면 → 동·리」 이름을 받음</td>
</tr>
<tr>
<td>② 지역 테이블 매칭</td>
<td>위에서부터 차례로 찾아 내려감 · area 번호 = 지역 테이블 레벨</td>
</tr>
<tr>
<td>③ 의심 좌표 재판정</td>
<td>다른 장소와 좌표 공유 · 주소와 시·도 불일치 → 주소로 다시 지오코딩</td>
</tr>
<tr>
<td>④ 없는 단계</td>
<td>한국은 신규 노드(구글 이름) · 해외는 dr5hn 도시 승격으로 채움</td>
</tr>
</tbody>
</table>
<ul>
<li>서울은 area1·3·5(시·구·동), 경기 일반시는 area1·2·4·5 처럼 기존 360VIEW 장소와 같은 방식입니다</li>
<li>결과: 한국 1,526건 중 <span class="hl-green">1,509건이 area5 까지</span> · 해외 539건이 도시(area2)까지</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="37" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="73">
<h2 id="%E2%9A%A0%EF%B8%8F-gps-%ED%95%A8%EC%A0%95--%EC%A2%8C%ED%91%9C%EA%B0%80-%EB%B3%B5%EC%82%AC%EB%90%9C-%EC%BD%98%ED%85%90%EC%B8%A0%EA%B0%80-%EB%A7%8E%EC%95%98%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge-date1106span"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> GPS 함정 — 좌표가 복사된 콘텐츠가 많았습니다 <span class="badge-date">11/06</span></h2>
<table>
<thead>
<tr>
<th>같은 좌표</th>
<th>몰린 콘텐츠</th>
</tr>
</thead>
<tbody>
<tr>
<td>예산군 응봉면 1곳</td>
<td>국립민속박물관 · 국립한글박물관 · 천리포수목원 · 신두리 해안사구 등 <span class="hl-red">43건</span></td>
</tr>
<tr>
<td>정선군 화암면 1곳</td>
<td>강릉 선교장 · 뮤지엄산 · 코엑스 별마당 도서관 등 12건</td>
</tr>
<tr>
<td>포항 송라면 1곳</td>
<td>김천 직지사 · 보은 법주사 · 안동 봉정사 등 사찰 8건</td>
</tr>
</tbody>
</table>
<ul>
<li>같은 좌표를 3건 이상 공유하는 묶음이 83개(581건)였습니다</li>
<li>이 중 서로 다른 장소이거나 주소와 시·도가 어긋난 <span class="hl-amber">425건</span>은 주소로 다시 찾았습니다 → 불일치 187건 → <span class="hl-green">9건</span></li>
</ul>
<blockquote>
<p>«GPS 는 정확하다»는 전제는 이번 데이터에선 성립하지 않았습니다. 원본 좌표 정리는 별도 과제입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="38" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="73">

<li>예외: 한 도시에 콘텐츠가 수십 건 쌓이면 그 도시만 한 단계 내립니다</li>

<h2 id="%EC%99%B8%EB%B6%80vr--%ED%81%AC%EB%A1%A4%EB%9F%AC-%EC%88%98%EC%A7%91%EB%B6%84-%EB%93%B1%EB%A1%9D-%ED%8C%8C%EC%9D%B4%ED%94%84%EB%9D%BC%EC%9D%B8">외부VR — 크롤러 수집분 등록 파이프라인</h2>
<p>CMS for VR Crawler 로 <strong>새로 수집한 데이터</strong>를 플랫폼 외부VR 로 등록하는 작업입니다. 섹션 04 의 기존 데이터 재분류와는 결이 다릅니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="46" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="73">

<p>수집 규모: 검토 대기 <strong>18,755</strong> · 승인 114 · 게시 1 · 제외 1,679,082(자동 1,675,984 · 사람 3,098) · 접속 불가 28,264.</p>
<table>
<thead>
<tr>
<th>단계(메뉴 「외부VR 등록」 · 11/06 구축)</th>
<th>하는 일</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. 장소 확정</td>
<td>URL 경로 단위로 투어를 묶고, 투어 XML 제목·좌표와 Kakao 후보, 홈페이지의 기관명·주소를 보여줘 실제 장소를 고릅니다. 실제 방문 장소가 없으면 「장소 없음」으로 뺍니다</td>
</tr>
<tr>
<td>2. 중복 검토</td>
<td>같은 장소를 가리키는 그룹을 정리하고 대표 URL 을 고릅니다</td>
</tr>
<tr>
<td>3. 이미지 검수</td>
<td>투어마다 자동 캡처한 장면 최대 5장 중 쓸 것을 고르고 대표를 지정합니다 · 「다른 장면 더 캡처」 가능</td>
</tr>
<tr>
<td>4. 분류 검토</td>
<td>지역(area1~5)·카테고리를 확인하고, 플랫폼에 없는 값은 신규 제안으로 모읍니다</td>
</tr>
</tbody>
</table>
<blockquote>
<p>수집 쪽은 「수집 파이프라인」 메뉴로 분리했습니다. 이슈 없이 저장소 <code>cms-for-vr-crawler</code> 에서 진행 중입니다.</p>
</blockquote>

<p>가사를 보려고 스크롤해도 영상이 오른쪽 아래 400×225 로 떠서 재생이 이어집니다. kpop·pop PC 적용 · 재생 전 안 뜸 / 재생 후 고정 / 닫기 후 안 뜸을 운영에서 확인했습니다.</p>
<div class="cols">
<div class="col" style="flex:1">

<p><img src="assets/2026-11-06/weeklychart-miniplayer-pop-6725-before.jpg" alt="" style="width:440px;" /></p>

<p>태블릿과 VR 이 모두 <code>1024_%s.jpg</code> 를 쓰고 VR 전용 해상도가 없습니다. 오너 제안은 신규 콘텐츠부터 태블릿·VR 을 1536 으로 생성·제공하고 레거시는 1024 를 유지하는 것입니다.</p>
<table>
<thead>
<tr>
<th>안건</th>
<th>정할 것</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A. 1024 를 버릴 것인가</strong></td>
<td>A1 신규는 <code>1536_%s.jpg</code> 만 생성 / A2 일정 기간 1024 병행 생성 후 끔. 파일명은 <code>1536_%s.jpg</code> 로 새로 만듭니다. 픽셀 2.25배라 태블릿 첫 로딩이 늘어납니다(추정 · 미실측)</td>
</tr>
<tr>
<td><strong>B. 업로드 시점부터 기록(오너 방향)</strong></td>
<td>512·1024·1536·레벨·폴더 번호를 <code>tile_info</code> 에 저장하고 XML 이 그 값만 따르게 할지. flat 전용 → sphere 키 확장. <code>null</code>=미기록(현행) · <code>cube:[]</code>=없음 확인(VR 은 멀티레졸루션) · 값 있음=그대로. 「sphere 출력 바이트 불변」 원칙(<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8773">IND-8773</a>) 해제 승인이 필요합니다</td>
</tr>
<tr>
<td><strong>C. 레거시 반영</strong></td>
<td>백필 후 기존 투어 XML 재생성 범위·시점 결정이 필요합니다(VR 분기 없는 옛 XML 이 다수)</td>
</tr>
</tbody>
</table>

/* 스크린샷 클릭 → 확대 보기
   · 열면 먼저 화면에 꽉 맞춰 보여주고, 한 번 더 누르면 원본 100% 크기로 확대
   · 확대 상태에서 드래그(모바일은 한 손가락)로 이동, 휠·핀치로 자유 배율
   · ESC·✕·배경 클릭으로 닫기 (오너 상시 요구 · 2026-10-06 도입)                      */
(() => {
  if (window.__lb) return; window.__lb = 2;   // 2 = 원본 크기 확대판(2026-11-04)

  const PAD = 28, MAXZ = 4;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:99999;display:none;overflow:hidden;' +
    'background:rgba(10,14,22,.93);touch-action:none;-webkit-user-select:none;user-select:none';

  const im = document.createElement('img');
  im.draggable = false;
  im.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;' +
    'border-radius:4px;box-shadow:0 12px 44px rgba(0,0,0,.5);will-change:transform';
  ov.appendChild(im);

  const hud = document.createElement('div');
  hud.style.cssText = 'position:absolute;right:16px;top:14px;display:flex;gap:8px;align-items:center;' +
    'font:600 13px/1 system-ui,-apple-system,sans-serif;color:#eaf0fb;pointer-events:none';
  const chip = 'background:rgba(255,255,255,.15);padding:8px 12px;border-radius:999px;backdrop-filter:blur(6px)';
  const tip = document.createElement('span'); tip.style.cssText = chip + ';transition:opacity .4s';
  const pct = document.createElement('span'); pct.style.cssText = chip + ';font-variant-numeric:tabular-nums';
  const xb  = document.createElement('button'); xb.textContent = '✕'; xb.setAttribute('aria-label', '닫기');
  xb.style.cssText = chip + ';pointer-events:auto;border:0;color:#fff;width:36px;height:36px;padding:0;' +
    'font:600 16px/1 system-ui;cursor:pointer';
  hud.append(tip, pct, xb);
  ov.appendChild(hud);

  let nw = 0, nh = 0, fit = 1, s = 1, tx = 0, ty = 0;
  let drag = false, lx = 0, ly = 0, moved = false, tipT = 0;

  const clamp = () => {
    const W = innerWidth, H = innerHeight, w = nw * s, h = nh * s;
    tx = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, tx));
    ty = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, ty));
  };
  const draw = () => {
    im.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
    pct.textContent = Math.round(s * 100) + '%';
    const big = nw * s > innerWidth + 1 || nh * s > innerHeight + 1;
    im.style.cursor = big ? (drag ? 'grabbing' : 'grab') : (s < 1 ? 'zoom-in' : 'zoom-out');
  };
  const zoom = (ns, cx, cy) => {
    ns = Math.max(Math.min(fit, 1) * 0.9, Math.min(ns, MAXZ));
    const k = ns / s;
    tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k;
    s = ns; clamp(); draw();
  };
  const showTip = (t) => {
    tip.textContent = t; tip.style.opacity = '1';
    clearTimeout(tipT); tipT = setTimeout(() => { tip.style.opacity = '0'; }, 2600);
  };
  const close = () => { ov.style.display = 'none'; im.removeAttribute('src'); document.body.style.overflow = ''; };

  const open = (src) => {
    im.onload = () => {
      nw = im.naturalWidth; nh = im.naturalHeight;
      im.style.width = nw + 'px'; im.style.height = nh + 'px';
      fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
      s = Math.min(fit, 1);            // 원본보다 크게는 띄우지 않는다
      tx = ty = 0; clamp(); draw();
      showTip(fit < 0.995 ? '클릭하면 원본 크기 · 드래그 이동 · ESC 닫기' : '휠로 확대 · ESC 닫기');
    };
    im.src = src;
    ov.style.display = 'block';
    document.body.style.overflow = 'hidden';
  };

  // 배경 클릭 → 닫기 / 이미지 클릭 → 맞춤 ↔ 원본 토글
  ov.addEventListener('click', (e) => {
    e.stopPropagation();
    if (moved) { moved = false; return; }
    if (e.target === xb || e.target === ov) { close(); return; }
    if (e.target === im) {
      const f = Math.min(fit, 1);
      zoom(s > f + 0.005 ? f : Math.max(1, f * 2), e.clientX, e.clientY);
    }
  });

  // 드래그 이동 (마우스 · 터치 공통)
  im.addEventListener('pointerdown', (e) => {
    if (nw * s <= innerWidth && nh * s <= innerHeight) return;
    drag = true; moved = false; lx = e.clientX; ly = e.clientY;
    im.setPointerCapture(e.pointerId); draw(); e.preventDefault();
  });
  im.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    tx += dx; ty += dy; lx = e.clientX; ly = e.clientY; clamp(); draw();
  });
  const endDrag = (e) => { if (drag) { drag = false; try { im.releasePointerCapture(e.pointerId); } catch (_) {} draw(); } };
  im.addEventListener('pointerup', endDrag);
  im.addEventListener('pointercancel', endDrag);

  // 휠 줌 (슬라이드 전환으로 새지 않게 차단)
  ov.addEventListener('wheel', (e) => {
    e.preventDefault(); e.stopPropagation();
    zoom(s * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY);
  }, { passive: false });

  // 핀치 줌
  let pts = new Map(), pd = 0;
  ov.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') pts.set(e.pointerId, e); });
  ov.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'touch' || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pts.size !== 2) return;
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pd) { moved = true; zoom(s * (d / pd), (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2); }
    pd = d;
  });
  const dropPt = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pd = 0; };
  ov.addEventListener('pointerup', dropPt);
  ov.addEventListener('pointercancel', dropPt);

  // 열려 있는 동안 키보드는 전부 여기서 소비 (화살표가 슬라이드를 넘기면 안 된다)
  document.addEventListener('keydown', (e) => {
    if (ov.style.display === 'none') return;
    const cx = innerWidth / 2, cy = innerHeight / 2;
    if (e.key === 'Escape') close();
    else if (e.key === '+' || e.key === '=') zoom(s * 1.25, cx, cy);
    else if (e.key === '-' || e.key === '_') zoom(s / 1.25, cx, cy);
    else if (e.key === '0') zoom(Math.min(fit, 1), cx, cy);
    else if (e.key === '1') zoom(1, cx, cy);
    else if (e.key === 'ArrowLeft') { tx += 60; clamp(); draw(); }
    else if (e.key === 'ArrowRight') { tx -= 60; clamp(); draw(); }
    else if (e.key === 'ArrowUp') { ty += 60; clamp(); draw(); }
    else if (e.key === 'ArrowDown') { ty -= 60; clamp(); draw(); }
    else return;
    e.preventDefault(); e.stopPropagation();
  }, true);

  addEventListener('resize', () => {
    if (ov.style.display === 'none' || !nw) return;
    fit = Math.min((innerWidth - PAD * 2) / nw, (innerHeight - PAD * 2) / nh);
    clamp(); draw();
  });

  const ready = () => {
    document.body.appendChild(ov);
    document.addEventListener('click', (e) => {
      const t = e.target;
      if (t && t.tagName === 'IMG' && t.closest('section') && !t.classList.contains('emoji')) {
        e.preventDefault(); e.stopPropagation(); open(t.currentSrc || t.src);
      }
    }, true);
  };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', ready) : ready();
})();
</script>
