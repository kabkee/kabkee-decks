<h2 id="%EA%B2%B0%EC%A0%9C-%EC%8B%A4%EC%84%9C%EB%B9%84%EC%8A%A4-%EC%A0%84%ED%99%98-%EB%A7%88%EB%AC%B4%EB%A6%AC">결제 실서비스 전환 마무리</h2>

<h2 id="%F0%9F%92%B3-%EC%8B%A4%EC%B9%B4%EB%93%9C-%EA%B2%B0%EC%A0%9C--%EC%8A%B9%EC%9D%B8%EC%B7%A8%EC%86%8C-%EC%8B%A4%EA%B1%B0%EB%9E%98-%EA%B2%80%EC%A6%9D-%EC%99%84%EB%A3%8C-span-classbadge-date729span"><img class="emoji" draggable="false" alt="💳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b3.svg" data-marp-twemoji=""/> 실카드 결제 — 승인·취소 실거래 검증 완료 <span class="badge-date">7/29</span></h2>
<p>카드 결제 결과를 <span class="hl-red">서버가 받지 못하고 안전망(웹훅)에만 의존</span>하던 결함을 수정하고, 오너가 실제 카드로 결제·취소를 수행해 전 구간을 검증했습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>결제 결과 미처리 (IND-5168)</td>
<td>카드사 결제창에서 돌아온 결과를 서버가 <span class="hl-red">처리하지 않아</span> 모든 카드결제가 지연 통보(웹훅)에만 의존 → 즉시 완료 처리 신설</td>
</tr>
<tr>
<td>중복 처리 방지</td>
<td>결제 결과와 지연 통보가 <span class="hl-green">동시에 와도 한 번만 반영</span>되도록 검증 (사람 카드승인 2회 실거래)</td>
</tr>
<tr>
<td>실환불 검증</td>
<td>포인트 1,000원 + 카드 1,000원 <span class="hl-green">혼합결제 2,000원 건 취소 성공</span> — 영수증·포인트 내역 다국어 표기 동시 확인</td>
</tr>
<tr>
<td>구매자 정보 (IND-5216)</td>
<td>결제 요청에 이름·연락처가 빠져 <span class="hl-red">영수증과 관리자 화면의 구매자란이 공란</span>이던 것 복구</td>
</tr>

<h2 id="%F0%9F%9A%A8-0%EC%9B%90-%ED%9A%8D%EB%93%9D-%EA%B2%BD%EB%A1%9C%EA%B0%80-%EC%8B%A4%EC%84%9C%EB%B9%84%EC%8A%A4%EC%97%90-%EC%97%B4%EB%A0%A4-%EC%9E%88%EB%8D%98-%EA%B2%83-%EC%B0%A8%EB%8B%A8-span-classbadge-date81span"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> 0원 획득 경로가 실서비스에 열려 있던 것 차단 <span class="badge-date">8/1</span></h2>
<p>go-live 점검 중, <span class="hl-red">로그인만 하면 유료 콘텐츠를 0원에 획득할 수 있는 경로가 실서비스 서버에 열려 있는 것</span>을 발견해 당일 차단했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%AC%B8%EC%A0%9C%EC%98%80%EB%82%98">무엇이 문제였나</h3>
<ul>
<li>테스트용 구매 시뮬레이션 기능(<code>purchase/simulate</code>)이 <span class="hl-red">실서비스에서 활성</span></li>
<li>go-live 체크리스트에 <span class="hl-red">미등재</span> — 점검 대상에서 빠져 있던 사각지대</li>
<li>최초 판단은 &quot;테스트 환경 한정&quot;이었으나, 실서비스 도메인 실측으로 <span class="hl-blue">오판을 정정</span>하고 P0로 승격</li>

<h2 id="%F0%9F%94%92-%EC%9C%A0%EB%A3%8C-%EC%BD%98%ED%85%90%EC%B8%A0-%EC%9B%90%EB%B3%B8-%EB%85%B8%EC%B6%9C-%EA%B2%BD%EB%A1%9C-3%EA%B3%B3-%EC%B0%A8%EB%8B%A8-span-classbadge-date73181span"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> 유료 콘텐츠 원본 노출 경로 3곳 차단 <span class="badge-date">7/31~8/1</span></h2>
<p>관련목록·검색·좋아요 목록에서 <span class="hl-red">유료 콘텐츠의 원본 이미지 주소가 그대로 응답에 실려 나가고</span>, 동시에 <span class="hl-red">일반 카드 썸네일은 전부 깨져 보이던</span> 결함을 찾아 수정했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EC%9B%90%EC%9D%B8">원인</h3>
<ul>
<li>접근 권한 판정 로직이 <span class="hl-red">목록·상세 2곳에만</span> 적용</li>
<li>관련목록 · 내 포스트 · 검색 · 좋아요 목록 <span class="hl-red">4개 경로 누락</span></li>
<li>화면은 안전 우선(fail-closed) 설계라, 권한 정보가 비면 <span class="hl-red">썸네일을 통째로 감춤</span> → 관련목록 카드 15개 전멸</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%A1%B0%EC%B9%98-1">조치</h3>
<ul>
<li>누락 4개 경로에 <span class="hl-green">접근 권한 판정 일괄 적용</span> (IND-5449·5458)</li>
<li>잠긴 콘텐츠는 <span class="hl-green">서버가 블러 이미지로 치환</span>해 응답</li>
<li>유료 배지를 <span class="hl-blue">&quot;이용 중 D-n&quot; / &quot;영구소장&quot;</span>으로 세분화 (IND-5463)</li>
<li>배포 후 실서버 반영까지 실측 확인 (IND-5469)</li>
</ul>
</div>
</div>

<h2 id="%F0%9F%96%BC%EF%B8%8F-%EC%B2%A8%EB%B6%80-%EC%9D%B4%EB%AF%B8%EC%A7%80-%EA%B9%A8%EC%A7%90--%ED%91%9C%EC%8B%9C-%EC%B2%B4%EA%B3%84-%EC%8B%A0%EC%84%A4-span-classbadge-date84span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> 첨부 이미지 깨짐 — 표시 체계 신설 <span class="badge-date">8/4</span> <span class="badge-new">NEW</span></h2>
<p>오너가 <span class="hl-blue">&quot;첨부 이미지가 없는데 카드에는 썸네일이 보이고, 눌러도 무한 로딩만 된다&quot;</span>고 지적한 건에서 시작해, 구버전에서 넘어온 이미지 경로 문제 전반을 정리했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%AC%B8%EC%A0%9C%EC%98%80%EB%82%98-1">무엇이 문제였나</h3>
<ul>
<li>상세 화면에만 <span class="hl-red">구버전 이미지 경로 대체 로직이 빠져</span> 있어 188건이 깨짐</li>
<li>깨진 이미지를 눌러도 <span class="hl-red">라이트박스가 무한 로딩</span></li>
<li>정상 이미지가 <span class="hl-red">8초 뒤 깨짐으로 뒤집히던</span> 오탐도 발견 (IND-5580)</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%A1%B0%EC%B9%98--%EC%98%A4%EB%84%88-%EB%B0%A9%EC%B9%A8-%EB%B0%98%EC%98%81">조치 — 오너 방침 반영</h3>
<ul>
<li>구버전 경로 대체 복원 + <span class="hl-green">깨짐/무응답 상태를 아이콘으로 명시</span></li>
<li>오너 지시: <span class="hl-blue">이미지 태그를 지우지 않고, &quot;이미지 없음&quot; 표시를 남긴다</span> — 이미지가 있었다는 증거 보존</li>
<li>본문 안쪽 첨부까지 확대 적용 (IND-5574)</li>
</ul>
</div>
</div>

<div class="cols">
<div class="col">
<h3 id="%EC%B9%B4%EB%93%9C-%ED%91%9C%EB%A9%B4-%EA%B0%9C%ED%8E%B8-ind-5521">카드 표면 개편 (IND-5521)</h3>
<ul>
<li>콘텐츠 종류 칩에 <span class="hl-green">아이콘·색상 부여</span></li>
<li><span class="hl-green">관람 이력 눈 아이콘</span> 신설 — 본 콘텐츠 구분</li>
<li>좋아요 수 노출 제거 (요청 반영)</li>
<li>칩 모서리 규격(6px) 정정 (IND-5544)</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%A0%95%EB%A0%AC-%EC%A0%95%EC%B1%85-%ED%86%B5%EC%9D%BC-ind-5522">정렬 정책 통일 (IND-5522)</h3>
<ul>
<li><span class="hl-red">좋아요순 선택지 제거</span> — 3개 지면 일괄</li>
<li>인기순 재정의: <span class="hl-blue">좋아요 → 조회수 → 최신</span></li>
<li>조회순과 인기순이 <span class="hl-red">왜 다른지 알 수 없던</span> 오너 질의에서 출발한 정리</li>
<li>내부 가중치 참조 제거로 기준 단일화</li>
</ul>
