<h2 id="%E2%9A%A1-vr-%EB%B7%B0%EC%96%B4--%ED%99%88-%ED%9E%88%EC%96%B4%EB%A1%9C-%EB%A1%9C%EB%94%A9-%EC%86%8D%EB%8F%84-%EA%B0%9C%EC%84%A0-span-classbadge-date106span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> VR 뷰어 · 홈 히어로 로딩 속도 개선 <span class="badge-date">10/6</span> <span class="badge-new">NEW</span></h2>
<p>오너가 「VR 첫 로딩이 느리고, 히어로는 넘긴 뒤에야 로딩이 시작되며 이전 슬라이드가 먼저 사라진다」고 지적해 원인부터 실측했습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>조치</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>원인 실측</td>
<td>병목은 파일 개수가 아니라 API 응답 뒤의 직렬 대기</td>
<td><span class="hl-red">주원인 확정</span></td>
</tr>
<tr>
<td>VR 뷰어</td>
<td><code>vr.js</code> 를 API 응답과 동시에 받고, 재방문 시 정적 파일은 브라우저 캐시 사용</td>
<td><span class="hl-green">완료</span></td>
</tr>
<tr>
<td>히어로 클릭 → 미리보기</td>
<td>iframe 제거·직접 표시 + 옆 슬라이드 미리 받기</td>
<td><span class="hl-blue">2,062ms → 239ms</span> (캐시 사용 시 89ms)</td>
</tr>
<tr>
<td>히어로 전환 요청 수</td>
<td>미리 받은 파일을 그대로 재사용</td>
<td><span class="hl-blue">13건 → 2건</span></td>
</tr>
<tr>
<td>이전 슬라이드 사라짐</td>
<td>이동 애니메이션이 끝난 뒤 제거</td>
<td><span class="hl-green">QC 통과</span></td>
</tr>
<tr>
<td>끝 ↔ 끝 전환</td>
<td>전체를 거꾸로 감던 동작 → 한 칸 이동 후 순간 보정</td>
<td><span class="hl-green">QC 통과</span> (IND-7984)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>측정은 미리보기 배포(draft)에서 했고 운영에는 배포하지 않았습니다. 첫 타일 XML 지연(약 2.3초) 개선 여부 등 4건은 오너 판단 대기입니다.</p>
</blockquote>

<h2 id="%F0%9F%A4%96-ai%EB%A1%9C-%EB%A7%8C%EB%93%A0-%ED%8C%8C%EB%85%B8%EB%9D%BC%EB%A7%88-%EC%95%88%EB%82%B4-span-classbadge-date916921span"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> AI로 만든 파노라마 안내 <span class="badge-date">9/16~9/21</span></h2>
<p>AI로 만든 파노라마는 관리자가 표시를 켜면 뷰어에 안내가 나옵니다.</p>
<div style="font-size:0.8em">
<p><strong>바뀐 것</strong></p>
<ul>
<li>관리자 파노라마 등록·일괄등록·정보수정에 「AI 생성 이미지」 스위치</li>
<li>뷰어 파노라마 정보창에 「이 파노라마는 AI로 생성된 이미지입니다」(7개 언어)</li>
<li>바닥 로고 옆 「AI GENERATED」 원형 표시 (로고를 가리지 않게 위치 조정)</li>
<li>기존 파노라마는 일괄 변경하지 않고, 필요한 것만 관리자가 켭니다</li>
</ul>
<p><strong>시연 순서</strong> — 현재 AI 표시가 켜진 콘텐츠가 없어 시연 전에 하나를 켜야 합니다</p>
<ol>
<li>관리자 파노라마 화면에서 「(주)인디스팟 · 공원」 정보수정 → 「AI 생성 이미지」 켜기</li>
<li>뷰어를 열고 바닥을 내려다보면 AI 표시, 정보창에 안내 문구</li>
<li>시연 후 스위치를 다시 끕니다 (실제 데이터)</li>
</ol>
</div>
<div class="links"><span class="lbl">시연</span>
<a class="lnk admin" href="http://100.120.25.127:5277/panorama" target="_blank">관리자 파노라마</a>
<a class="lnk" href="http://100.120.25.127:5174/vr/4qorh7b8?pano=2523" target="_blank">뷰어 — 공원</a>
</div>
</section>

<h2 id="%F0%9F%8E%AC-360%EB%8F%99%EC%98%81%EC%83%81-%EA%B8%B0%ED%9A%8D%EC%84%9C-span-classbadge-date917918span"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ac.svg" data-marp-twemoji=""/> 360동영상 기획서 <span class="badge-date">9/17~9/18</span></h2>
<p>사진처럼 360동영상도 뷰어에서 보여주기 위한 기획서입니다. 개발은 하지 않고 기획만 했습니다.</p>
<div class="cols"><div class="col" style="font-size:0.74em">
<p><strong>담은 내용</strong></p>
<ul>
<li>지금 구조 조사, 화질 자동 조절 방식</li>
<li>유튜브 360 영상이 브라우저별로 되는지 확인한 표</li>
<li>일반 VR · 평면 · 영상 구분 표시 시안 2개, 작업 순서</li>
</ul>
<p><strong>오너가 정할 7가지</strong> (괄호는 추천)</p>
<ol>
<li>저장 방식 (파노라마 종류에 「360영상」 추가)</li>
<li>유튜브 영상엔 핫스팟·포스트 불가 수용 (조건부 수용)</li>
<li>저화질 영상 생성 (우리 서버에서 시작)</li>
<li>목록 카드 「영상 포함」 표시 (나중에)</li>
<li>항공 촬영 배지 (넣지 않음) · 6. 백업 범위 (원본만)</li>
<li>판매자 등록 허용 (처음엔 관리자만)</li>
</ol>
</div><div class="col"><figure style="margin:0 0 8px"><img src="assets/2026-10-07/21-video-plan-doc.jpg" style="display:block;max-width:100%;max-height:390px;width:auto;margin:0 auto" /><figcaption>기획서 첫 화면</figcaption></figure></div></div>
<div class="links"><span class="lbl">시연</span>
<a class="lnk" href="https://kabkee-decks.netlify.app/ideas/2026-09-18-look360-360video-content-plan.html" target="_blank">기획서 열기</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="18" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="88">
<h2 id="%F0%9F%91%86-%EB%AC%B4%EB%A3%8C-%EC%BD%98%ED%85%90%EC%B8%A0%EB%8A%94-%EB%88%84%EB%A5%B8-%EC%9E%A5%EB%A9%B4%EC%9C%BC%EB%A1%9C-%EB%B0%94%EB%A1%9C-%EC%9D%B4%EB%8F%99-span-classbadge-date930span"><img class="emoji" draggable="false" alt="👆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f446.svg" data-marp-twemoji=""/> 무료 콘텐츠는 누른 장면으로 바로 이동 <span class="badge-date">9/30</span></h2>
<p>무료 콘텐츠는 상세 페이지 파노라마 목록에서 누른 장면이 뷰어에서 바로 열립니다. 유료는 기존처럼 미리보기 창만 뜹니다.</p>
<div class="cols"><div class="col" style="font-size:0.74em">
<p><strong>시연 순서 (무료)</strong></p>
<ol>
<li>「경희판교VI캠퍼스」 상세에서 「파노라마 목록」</li>
<li>「주차장 출입구」 썸네일 클릭</li>
<li>뷰어가 첫 장면이 아니라 <strong>주차장 출입구</strong>로 바로 열림</li>
</ol>
<p><strong>비교 (유료)</strong></p>
<ul>
<li>「K SHOP 2018」 상세에서 「입구」를 누르면 페이지는 그대로, 미리보기 창만 뜸</li>
</ul>

<h2 id="%E2%AD%95-%ED%9D%B0-%EB%B0%B0%EA%B2%BD-%ED%94%84%EB%A1%9C%ED%95%84-%EC%82%AC%EC%A7%84-%ED%85%8C%EB%91%90%EB%A6%AC-span-classbadge-date922span"><img class="emoji" draggable="false" alt="⭕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2b55.svg" data-marp-twemoji=""/> 흰 배경 프로필 사진 테두리 <span class="badge-date">9/22</span></h2>
<p>프로필 사진 배경이 흰색이면 카드와 구분되지 않던 것을, 옅은 그림자와 얇은 테두리로 보이게 했습니다.</p>
<div class="cols"><div class="col" style="font-size:0.74em">
<p><strong>적용한 6개 화면</strong></p>
<ul>
<li>360포스트 목록 카드 · 작성 · 수정</li>
<li>설정 탭 · 문의(Q&amp;A) 글 · 댓글 입력줄</li>
</ul>
<p><strong>시연 순서</strong></p>
<ol>
<li>링크를 열면 오른쪽에 「360포스트」가 바로 열림</li>
<li>「경희대학교 · 셔틀엘리베이터 이용안내」 카드</li>
<li>흰 로고 둘레에 옅은 동그라미 테두리</li>
</ol>
</div><div class="col"><figure style="margin:0 0 8px"><img src="assets/2026-10-07/22-post-avatar.jpg" style="display:block;max-width:100%;max-height:390px;width:auto;margin:0 auto" /><figcaption>경희대학교 흰 배경 로고</figcaption></figure></div></div>
<div class="links"><span class="lbl">시연</span>
<a class="lnk" href="http://100.120.25.127:5174/vr/xo6jh8ib?pano=33044&tab=post" target="_blank">360포스트 — 경희대학교</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="20" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="88">
<h2 id="%F0%9F%94%97-%EA%B3%B5%EC%9C%A0-%EB%A7%81%ED%81%AC%EB%A1%9C-%ED%83%AD-%EB%B0%94%EB%A1%9C-%EC%97%B4%EA%B8%B0--%EA%B0%A4%EB%9F%AC%EB%A6%AC-%ED%83%AD-%ED%91%9C%EC%8B%9C-span-classbadge-date916span"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> 공유 링크로 탭 바로 열기 · 갤러리 탭 표시 <span class="badge-date">9/16</span></h2>
<p>주소에 탭을 지정해 공유하면 그 탭이 바로 열리고, 장소소개의 「갤러리」 탭을 누르면 선택 표시가 제대로 옮겨갑니다.</p>
<div class="cols"><div class="col" style="font-size:0.74em">
<p><strong>고친 것 ① 360포스트 탭 바로 열기</strong></p>
<ul>
<li>주소 끝 <code>?tab=post</code> 를 붙여 공유해도 탭이 열리지 않던 것 수정</li>
</ul>
<p><strong>고친 것 ② 갤러리 탭 선택 표시</strong></p>
<ul>
<li>「갤러리」를 눌러도 밑줄이 「장소정보」에 남던 것 수정</li>
</ul>
<p><strong>시연 순서</strong></p>
<ol>
<li>첫 링크 → 360포스트 패널이 바로 열림</li>
<li>둘째 링크 → 「콘텐츠 소개 / 장소정보 / 갤러리」</li>
<li>「갤러리」 클릭 → 밑줄이 갤러리로 이동해 유지</li>
</ol>
</div><div class="col"><figure style="margin:0 0 8px"><img src="assets/2026-10-07/23-intro-gallery.jpg" style="display:block;max-width:100%;max-height:390px;width:auto;margin:0 auto" /><figcaption>장소소개 탭 (콘텐츠 소개 · 장소정보 · 갤러리)</figcaption></figure></div></div>
<div class="links"><span class="lbl">시연</span>
<a class="lnk" href="http://100.120.25.127:5174/vr/xo6jh8ib?tab=post" target="_blank">360포스트 탭 바로 열기</a>
<a class="lnk" href="http://100.120.25.127:5174/vr/09a2e3fd?tab=intro" target="_blank">장소소개 · 갤러리</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="21" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="88">
<h2 id="%F0%9F%94%97-%EA%B0%A4%EB%9F%AC%EB%A6%AC%EA%B9%8C%EC%A7%80-%EB%B0%94%EB%A1%9C-%EC%97%B4%EB%A6%AC%EB%8A%94-%EA%B3%B5%EC%9C%A0-%EB%A7%81%ED%81%AC-span-classbadge-date106span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> 갤러리까지 바로 열리는 공유 링크 <span class="badge-date">10/6</span> <span class="badge-new">NEW</span></h2>
<p>앞 슬라이드를 시연하다가, 「갤러리」를 눌러도 주소가 바뀌지 않아 복사한 링크로는 갤러리까지 이동하지 않는 점이 발견되었습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>조치</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>섹션 클릭</td>
<td>주소에 <code>section=gallery</code> 를 반영 (뒤로 가기 기록은 늘리지 않음)</td>
<td><span class="hl-green">완료</span></td>
</tr>
<tr>
<td>링크로 진입</td>
<td>장소소개가 열린 뒤 갤러리로 자동 스크롤 + 밑줄 유지</td>
<td><span class="hl-green">1차 반려 → 수정 후 QC 통과</span></td>
</tr>
<tr>
<td>공유 버튼 링크</td>
<td>콘텐츠 단위 주소 유지 (열람 위치는 싣지 않음)</td>
<td><span class="hl-blue">결정</span></td>
</tr>
<tr>
<td>직접 스크롤</td>
<td>주소에 반영하지 않음 (클릭만 반영)</td>
<td><span class="hl-blue">결정</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>VR스토리에서 「시작하기」를 누르면 주소에서 섹션 정보가 빠집니다. 화면은 정상이며, 복원이 필요하면 별도로 요구사항을 받겠습니다.</p>
</blockquote>
<div class="links">

</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="22" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="88">
<h2 id="%F0%9F%93%B8-%ED%99%94%EB%A9%B4--%EB%A7%81%ED%81%AC%EB%A1%9C-%EC%97%B4%EB%A9%B4-%EA%B0%A4%EB%9F%AC%EB%A6%AC%EA%B0%80-%EC%84%A0%ED%83%9D%EB%90%9C-%EC%83%81%ED%83%9C-span-classbadge-date106span"><img class="emoji" draggable="false" alt="📸" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f8.svg" data-marp-twemoji=""/> 화면 — 링크로 열면 갤러리가 선택된 상태 <span class="badge-date">10/6</span></h2>
<p><code>section=gallery</code> 가 붙은 주소로 열면 장소소개 패널이 열리고 「갤러리」 밑줄과 스크롤 위치가 유지됩니다.</p>
<p><img src="assets/2026-10-07/30-gallery-deeplink.jpg" alt="" style="width:640px;" /></p>

<a class="lnk" href="http://100.120.25.127:5174/vr/09a2e3fd?tab=intro&section=gallery" target="_blank">http://100.120.25.127:5174/vr/09a2e3fd?tab=intro&amp;section=gallery</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="23" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="88">
<h2 id="%E2%9C%82%EF%B8%8F-%EA%B8%B4-%EC%B1%84%EB%84%90-%EC%9D%B4%EB%A6%84-%ED%95%9C-%EC%A4%84-%EC%A4%84%EC%9E%84-span-classbadge-date915span"><img class="emoji" draggable="false" alt="✂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2702.svg" data-marp-twemoji=""/> 긴 채널 이름 한 줄 줄임 <span class="badge-date">9/15</span></h2>
<p>채널 이름이 길면 제목 카드가 두 줄로 늘어나던 것을, 한 줄로 두고 넘치면 「…」로 줄였습니다.</p>
<div class="cols"><div class="col" style="font-size:0.74em">
<p><strong>바뀐 것</strong></p>
<ul>
<li>채널명만 줄어들고, 인증 배지·날짜·조회수는 그대로</li>
<li>휴대폰 화면에서 두 줄 → 한 줄 (PC는 변화 없음)</li>
</ul>
<p><strong>시연 순서</strong></p>
<ol>
<li>휴대폰으로 링크를 엽니다</li>
<li>왼쪽 위 제목 카드의 「산림복지 국민참여 공모전 운영…」</li>
<li>한 줄에서 끝나고 날짜·조회수가 같은 줄에 남음</li>
</ol>
</div><div class="col" style="max-width:240px;margin:0 auto"><figure style="margin:0 0 8px"><img src="assets/2026-10-07/24-channel-ellipsis.jpg" style="display:block;max-width:100%;max-height:390px;width:auto;margin:0 auto" /><figcaption>휴대폰 화면</figcaption></figure></div></div>
<div class="links"><span class="lbl">시연</span>
<a class="lnk" href="http://100.120.25.127:5174/vr/1lfn283t" target="_blank">산림복지 공모전 (휴대폰으로)</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="24" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="88">
<h2 id="%F0%9F%8C%90-vr-%EC%95%88%EC%97%90%EC%84%9C-%EC%96%B8%EC%96%B4%EB%A5%BC-%EB%B0%94%EA%BE%B8%EB%A9%B4-%EC%A0%84%EB%B6%80-%EB%B0%94%EB%A1%9C-%EB%B0%94%EB%80%9C-span-classbadge-date914915span"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> VR 안에서 언어를 바꾸면 전부 바로 바뀜 <span class="badge-date">9/14~9/15</span></h2>
<p>콘텐츠 언어를 바꿔도 장면 목록·위치 표시·이동 화살표 이름이 한국어로 남던 것을, 새로고침 없이 바로 바뀌게 했습니다.</p>
<div class="cols"><div class="col" style="font-size:0.74em">
<p><strong>바뀐 것</strong></p>
<ul>
<li>아래 장면 목록과 위치 표시(경로)가 즉시 번역</li>
<li>이동 화살표 이름표와 마우스를 올리면 뜨는 설명도 번역</li>
<li>영어판 같은 별도 언어판 VR은 처음부터 번역된 이름으로</li>
</ul>
<p><strong>시연 순서</strong></p>
<ol>
<li>링크를 열면 아래 목록에 「고공전경」</li>
<li>옆 패널 「설정」 → 「콘텐츠 언어」 → English</li>
<li>목록이 「High altitude view」로, 화살표 이름표도 영어로 바뀜 · 「사용 안 함」이면 원래대로</li>
</ol>
</div><div class="col"><figure style="margin:0 0 8px"><img src="assets/2026-10-07/18-lang-group-ko.jpg" style="display:block;max-width:100%;max-height:390px;width:auto;margin:0 auto" /><figcaption>바꾸기 전 (한국어)</figcaption></figure></div></div>
<div class="links"><span class="lbl">시연</span>
<a class="lnk" href="http://100.120.25.127:5174/vr/wrpkbkcy?pano=4322" target="_blank">2017 경기관광박람회 · 고공전경</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="25" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="88">
<h2 id="%F0%9F%8F%A0-%ED%99%88-%EB%B0%B0%EB%84%88-%EB%B6%84%EB%A5%98-%EC%9D%B4%EB%A6%84%EB%8F%84-%EC%82%AC%EC%9D%B4%ED%8A%B8-%EC%96%B8%EC%96%B4%EB%A5%BC-%EB%94%B0%EB%9D%BC%EA%B0%90-span-classbadge-date916917span"><img class="emoji" draggable="false" alt="🏠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e0.svg" data-marp-twemoji=""/> 홈 배너 분류 이름도 사이트 언어를 따라감 <span class="badge-date">9/16~9/17</span></h2>
<p>사이트 언어를 일본어 등으로 바꿔도 홈 첫 화면 배너의 분류 이름(대학교, 스케이트파크 등)이 한국어로 남던 것을 고쳤습니다.</p>
<div class="cols"><div class="col" style="font-size:0.74em">
<p><strong>바뀐 것</strong></p>
<ul>
<li>공식 번역이 없는 언어는 자동번역으로 표시</li>
<li>한국어 외 6개 언어에서 한국어 잔존 0건</li>
</ul>
<p><strong>시연 순서</strong></p>
<ol>
<li>홈을 열고 배너 위 분류 이름을 봅니다</li>
<li>위쪽 언어 버튼 → 「日本語」</li>
<li>새로고침 없이 분류·지역 이름이 일본어로</li>
</ol>
<p><strong>참고</strong> 배너는 열 때마다 무작위로 바뀝니다. 로그인 상태면 계정 언어가 우선이라 비로그인으로 시연하세요.</p>
</div><div class="col"><figure style="margin:0 0 8px"><img src="assets/2026-10-07/19-home-hero-ko-crop.jpg" style="display:block;max-width:82%;max-height:160px;width:auto;margin:0 auto" /><figcaption>한국어</figcaption></figure><figure style="margin:0 0 8px"><img src="assets/2026-10-07/20-home-hero-ja-crop.jpg" style="display:block;max-width:82%;max-height:160px;width:auto;margin:0 auto" /><figcaption>日本語</figcaption></figure></div></div>
<div class="links"><span class="lbl">시연</span>
<a class="lnk" href="http://100.120.25.127:5174/" target="_blank">홈 (l3 플랫폼)</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="26" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="88">
<h2 id="%F0%9F%A7%B9-vr%EC%9D%84-%EC%A7%80%EC%9A%B4-%EB%92%A4-%EB%82%A8%EB%8D%98-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%A0%95%EB%A6%AC-span-classbadge-date917-923-%EB%B0%98%EC%98%81span"><img class="emoji" draggable="false" alt="🧹" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f9.svg" data-marp-twemoji=""/> VR을 지운 뒤 남던 데이터 정리 <span class="badge-date">9/17 (9/23 반영)</span></h2>
<p>화면에서 보이는 변화는 없는 내부 정리 작업입니다.</p>
<div style="font-size:0.8em">
<p><strong>무슨 일이었나</strong></p>
<ul>
<li>지워진 VR에 딸린 이동 화살표·번역·좋아요 통계 약 <strong>590건</strong>이 주인 없이 남아 있었습니다</li>
</ul>
<p><strong>원인</strong></p>
<ul>
<li>개발용 데이터를 처음부터 다시 옮기면서(9/8) 번호가 다시 매겨져 생긴 찌꺼기였습니다</li>
</ul>

<tr>
<td>서버 시크릿 11종</td>

<tr>

</blockquote>

<h2 id="%F0%9F%94%8E-%EA%B0%80%EC%88%98-%EC%A0%95%EB%B3%B4-%EC%88%98%EC%A7%91--%EA%B3%B5%EC%8B%9D-api-%EC%9A%B0%EC%84%A0--%EC%9B%B9-%EA%B2%80%EC%83%89-%EA%B0%9C%EC%84%A0-span-classbadge-date917104span"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> 가수 정보 수집 — 공식 API 우선 · 웹 검색 개선 <span class="badge-date">9/17~10/4</span></h2>
<p>가수 정보 빈 구간이 커서 수집을 전체 연도로 넓히고, 공식 데이터(Wikidata·MusicBrainz)를 먼저 쓰며, 채택 0건이던 웹 검색 수집기를 고쳤습니다.</p>

<th>결과</th>
</tr>

<td><span class="hl-green">완료</span></td>
</tr>
<tr>

</tr>
<tr>
<td>웹 검색 대상 축소</td>
<td>이미 채운 항목 제외</td>
<td><span class="hl-blue">kpop 761→571 · pop 1,264→622명</span></td>
</tr>
<tr>

<tr>
<td>오채택 사고</td>

</tr>
<tr>
<td>재개 결과</td>

<blockquote>
<p>운영 DB 반영은 오너 승인 카드 후 집행했습니다. 하루 20요청 기준 남은 대상에 수개월이 걸려, 처리량 상향은 오너 판단 사항입니다.</p>
</blockquote>
