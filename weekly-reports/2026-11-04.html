<h2 id="%F0%9F%94%91-%EC%9D%B4%EB%B2%88-%EC%A3%BC%EC%97%90-%EC%A0%95%ED%95%9C-%EA%B7%9C%EC%B9%99-span-classbadge-date10271102span"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> 이번 주에 정한 규칙 <span class="badge-date">10/27~11/02</span></h2>
<table>
<thead>
<tr>
<th>결정</th>
<th>내용</th>
<th>근거</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>embed 비공개 처리</strong></td>
<td>유료·비밀번호·비공개는 embed·oEmbed 모두 「있다는 것조차 알 수 없게」 없는 콘텐츠와 같은 404·같은 화면. Referer 화이트리스트·워터마크는 두지 않음</td>
<td><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8885">IND-8885</a> 오너 10/27</td>
</tr>
<tr>
<td><strong>레거시 설정 변경 원칙</strong></td>
<td>look360.kr CloudFront 는 <strong>「썸네일 파일 규칙만」</strong> 허용 목록에 추가. 썸네일을 beta 로 옮기는 안은 기각 — beta 는 새 플랫폼 전용이고 look360.kr 저장소는 레거시로 계속 유지</td>
<td><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8909">IND-8909</a> 오너 10/27</td>
</tr>
<tr>
<td><strong>유입 버튼 방식</strong></td>

<h2 id="%EC%9A%B4%EC%98%81-%EC%95%88%EC%A0%95%ED%99%94--look360kr-1101-%EB%AC%B4%EC%9D%91%EB%8B%B5">운영 안정화 — look360.kr 11/01 무응답</h2>
<p>약 5분간 사이트가 응답하지 않았습니다. 원인은 사용자 증가가 아니라 2015년 코드의 버그였습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%9A%A8-%EC%A7%81%EC%A0%91-%EC%9B%90%EC%9D%B8--%EC%A0%91%EC%86%8D-%EA%B8%B0%EB%A1%9D-100%EB%A7%8C-%ED%96%89-%ED%86%B5%EC%A7%B8-%EC%82%AD%EC%A0%9C-span-classbadge-date1101-2234span"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> 직접 원인 — 접속 기록 100만 행 통째 삭제 <span class="badge-date">11/01 22:34</span></h2>
<p>방문자 접속 경로 기록(<code>rb_s_referer</code>)이 100만 건을 넘는 순간, 「오래된 1건 삭제」 코드가 <code>delete … where 7003202</code>(항상 참)이 되어 <strong>100만 행을 통째로 삭제</strong>했습니다. 삭제가 끝나자 첫 방문자 요청이 운영 중에 통계 테이블 5개를 재구성(OPTIMIZE)하기 시작했고, 그동안 방문자 요청들이 잠금을 기다리며 연결 60개를 모두 채웠습니다. <strong>2015-10 코드부터 있던 버그</strong>입니다(<code>switchs/end/visitercheck/main.php</code>).</p>
<table>
<thead>
<tr>
<th>지표</th>
<th style="text-align:right">평소 (22:25)</th>
<th style="text-align:right">장애 (22:37~38)</th>
</tr>
</thead>
<tbody>
<tr>
<td>DB CPU</td>
<td style="text-align:right">5~7%</td>
<td style="text-align:right"><span class="hl-red">91%</span></td>
</tr>
<tr>
<td>디스크 읽기(ReadIOPS)</td>
<td style="text-align:right">2~3</td>
<td style="text-align:right"><span class="hl-red">최대 1,110</span></td>
</tr>
<tr>
<td>DB 연결 수</td>
<td style="text-align:right">0~1</td>
<td style="text-align:right"><span class="hl-red">58 / 60</span></td>
</tr>
<tr>
<td>분당 웹 요청</td>
<td style="text-align:right">278건 (22:20 · 이때 DB CPU 6%)</td>
<td style="text-align:right">15~32건</td>
</tr>
</tbody>
</table>
<blockquote>
<p>증거: DB 디스크 여유 공간이 22:33~22:41 <strong>−231MB</strong>(대량 삭제) → 22:42 <strong>+274MB</strong> · 22:45 <strong>+151MB</strong>(재구성으로 회수)로 움직이고, 남은 기록의 가장 오래된 행이 정확히 22:42:15 입니다. <strong>「사용자 증가」는 원인이 아닙니다</strong> — 요청이 훨씬 많던 22:20 에 DB CPU 는 6% 였습니다. DB 사양(db.t4g.micro · 메모리 1GB · 버퍼 풀 128MB · 연결 상한 60)에 여유가 없어 상황이 커졌습니다. 작업실(pano-stitcher)·flat 개발과는 무관합니다(그 시간 작업실 요청 0건).</p>
</blockquote>

</section>

<td style="text-align:right">7,179,227 (<span class="hl-red">149,406회 부풀림</span>)</td>
<td style="text-align:right"><span class="hl-green">7,029,821</span> = 카운터 합계와 일치</td>
</tr>
<tr>
<td>방문 통계 조회 <code>rb_s_browser</code></td>
<td style="text-align:right">약 4,000행</td>
<td style="text-align:right"><span class="hl-green">1~2행</span></td>
</tr>
<tr>
<td>접속 기록 INSERT 의 UA·Referer</td>
<td style="text-align:right">이스케이프 없음 — <span class="hl-red">SQL 인젝션 통로</span></td>
<td style="text-align:right">이스케이프</td>
</tr>
<tr>
<td>검색어 값 SQL 이스케이프</td>
<td style="text-align:right">없음 — <code>UNION ALL SELECT …</code> 공격 시도 문자열 <span class="hl-red">15건 실제 저장</span></td>
<td style="text-align:right">이스케이프 + upsert</td>
</tr>
<tr>
<td>관리자 파노라마 삭제 빈 조건</td>
<td style="text-align:right">조건이 비면 <span class="hl-red">테이블 전체 삭제</span> 가능</td>
<td style="text-align:right">가드 추가</td>
</tr>
<tr>
<td>검색 페이지 — 검색어 없이 검색</td>
<td style="text-align:right">파노라마 3만여 개 전체 검색 · 0.82~0.88초</td>
<td style="text-align:right"><span class="hl-green">DB 검색 생략 + 안내 · 0.05초</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>오너 결정: DB 사양 상향(t4g.small 월 +$19)·Aurora Serverless v2(최소 월 약 $73)는 <strong>다음 피크의 slow log 를 보고</strong> 결정합니다. 다음 주 할 일 — 백업 테이블 <code>bak20261102_*</code> 5개를 1~2주 뒤 삭제하고, 검색어가 있는 검색의 첫 검색 0.75~1.08초(버퍼 풀 128MB 부족으로 디스크를 읽는 탓 · 쿼리 자체는 22~39ms)는 사양 결정과 함께 봅니다.</p>
</blockquote>
</section>

<p><span class="sec-num">Section 03</span></p>
<h2 id="%EC%99%B8%EB%B6%80-%ED%99%95%EC%82%B0--embed--oembed--%EC%9C%A0%EC%9E%85-%EB%B2%84%ED%8A%BC">외부 확산 — embed · oEmbed · 유입 버튼</h2>
<p>Look360 콘텐츠가 외부 사이트로 퍼지고, 그 사람들이 다시 Look360 으로 들어오게 하는 묶음입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%94%97-oembed-%EC%A0%9C%EA%B3%B5--%EB%AC%B4%EC%97%87%EC%9D%84-%EB%A7%8C%EB%93%A4%EC%97%88%EB%82%98-span-classbadge-date1027span"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> oEmbed 제공 — 무엇을 만들었나 <span class="badge-date">10/27~</span></h2>
<p>l3 플랫폼은 그동안 oEmbed 를 제공하지 않았습니다. 외부 사이트에 Look360 주소를 붙여도 링크로만 남고 영상처럼 펼쳐지지 않았습니다.</p>
<table>
<thead>
<tr>
<th>만든 것</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>/oembed</code> 엔드포인트</td>
<td>콘텐츠 주소를 받아 제목·썸네일·iframe 코드를 JSON 으로 돌려줍니다</td>
</tr>
<tr>
<td>찾기용 링크 태그</td>
<td>모든 VR 페이지에 <code>&lt;link rel=&quot;alternate&quot; type=&quot;application/json+oembed&quot;&gt;</code> 를 넣어, 페이지를 직접 열어보는 프로그램(WordPress 링크 찾기·Iframely 등)이 우리를 찾게 합니다</td>
</tr>
<tr>
<td>embed 가능 판정 단일화</td>
<td>유료·비밀번호·비공개(hidden 은 비번 유무 무관)는 <strong>없는 콘텐츠와 같은 404·같은 화면</strong>. 「iframe 가능/불가」만 구분하고 Referer 화이트리스트·워터마크는 두지 않습니다</td>
</tr>
<tr>
<td>embed 허용 범위</td>
<td>VIEW360 만 embed 허용하고 VRSTORY 등은 「없음」. 공유 창 탭 내용 섞임도 함께 고쳤습니다</td>
</tr>
</tbody>
</table>
<blockquote>
<p>hidden 콘텐츠의 <code>/vr</code> 직링크 감상은 <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-4741">IND-4741</a> 결정 그대로 유지합니다. 출처는 오너 자료 <code>oEmbed-API-Look360.pptx</code>(2026-03-09)입니다.</p>
</blockquote>
<div class="links">
<span class="lbl">확인</span>
<a class="lnk" href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8885" target="_blank">IND-8885 oEmbed provider</a>
<a class="lnk" href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8892" target="_blank">IND-8892 embed 후속</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%96%BC%EF%B8%8F-look360kr-%EC%8D%B8%EB%84%A4%EC%9D%BC-%EC%99%B8%EB%B6%80-%ED%97%88%EC%9A%A9--embed-%EB%A5%BC-%EB%A7%8C%EB%93%A4%EB%8B%A4%EA%B0%80-%EC%B0%BE%EC%9D%80-%EB%AC%B8%EC%A0%9C-span-classbadge-date1027-%EC%9A%B4%EC%98%81-livespan"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> look360.kr 썸네일 외부 허용 — embed 를 만들다가 찾은 문제 <span class="badge-date">10/27 운영 LIVE</span></h2>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 이 변경은 <strong>embed 기능(<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8885">IND-8885</a>·<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8892">IND-8892</a>)을 구현하면서 확인된 문제</strong>이고, oEmbed 응답을 점검하다 바꾼 사항입니다(별도 요청이 아님). 응답의 주소 섞임 자체는 개발 서버로 테스트해 생긴 정상 동작이었지만, 그 과정에서 <strong>썸네일 URL 이 외부에서 403</strong> 인 것을 발견했습니다. CloudFront <code>/files/*</code> 의 referer 가드 때문에 <strong>oEmbed 썸네일뿐 아니라 카톡·페이스북 공유 카드(OG 이미지)도 안 나오던 상태</strong>였습니다(이번 작업 전부터 있던 문제).</p>
<table>
<thead>
<tr>
<th>대상</th>
<th>10/27 반영 전</th>
<th>반영 후 (실서버 실측)</th>
</tr>
</thead>
<tbody>
<tr>
<td>VR스토리 <code>thumb.png</code> — referer 없음 / 외부 / 페이스북 / 카카오 UA</td>
<td><span class="hl-red">전부 403</span></td>
<td><span class="hl-green">200</span></td>
</tr>
<tr>
<td>flat 파노라마 <code>preview.jpg</code> · VR스토리 <code>cover.png</code></td>
<td>403</td>
<td><span class="hl-green">200</span></td>
</tr>
<tr>
<td>XML · <code>pv.jpg</code> (큐브면·타일·장소 원본·UCC 원본)</td>
<td>403</td>
<td><span class="hl-green">403 유지</span> — 원본 보호 그대로</td>
</tr>
<tr>
<td>look360.kr 홈 · www 리다이렉트</td>
<td>정상</td>
<td>회귀 없음</td>
</tr>
</tbody>
</table>
<blockquote>
<p>기존 규칙은 그대로 두고 허용 규칙 4개만 추가했습니다(썸네일류 · flat <code>preview.jpg</code> · VR스토리 <code>cover.*</code> · UCC <code>_250/_500</code>). 반영 전 시험 16건이 전부 기대대로 나왔고, CloudFront 수정은 이슈 위험이 있어 오너 세션이 직접 했습니다.</p>
</blockquote>
<div class="links"><span class="lbl">확인</span>
<a class="lnk" href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8909" target="_blank">IND-8909 SNS·oEmbed 썸네일 외부 노출 정상화</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%96%BC%EF%B8%8F-%ED%95%A8%EA%BB%98-%EA%B3%A0%EC%B9%9C-%EA%B2%83--%EA%B3%B5%EC%9C%A0-%EC%B9%B4%EB%93%9C-%EA%B8%B0%EB%B3%B8-%EC%9D%B4%EB%AF%B8%EC%A7%80-span-classbadge-date1027span"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> 함께 고친 것 — 공유 카드 기본 이미지 <span class="badge-date">10/27</span></h2>
<p>썸네일 가드를 확인하다가 데이터 쪽 문제도 함께 찾았습니다.</p>
<table>
<thead>
<tr>
<th>확인된 것</th>
<th style="text-align:right">수치</th>
<th>처리</th>
</tr>
</thead>
<tbody>
<tr>
<td>콘텐츠 대표 썸네일이 비어 있던 view360</td>
<td style="text-align:right">2,856건 중 <span class="hl-red">2,816건</span></td>
<td>오너 결정으로 <strong>시작 파노라마 썸네일</strong>을 쓰도록 변경</td>
</tr>
<tr>
<td>그때 쓰던 기본 이미지 경로</td>
<td style="text-align:right"><code>/web/images/ogImage-default.png</code></td>
<td>이미지가 아니라 <span class="hl-red">SPA HTML 을 돌려주는 깨진 경로</span>였음</td>
</tr>
</tbody>
</table>
<ul>
<li>바뀐 규칙: <code>?pano=</code> 로 지정된 처음 로딩 파노라마의 썸네일을 쓰고, 개별 업로드 썸네일이 없으면 기존 <code>view_250/500.jpg</code> 를 그대로 씁니다. 스플래시와 oEmbed 가 같은 규칙을 공용합니다(<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8907">IND-8907</a> 커밋 <code>52205d7d</code>).</li>
<li>남은 것: OG 카드 이미지(W1)와 외부 UA 실측(W2)이 <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8909">IND-8909</a> 에서 진행 중입니다.</li>
<li>회의에서 확인할 것: <strong>레거시 look360.kr 설정을 l3 플랫폼 필요로 바꾼 첫 사례</strong>입니다. 앞으로도 「썸네일류만 허용」 원칙으로 갈지, 운영 배포 뒤 카톡·페이스북 공유 카드 이미지를 실제로 확인할 담당을 정해야 합니다.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%E2%86%97%EF%B8%8F-%EC%9E%84%EB%B2%A0%EB%93%9C-%EC%9C%A0%EC%9E%85-%EB%B2%84%ED%8A%BC--%ED%98%84%EC%9E%AC-%EC%9E%AC%EC%83%9D-%EC%A4%91-%ED%99%94%EB%A9%B4-before-span-classbadge-date1027-%EC%8B%9C%EC%95%88span"><img class="emoji" draggable="false" alt="↗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2197.svg" data-marp-twemoji=""/> 임베드 유입 버튼 — 현재 재생 중 화면 (before) <span class="badge-date">10/27 시안</span></h2>
<p>외부 사이트에서 작게 보던 사람을 <strong>새 창으로 Look360 원본 페이지에 크게 데려오는 버튼</strong>입니다. 버튼은 이미 있지만(<code>VrViewer.vue:38~48</code>) <strong>재생 전 스플래시에만 있고 재생이 시작되면 사라집니다.</strong> 아래가 지금 재생 중 화면이고, 돌아갈 길이 보이지 않습니다.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%E2%86%97%EF%B8%8F-%EC%9C%A0%EC%9E%85-%EB%B2%84%ED%8A%BC-%EC%8B%9C%EC%95%88--%EC%9C%84%EC%B9%98-%EC%95%88-a--b--c-span-classbadge-datedesigner-ind-8891span"><img class="emoji" draggable="false" alt="↗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2197.svg" data-marp-twemoji=""/> 유입 버튼 시안 — 위치 안 A / B / C <span class="badge-date">Designer IND-8891</span></h2>
<p>360 뷰어는 재생·정지가 없어서 유튜브식 「정지하면 표시」를 그대로 쓸 수 없습니다. 그래서 「조작하지 않는 시간」을 기준으로 삼았습니다. Designer 추천은 <strong>A 우상단</strong>입니다.</p>

<h2 id="%E2%86%97%EF%B8%8F-%EC%9C%A0%EC%9E%85-%EB%B2%84%ED%8A%BC-%EC%8B%9C%EC%95%88--%ED%81%AC%EA%B8%B0-4%EC%A2%85-%C3%97-%EC%83%81%ED%83%9C-4%EC%A2%85-span-classbadge-datedesigner-ind-8891span"><img class="emoji" draggable="false" alt="↗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2197.svg" data-marp-twemoji=""/> 유입 버튼 시안 — 크기 4종 × 상태 4종 <span class="badge-date">Designer IND-8891</span></h2>
<p>320×180(아주 작은 임베드) · 560×315(블로그 기본) · 800×450 · 모바일 세로를, 조작 중(숨김) · 손 뗀 뒤 나타남 · hover · 글자 포함 네 상태로 그렸습니다.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%E2%86%97%EF%B8%8F-%EC%9C%A0%EC%9E%85-%EB%B2%84%ED%8A%BC--%EC%8A%A4%ED%94%8C%EB%9E%98%EC%8B%9C%EC%99%80%EC%9D%98-%EC%97%B0%EC%86%8D%EC%84%B1--%EC%8B%9C%EC%95%88-%EC%A0%9C%EC%95%88-span-classbadge-datedesigner-specmdspan"><img class="emoji" draggable="false" alt="↗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2197.svg" data-marp-twemoji=""/> 유입 버튼 — 스플래시와의 연속성 · 시안 제안 <span class="badge-date">Designer spec.md</span></h2>
<p><img src="assets/2026-11-04/embed-btn-continuity.jpg" alt="" style="width:420px;" /></p>
<table>
<thead>
<tr>
<th>항목</th>

<h2 id="%EB%A0%88%EA%B1%B0%EC%8B%9C--%EC%9E%A5%EC%86%8C-%ED%8E%98%EC%9D%B4%EC%A7%80-flat-%ED%8C%8C%EB%85%B8%EB%9D%BC%EB%A7%88">레거시 — 장소 페이지 flat 파노라마</h2>
<p>오너 제보로 시작해, 2021년부터 깨져 있던 flat 파노라마 표시를 전부 정상화했습니다.</p>

<p>오너 제보: <a href="https://look360.kr/place/azziyong_thematch">look360.kr/place/azziyong_thematch</a>(place 1722 · 「이시용 바둑 사진기자의 사진전 &lt;승부&gt;」)에서 파노라마 30개(sy01~sy29)의 썸네일이 빈 칸이었습니다. <strong>DB·원본 손실이 아닙니다</strong> — 목록 API 40건 정상 · S3 파일 전부 있음 · delete marker 없음.</p>
<p>flat 파노라마는 업로드 방식이 두 가지입니다(단일 이미지 <code>preview.jpg</code> / krpano 타일 + <code>pv.jpg</code>·<code>view_250.jpg</code>). 그런데 <strong>2021-03-16 레거시 커밋 <code>a6374780f</code> 가 flat 이면 무조건 <code>preview.jpg</code> 를 쓰게 고정</strong>했습니다. 최근 회귀가 아니라 원래부터 깨져 있던 것입니다(<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-6806">IND-6806</a> 은 flat 분기를 건드리지 않았습니다).</p>

<h2 id="%F0%9F%96%BC%EF%B8%8F-%EB%AC%B4%EC%97%87%EC%9D%84-%EA%B3%A0%EC%B3%A4%EB%82%98--flat-%ED%8C%8C%EB%85%B8%EB%9D%BC%EB%A7%88-%ED%91%9C%EC%8B%9C-4%EA%B1%B4-span-classbadge-date10271028-%EC%9A%B4%EC%98%81-%EB%B0%98%EC%98%81span"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> 무엇을 고쳤나 — flat 파노라마 표시 4건 <span class="badge-date">10/27~10/28 운영 반영</span></h2>
<table>
<thead>
<tr>
<th>항목</th>
<th>바뀐 것</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>썸네일</strong></td>
<td>서버 <code>getPanoThumbUrl()</code> 후보를 <code>view_250 → preview.jpg → pv.jpg → default.png</code> 로 확장하고 <code>place.php</code> 의 flat 고정 분기를 제거. 장소 1316 등 기존 정상 장소는 그대로 <code>preview.jpg</code></td>
</tr>
<tr>
<td><strong>촬영일</strong></td>
<td><code>0000-00-00</code>·1971년 이전이면 날짜 배지를 숨김 (지금은 <code>0001-11</code> 로 깨져 보임 · 1722 30건 · 100 13건)</td>
</tr>
<tr>
<td><strong>라벨</strong></td>
<td>flat 썸네일·대표 영역에서 <code>360° VR</code> 라벨 제거 (대체 라벨 없음 · sphere 는 유지)</td>
</tr>
<tr>
<td><strong>대표 미리보기</strong></td>
<td>1722 상단 큰 미리보기가 회색이던 것 → <code>imglink_view_900 → view_500 → pv → view_250 → preview</code> 순서로 있는 파일을 사용</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>제목 노출</strong>: 1722 의 flat 30건은 제목이 <code>sy01</code>~<code>sy29</code> 같은 파일명 코드라 화면에 그대로 노출됩니다(DB 실측: flat 276건 중 제목 공란 0건 → 사용자에게는 「제목 없음」처럼 보입니다). <strong>오너 결정(10/27): 제목은 현행 유지</strong>하고 작품명 수집·데이터 수정은 하지 않습니다. W2 는 제목이 「완전히 빈」 경우에만 제목 칸을 숨기는 규칙을 넣었고, <code>sy01</code> 같은 코드 제목은 그대로 보입니다.</p>
</blockquote>

<h2 id="%F0%9F%8E%9E%EF%B8%8F-%ED%9B%84%EC%86%8D--%EB%8C%80%ED%91%9C-%EB%AF%B8%EB%A6%AC%EB%B3%B4%EA%B8%B0-%EC%BA%90%EB%9F%AC%EC%85%80%EC%9D%B4-flat-%EC%B0%A8%EB%A1%80%EC%97%90-%ED%9A%8C%EC%83%89-span-classbadge-date1028-%EC%9A%B4%EC%98%81-%EB%B0%98%EC%98%81span"><img class="emoji" draggable="false" alt="🎞️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f39e.svg" data-marp-twemoji=""/> 후속 — 대표 미리보기 캐러셀이 flat 차례에 회색 <span class="badge-date">10/28 운영 반영</span></h2>
<p>큰 미리보기는 5초마다, 그리고 썸네일에 마우스를 올릴 때 다음 장면으로 넘어갑니다. 타일 방식 flat 장면 차례가 되면 회색이 됐습니다(1722 는 40장면 중 30장면).</p>
<p>원인은 캐러셀 JS 가 썸네일 경로의 <code>view_250</code> 을 <code>imglink_view_900</code> 으로 바꿔 큰 이미지 주소를 **「추측」**한 것입니다. 타일 방식 flat 폴더에는 그 파일이 없고 <code>pv.jpg</code>(정상 사진)만 있습니다. <strong>실제로 있는 이미지를 두고 없는 경로를 부른 것</strong>입니다. <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8938">IND-8938</a> 은 첫 화면만 고쳤고, QC 도 첫 화면만 재서 놓쳤습니다.</p>
<p>고친 방식: 서버가 장면마다 실제로 있는 대표 이미지 URL(<code>repUrl</code>)을 계산해 내려주고, 캐러셀은 그 값만 씁니다. sphere 는 큐브 띠 이미지(<code>pv.jpg</code> 256×1536)로 바뀌지 않게 후보에서 뺐습니다.</p>
<blockquote>
<p>운영 실측(전 순번 · 회색 장면 수): azziyong_thematch <strong>30 → 0</strong> · indyspot 「Kay Park 작가 전시회」 32 → 0 · 「Flat 파노라마 테스트」 4 → 0 · yongsan_oldphoto 95 → 0(회귀 없음) · panoramakim 3 → 0. 전부 HTTP 200 · JS 오류 0건.</p>
</blockquote>

<p><span class="sec-num">Section 05</span></p>
<h2 id="%EB%A0%88%EA%B1%B0%EC%8B%9C--flat-%ED%8C%8C%EB%85%B8%EB%9D%BC%EB%A7%88-%EC%A0%95%EC%8B%9D-%EC%A7%80%EC%9B%90--%ED%83%80%EC%9D%BC-%EB%A0%88%EB%B2%A8">레거시 — flat 파노라마 정식 지원 · 타일 레벨</h2>
<p>작업자가 손으로 XML 을 복사해 넣던 flat 파노라마를, 개발자 손 없이 등록되게 만들었습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%93%90-flat-%ED%8C%8C%EB%85%B8%EB%9D%BC%EB%A7%88-%EC%A0%95%EC%8B%9D-%EC%A7%80%EC%9B%90--%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%AC%B8%EC%A0%9C%EC%98%80%EB%82%98-span-classbadge-date1031-%EC%9A%B4%EC%98%81-%EB%B0%98%EC%98%81span"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> flat 파노라마 정식 지원 — 무엇이 문제였나 <span class="badge-date">10/31 운영 반영</span></h2>
<p>레거시(ksq1.2)는 flat 파노라마(2:1 이 아닌 평면 이미지)를 정식 흐름으로 등록하지 못했습니다. 지금까지는 krpanotools 가 자동 계산한 multires 레벨과 krpano 가 만든 <code>&lt;image&gt;</code> 코드를 <strong>개발자가 투어 custom XML 에 손으로 복사</strong>해 넣었습니다.</p>
<table>
<thead>
<tr>
<th>운영 DB 실측 (2026-10-24 · 조회 전용)</th>
<th>값</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>look360_panorama</code> flat / sphere</td>
<td>flat <strong>273건</strong> / sphere 31,907건</td>
</tr>
<tr>
<td><code>panowidth</code>·<code>panoheight</code> 자료형</td>
<td><strong>smallint</strong> · <code>tile_info</code> 류 칼럼 없음</td>
</tr>
<tr>
<td>기존 flat 가로값</td>
<td>4000·3000 처럼 <strong>1000 단위로 반올림</strong>되어 있었음(세로는 실제값) — 예전 batch 생성기의 흔적</td>
</tr>
<tr>
<td>주의</td>
<td>place 100 에 가로 28,665 flat 이 이미 있음 (smallint 상한 32,767 근접)</td>
</tr>
</tbody>
</table>
<ul>
<li>이번 EPIC 범위: 레거시가 작업실의 batch XML 을 받아 저장하고, 투어 XML·관리자 화면이 flat 을 정식으로 그리게 하는 것입니다.</li>
<li>작업실(pano-stitcher) 쪽 flat 타일 생성·batch XML flat 출력·업로드 zip 은 오너 세션에서 직접 구현했습니다.</li>
</ul>
<div class="links"><span class="lbl">확인</span>
<a class="lnk" href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8770" target="_blank">IND-8770 레거시 flat 정식 지원</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%94%A7-%EC%9A%B4%EC%98%81-%EB%B0%98%EC%98%81-%EB%92%A4-%EB%B0%9C%EA%B2%AC%ED%95%9C-%ED%9A%8C%EA%B7%80-3%EA%B1%B4--%EB%8B%B9%EC%9D%BC-%EC%88%98%EC%A0%95-span-classbadge-date1101span"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f527.svg" data-marp-twemoji=""/> 운영 반영 뒤 발견한 회귀 3건 — 당일 수정 <span class="badge-date">11/01</span></h2>
<p><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8770">IND-8770</a> 을 운영에 반영한 뒤(11/01 00:2x KST) 오너가 운영 화면에서 회귀를 보고했습니다. Claude Code 가 직접 구현·운영 반영했고 <strong>남은 작업은 없습니다.</strong></p>
<table>
<thead>
<tr>
<th>회귀</th>
<th>원인</th>
<th>수정</th>
</tr>
</thead>
<tbody>
<tr>
<td>flat 썸네일이 전부 <code>default.png</code></td>
<td>투어 생성기가 flat 장면에도 <code>view_250.jpg</code> 를 찾는데 flat 폴더에는 <code>preview.jpg</code>·<code>pv.jpg</code> 만 있음</td>
<td>후보 순서 확장</td>
</tr>
<tr>
<td><strong>flat → sphere 로 돌아오면 fov 제한이 풀림</strong></td>
<td>custom.xml 6개에 남아 있던 옛 <code>flatpano_events</code>/<code>flatpano_startup</code>/<code>flatpano_imagefit</code> 정의가 생성기의 keep=true events 와 이름이 같아 병합됨 → 옛 <code>flatpano_startup</code> 이 sphere 장면에서도 실행</td>
<td>이름 충돌 해소. 운영 실측으로 sphere 인데 <code>fovmax 360 · fov 179</code>, 모바일 fovmin 3.9, 돌아가기 fov=50 무시가 나던 것을 바로잡음</td>
</tr>
<tr>
<td>pano 23907 타일 404</td>
<td>폴더에 0패딩/비패딩 타일 세트가 두 벌 있는데 <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9038">IND-9038</a> multires override 가 다른 세트 기준으로 측정됨</td>
<td>측정 기준 교정</td>
</tr>
</tbody>
</table>
<div class="links"><span class="lbl">확인</span>
<a class="lnk" href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9045" target="_blank">IND-9045 후속 기록 · 커밋 `673076aa1`</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%9B%A0%EF%B8%8F-%EC%9C%A0%ED%8B%B8look360_utils_v3%EB%8F%84-flat-%EC%A7%80%EC%9B%90--%EC%9E%91%EC%97%85-%ED%98%84%EC%9E%A5-%EB%8F%84%EA%B5%AC-span-classbadge-date1102span"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 유틸(look360_utils_v3)도 flat 지원 — 작업 현장 도구 <span class="badge-date">11/02</span></h2>
<p><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8770">IND-8770</a> 은 입력 도구로 <strong>작업실만</strong> 전제했습니다. 그런데 작업 현장에서 쓰는 <strong>유틸(Electron 앱)</strong> 은 범위 밖이라, 유틸로 만든 flat 을 레거시에 올릴 수 없었습니다.</p>
<table>
<thead>
<tr>
<th>막혀 있던 지점</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>가로 반올림</td>
<td>batch XML 생성기가 flat 이어도 가로를 <strong>1000 단위로 반올림</strong> — 레거시 계약은 실제 픽셀값을 요구</td>
</tr>
<tr>
<td><code>tile_info</code> 미출력</td>
<td>레거시 파서는 <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8775">IND-8775</a> 이후 <strong>tile_info 없는 flat 행을 거부</strong>(코드 <code>-7</code>) ⇒ 유틸이 만든 flat XML 은 등록 단계에서 거부됨</td>
</tr>
<tr>
<td>flat 타일 생성 분기 없음</td>
<td>레거시용 타일 생성 화면에 flat 분기가 아예 없고, krpano <code>xml=true</code> 로 multires 레벨을 받아오는 단계도 없음</td>
</tr>
</tbody>
</table>
<div class="links"><span class="lbl">확인</span>
<a class="lnk" href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9056" target="_blank">IND-9056 유틸 flat 지원</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%A7%A9-%EA%B5%AC%ED%98%95-sphere-%ED%83%80%EC%9D%BC-%EB%A0%88%EB%B2%A8-%EB%B6%88%EC%9D%BC%EC%B9%98--%EC%A0%84%EC%88%98-%EA%B2%80%EC%82%AC-span-classbadge-date1030span"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 구형 sphere 타일 레벨 불일치 — 전수 검사 <span class="badge-date">10/30</span></h2>
<p><code>vr/r781aofh?pano=6520</code>(pano 6520 「화장실」)이 뷰어에 표시되지 않았습니다. <strong>원본 손실이 아니라 XML 의 타일 레벨 선언과 실제 타일 구조가 불일치</strong>하는 문제였습니다.</p>
<table>
<thead>
<tr>
<th>대상 (<code>/files/pano/0/329/88/</code>)</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>mres_{f,b,l,r,u,d}/l1/</code></td>
<td>200 · 2×2 타일(512+444) → 면당 <strong>956×956 단일 레벨</strong></td>
</tr>
<tr>
<td><code>mres_*/l2/</code>, <code>mres_*/l3/</code> (6면 전부)</td>
<td><span class="hl-red">404</span></td>
</tr>
<tr>
<td><code>512_f.jpg</code> · <code>1024_f.jpg</code> · <code>pv.jpg</code> · <code>imglink_sphere_900.jpg</code></td>
<td>200</td>
</tr>
</tbody>
</table>
<p>반면 XML 은 <code>l1=3820 / l2=2048 / l3=1024</code> 의 <strong>3레벨 multires</strong> 를 선언합니다. 그래서 krpano 가 없는 l3·l2 타일을 요청하고, l1 도 8×8 격자를 기대해 실제 2×2 파일과 좌표가 맞지 않았습니다. 2006년 촬영분처럼 원본 해상도가 낮은 구형 sphere 는 단일 레벨로만 타일이 생성됐는데 XML 빌더가 그것을 모른 채 레벨을 선언한 것으로 추정합니다.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 이 검사는 <strong>Referer 헤더를 포함해</strong> 요청해야 합니다. 없이 요청하면 핫링크 차단으로 전부 403 이 나와 「파일 없음」으로 오판합니다.</p>
</blockquote>
<div class="links"><span class="lbl">확인</span>
<a class="lnk" href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8731" target="_blank">IND-8731 타일 레벨 전수검사</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%8F%A0-%ED%99%88-%ED%9E%88%EC%96%B4%EB%A1%9C-%EC%8A%AC%EB%9D%BC%EC%9D%B4%EB%93%9C-%ED%8C%8C%EB%85%B8%EB%9D%BC%EB%A7%88-404-span-classbadge-date1030span"><img class="emoji" draggable="false" alt="🏠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e0.svg" data-marp-twemoji=""/> 홈 히어로 슬라이드 파노라마 404 <span class="badge-date">10/30</span></h2>
<p>CloudFront 자산 404 일일 리포트에 <strong>홈 히어로 슬라이드발 404</strong> 가 반복해서 잡혔습니다. 히어로는 5초 간격으로 투어 XML 을 차례로 요청하는데, 커스텀/타일 형식 투어는 지원하지 않아 큐브면 파일(<code>1024_*.jpg</code>)을 요청하다 404 가 납니다. 그 슬라이드 5초 동안 히어로가 빈 화면으로 보였을 것으로 추정합니다(화면 실측은 하지 않았습니다).</p>
<table>
<thead>
<tr>
<th>날짜</th>
<th>경로</th>
<th>폴더 실물 (백업 목록표 기준)</th>
</tr>
</thead>
<tbody>
<tr>
<td>10/21</td>
<td><code>pano/1/1722/31</code></td>
<td><code>l1~l4/</code> 타일 + <code>pv.jpg</code> 만 있음 · <code>1024_*.jpg</code> 없음</td>
</tr>
<tr>
<td>10/22</td>
<td><code>pano/1/1366/157</code></td>
<td>폴더 자체 없음 (DB 레코드만 남은 것으로 보임)</td>
</tr>
<tr>
<td>10/29</td>
<td><code>pano/1/1317/31</code></td>
<td><code>l1~l4/</code> 타일 + <code>preview.jpg</code> 만 · <code>1024_*.jpg</code>·<code>pv.jpg</code> 없음 · 투어는 customxml 방식</td>
</tr>
</tbody>
</table>
<ul>
<li>처리: 후보군을 고를 때 <strong>파일이 실제로 있는지 판정</strong>하고, 관리자 화면에 그 상태를 표시하도록 바꿨습니다.</li>
</ul>
<div class="links"><span class="lbl">확인</span>
<a class="lnk" href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-9031" target="_blank">IND-9031 홈 히어로 슬라이드 404</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="sec" data-theme="clean" lang="en-US" class="sec" data-marpit-pagination="34" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="102">
<p><span class="sec-num">Section 06</span></p>

<p>외부 공개 기간(11/05 19:40 종료 예정) 동안 직원이 실제로 쓰고 있어, 막히는 곳을 그 전에 열었습니다.</p>

<h2 id="%F0%9F%93%B7-%EC%9E%91%EC%97%85%EC%8B%A4-flat--%EA%B2%B0%EA%B3%BC%EB%A5%BC-%EB%88%88%EC%9C%BC%EB%A1%9C-%EB%B3%BC-%EC%88%98-%EC%97%86%EB%8D%98-%EB%AC%B8%EC%A0%9C-span-classbadge-date1028span"><img class="emoji" draggable="false" alt="📷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f7.svg" data-marp-twemoji=""/> 작업실 flat — 결과를 눈으로 볼 수 없던 문제 <span class="badge-date">10/28</span></h2>
<p>오너가 외부 공개 주소로 작업실을 쓰다가 발견했습니다. <strong>flat 파노라마는 작업 결과를 눈으로 확인할 방법이 없었습니다</strong> — 올린 이미지를 크게 볼 곳이 없고, 타일을 만든 뒤에도 결과를 볼 수 없었습니다.</p>
<table>
<thead>
<tr>
<th>막힌 곳</th>
<th>원인</th>
</tr>
</thead>
<tbody>
<tr>
<td>타일 생성 후 「뷰어에서 열어 보기」 → 이미지 깨짐</td>
<td>뷰어가 <code>pano/preview.jpg</code> 를 띄우는데, flat 타일 설정은 미리보기를 <code>pano/pv.jpg</code> 로 만듦 — 이름이 서로 다름</td>
</tr>
<tr>
<td>올린 원본을 크게 볼 화면 없음</td>
<td>flat 장면은 <code>FLAT_SKIP</code> 으로 ①~⑥ 단계를 건너뛰어 ⑦ 타일로 바로 가는데, 그 경로에 원본 보기가 없었음</td>
</tr>
</tbody>
</table>
<ul>
<li>처리: 올린 원본 크게 보기와 타일 결과 뷰어를 넣고, 깨진 <code>preview.jpg</code> 참조를 실제 파일명으로 고쳤습니다.</li>
</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%93%B7-%EC%9E%91%EC%97%85%EC%8B%A4-flat--%ED%83%80%EC%9D%BC-%EB%8B%A8%EA%B3%84%EB%A1%9C-%EA%B0%88-%EB%B0%A9%EB%B2%95%EC%9D%B4-%EC%97%86%EB%8D%98-%EB%AC%B8%EC%A0%9C-span-classbadge-date1029span"><img class="emoji" draggable="false" alt="📷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f7.svg" data-marp-twemoji=""/> 작업실 flat — 타일 단계로 갈 방법이 없던 문제 <span class="badge-date">10/29</span></h2>
<p>오너가 flat 이미지를 ⑦ 타일 단계에서 보려고 했는데, ⑦ 화면이 「먼저 ⑤ 에서 보정본을 올리거나 「보정 없이 진행」을 눌러줘」라고 안내했습니다. ⑤ 로 올라가 「보정 없이 진행」을 누르자 아래 에러가 났습니다. <strong>flat 장면은 타일 단계로 진행할 방법이 아예 없는 상태</strong>였습니다.</p>
<pre><code>File &quot;mosaic/studio.py&quot;, line 2834, in _copy_tmp
  raise FileNotFoundError(&quot;최종 렌더(stitched.jpg)가 아직 없어&quot;)
</code></pre>
<p>결함이 두 개 겹쳐 있었습니다 — ① ⑦ 타일 입력 판정이 「폴더에 바로 둔 retouched.jpg」를 찾지 못해 ⑤ 로 되돌려 보냄 ② ⑤ 의 「보정 없이 진행」이 flat 에는 없는 <code>stitched.jpg</code> 를 복사하려 함.</p>
<p>이어서 <strong>애초에 그 단계로 들어가지 않게</strong> 했습니다. 장면 화면의 단계 메뉴가 <code>FLAT_SKIP</code> 을 전혀 보지 않아 flat 장면에서도 ①~⑥ 이 클릭됐고, 주소의 <code>step=</code> 으로 북마크·새로고침으로도 들어올 수 있었습니다. 프로젝트 홈에서는 「완료」로 보이는데 장면 안에서는 할 일처럼 보이는 불일치도 함께 없앴습니다.</p>

<p>오너 질문 「vr-info 장소 정보에 SNS가 실제로 표시되는가?」를 코드로 확인해 보니 <strong>표시되지 않았습니다.</strong></p>

<tr>
<td>API 응답</td>

</tr>
<tr>
<td>클라이언트 vr-info</td>

</tr>
</tbody>
</table>
<p>즉 <strong>DB → API 구간은 장소 SNS 를 전부 내려주는데 화면이 버리고 있었습니다.</strong> 장소 홈페이지는 이미 여러 개 입력·표시가 가능합니다(어드민 「웹사이트 추가」 · <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-6925">IND-6925</a>). 다만 dev DB 에서 website 가 2개 이상인 장소는 이번 시연 데이터 전까지 0곳이었습니다.</p>

<h2 id="%F0%9F%94%B4-%ED%8C%9D%EC%97%85--%EC%9A%B4%EC%98%81-%EB%AF%B8%EB%B0%98%EC%98%81-%EC%83%81%ED%83%9C-span-classbadge-date1028-%EC%8B%A4%EC%B8%A1span"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 팝업 — 운영 미반영 상태 <span class="badge-date">10/28 실측</span></h2>
<p>운영 번들(<code>look360-v3-client.netlify.app</code>)에는 <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8897">IND-8897</a> 의 커스텀 팝업조차 없고 <strong>브라우저 기본 <code>confirm()</code> 이 그대로</strong>입니다(<code>cancelPurchaseBtn</code> 0건 · <code>ConfirmDeleteModal</code> 에 잠김 없음). 커밋은 client <code>paperclip</code> 브랜치(origin/paperclip)에만 있고 <code>main</code> 에 없습니다.</p>

<th>무엇을 보나</th>

<tr>

<blockquote>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 회의에서 정할 것: ① 팝업 디자인 확정 여부 ② client 운영 배포 시점(<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8897">IND-8897</a>·<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8916">IND-8916</a> 묶어서)</p>

<p><span class="sec-num">Section 09</span></p>
<h2 id="%EB%B3%B4%EC%95%88-1">보안</h2>
<p>SNS 로그인의 임의 계정 로그인 통로를 막고, 권한 누락이 다시 생기지 않게 회귀 테스트를 깔았습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%94%90-%EB%A0%88%EA%B1%B0%EC%8B%9C-sns-%EB%A1%9C%EA%B7%B8%EC%9D%B8--%EC%9E%84%EC%9D%98-%EA%B3%84%EC%A0%95-%EB%A1%9C%EA%B7%B8%EC%9D%B8-%EC%B0%A8%EB%8B%A8-span-classbadge-date1028span"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> 레거시 SNS 로그인 — 임의 계정 로그인 차단 <span class="badge-date">10/28</span></h2>
<p><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-6803">IND-6803</a>(플랫폼이 body 의 id 만으로 세션을 발급하던 결함)과 <strong>같은 종류의 결함</strong>이 레거시(look360.kr)에도 있었습니다. 10/26 플랫폼 SNS 검토 중 로컬 사본에서 발견했습니다. 레거시는 지금도 가입을 받고 있어(마지막 가입 2026-08-25) 운영에 노출 중일 가능성이 높았습니다.</p>
<table>
<thead>
<tr>
<th>결함</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>provider 토큰 미검증</td>
<td><code>a.snscall_direct_api.php</code> 가 클라이언트가 보낸 데이터를 그대로 믿어, <strong>임의 계정으로 로그인</strong>할 수 있었습니다</td>
</tr>
<tr>
<td>SQL 문자열 결합</td>
<td>같은 파일에서 입력값을 이스케이프 없이 쿼리에 결합하고 있었습니다</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 오너 지시에 따라 보안 이슈는 우선순위 최고(critical)로 바로 처리했습니다. 회귀 확인 경로: look360.kr 로그인 → 카카오 / 네이버 실계정 로그인 → 메인 이동 + 로그인 상태면 정상(운영 HEAD <code>2fd48a9cd</code>).</p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%94%90-%EC%A0%84%EC%97%AD-%EB%9D%BC%EC%9A%B0%ED%8A%B8-%EA%B0%80%EB%93%9C-%ED%9A%8C%EA%B7%80-spec--l3-sns-%EB%A1%9C%EA%B7%B8%EC%9D%B8-%EC%8B%A0%EC%84%A4-span-classbadge-date10281029span"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> 전역 라우트 가드 회귀 spec · l3 SNS 로그인 신설 <span class="badge-date">10/28~10/29</span></h2>
<table>
<thead>
<tr>
<th>EPIC</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8985">IND-8985</a> 라우트 가드 회귀 spec</td>
<td><code>:param</code> 이 들어가는 라우트에 <code>AdminGuard</code>·요청자 전달을 <strong>강제하는 테스트</strong>를 깔았습니다. <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-7159">IND-7159</a>(임의 로그인 유저가 타인의 시작 메시지를 삭제할 수 있던 IDOR)의 재발을 막기 위한 것입니다</td>
</tr>
<tr>
<td><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8850">IND-8850</a> l3 SNS 로그인</td>
<td>현재 구조는 <code>l3_user.id = &quot;{provider}_{providerId}&quot;</code> 하나로 회원을 찾아 <strong>회원 1명 = 로그인 수단 1개</strong>였습니다. 이메일 비교가 없어 이메일 회원이 SNS 로 들어오면 별도 계정이 생겼습니다. weekly 방식(연결 테이블 · 이메일 중복 안내 · 계정 연결/옮기기)을 이식하고 Netlify 테스트 환경을 만들었습니다</td>
</tr>
</tbody>
</table>
<blockquote>
<p><a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8850">IND-8850</a> 은 <strong>오너 작업이 남아 있습니다</strong> — provider 콘솔(카카오·네이버 등)에 테스트 사이트 주소를 등록해야 합니다. 등록 뒤 테스트 사이트에서 소셜 로그인 버튼을 눌러 <strong>provider 동의 화면까지 뜨면 정상</strong>이고, <code>redirect_uri mismatch</code>·<code>KOE006</code>·<code>URL 차단됨</code> 이 나오면 등록값이 다르다는 뜻입니다.</p>
</blockquote>

<a class="lnk" href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8853" target="_blank">IND-8853 등록 요청서 전문</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-class="sec" data-theme="clean" lang="en-US" class="sec" data-marpit-pagination="59" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="102">
<p><span class="sec-num">Section 10</span></p>
<h2 id="weeklykpop--weeklypop">weeklykpop · weeklypop</h2>
<p>유튜브 영상 교체 체계를 세우고, 조용히 빠지던 데이터를 찾아 메우고, 운영 자동화를 정리했습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%93%BA-%EC%97%91%EB%B0%95-%EA%B3%BC%EC%86%8C-%EB%B3%B4%EA%B3%A0--api-%ED%82%A4%EC%97%90%EC%84%9C-%EC%84%9C%EB%B2%84-%EC%A3%BC%EC%86%8C%EA%B0%80-%EB%B9%A0%EC%A0%B8-%EC%9E%88%EC%97%88%EB%8B%A4-span-classbadge-date10241027span"><img class="emoji" draggable="false" alt="📺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4fa.svg" data-marp-twemoji=""/> 엑박 과소 보고 — API 키에서 서버 주소가 빠져 있었다 <span class="badge-date">10/24~10/27</span></h2>
<p>매일 오는 「유튜브 엑박 점검」 메일은 엑박을 kpop 3곡 · pop 5곡으로 보고했지만, 실제로는 <strong>kpop 283곡 · pop 246곡이 재생 불가</strong>였습니다.</p>
<table>
<thead>
<tr>
<th>무엇이 문제였나</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>원인</td>
<td>YouTube API 키의 IP 제한에 Lightsail 서버 주소(43.202.102.159 · IPv6 <code>2406:da12:240:6900::/64</code>)가 빠져 있었습니다</td>
</tr>
<tr>
<td>그래서 생긴 일</td>
<td>점검이 10/24부터 조용히 썸네일 확인으로 대체돼 <strong>「삭제」만 잡았습니다</strong> — 비공개·퍼가기 금지·한국 지역 차단은 검출하지 못했습니다</td>
</tr>
<tr>
<td>자동 교체도 멈춤</td>
<td>직전 재검증이 403 으로 막혀 <strong>4일간 0곡</strong></td>
</tr>
<tr>
<td>해소</td>
<td>10/27 오너가 키의 IP 제한에 서버 주소를 추가</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> 함정: 「점검이 돌고 있고 메일도 온다」는 것이 「제대로 재고 있다」는 뜻은 아닙니다. 판정 수단이 조용히 바뀌어도(API → 썸네일) 리포트 형식은 그대로였습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%93%BA-1027-%EC%B2%98%EB%A6%AC-%EA%B2%B0%EA%B3%BC%EC%99%80-%EB%B0%94%EB%80%90-%EA%B7%9C%EC%B9%99-span-classbadge-date1027--%EA%B7%B8-%EC%8B%9C%EC%A0%90-%EC%8A%A4%EB%83%85%EC%83%B7span"><img class="emoji" draggable="false" alt="📺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4fa.svg" data-marp-twemoji=""/> 10/27 처리 결과와 바뀐 규칙 <span class="badge-date">10/27 · 그 시점 스냅샷</span></h2>
<table>
<thead>
<tr>
<th>사이트</th>
<th style="text-align:right">교체 적용</th>
<th>내역</th>
</tr>
</thead>
<tbody>
<tr>
<td>kpop</td>
<td style="text-align:right"><strong>140곡</strong></td>
<td>오너 직접 13 · 90점 단독 후보 일괄 57 · 공식 영상 자동 70</td>
</tr>
<tr>
<td>pop</td>
<td style="text-align:right"><strong>216곡</strong></td>
<td>일괄 71 · 공식 영상 145</td>
</tr>
</tbody>
</table>
<p>적용 후 재검사에서 전부 정상이었습니다. 남은 승인 대기는 kpop 148곡 · pop 29곡으로, 대부분 90점 미만이라 사람이 골라야 하는 곡입니다.</p>
<table>
<thead>
<tr>
<th>바뀐 규칙</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>0순위 자동 교체</td>
<td>공식 뮤비 &gt; 공식 오디오 &gt; 공식 채널 영상은 점수와 무관하게 자동 교체 — 단 <strong>제목이 곡명과 완전 일치 + 80점 이상</strong>(다른 곡의 공식 영상 방지)</td>
</tr>
<tr>
<td>단독 후보만 자동</td>
<td>공식 영상이 없으면 90점 이상 후보가 <strong>하나뿐인</strong> 곡만 자동. 여럿이면 사람이 선택</td>
</tr>
<tr>
<td>적용 전 재확인</td>
<td>사람이 승인할 때도 적용 <strong>직전</strong> API 로 재생 가능 여부를 확인</td>
</tr>
<tr>
<td>실패를 드러냄</td>
<td>API 가 막히면 메일 제목에 <strong>「⚠ API 판정 실패」</strong> 경고</td>
</tr>
<tr>
<td>메일·화면 정리</td>
<td>명칭 정리(유튜브 영상 교체 리포트 · 재생 불가 · 교체 승인 대기 · 직접 찾기 · 자동 교체) + 승인 화면에 「직접 찾기」(후보 없는 곡) 목록 추가</td>
</tr>
</tbody>
</table>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%91%A5-%EA%B2%80%ED%86%A0%EC%9E%90-%EC%97%AD%ED%95%A0-%EC%8B%A0%EC%84%A4--%EA%B4%80%EB%A6%AC%EC%9E%90-%EA%B3%84%EC%A0%95-%EC%97%86%EC%9D%B4-%EC%8A%B9%EC%9D%B8-%EC%B2%98%EB%A6%AC-span-classbadge-date10271028span"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f465.svg" data-marp-twemoji=""/> 검토자 역할 신설 — 관리자 계정 없이 승인 처리 <span class="badge-date">10/27~10/28</span></h2>
<p>관리자 계정 없이 승인 대기열을 처리할 수 있는 <strong>「검토자」</strong> 역할을 만들었습니다. 검토자는 일반 회원이라 사이트 관리자 권한이 없고, 승인·일괄 승인·전체 거절·건너뛰기·직접 찾기 적용을 할 수 있습니다. 처리 이력에 <code>reviewer:&lt;아이디&gt;</code> 로 남습니다.</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>결정 변경(10/28)</strong>: 10/27 에 「롤백·자동 승인 설정은 관리자만」으로 정했는데, <strong>검토자도 롤백·교체를 할 수 있게</strong> 바꿨습니다. 작업자가 자기 실수를 남(관리자)에게 부탁하지 않고 바로 되돌릴 수 있어야 하기 때문입니다. 이제 관리자 전용은 <strong>「자동 승인 설정」 하나뿐</strong>입니다.</p>

<h2 id="%F0%9F%94%84-%EC%97%91%EB%B0%95-%EB%B3%B5%EA%B5%AC-%ED%99%94%EB%A9%B4-%EA%B0%9C%ED%8E%B8--%ED%83%AD-%EB%B6%84%EB%A6%AC--%EC%A7%81%EC%A0%91-%EC%9E%85%EB%A0%A5-%EB%90%98%EB%8F%8C%EB%A6%AC%EA%B8%B0-span-classbadge-date1028span"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> 엑박 복구 화면 개편 — 탭 분리 · 직접 입력 되돌리기 <span class="badge-date">10/28</span></h2>
<p>발단: 검토자가 「직접 찾기」에서 kpop <code>[BMK]One Two Three Four (1234)</code> 에 영상을 잘못 넣었는데(운영 이력 #285) 되돌리는 UI 가 없어 보였습니다. 롤백 기능은 있었지만 ① 검토자 화면에서는 롤백 칸이 <code>—</code> 로만 보였고 ② 관리자 화면에서도 「적용 이력」 표에 모든 방식의 이력(kpop 289건)이 섞여 최근 50건만 보였습니다.</p>
<table>
<thead>
<tr>
<th>바뀐 것</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>

<td>한 화면에 위아래로 늘어놓던 목록을 <strong>승인 대기 | 직접 찾기 | 직접 입력 내역 | 적용 이력</strong> 으로 나눴습니다(탭마다 곡수·건수 표시)</td>
</tr>
<tr>
<td>「직접 입력 내역」 탭</td>
<td>직접 입력한 곡만 모아 <strong>되돌리기</strong>(넣기 전 영상으로 · 곡은 다시 직접 찾기 목록으로)와 <strong>교체</strong>(맞는 주소를 넣으면 되돌린 뒤 바로 다시 적용)</td>
</tr>
<tr>
<td>「적용 이력」 탭</td>
<td>최근 50건 고정 → 30건씩 페이지 + 방식 필터(자동 승인·일괄 승인·후보 승인·직접 입력) + 곡명 검색</td>
</tr>
<tr>
<td>안전 장치</td>
<td>되돌리기·교체는 곡의 <strong>가장 최근</strong> 적용에서만 가능(순서가 꼬이지 않게) · 「교체」는 새 영상의 재생 가능 여부를 <strong>먼저</strong> 확인하고 막힌 영상이면 아무것도 바꾸지 않습니다</td>
</tr>

<blockquote>
<p>검증: 로컬에서 교체·되돌리기·재시도 거부·필터·검색을 실제로 눌러 확인하고 DB 변화를 조회했습니다. 운영은 조회 함수로 kpop 289건·직접 입력 33건·pop 251건을 확인했습니다. <strong>검토자 계정으로 운영 화면을 직접 눌러보는 확인은 하지 않았습니다.</strong></p>
</blockquote>

<h2 id="%F0%9F%94%8D-%ED%86%B5%ED%95%A9%EA%B2%80%EC%83%89-%EA%B0%9C%ED%8E%B8--%EC%98%9B-%EC%B0%A8%ED%8A%B8-%EA%B3%A1%EC%9D%B4-%EA%B2%80%EC%83%89%EA%B2%B0%EA%B3%BC-%EC%97%86%EC%9D%8C%EC%9D%B4%EB%8D%98-%EB%AC%B8%EC%A0%9C-span-classbadge-date1028span"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 통합검색 개편 — 옛 차트 곡이 「검색결과 없음」이던 문제 <span class="badge-date">10/28</span></h2>
<p>킴스큐 기본 검색은 게시글 <strong>등록일 기준 최근 12개월</strong>만 찾습니다. 그런데 곡 게시글의 등록일은 곡을 차트에 들여온 날이라서, 옛 차트 곡을 검색하면 「검색결과가 없습니다」가 나와 <strong>사이트에 없는 곡처럼 보였습니다</strong>(pop 은 곡 9,102건 중 <strong>35건만</strong> 검색 대상이었습니다).</p>
<table>
<thead>
<tr>
<th>바뀐 것</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>기간 조건 제거</td>
<td>차트 게시판 곡은 기간 조건 없이 찾습니다(공지·자유 게시판은 기존 검색 그대로)</td>
</tr>
<tr>
<td>곡 중심 결과</td>
<td>썸네일 · 최근 차트와 순위 · 최고 순위 · 차트에 오른 횟수 · 「▶ 듣기」(플레이어에서 그 곡부터) · 「차트에서 보기」 · 엑박 판정 곡은 「영상 준비 중」</td>
</tr>
<tr>
<td>여러 단어</td>
<td><strong>모든 단어가 들어간 곡</strong>만 찾습니다(기존은 하나만 걸려도 결과)</td>
</tr>
<tr>
<td>띄어쓰기 무시</td>
<td>「아이유 좋은날」로 <code>[아이유]좋은 날</code> 이 찾아집니다</td>
</tr>
<tr>
<td>적용 범위</td>
<td>PC·모바일, 통합 탭·게시판 탭 모두(kpop 은 영어 문구). 공통 로직 <code>modules/weeklychart/lib/search_songs.php</code>(두 사이트 동일 파일)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>같이 고친 기존 버그: <strong>「게시판」 탭이 PHP 8.3 서버로 옮긴 10/23 이후 줄곧 치명적 오류로 깨져 있었습니다</strong>(<code>echo $_BBS = getDbArray(...)</code> 한 줄 · 페이지가 드롭다운 중간에서 끊김 · 서버 오류 로그에도 기록).</p>
</blockquote>
</section>

<ol>
<li><strong>조용히 빠지던 데이터를 찾아서 메웠다</strong> — 2주치 KPOP 차트(10/04·10/11), 가수 페이지(Lightsail 이전 뒤 전체 미표시), 새 곡 가사(10/07 이후 미처리), 신곡 유튜브(n8n 이 옛 DB 를 읽음)가 <strong>「성공」으로 보이면서 비어 있었습니다.</strong> 원인을 하나씩 확인해 모두 채우고 재발을 막았습니다.</li>
<li><strong>사람 손이 필요한 일을 줄였다</strong> — 엉뚱한 유튜브 영상 289곡 중 159곡을 당일 교체(자동 149), 신곡 유튜브·차트 수집·가사 처리를 스크립트로 자동화, 가수 매칭 오류를 검수 화면에 「jev 의심」으로 모았습니다.</li>
<li><strong>운영 비용·관리 대상을 줄였다</strong> — n8n(컨테이너·Caddy·Route53 2건·CloudFront 1건)을 내리고 하던 일 3가지를 스크립트로 옮겼습니다. 판정 AI 총비용은 약 <strong>$0.56</strong>.</li>
</ol>
<blockquote>
<p>커밋: weeklykpop 14건 · weeklypop 6건 · <code>weeklychart-chart</code> 5건 · <code>cron</code> <code>74cbf9d</code> · 운영 반영 완료 · paperclip 발주 없음(오너 세션 직접 구현).</p>
</blockquote>

<h2 id="%F0%9F%94%8E-%EC%A7%81%EC%A0%91-%EC%B0%BE%EA%B8%B0-%EA%B3%A1-1%EA%B1%B4-%EC%A1%B0%EC%82%AC--%EC%98%A4%EC%8B%9D%EB%B3%84-%EB%B0%98%EC%A6%9D-%EC%82%AC%EB%A1%80-span-classbadge-date1028span"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> 「직접 찾기」 곡 1건 조사 — 오식별 반증 사례 <span class="badge-date">10/28</span></h2>
<p>pop 엑박 화면의 「직접 찾기」에 <code>[Chevt Man]Pussy 2006 · WFf-LEPsung</code> 이 남아 있었습니다. 처음엔 크롤링 중 제목이 깨진 것으로 보고 곡을 추정했습니다.</p>
<table>
<thead>
<tr>
<th>단계</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 처음 판단</td>
<td><code>LEP</code> 를 Lee Perry 로 읽어 Lee &quot;Scratch&quot; Perry 「Pussy Man」으로 식별하고 유튜브 영상을 연결하려 했습니다</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 반증</td>
<td>운영 DB 를 직접 조회해 보니 화면 문자열은 <strong>「제목 <code>[Chevt Man]Pussy</code> + 연도 <code>2006</code> + 옛 videoId <code>WFf-LEPsung</code>」을 이어 붙인 표시</strong>였습니다. <code>LEP</code> 는 videoId 조각이었고, Lee Perry 식별과 그 영상은 <strong>다른 곡</strong>입니다(적용 전에 발견해 적용하지 않았습니다)</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 실제 곡</td>
<td><strong>Chevt Man — 「Pussy」</strong>(앨범 「Pussy (Single)」 · 2006-02-16 · 랩/힙합) · 멜론 songId <code>1110411</code>. 운영 DB <code>rb_bbs_data</code> uid <code>4613</code> · <code>rb_weeklychart_pop</code> 2006년 3주차 98위 · song_uid 가 멜론과 정확히 일치 ⇒ <strong>DB 수정 불필요</strong></td>
</tr>
<tr>
<td>영상</td>
<td>원래 영상은 삭제됨(10/28 API 판정). 「Chevt Man」은 웹 검색에 아무것도 나오지 않아 대체 영상이 없을 가능성이 큽니다(추정). 없으면 「찾아봤는데 없음」으로 기록합니다</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> <strong>교훈: 화면에 보이는 문자열을 「원본 데이터」로 믿기 전에 DB 원본 행부터 조회합니다.</strong> 표시용으로 이어 붙인 값(연도·videoId)을 제목 일부로 오인하면 엉뚱한 곡을 「찾아냅니다」.<br />
같이 바꾼 것: 직접 찾기 목록의 곡 링크가 <strong>그 곡이 어느 차트에 있는지 알 수 없는 게시판 화면</strong>으로 가던 것을, 그 곡이 오른 주간 차트 페이지로 이동하도록 고쳤습니다.</p>
</blockquote>
</section>

<h2 id="%F0%9F%8E%AF-%EC%9D%B4%EB%B2%88-%EC%A3%BC-%EC%95%88%EA%B1%B4--%EC%98%A4%EB%84%88-%EA%B2%B0%EC%A0%95-%EB%8C%80%EA%B8%B0"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 이번 주 안건 — 오너 결정 대기</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%8E%9E%EF%B8%8F-%EC%95%88%EA%B1%B4-1--raw-%EC%9E%90%EB%8F%99-%ED%98%84%EC%83%81-%EA%B8%B0%EB%B3%B8-%ED%94%84%EB%A6%AC%EC%85%8B-span-classbadge-date%ED%9A%8C%EC%9D%98-%EC%95%88%EA%B1%B4span"><img class="emoji" draggable="false" alt="🎞️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f39e.svg" data-marp-twemoji=""/> 안건 1 · RAW 자동 현상 기본 프리셋 <span class="badge-date">회의 안건</span></h2>
<p>지금은 작업자가 Lightroom 에서 사진마다 노출·섀도·하이라이트를 손으로 맞춘 JPG 를 PTGui 에 넣습니다. 이를 <strong>NAS 수신 즉시 NEF 를 자동 현상</strong>하는 방식으로 바꾸려 합니다(Adobe 구독 불필요).</p>
<table>
<thead>
<tr>
<th>프리셋</th>
<th style="text-align:right">평균 L 오차 (자동 − LR 수동 · 12장면)</th>
</tr>
</thead>
<tbody>
<tr>
<td>지금 기본(HOUSE)</td>
<td style="text-align:right">+6.07</td>
</tr>
<tr>
<td>nas</td>
<td style="text-align:right">+3.79</td>
</tr>
<tr>
<td>nas2</td>
<td style="text-align:right">+3.90</td>
</tr>
<tr>
<td><strong>auto2</strong></td>
<td style="text-align:right"><span class="hl-blue">+2.94</span> (EM 제안 기준 ≤1.0 에는 미달)</td>
</tr>
</tbody>
</table>
<ul>
<li>QC <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8768">IND-8768</a> PASS. 오차의 주원인은 <strong>장면별 노출을 고르는 규칙</strong>입니다(장면마다 노출만 맞춰도 L 11.9 → 5.5).</li>
<li>오너 의견(10/25): 가장 가까운 건 「Lightroom 수동 JPG」 칸이지만, 그 칸은 예전 JPG 를 같은 정렬로 스티칭만 한 <strong>기준선</strong>이라 고를 수 있는 선택지가 아닙니다. <strong>자동이 이 칸에 얼마나 가까워졌는지로 판단합니다.</strong></li>
<li>제안(미착수): 지금 학습은 <strong>색 차이로만</strong> 맞추고 NAS 의 Lightroom xmp 설정값은 한 번도 읽지 않았습니다. xmp 값을 직접 학습시키면 사람 판단에 더 가까워질 수 있습니다.</li>
</ul>

<h2 id="%F0%9F%94%A4-%EC%95%88%EA%B1%B4-2--%EC%BD%98%ED%85%90%EC%B8%A0-%EC%96%B8%EC%96%B4-%ED%95%84%ED%84%B0--%EA%B2%80%EC%83%89%EA%B2%B0%EA%B3%BC-%ED%95%84%ED%84%B0-%ED%86%B5%EC%9D%BC-span-classbadge-date%ED%9A%8C%EC%9D%98-%EC%95%88%EA%B1%B4span"><img class="emoji" draggable="false" alt="🔤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f524.svg" data-marp-twemoji=""/> 안건 2 · 콘텐츠 언어 필터 + 검색결과 필터 통일 <span class="badge-date">회의 안건</span></h2>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>구현은 주간회의 뒤에 시작합니다.</strong> 지금은 W0 시안만 끝났고 구현 트랙(W1 BE → W2 vr-list → W3 검색결과 → 각 QC)은 <strong>아직 하나도 발주하지 않았습니다.</strong></p>
<table>
<thead>
<tr>
<th>#</th>
<th>추천안 (카드를 「수락」하면 이대로 발주)</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>선택 방식 — <strong>복수 선택(체크)</strong>. 같은 필터 안은 OR, 전부 해제 = 전체</td>
</tr>
<tr>
<td>2</td>
<td>언어 목록 — 데이터에 실제로 있는 <strong>8종</strong>(한국어·English·中文·日本語·Türkçe·Русский·Deutsch·Español), 표시는 카드 언어 칩과 같은 원어 표기</td>
</tr>
<tr>
<td>3</td>
<td>위치 — PC 는 「콘텐츠 형식」 뒤 · 「가격」 앞 / 모바일은 필터 아이콘 안 「콘텐츠 형식」 아래 섹션(노출 아이콘 3개 유지)</td>
</tr>
<tr>
<td>4</td>
<td>검색결과 VR 탭 — vr-list 와 <strong>같은 항목·컴포넌트·순서</strong>. 다른 건 「필터바 검색어 칸 숨김」 1건뿐(상단 검색창과 중복). 전체·포스트·채널 탭엔 지금처럼 필터 없음</td>
</tr>
<tr>
<td>5</td>
<td>기본값 — <strong>전체 언어</strong>(아무것도 거르지 않음)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 수락하면 함께 확정되는 것: ① 08/21 결정(<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-6321">IND-6321</a> E5 「목록 언어 자동 필터 폐기」) 가드 교체 — 기본 노출은 전체 언어 유지, 사용자가 고르는 필터만 신설 ② <strong>검색결과 정렬에서 「이름순(오름/내림)」이 사라집니다</strong>(vr-list 의 최신·조회수·인기 버튼으로 통일).<br />
전제: dev 가 아직 <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8264">IND-8264</a> 반영 전이라, 시안의 「after」는 <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8424">IND-8424</a> 수정본 A안(VR 종류 드롭다운 · 모바일 노출 아이콘 3개) 위에 언어 필터를 얹은 그림입니다. B안이 되면 VR 종류 부분만 칩으로 바뀝니다.</p>
</blockquote>

<h2 id="%F0%9F%8C%90-%EC%95%88%EA%B1%B4-4--oembed-%EC%97%85%EC%B2%B4-%EB%AA%A9%EB%A1%9D-%EB%93%B1%EB%A1%9D--%EA%B7%B8%EB%9E%98%EC%84%9C-%EB%8D%94-%ED%8D%BC%EC%A7%80%EB%8A%94%EA%B0%80-span-classbadge-date%ED%9A%8C%EC%9D%98-%EC%95%88%EA%B1%B4span"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 안건 4 · oEmbed 업체 목록 등록 — 「그래서 더 퍼지는가」 <span class="badge-date">회의 안건</span></h2>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>오너 기준: embed 의 가장 큰 목적은 Look360 콘텐츠가 외부 사이트로 퍼져서 서비스가 널리 쓰이고 알려지는 것입니다.</strong> 등록은 「했다」가 아니라 <strong>「그래서 더 퍼지는가」로 판단</strong>하고, 설득이 안 되면 <strong>「안 한다」도 정답</strong>입니다.</p>
<p>등록이 뭔가: GitHub <code>iamcal/oembed</code> 저장소의 업체 목록(<code>providers.json</code>)에 「<code>look360…/vr/*</code> 주소는 <code>look360…/oembed</code> 에 물어보라」는 항목을 PR 로 추가하는 것입니다. <strong>사람이 검색하는 목록이 아니라, 링크를 펼쳐주는 프로그램이 읽는 주소록</strong>입니다. 비용은 PR 1건(무료)이고, 조건은 운영 <code>/oembed</code> 가 공개돼 있어야 합니다.</p>
<table>
<thead>
<tr>
<th>#</th>
<th>링크 태그만 vs 등록까지</th>
<th>판단</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>링크 태그만 있어도 <strong>페이지를 직접 열어보는</strong> 프로그램(WordPress 링크 찾기·Iframely)은 우리를 찾습니다 ⇒ 등록의 추가 효과는 <strong>「목록만 보는」 프로그램까지 넓히는 것</strong></td>
<td>추가 효과 있음</td>
</tr>
<tr>
<td>2</td>
<td>안정성 — 링크 태그 방식은 <strong>Netlify 엣지 주입에 의존</strong>합니다(엣지가 실패하면 찾기 실패). 목록 등록은 HTML 을 안 읽습니다</td>
<td>등록이 유리</td>
</tr>
<tr>
<td>3</td>
<td>신뢰·노출 — oembed.com 목록에 YouTube·Vimeo 와 나란히 올라갑니다</td>
<td><span class="hl-gray">효과는 작음</span></td>
</tr>
<tr>
<td>4</td>
<td><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>한계</strong> — 가장 큰 확산 경로인 <strong>WordPress 는 이 목록을 쓰지 않습니다</strong>(자체 허용 목록). 카카오톡·슬랙·X 미리보기는 OG 카드라 무관하고, Notion 은 링크 태그로 이미 잡힙니다</td>
<td><span class="hl-red">설득 자료에 함께</span></td>
</tr>
<tr>
<td>5</td>
<td>대안 — ① <strong>WordPress 플러그인 공개</strong>(사람이 찾는 경로라 가장 직접적) ② Iframely·Embedly 등록 신청 ③ 유입 버튼을 재생 중에도 보이게(안건 5)</td>
<td>더 직접적일 수 있음</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="88" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">

<thead>
<tr>
<th>#</th>
<th>정할 것</th>

</thead>
<tbody>
<tr>

<tr>

<blockquote>
<p>등록 작업(W5)은 EM 이 「운영 배포 뒤로 보류」로 제안해 <strong>발주하지 않았습니다.</strong> 자식 트랙 W1~W4·QC 는 진행했습니다(<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8886">IND-8886</a> · <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8887">IND-8887</a> · <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8888">IND-8888</a> · <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8889">IND-8889</a>).</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="89" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%E2%86%97%EF%B8%8F-%EC%95%88%EA%B1%B4-5--%EC%9E%84%EB%B2%A0%EB%93%9C-%EC%9C%A0%EC%9E%85-%EB%B2%84%ED%8A%BC--%EC%A0%95%ED%95%A0-%EA%B2%83-span-classbadge-dateind-8890span"><img class="emoji" draggable="false" alt="↗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2197.svg" data-marp-twemoji=""/> 안건 5 · 임베드 유입 버튼 — 정할 것 <span class="badge-date">IND-8890</span></h2>
<p>시안은 Section 03 에 있습니다. 오너가 10/27 에 「조작 중 숨김 + 모서리 아이콘」 조합을 고른 상태이고, 이제 세부를 확정합니다.</p>
<table>
<thead>
<tr>
<th>#</th>
<th>정할 것</th>
<th>Designer 제안</th>
</tr>
</thead>
<tbody>
<tr>
<td>①</td>
<td>위치 · 크기 · 글자 표시 기준폭</td>
<td><strong>A 우상단</strong> · 아이콘 28~32px 반투명 · 480px 경계</td>
</tr>
<tr>
<td>②</td>
<td>나타남 타이밍</td>
<td>손 떼고 <strong>2.5초</strong> 뒤 0.3초 페이드 인</td>
</tr>
<tr>
<td>③</td>
<td>슬라이드용 <code>nocontrol=1</code> 임베드에도 넣을지</td>
<td>추천은 <strong>「넣지 않는다」</strong></td>
</tr>
<tr>
<td>④</td>
<td>구현 진행 방식</td>
<td>paperclip 발주 / 직접 구현</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> 이 EPIC 은 <strong>시안만</strong>이고 구현은 금지돼 있습니다. 결정 뒤에 발주합니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-theme="clean" lang="en-US" data-marpit-pagination="90" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="102">
<h2 id="%F0%9F%91%81%EF%B8%8F-%EC%95%88%EA%B1%B4-6--%EC%9E%84%EB%B2%A0%EB%93%9C-%EC%9E%90%EB%8F%99-%EC%9E%AC%EC%83%9D%EC%9D%98-%EC%A1%B0%ED%9A%8C%EC%88%98-%EA%B8%B0%EC%A4%80-c-span-classbadge-dateind-8870span"><img class="emoji" draggable="false" alt="👁️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f441.svg" data-marp-twemoji=""/> 안건 6 · 임베드 자동 재생의 조회수 기준 (C) <span class="badge-date">IND-8870</span></h2>
<p>원칙: <strong>사용자가 의도해서 콘텐츠에 진입한 1회 = +1.</strong> 같은 감상 안에서 다시 불러오는 것은 +0. 홈 히어로는 의도가 없어 조회수에서 뺐습니다(<a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/IND-8869">IND-8869</a> A안).</p>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 정할 것: 외부 사이트에 iframe 으로 붙은 임베드가 <code>?autoplay=1</code> 로 자동 재생될 때 <strong>몇 번째부터 셀지</strong>입니다.</p>
<table>
<thead>
<tr>
<th>선택지</th>
<th>내용</th>
<th>장점</th>
<th>단점</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>①</strong></td>
<td><strong>로드만 돼도 +1</strong></td>
<td>외부 노출이 조회수에 잡혀 마케팅에 유리</td>
<td>그 페이지를 연 사람이 우리 콘텐츠를 보려 한 건 아니라서, <strong>히어로를 뺀 기준과 어긋남</strong></td>
</tr>
<tr>
<td><strong>②</strong></td>
<td>로드할 때 +0, 사용자가 임베드를 <strong>조작(드래그·클릭·휠·줌)하거나 클릭해 들어오면 1회 +1</strong></td>
<td>감상 기준에 맞음</td>
<td>외부 노출은 덜 잡힘</td>
</tr>
</tbody>
</table>
<blockquote>
