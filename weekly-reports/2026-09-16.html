<div class="col">

<li>관리자 권한을 <span class="hl-green">ADMIN 하나로</span> 통일</li>
</ul>
<h3 id="%F0%9F%97%BA%EF%B8%8F-%EC%A7%80%EC%97%AD-%EB%8D%B0%EC%9D%B4%ED%84%B0--5%EB%8B%A8-%EC%B2%B4%EA%B3%84-%EC%99%84%EC%A3%BC"><img class="emoji" draggable="false" alt="🗺️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5fa.svg" data-marp-twemoji=""/> 지역 데이터 — 5단 체계 완주</h3>

<h3 id="%F0%9F%96%A5%EF%B8%8F-%EC%82%AC%EC%9A%A9%EC%9E%90-%ED%99%94%EB%A9%B4"><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5a5.svg" data-marp-twemoji=""/> 사용자 화면</h3>

<li>감상 화면 <span class="hl-red">언어 전환 누락</span> 해소</li>

<h3 id="%F0%9F%93%A6-%EC%9D%B8%ED%94%84%EB%9D%BC--%EC%97%85%EB%A1%9C%EB%93%9C-%EA%B2%80%EC%A6%9D"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> 인프라 — 업로드 검증</h3>

<p><span class="sec-num">Section 01</span></p>
<h2 id="%EB%B3%B4%EC%95%88--%EB%B0%94%EA%B9%A5%EC%9C%BC%EB%A1%9C-%EC%97%B4%EB%A0%A4-%EC%9E%88%EB%8D%98-%EB%AC%B8">보안 — 바깥으로 열려 있던 문</h2>
<p>운영 사이트에 노출돼 있던 파일과, 안에서 뚫려 있던 권한을 함께 닫았습니다.</p>

<h2 id="%F0%9F%94%B4-%EC%9A%B4%EC%98%81-%EC%82%AC%EC%9D%B4%ED%8A%B8%EC%9D%98-%EB%A1%9C%EA%B7%B8-%ED%8C%8C%EC%9D%BC%EC%9D%B4-%EA%B3%B5%EA%B0%9C%EB%8F%BC-%EC%9E%88%EC%97%88%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge-date914span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 운영 사이트의 로그 파일이 공개돼 있었습니다 <span class="badge-date">9/14</span> <span class="badge-new">NEW</span></h2>
<p>업로드 기능을 점검하다 <strong>운영 도메인(<code>look360.kr</code>)의 임시 폴더가 인터넷에 열려 있는 것</strong>을 발견했습니다.</p>

<thead>
<tr>
<th>주소</th>
<th>당시 응답</th>
<th>크기</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>/_tmp/php_errors.log</code></td>
<td><span class="hl-red">200 (공개)</span></td>
<td><span class="hl-red">약 200MB</span></td>
</tr>
<tr>
<td><code>/_tmp/uploads/1669.zip</code></td>
<td><span class="hl-red">200 (공개)</span></td>
<td>16.6MB</td>
</tr>
<tr>
<td><code>/_tmp/</code> 디렉토리 목록</td>
<td>404 (이미 차단)</td>
<td>—</td>
</tr>
</tbody>
</table>
<blockquote>
<p>오류 로그에는 보통 서버 경로·질의문·요청값이 섞입니다. <strong>내용은 열람하지 않고 응답 여부만 확인</strong>했습니다. 업로드된 파노라마 원본 압축파일도 파일명만 알면 받을 수 있는 상태로, 약 310MB가 남아 있었습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="5" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">

<p>담당자가 직접 집행하고, <strong>집행에 관여하지 않은 별도 인원이 외부 인터넷에서 재측정</strong>했습니다.</p>

<tbody>
<tr>

<tr>
<td><code>/_tmp/</code></td>

<p>지금 쓰는 코드를 먼저 고치고, 과거 기록은 <strong>오너가 직접 실행</strong>하는 방식으로 나눴습니다.</p>

</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="8" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="39">
