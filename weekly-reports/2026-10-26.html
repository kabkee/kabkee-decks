<h2 id="%F0%9F%94%90-look360kr-sns-%EB%A1%9C%EA%B7%B8%EC%9D%B8--%EC%9E%84%EC%9D%98-%EA%B3%84%EC%A0%95-%EB%A1%9C%EA%B7%B8%EC%9D%B8-%EC%B0%A8%EB%8B%A8-span-classbadge-date1026span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> look360.kr SNS 로그인 — 임의 계정 로그인 차단 <span class="badge-date">10/26</span> <span class="badge-new">NEW</span></h2>
<p>플랫폼 SNS 로그인을 검토하다가 <strong>레거시에도 같은 종류의 결함</strong>을 찾았습니다. 서버가 카카오·네이버 토큰을 확인하지 않고 브라우저가 보낸 SNS id 만 믿었기 때문에, 피해자의 SNS id 를 알면 그 계정으로 로그인할 수 있었습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>운영 노출</td>
<td>대상 파일 7개 md5 가 로컬과 전부 일치 → <strong>운영에 그대로 노출돼 있었음</strong></td>
</tr>
<tr>
<td>같은 결함 추가 발견</td>
<td>가입 API <code>a.snscall_join_api.php</code> 도 기존 회원이면 바로 세션 발급 · SQL 문자열 결합 · 프로필 이미지 서버 다운로드(SSRF 소지)</td>

<p>10/22 04:00 증분 백업이 안전장치(50GiB)에 걸려 멈췄습니다. 실제 변경은 <strong>XML 88개(약 2.3MB)</strong> 인데, 9/14 원안(«바뀐 장소는 장소 전체 tar 재다운로드») 때문에 장소 71곳 <strong>57.2GiB</strong> 를 받으려 했습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>오너 결정</td>
<td>57.2GiB 를 옛 방식으로 승인하지 않고, <strong>바뀐 파일만 받는 변경분 세대</strong>로 고친 뒤 처리</td>
</tr>
<tr>
<td>결과</td>
<td>같은 변경을 <strong>2,380,411바이트</strong>로 처리 · 10/23 정기 실행 3건(04:00 · 04:30 · 06:00) 정상 · QC 7축 PASS</td>
</tr>
<tr>
<td>9/14 판단이 틀린 지점</td>
<td>«장소가 바뀌면 대개 장소 전체가 바뀐다» — XML 일괄 수정은 여러 장소에 1~3개씩 흩어진다</td>
</tr>
<tr>
<td>유지한 가치</td>
<td>복원 단순성(목록표 하나로 복원) · 복원 md5 39,342건 불일치 0</td>
</tr>
<tr>
<td>10/23 추가 조치</td>
<td>복원 도구가 소유자·권한(www-data)을 버리던 문제 수정(<code>fd1c54e</code>) · 핫스팟 복구 때 root 로 덮인 XML 80개를 33:33 · 0664 로 복구</td>
</tr>

<p><span class="sec-num">Section 07</span></p>
<h2 id="%F0%9F%8E%AF-%EC%9D%B4%EB%B2%88-%EC%A3%BC-%EC%95%88%EA%B1%B4--%EC%98%A4%EB%84%88-%EA%B2%B0%EC%A0%95-%EB%8C%80%EA%B8%B0"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 이번 주 안건 — 오너 결정 대기</h2>
<p>장소 재매칭 정책을 먼저 정하고, 이어서 시안·기본값 결정과 확인 대기 카드를 처리합니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="36" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="59">
<h2 id="%F0%9F%97%BA%EF%B8%8F-%EC%95%88%EA%B1%B4-1--%EC%9E%A5%EC%86%8C-%EC%9E%AC%EB%A7%A4%EC%B9%AD--%EC%99%9C-%ED%95%84%EC%9A%94%ED%95%9C%EA%B0%80-span-classbadge-date%ED%9A%8C%EC%9D%98-%EC%95%88%EA%B1%B4span"><img class="emoji" draggable="false" alt="🗺️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5fa.svg" data-marp-twemoji=""/> 안건 1 · 장소 재매칭 — 왜 필요한가 <span class="badge-date">회의 안건</span></h2>
<p>레거시(look360_ksq1.2)의 «장소»는 실제 지리적 장소가 아니라 <strong>«업로드 폴더 + VR 주소 + 업체 페이지 + 결제 단위»를 겸한 묶음</strong>이었습니다. l3 플랫폼은 장소를 «어디서 찍었나»로 쓰는데(지역 칩·지역 필터·지도), 마이그레이션이 값을 의미 변환 없이 옮겨서 위치가 아닌 장소가 위치처럼 화면에 나갑니다.</p>
<table>
<thead>
<tr>
<th>레거시에서 장소가 하던 역할</th>
<th>코드 근거</th>
</tr>
</thead>
<tbody>
<tr>
<td>업로드 폴더 — 장소 id 없이는 일괄등록 거부 · <code>files/pano/{장소}/…</code> · 번호도 장소 안에서만 유일</td>
<td><code>panoBatch/a.insertNewPano.php:5-21, :89-91</code></td>
</tr>
<tr>
<td>VR 주소 — <code>/vr/{장소}/{투어}</code> · <code>/vrstory/{장소}/…</code></td>
<td><code>.htaccess:154-157, :174-181</code></td>
</tr>
<tr>
<td>업체 페이지·회원 소유·결제 단위 — 가격표·영업시간·쿠폰·유료 기간·소유 회원</td>
<td><code>mypage/myplace.php:26-51</code></td>
</tr>
<tr>
<td>입력 검증 없음 — 이름만 필수(50자) · 주소·좌표 선택</td>
<td><code>addPlace.js:507-520</code></td>
</tr>
<tr>
<td>마이그레이션 — <code>look360_place → l3_place</code> 그대로 복사, «실제 장소인가» 판정 없음</td>
<td><code>column-mapping.json:933-940</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>타당성: ① 지금도 «청와대 → 경기도 · 용인시» 같은 틀린 칩이 나갑니다(소속형 81건 중 노출 69). ② 10/19 회의 #24 가 «나중에 수동 전수 검수로 재매칭»을 정했고 이번이 그 재매칭입니다. ③ <strong>서비스 방향 전환의 일부(오너 10/23)</strong> — 콘텐츠 중심 분류로 바꾸고 장소는 부가 정보로 내립니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="37" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="59">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="38" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="59">

<tr>
<th></th>

<h2 id="%F0%9F%97%82%EF%B8%8F-%EC%95%88%EA%B1%B4-1--%EC%8B%9C%ED%8A%B8-%EC%9E%91%EC%97%85-%EC%88%9C%EC%84%9C-span-classbadge-date%EC%98%A4%EB%84%88-%EC%9A%94%EC%B2%AD-1023span"><img class="emoji" draggable="false" alt="🗂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c2.svg" data-marp-twemoji=""/> 안건 1 · 시트 작업 순서 <span class="badge-date">오너 요청 10/23</span></h2>
<p><strong>행 색 = 제안 처리</strong> — 파랑 재매칭 · 초록 주소 채움 · 보라 새 장소 · 회색 유지 · <strong>노랑 검토 필요</strong> · 빨강 매칭 해제. A · O · Q · R · S 머리글에 마우스를 올리면 입력 방법이 뜹니다.</p>
<ol>
<li><strong>노란 행(검토 필요) 6건부터</strong> O열을 직접 판단합니다 — ① 11행(2256 NH 통합IT데이터센터) · 12행(2828 외대당구클럽) / ② 46행(818 청창사 제5기 졸업식) · 47행(858 오벨리스크) · 48행(2800 광화문) · 49행(2807 동대문시장).</li>
<li>나머지 행은 P열 링크로 화면을 열어 보며 <strong>제안이 이상한 행만</strong> O열에 다른 값을 씁니다. 비워 둔 O열은 «제안대로(O)»로 일괄 처리합니다.</li>
<li><strong>빨간 행(매칭 해제)</strong> 은 S열도 판단합니다 — 장소가 없어지면 그 주소로 지역 칩이 생기므로 남길지 · 지울지. 실제로 판단할 행은 ② 소속형 33건(유지 제안 14 · 삭제 제안 19)뿐입니다. ① 폴더형 해제 대상 49건은 주소가 원래 비어 있습니다.</li>
<li>입력이 끝나면 AI 에게 알립니다 → 입력값을 집계해 보고하고, <strong>DB 반영은 회의에서 정책(1번)이 확정된 뒤</strong> 별도로 진행합니다.</li>
</ol>
</section>

<h2 id="%F0%9F%8E%9E%EF%B8%8F-%EC%95%88%EA%B1%B4-5--raw-%EC%9E%90%EB%8F%99-%ED%98%84%EC%83%81-%EA%B8%B0%EB%B3%B8-%ED%94%84%EB%A6%AC%EC%85%8B-span-classbadge-date%ED%9A%8C%EC%9D%98-%EC%9D%B4%ED%9B%84-%ED%99%95%EC%A0%95span"><img class="emoji" draggable="false" alt="🎞️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f39e.svg" data-marp-twemoji=""/> 안건 5 · RAW 자동 현상 기본 프리셋 <span class="badge-date">회의 이후 확정</span></h2>
<p>지금은 작업자가 Lightroom 에서 사진마다 노출·섀도·하이라이트를 손으로 맞춘 JPG 를 PTGui 에 넣습니다. 이를 NAS 수신 즉시 NEF 를 자동 현상하는 방식으로 바꾸려 합니다(Adobe 구독·로그인 불필요).</p>
<table>
<thead>
<tr>
<th>후보</th>
<th>평균 L 오차 (자동 − LR 수동, 12장면)</th>
</tr>
</thead>
<tbody>
<tr>
<td>지금 기본 (HOUSE)</td>
<td>+6.07</td>
</tr>
<tr>
<td>nas · nas2</td>
<td>+3.79 · +3.90</td>
</tr>
<tr>
<td><strong>auto2</strong></td>
<td><strong>+2.94</strong> (EM 제안 기준 ≤1.0 미달)</td>
</tr>
</tbody>
</table>
<ul>
<li>오차의 주원인은 장면별 노출 규칙입니다(노출만 맞춰도 L 11.9 → 5.5). QC IND-8768 PASS.</li>
<li>「Lightroom 수동 JPG」 칸은 작업자가 만든 JPG 를 같은 정렬로 스티칭만 한 <strong>기준선</strong>이라 선택지가 아닙니다. 자동이 이 칸에 얼마나 가까워졌는지로 판단합니다.</li>
<li>제안(미착수): NAS 의 Lightroom xmp 설정값(작업자가 실제로 준 값)을 직접 학습 — 지금 코드는 xmp 를 한 번도 읽지 않습니다.</li>
</ul>
<blockquote>
<p><strong>정할 것:</strong> ① 기본값 — <code>auto2</code> 교체 / HOUSE 유지 / 둘 다 아직 ② 눈으로 봐서 수용 가능한지 ③ xmp 학습 진행 여부 ④ 진행 방식. 결과는 카드 <code>2745d830</code> 에 답합니다.</p>
</blockquote>

<h2 id="%E2%9C%A8-%EC%95%88%EA%B1%B4-6--%EC%9E%91%EC%97%85%EC%8B%A4-%EB%85%B8%EC%9D%B4%EC%A6%88-%EC%A0%9C%EA%B1%B0--%EC%83%A4%ED%94%88-%EA%B8%B0%EB%B3%B8%EA%B0%92-span-classbadge-date10241025span"><img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2728.svg" data-marp-twemoji=""/> 안건 6 · 작업실 노이즈 제거 · 샤픈 기본값 <span class="badge-date">10/24~10/25</span></h2>
<p>어둡게 찍힌 곳의 굵은 색 노이즈를 녹이고 마지막에 전체 샤픈을 주는 단계를 작업실에 넣으려 합니다. 실제 RAW 3장(마트·주차장·호텔)으로 ①없음 ②LibRaw ③④<img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> 색 노이즈 ⑤<img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> AI(SCUNet, GPU) ⑥<img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/>+<img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> 를 같은 자리 확대로 비교했습니다(렌즈통 제외).</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>오너 의견(10/24)</td>
<td><strong><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> AI + <img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> 색 노이즈(강) + 샤픈</strong> 이 가장 보기 좋다 · 장당 약 48초(RTX 3060)여도 이 조합이 낫다</td>
</tr>
<tr>
<td>먼저 넣은 것</td>
<td>작업실에 「AI + 색 강 + 샤픈 보통」 기본값(<code>86f0233</code>) · NAS 원본 3포인트를 시험 프로젝트에 돌림 · 렌더당 74~81초</td>
</tr>
<tr>
<td>정할 것</td>
<td>① 기본 조합 확정 ② AI 를 기본으로 켤지, 작업자가 고르게 할지(포인트당 4~6장 → 4~5분, ⑦ 작업 큐 일괄 안) ③ 샤픈 강도 기본값</td>
</tr>
<tr>
<td>확정 후</td>
<td>② 톤·색 카드에 노이즈 선택 · ⑦ 앞 최종 샤픈 · 바뀌면 <code>stitcher/finish.py</code> <code>DEFAULTS</code> 만 수정</td>
</tr>
</tbody>
</table>

<h2 id="%F0%9F%92%BE-%EC%95%88%EA%B1%B4-7--%ED%8C%8C%EC%9D%BC-%EB%B0%B1%EC%97%85--%EC%B6%94%EA%B0%80-%EB%B0%B1%EC%97%85-%EB%85%BC%EC%9D%98-span-classbadge-date%EB%85%BC%EC%9D%98--%EA%B2%B0%EC%A0%95-%EC%95%84%EB%8B%98span"><img class="emoji" draggable="false" alt="💾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4be.svg" data-marp-twemoji=""/> 안건 7 · 파일 백업 — 추가 백업 논의 <span class="badge-date">논의 · 결정 아님</span></h2>
<p>오너 지시(10/23): 「내용만 공유하고 논의하기로」.</p>
<ul>
<li><strong>문제:</strong> 원본 백업(H:)과 2차 사본(D:·E:) 3벌이 <strong>모두 kabkee-main 한 대</strong>에 있습니다. 디스크 1개 고장은 막지만, 랜섬웨어(연결된 디스크의 파일을 전부 암호화하는 악성코드)·도난·전원 사고면 3벌이 함께 사라질 수 있습니다. AWS 쪽은 버전관리 + 구버전 30일뿐입니다(AWS Backup·복제·Object Lock 없음).</li>
<li>9/14 원안은 2차 사본을 «다른 컴퓨터»에 두었는데, 10/15 서버 이전 때 같은 컴퓨터로 모였습니다. 이를 따로 결정한 기록은 찾지 못했습니다.</li>
</ul>
<table>
<thead>
<tr>
<th>선택지</th>
<th>월 비용(추정)</th>
<th>특징</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>A. 별도 AWS 계정 S3 Glacier Deep Archive</strong> (오너 선호안)</td>
<td>약 $1</td>
<td>꺼낼 때만 비용 · 전체 복원 1회 약 $50~62 · 최소 보관 180일</td>
</tr>
<tr>
<td>B. Backblaze B2</td>
<td>약 $3</td>
<td>바로 꺼냄</td>
</tr>
<tr>
<td>C. 외장 HDD 다른 장소 보관</td>
<td>처음 약 10만원</td>
<td>수동 갱신</td>
</tr>
</tbody>
</table>
<blockquote>
<p>어느 쪽이든 kabkee-main 에는 «올리기만 되고 지우기는 안 되는» 권한만 줍니다. A 는 180일 전에 지우면 남은 기간 저장비를 한 번에 청구합니다(490GB 기준 최대 $5.88). <strong>정할 것:</strong> ① 할지·어느 방식 ② 직접 vs 발주 ③ A·B 면 새 계정 생성(오너 작업)</p>
</blockquote>
