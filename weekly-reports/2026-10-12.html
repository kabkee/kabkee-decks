<p><span class="sec-num">Section 01</span></p>
<h2 id="l3-%ED%94%8C%EB%9E%AB%ED%8F%BC--360%EB%8F%99%EC%98%81%EC%83%81-%EA%B5%AC%EC%84%B1%EC%9A%94%EC%86%8C">l3 플랫폼 · 360동영상 구성요소</h2>
<p>360뷰의 구성요소 줄에 사진 파노라마와 나란히 360동영상을 넣을 수 있게 했습니다. 기획서(9/18) 이후 처음 구현한 신규 기능이며, 모두 개발 서버 반영 상태입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="4" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="27">
<h2 id="%F0%9F%8E%AC-360%EB%8F%99%EC%98%81%EC%83%81--%EB%AC%B4%EC%97%87%EC%9D%84-%EB%A7%8C%EB%93%A4%EC%97%88%EB%82%98-span-classbadge-date1081011span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ac.svg" data-marp-twemoji=""/> 360동영상 — 무엇을 만들었나 <span class="badge-date">10/8~10/11</span> <span class="badge-new">NEW</span></h2>
<p>파노라마 종류에 <code>video360</code> 을 추가해, 업로드 영상과 YouTube 영상을 360뷰 한 칸으로 등록·재생합니다.</p>
<table>
<thead>
<tr>
<th>영역</th>
<th>구현 내용</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>서버(API)</td>
<td>영상 테이블 신설 · 개별/일괄(zip) 매칭 업로드 · 읽기/쓰기 계약</td>
<td><span class="hl-green">QC 통과</span> (테스트 385/385)</td>
</tr>
<tr>
<td>영상 변환</td>
<td>ffmpeg 프리셋 스크립트 · 화질 단계와 기본 화질 하한 실측</td>
<td><span class="hl-green">완료</span></td>
</tr>
<tr>
<td>관리자 화면</td>
<td>등록·편집 탭 · 일괄 매칭 업로드 · 구성요소 종류 배지</td>
<td><span class="hl-green">QC 통과</span></td>
</tr>
<tr>
<td>사용자 뷰어</td>
<td>재생 레이어 · 화질 선택 · 종료 후 이동 · 첫 재생 통계 · 목록 배지</td>
<td><span class="hl-green">재QC 통과</span></td>
</tr>
<tr>
<td>QC 결함 2건</td>
<td>① 화질을 바꿔도 실제 재생 소스가 그대로 ② 잠긴 영상의 원본 주소 노출</td>
<td><span class="hl-green">수정 후 재QC 통과</span></td>
</tr>
<tr>
<td>오너 결정</td>
<td>영상 장면 진입 시 자동 패닝 끄기</td>
<td><span class="hl-green">적용</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>관리자 화면은 10/8 오너 결정(「push 는 오너 지시 때만」)에 따라 일부 커밋(<code>3e9ad4a</code> 등 3건)이 원격 미반영 상태입니다.</p>
</blockquote>

<tr>

<tr>
<td>썰매 아이콘이 안 뜨고 자동으로 넘어감</td>
<td>레거시 실측 결과 「아이콘 노출 → 클릭 대기」가 정답</td>
<td><span class="hl-green">레거시와 일치</span></td>

<tr>
<td>영상 진척이 상태바에 안 보임</td>

<tr>
<td>이전/다음으로 떠나도 소리가 계속 남</td>
<td>매체 정지 처리가 매체별로 흩어짐</td>
<td><span class="hl-green">공통 정지 장치 1곳으로 통합</span></td>
</tr>
<tr>
<td>플랫폼 전체 매체·전 스토리 전수 검사</td>
<td>공통 장치 확대 적용</td>
<td><span class="hl-amber">대기</span></td>
</tr>

</table>
<blockquote>
<p>측정은 모두 가상 GPU(헤드리스) 환경이며, 실제 그래픽카드 환경은 측정하지 않았습니다.</p>
