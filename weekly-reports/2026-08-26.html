<h2 id="%EC%9D%B4%EB%B2%88-%EC%A3%BC-%EC%A3%BC%EC%9A%94-%EC%9E%91%EC%97%85--%EB%8B%A4%EA%B5%AD%EC%96%B4%EB%A5%BC-%EC%8B%A4%EC%A0%9C%EB%A1%9C-%EB%8B%A4%EA%B5%AD%EC%96%B4%EB%8B%B5%EA%B2%8C-%EB%A7%8C%EB%93%A0-%EC%A3%BC%EA%B0%84">이번 주 주요 작업 — 「다국어를 실제로 다국어답게」 만든 주간</h2>
<div class="cols">
<div class="col">
<h3 id="%F0%9F%8C%90-%EB%8B%A4%EA%B5%AD%EC%96%B4--%EC%82%AC%EB%9D%BC%EC%A1%8C%EB%8D%98-%EC%9E%90%EC%82%B0-%EB%B3%B5%EC%9B%90"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 다국어 — 사라졌던 자산 복원</h3>
<ul>
<li>레거시에 있던 360VIEW 외국어판 <span class="hl-red">94건이 이관 과정에서 통째로 유실</span>돼 있던 것을 복원</li>
<li>언어그룹 <span class="hl-blue">114개</span> 자동 연결 · 번호 체계 재정비</li>
<li>이미 이관돼 있던 번역 <span class="hl-blue">2,215행</span>이 <span class="hl-red">한 번도 읽히지 않던</span> 문제 해소</li>
</ul>
<h3 id="%F0%9F%94%A4-%EB%8B%A4%EA%B5%AD%EC%96%B4--%ED%99%94%EB%A9%B4-%EC%A0%84%EB%A9%B4-%EC%A0%81%EC%9A%A9"><img class="emoji" draggable="false" alt="🔤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f524.svg" data-marp-twemoji=""/> 다국어 — 화면 전면 적용</h3>
<ul>
<li>뷰어에서 <span class="hl-red">묻지도 않고 켜지던</span> 자동번역을 <span class="hl-green">사용자 선택식</span>으로 전환</li>
<li>「제목만 번역」에서 <span class="hl-green">파노라마 이름·포스트·댓글까지</span> 전면 확대</li>
<li>번역이 <span class="hl-amber">부실한 콘텐츠는 목록에서 자동 은닉</span></li>
</ul>
</div>
<div class="col">
<h3 id="%E2%9A%A1-%EC%84%B1%EB%8A%A5--%EC%B1%84%EB%84%90-%ED%8E%98%EC%9D%B4%EC%A7%80"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 성능 — 채널 페이지</h3>
<ul>
<li>채널 페이지 기본 정보 <span class="hl-red">1.55초</span> → <span class="hl-green">0.1초대</span></li>
<li>없어질 레거시 DB를 <span class="hl-red">요청마다 조회</span>하던 8곳 전면 제거</li>
</ul>
<h3 id="%F0%9F%94%94-%EC%95%8C%EB%A6%BC--%EB%88%84%EA%B0%80%EB%AC%B4%EC%97%87%EC%9D%84"><img class="emoji" draggable="false" alt="🔔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f514.svg" data-marp-twemoji=""/> 알림 — 「누가·무엇을」</h3>
<ul>
<li>좋아요 알림 클릭 시 <span class="hl-red">전건 404</span>이던 문제 해소 + 보낸 사람 표시</li>
<li>알림 삭제가 <span class="hl-red">실제로는 안 되던</span> 상태 실집행 완료</li>
</ul>
<h3 id="%F0%9F%8E%A8-%ED%99%94%EB%A9%B4--%EC%9D%BC%EA%B4%80%EC%84%B1-%EC%A0%95%EB%A6%AC"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> 화면 — 일관성 정리</h3>
<ul>
<li>화살표 아이콘 <span class="hl-blue">7가지 방식</span> → 단일 부품</li>
<li>마이페이지 <span class="hl-green">페이지 번호 전환</span> · 계정 설정 <span class="hl-green">재인증 게이트</span> 신설</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="sec" data-theme="clean" lang="ko-KR" class="sec" data-marpit-pagination="3" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="30">
<p><span class="sec-num">Section 01</span></p>
<h2 id="%EB%8B%A4%EA%B5%AD%EC%96%B4--%EC%9E%83%EC%96%B4%EB%B2%84%EB%A6%B0-%EC%BD%98%ED%85%90%EC%B8%A0%EB%A5%BC-%EB%90%98%EC%B0%BE%EA%B8%B0">다국어 — 잃어버린 콘텐츠를 되찾기</h2>
<p>레거시에서 실제로 서비스되던 외국어판이 v3 이관 과정에서 사라져 있었습니다. 원인 규명부터 데이터 복원, 번호 체계 정리까지 마쳤습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="4" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%8C%8F-360view-%EC%99%B8%EA%B5%AD%EC%96%B4%ED%8C%90-94%EA%B1%B4-%EB%B3%B5%EC%9B%90-span-classbadge-date819825span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🌏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30f.svg" data-marp-twemoji=""/> 360VIEW 외국어판 94건 복원 <span class="badge-date">8/19~8/25</span> <span class="badge-new">NEW</span></h2>
<p>지난주 신설한 「다국어 버전 연결」 기능이 <span class="hl-red">VRSTORY 15건만 잡고 360VIEW는 하나도 못 잡았습니다.</span> 조사 결과 버그가 아니라 <strong>이관 규칙 자체가 360VIEW 외국어판을 만들지 않고 있었습니다.</strong></p>
<table>
<thead>
<tr>
<th>단계</th>
<th>무엇이 잘못돼 있었나</th>
<th>조치</th>
</tr>
</thead>
<tbody>
<tr>
<td>1 · 언어값</td>
<td>레거시에 언어 컬럼이 없어 <span class="hl-red">전 건을 'kr' 로 하드코딩</span></td>
<td>오표기 36건 교정 (IND-6323)</td>
</tr>
<tr>
<td>2 · 외국어판 원본</td>
<td>언어별 URL 140개를 담은 레거시 표가 <span class="hl-red">이관 대상에서 누락</span></td>
<td>이관 규칙에 편입 (IND-6325)</td>
</tr>
<tr>
<td>3 · 생성 경로</td>
<td>외국어판 원본이 없으니 콘텐츠 행이 <span class="hl-red">생길 경로가 구조적으로 봉쇄</span></td>
<td>개발 DB 실집행 — <span class="hl-green">94건 생성</span> (IND-6335)</td>
</tr>
<tr>
<td>4 · 연결</td>
<td>원본과 번역본을 묶는 그룹이 <span class="hl-red">27개뿐</span></td>
<td><span class="hl-green">114개 자동 연결</span> (IND-6326)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>이관 설계서가 가리키던 외국어판 처리 함수는 <strong>코드베이스 어디에도 존재하지 않았고</strong>, 그것을 지우는 스크립트만 화석처럼 남아 있었습니다. 「구현했다가 되돌린 뒤 다시 만들지 않은」 상태였습니다.</p>
</blockquote>
<div class="links">

</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="5" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%94%A2-%EB%B2%88%ED%98%B8-%EC%B2%B4%EA%B3%84%EA%B0%80-%EB%AC%B4%EB%84%88%EC%A7%88-%EB%BB%94%ED%95%9C-%EA%B2%83%EC%9D%84-%EB%90%98%EB%8F%8C%EB%A6%BC-span-classbadge-date823824span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🔢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f522.svg" data-marp-twemoji=""/> 번호 체계가 무너질 뻔한 것을 되돌림 <span class="badge-date">8/23~8/24</span> <span class="badge-new">NEW</span></h2>
<p>복원한 94건에 <span class="hl-blue">90만번대</span> 임시 번호를 붙여뒀는데, 이것이 <strong>신규 콘텐츠 번호까지 90만번대로 밀어버리는</strong> 부작용을 낳고 있었습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%AC%B8%EC%A0%9C%EC%98%80%EB%82%98">무엇이 문제였나</h3>
<ul>
<li>번호가 <span class="hl-red">2,926 ~ 900,239 사이 89만 개가 영구 유실</span>되는 상태</li>
<li>신규 콘텐츠가 <span class="hl-red">「외국어판 삭제」 대상 범위 안에서 태어나</span> 사고 위험</li>
<li>번호 되돌리기 명령을 실행해도 <span class="hl-red">조용히 무시</span>됨 — 90만번대 행이 있는 한 불가능</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%96%B4%EB%96%BB%EA%B2%8C-%ED%95%B4%EA%B2%B0%ED%96%88%EB%82%98">어떻게 해결했나</h3>
<ul>
<li>94건을 <span class="hl-green">원래 번호 공간(2,926~3,019)으로 재배정</span>하고 연관 표 19곳 <span class="hl-blue">18,933행</span> 일괄 재연결</li>
<li>판별 기준을 「번호 범위」에서 <span class="hl-green">「원본 콘텐츠 참조」</span>로 이관해 사고 원인 제거</li>
<li>재실행해도 같은 결과가 나오도록 <span class="hl-green">멱등성 확보</span> + 격리 DB에서 처음부터 재현 검증</li>
</ul>
</div>
</div>
<div class="links">
<span class="lbl">확인</span>

</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="6" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%88%AF-%EC%98%81%EC%96%B4%ED%8C%90%EC%9D%B8%EB%8D%B0-%ED%99%94%EB%A9%B4%EC%9D%B4-%EC%A0%84%EB%B6%80-%ED%95%9C%EA%B5%AD%EC%96%B4-span-classbadge-date824span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🈯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f22f.svg" data-marp-twemoji=""/> 「영어판인데 화면이 전부 한국어」 <span class="badge-date">8/24</span> <span class="badge-new">NEW</span></h2>
<p>오너 지적: <span class="hl-blue">「다른 언어 화면을 만들 때 레거시처럼 번역 용어를 활용해야 하는데 작동을 안 하는 것 같다」</span> — 실측 결과 <strong>지적이 정확했습니다.</strong></p>
<table>
<thead>
<tr>
<th>항목</th>
<th>상태</th>
</tr>
</thead>
<tbody>
<tr>
<td>번역 데이터 이관</td>
<td><span class="hl-green">완료</span> — 파노라마 이름 2,215행 / 그룹·장소·투어 포함 7개 언어</td>
</tr>
<tr>
<td>런타임 사용</td>
<td><span class="hl-red">0회</span> — 이관 파일에서만 참조되고 화면 생성 시 한 번도 조회되지 않음</td>
</tr>
<tr>
<td>실제 화면</td>
<td>영어판 신륵사의 장면 이름이 <span class="hl-red">「주차장」·「신륵사 가는 길」</span> 그대로</td>
</tr>
</tbody>
</table>
<blockquote>
<p>DB에는 <code>Parking Lot</code> · <code>Path To Silleuksa Temple</code> 이 이미 들어 있었는데, 화면을 그리는 코드가 그 표를 <strong>한 번도 열어보지 않고 있었습니다.</strong> 장면 이름·투어 제목 2축을 실배선하고, 파노라마 그룹·장소명까지 4축으로 확장했습니다.</p>
</blockquote>
<div class="links">
<span class="lbl">확인</span>
<a class="lnk" href="http://100.120.25.127:3100/IND/issues/IND-6364" target="_blank">IND-6364 XML 다국어 배선</a>
<a class="lnk" href="http://100.120.25.127:5174/vr-list?contentType=VIEW360" target="_blank">360VIEW 목록</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="7" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%9A%A7-%EB%B2%88%EC%97%AD%EC%9D%B4-%EB%B6%80%EC%8B%A4%ED%95%9C-%EC%BD%98%ED%85%90%EC%B8%A0%EB%A5%BC-%EA%B1%B8%EB%9F%AC%EB%82%B4%EA%B8%B0-span-classbadge-date824span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a7.svg" data-marp-twemoji=""/> 번역이 부실한 콘텐츠를 걸러내기 <span class="badge-date">8/24</span> <span class="badge-new">NEW</span></h2>
<p>외국어판을 열었는데 내용이 한국어면 <strong>없느니만 못합니다.</strong> 판정 기준을 정하고, 그런 콘텐츠는 목록에서 아예 보이지 않게 했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%ED%8C%90%EC%A0%95-%EA%B8%B0%EC%A4%80-%ED%99%95%EC%A0%95">판정 기준 확정</h3>
<ul>
<li>기준 = <span class="hl-blue">「해당 언어 번역이 없고 + 원문에 한글이 있다」</span></li>
<li><span class="hl-red">번역률 %만으로 판정하면 정상 콘텐츠 5건이 오차단</span>됩니다 — K-Seafood 등은 애초에 원문이 영어라 번역 행이 없는 것이 정상</li>
<li>전수 조사 결과 130개 외국어판 중 <span class="hl-blue">차단 대상 3건</span></li>
</ul>
</div>
<div class="col">
<h3 id="%EB%85%B8%EC%B6%9C-%EC%B2%98%EB%A6%AC">노출 처리</h3>
<ul>
<li>오너 지시 <span class="hl-blue">「목록에서는 관리자도 숨기고, 관리 화면에서만 보이게」</span></li>
<li>목록·형제 언어판·인기 콘텐츠 3곳에서 <span class="hl-green">쿼리 단계 완전 제외</span></li>
<li>직접 주소로 접근하면 <span class="hl-green">「준비중입니다」 화면</span></li>
<li>관리자용 <span class="hl-green">「번역 불충분」 목록 화면</span> 신설 — 복구 가성비 정렬·「거의 완성」 분리 표시</li>
</ul>
</div>
</div>
<div class="links">
<span class="lbl">확인</span>
<a class="lnk admin" href="http://100.120.25.127:5277/" target="_blank">관리자 · 번역 불충분 목록</a>

</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="sec" data-theme="clean" lang="ko-KR" class="sec" data-marpit-pagination="8" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="30">
<p><span class="sec-num">Section 02</span></p>
<h2 id="%EB%8B%A4%EA%B5%AD%EC%96%B4--%EC%9E%90%EB%8F%99%EB%B2%88%EC%97%AD%EC%9D%84-%EC%82%AC%EC%9A%A9%EC%9E%90-%EC%86%90%EC%97%90-%EB%8F%8C%EB%A0%A4%EC%A3%BC%EA%B8%B0">다국어 — 자동번역을 사용자 손에 돌려주기</h2>
<p>자동번역이 묻지도 않고 켜지던 것을 바로잡고, 「제목만 번역」에 그치던 범위를 화면 전체로 넓혔습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="9" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%94%95-%EC%9E%90%EB%8F%99%EC%9C%BC%EB%A1%9C-%EC%BC%9C%EC%A7%80%EB%8A%94-%EC%9E%90%EB%8F%99%EB%B2%88%EC%97%AD%EC%9D%84-%EC%B0%A8%EB%8B%A8-span-classbadge-date825span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🔕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f515.svg" data-marp-twemoji=""/> 「자동으로 켜지는 자동번역」을 차단 <span class="badge-date">8/25</span> <span class="badge-new">NEW</span></h2>
<p>오너 지적: <span class="hl-blue">「영문 콘텐츠인데 「자동 번역 → 한국어(auto)」 라고 표시된다. 이 기능은 자동으로 켜지면 안 된다」</span></p>
<table>
<thead>
<tr>
<th>지면</th>
<th>번역이 걸리는 조건</th>
<th>판정</th>
</tr>
</thead>
<tbody>
<tr>
<td>VR 상세(vr-info)</td>
<td><span class="hl-green">「번역 켜기」를 명시해야만</span> 번역</td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 정상</td>
</tr>
<tr>
<td>VR 뷰어(vrViewer)</td>
<td><span class="hl-red">언어 설정만 있으면 무조건 번역</span></td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 결함 — 두 화면의 규약이 서로 달랐음</td>
</tr>
</tbody>
</table>
<p>같은 기능인데 <strong>화면마다 다른 규약을 쓰고 있던 것</strong>이 원인이었습니다. 뷰어를 상세 화면과 동일한 「사용자가 켤 때만」 방식으로 통일하고, 그 김에 언어 선택 화면도 새로 만들었습니다.</p>
<ul>
<li><strong>콘텐츠 언어 팝업 신설</strong> — 기본 7종 노출 + 검색·최근 사용·지역별 그룹으로 <span class="hl-blue">75종까지 확장</span> 도달</li>
<li><strong>표기는 현지어 기준</strong> — 일본어는 「日本語」로 표기해 해당 언어 사용자가 알아볼 수 있도록</li>
</ul>
<div class="links">
<span class="lbl">확인</span>
<a class="lnk" href="http://100.120.25.127:3100/IND/issues/IND-6389" target="_blank">IND-6389 opt-in 전환</a>
<a class="lnk" href="http://100.120.25.127:5174/vr/q6d4k6go" target="_blank">VR 뷰어 · 콘텐츠 언어 팝업</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="10" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%97%A3%EF%B8%8F-%EC%A0%9C%EB%AA%A9%EB%A7%8C-%EB%B2%88%EC%97%AD%EB%90%98%EB%8D%98-%EB%B7%B0%EC%96%B4%EB%A5%BC-%ED%99%94%EB%A9%B4-%EC%A0%84%EC%B2%B4%EB%A1%9C-span-classbadge-date825span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🗣️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5e3.svg" data-marp-twemoji=""/> 「제목만 번역되던」 뷰어를 화면 전체로 <span class="badge-date">8/25</span> <span class="badge-new">NEW</span></h2>
<p>오너 지적: <span class="hl-blue">「콘텐츠 제목만 바뀌고 있는데, 파노라마 이름·콘텐츠 정보 일체·360포스트까지 보여지는 모든 상황이 번역됐으면 좋겠다」</span></p>
<div class="cols">
<div class="col">
<h3 id="%ED%99%95%EB%8C%80%ED%95%9C-%EB%B2%94%EC%9C%84">확대한 범위</h3>
<ul>
<li><strong>파노라마 장면 이름</strong> — 저장된 번역 2,215행을 <span class="hl-red">언어 코드 표기 차이 때문에 못 읽던</span> 문제 수정 + 없는 것만 추가 번역</li>
<li><strong>360포스트 · 마커 제목</strong></li>
<li><strong>VR스토리 댓글</strong> — 원문은 보존한 채 번역 동봉</li>
<li><strong>파노라마 그룹 이름</strong></li>
</ul>
</div>
<div class="col">
<h3 id="%EC%84%A4%EA%B3%84-%EC%9B%90%EC%B9%99--%EC%9B%90%EB%AC%B8%EC%9D%84-%EC%A7%80%EC%9A%B0%EC%A7%80-%EC%95%8A%EB%8A%94%EB%8B%A4">설계 원칙 — 원문을 지우지 않는다</h3>
<ul>
<li>오너 힌트: <span class="hl-blue">「상세 화면에서 이미 수정될 거 안 될 거를 한번 거쳤으니 그 방식을 그대로 뷰어에 적용하라」</span> ⇒ <strong>새로 설계하지 않고 검증된 규약을 이식</strong></li>
<li>「원문 보기」를 <span class="hl-green">교체형 → 병기형(유튜브 방식)</span> 공용 부품으로 승격하고 상세·뷰어 양쪽에 적용</li>
<li>공식 번역 표는 <span class="hl-amber">건드리지 않고</span> 자동번역 결과는 별도 저장소로 분리 (오너 결정)</li>
</ul>
</div>
</div>
<div class="links">
<span class="lbl">확인</span>
<a class="lnk" href="http://100.120.25.127:3100/IND/issues/IND-6414" target="_blank">IND-6414 번역 범위 확대</a>
<a class="lnk" href="http://100.120.25.127:5174/vr/5bu04civ" target="_blank">VR 뷰어 · 신륵사</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="11" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%93%84-vr-%EC%83%81%EC%84%B8-%ED%99%94%EB%A9%B4-%EC%9E%90%EB%8F%99%EB%B2%88%EC%97%AD-5%EC%B6%95-span-classbadge-date820824span"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> VR 상세 화면 자동번역 5축 <span class="badge-date">8/20~8/24</span></h2>
<p>오너 요청 5건이 모두 같은 파일(4,000줄)을 건드려 하나로 묶어 처리했습니다.</p>
<table>
<thead>
<tr>
<th>요구</th>
<th>조치</th>
</tr>
</thead>
<tbody>
<tr>
<td>번역을 켜면 <span class="hl-blue">모든 내용</span>을 번역할 것</td>
<td>360포스트·리뷰·Q&amp;A 전체 확장 + 캐시 재사용 + 「원문 보기」</td>
</tr>
<tr>
<td>상세에서 뷰어로 이동 시 <span class="hl-blue">의견을 물을 것</span></td>
<td>「번역 상태로 이동되었습니다. 콘텐츠 내 번역을 이용하시겠습니까?」 확인 모달</td>
</tr>
<tr>
<td>토글 상태를 <span class="hl-blue">기억할 것</span></td>
<td>로그인 시 서버 저장 · 비로그인 시 브라우저 저장, 뷰어까지 상태 전달</td>
</tr>
<tr>
<td>「최근 다른 회원들이 많이 본 콘텐츠」</td>
<td>「다른 회원이 본 콘텐츠」로 개칭 + <span class="hl-green">완전 랜덤 10개</span></td>
</tr>
<tr>
<td>번역 토글 버튼이 <span class="hl-red">오른쪽으로 튀어나가 보이는</span> 문제</td>
<td>상단 박스 레이아웃 재조정 (flex → grid)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>정책 전환</strong> — 오너가 <span class="hl-blue">「사람이 번역을 고치는 축」을 폐지</span>했습니다. 자동번역은 기계 결과만 보여주고, 수정이 필요하면 <strong>360뷰 복제 기능으로 별도 콘텐츠를 만들어 고치도록</strong> 유도합니다.</p>
</blockquote>
<div class="links">
<span class="lbl">확인</span>
<a class="lnk" href="http://100.120.25.127:3100/IND/issues/IND-6260" target="_blank">IND-6260 상세 5축</a>

<h2 id="%F0%9F%8F%B7%EF%B8%8F-%EC%96%B8%EC%96%B4-%ED%91%9C%EA%B8%B0-%EA%B8%B0%EC%A4%80%EC%9D%84-%EC%82%AC%EC%9D%B4%ED%8A%B8-%EC%96%B8%EC%96%B4%EB%A1%9C-%ED%86%B5%EC%9D%BC-span-classbadge-date819823span"><img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3f7.svg" data-marp-twemoji=""/> 언어 표기 기준을 사이트 언어로 통일 <span class="badge-date">8/19~8/23</span></h2>
<p>같은 「일본어」가 화면마다 <span class="hl-red">「日本語」·「Japanese」·「일본어」로 제각각</span> 표시되던 것을 정리했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EC%9E%90%EB%8F%99%EB%B2%88%EC%97%AD-%ED%86%A0%EA%B8%80-%EC%8B%A4%EB%B0%B0%EC%84%A0-ind-6233">자동번역 토글 실배선 (IND-6233)</h3>
<ul>
<li>「버튼을 켰을 때만 번역」 규약을 상세 화면에 실제 배선</li>
<li>재사용 가능한 <span class="hl-green">공용 컴포저블</span>로 추출</li>
<li>도안대로 <span class="hl-green">토글 스위치 UI</span> 적용</li>
</ul>
</div>
<div class="col">
<h3 id="%ED%91%9C%EA%B8%B0-%EA%B8%B0%EC%A4%80-%ED%86%B5%EC%9D%BC-ind-6347">표기 기준 통일 (IND-6347)</h3>
<ul>
<li>카드·소개탭·지도 패널 <span class="hl-blue">3곳</span>을 사이트 언어 기준으로 교체</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 8/19에 「현지어 유지」로 정했던 결정을 <span class="hl-amber">8/23 오너가 뒤집어</span> 재작업</li>
<li>단, VR 뷰어의 <span class="hl-blue">언어 선택 팝업은 현지어 유지</span> — 그 언어 사용자가 찾아야 하므로</li>
</ul>
</div>
</div>
<div class="links">
<span class="lbl">확인</span>
<a class="lnk" href="http://100.120.25.127:3100/IND/issues/IND-6347" target="_blank">IND-6347 언어칩 통일</a>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="13" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%93%91-%EB%8B%A4%EA%B5%AD%EC%96%B4-%EC%BD%98%ED%85%90%EC%B8%A0%EB%A5%BC-%EB%A7%8C%EB%93%9C%EB%8A%94-%EA%B2%BD%EB%A1%9C-%EC%8B%A0%EC%84%A4-span-classbadge-date820span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="📑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d1.svg" data-marp-twemoji=""/> 다국어 콘텐츠를 「만드는」 경로 신설 <span class="badge-date">8/20</span> <span class="badge-new">NEW</span></h2>
<p>오너 요청 <span class="hl-blue">⟨360뷰 복사 기능을 만들어 자동번역으로 다국어 콘텐츠를 만들 수 있게 할 것⟩</span> — 관리자 화면에 신설했습니다.</p>
<table>
<thead>
<tr>
<th>단계</th>
<th>기능</th>
</tr>
</thead>
<tbody>
<tr>
<td>1 · 복제</td>
<td>360뷰 1건을 <span class="hl-green">연결 자료 전체와 함께</span> 복제 — 파노라마·이동핫스팟·정보핫스팟·지도·지도스팟, 주소만 새로 발급</td>
</tr>
<tr>
<td>2 · 번역 채움</td>
<td>대상 언어 선택 → <span class="hl-green">「자동 번역」 버튼</span>으로 텍스트 필드 일괄 채움 (기존 번역 파이프라인 재사용)</td>
</tr>
<tr>
<td>3 · 검수</td>
<td>채워진 번역을 <span class="hl-green">사람이 확인·수정 후 저장</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>검증 과정에서 VR스토리 복제 시 <strong>장면 참조가 옛 번호를 가리켜 화면이 깨지던 결함 2건</strong>을 잡았고, 파노라마 화면 설정에 쓰이는 특수 태그가 번역기에 의해 훼손되던 문제도 함께 수정했습니다.</p>
</blockquote>
<div class="links">
<span class="lbl">확인</span>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="sec" data-theme="clean" lang="ko-KR" class="sec" data-marpit-pagination="14" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="30">
<p><span class="sec-num">Section 03</span></p>
<h2 id="%EC%84%B1%EB%8A%A5%EA%B8%B0%EB%B0%98--%EB%8A%90%EB%A6%B0-%ED%99%94%EB%A9%B4%EA%B3%BC-%EC%97%86%EC%96%B4%EC%A7%88-db">성능·기반 — 느린 화면과 없어질 DB</h2>
<p>체감 속도 문제를 실측으로 좁혀 원인을 제거하고, 없어질 레거시 DB에 대한 런타임 의존을 전면 정리했습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="15" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%E2%9A%A1-%EC%B1%84%EB%84%90-%ED%8E%98%EC%9D%B4%EC%A7%80-155%EC%B4%88-%E2%86%92-01%EC%B4%88%EB%8C%80-span-classbadge-date825span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 채널 페이지 1.55초 → 0.1초대 <span class="badge-date">8/25</span> <span class="badge-new">NEW</span></h2>
<p>오너 제보: <span class="hl-blue">「채널 페이지가 눈에 띄게 느리고, 간헐적으로 「콘텐츠를 불러오지 못했어요」가 뜬다. 페이지가 다 안 열린 건지 고장난 건지 헷갈릴 정도」</span></p>
<table>
<thead>
<tr>
<th>축</th>
<th>원인</th>
<th>조치</th>
</tr>
</thead>
<tbody>
<tr>
<td>서버 A</td>
<td>날짜별 통계 표를 날짜 조건 없이 조인해 <span class="hl-red">행이 폭증</span></td>
<td>사전 집계로 교체</td>
</tr>
<tr>
<td>서버 B</td>
<td>없어질 레거시 DB를 <span class="hl-red">요청마다 크로스 조회</span></td>
<td>정적 컬럼으로 전환</td>
</tr>
<tr>
<td>서버 C</td>
<td>VR 목록 쿼리에 <span class="hl-red">종속 서브쿼리 5개</span></td>
<td>4종 사전 집계 + 정렬 개선</td>
</tr>
<tr>
<td>화면</td>
<td>로딩 중인데 <span class="hl-red">「콘텐츠가 없습니다」</span>가 먼저 보임</td>
<td>상단 스켈레톤 + 병렬 호출</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>오탐 5건 전수 정리</strong> — 「불러오기 실패」와 「진짜 0건」을 구분하지 못하는 결함이 북마크 탭·포스트 탭·북마크 상세 등에서 연달아 발견돼, EM이 전수 감사로 5곳을 모두 잡았습니다. 로딩 표시가 아예 안 보이던 결함(CSS가 다른 화면 안에만 정의)과 일본어·중국어 문구 누락도 함께 수정했습니다.</p>
</blockquote>
<div class="links">
<span class="lbl">확인</span>
<a class="lnk" href="http://100.120.25.127:3100/IND/issues/IND-6396" target="_blank">IND-6396 채널 성능</a>
<a class="lnk" href="http://100.120.25.127:5174/channel/channel-acmcgedg" target="_blank">채널 페이지</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="16" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%97%84%EF%B8%8F-%EC%97%86%EC%96%B4%EC%A7%88-db%EC%97%90-%EB%8C%80%ED%95%9C-%EB%9F%B0%ED%83%80%EC%9E%84-%EC%9D%98%EC%A1%B4-%EC%A0%84%EB%A9%B4-%EC%A0%9C%EA%B1%B0-span-classbadge-date825span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🗄️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c4.svg" data-marp-twemoji=""/> 없어질 DB에 대한 런타임 의존 전면 제거 <span class="badge-date">8/25</span> <span class="badge-new">NEW</span></h2>
<p>채널 페이지에서 발견한 문제가 <strong>전역 문제</strong>임이 확인돼 별건으로 분리해 전수 정리했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="1%EC%B0%A8--%EB%A0%88%EA%B1%B0%EC%8B%9C-%EC%A1%B0%ED%9A%8C-8%EA%B3%B3-%EC%A0%9C%EA%B1%B0">1차 — 레거시 조회 8곳 제거</h3>
<ul>
<li>검색·마이페이지·메인·북마크·리뷰·관리자·뷰어 <span class="hl-blue">8개 표면</span>이 매 요청마다 레거시 DB를 조회</li>
<li>값은 <span class="hl-blue">과거 시점에 고정</span>돼 변하지 않는데 실시간 조회 중이었음</li>
<li>정적 컬럼으로 백필 후 참조 교체</li>
</ul>
</div>
<div class="col">
<h3 id="2%EC%B0%A8--%EC%98%A4%EB%84%88-%EC%A7%80%EC%A0%81%EC%9C%BC%EB%A1%9C-%EB%B0%A9%EC%8B%9D-%EC%9E%90%EC%B2%B4%EB%A5%BC-%EA%B5%90%EC%A0%95">2차 — 오너 지적으로 방식 자체를 교정</h3>
<ul>
<li>오너: <span class="hl-blue">「이건 임시방편이다. 조회수 기준표를 하나 더 만든 셈」</span></li>
<li>⇒ 별도 컬럼을 폐기하고 <span class="hl-green">기존 통계표로 흡수</span>해 기준표를 하나로 통일</li>
<li>목록 정렬에 <span class="hl-red">동점 처리 기준이 없어</span> 페이지를 넘길 때 콘텐츠가 중복·누락되던 결함(동률 746행)도 함께 수정</li>
</ul>
</div>
</div>
<div class="links">
<span class="lbl">확인</span>

<a class="lnk" href="http://100.120.25.127:3100/IND/issues/IND-6417" target="_blank">IND-6417 조회수 통합</a>
<a class="lnk" href="http://100.120.25.127:3100/IND/issues/IND-6410" target="_blank">IND-6410 정렬 동점</a>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-class="sec" data-theme="clean" lang="ko-KR" class="sec" data-marpit-pagination="17" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="30">
<p><span class="sec-num">Section 04</span></p>
<h2 id="%EC%95%8C%EB%A6%BC--%EB%88%84%EA%B0%80%EB%AC%B4%EC%97%87%EC%9D%84%EC%9D%B4-%EB%B9%A0%EC%A0%B8-%EC%9E%88%EB%8D%98-%EA%B2%83">알림 — 「누가·무엇을」이 빠져 있던 것</h2>
<p>지난주 이월된 알림 축을 실제 동작 기준으로 마무리하고, 오너 제보로 나온 신규 결함을 처리했습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="18" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%94%94-%EC%A2%8B%EC%95%84%EC%9A%94-%EC%95%8C%EB%A6%BC--%ED%81%B4%EB%A6%AD%ED%95%98%EB%A9%B4-404-span-classbadge-date819823span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🔔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f514.svg" data-marp-twemoji=""/> 좋아요 알림 — 클릭하면 404 <span class="badge-date">8/19~8/23</span> <span class="badge-new">NEW</span></h2>
<p>오너 제보: <span class="hl-blue">「누가 좋아요했는지도, 어떤 게시물인지도 알 수 없고, 클릭하면 404다」</span></p>
<table>
<thead>
<tr>
<th>결함</th>
<th>원인</th>
<th>조치</th>
</tr>
</thead>
<tbody>
<tr>
<td>포스트 딥링크 <span class="hl-red">전건 404</span></td>
<td>알림이 만드는 주소(<code>/posts/…</code>)가 <span class="hl-red">화면에 존재하지 않는 경로</span></td>
<td>정본 경로로 교정 + 링크 생성 로직 단일화</td>
</tr>
<tr>
<td>「누가」 없음</td>
<td>보낸 사람 정보를 <span class="hl-red">저장하지 않고 있었음</span></td>
<td>컬럼 신설 + 8/23 실집행 + 왕복 검증</td>
</tr>
<tr>
<td>클릭 표적</td>
<td>어디를 눌러도 같은 곳</td>
<td><span class="hl-green">썸네일 → 채널 / 본문 → 콘텐츠</span> 분리</td>
</tr>
<tr>
<td>VR 콘텐츠 좋아요</td>
<td>알림 <span class="hl-red">자체가 없었음</span></td>
<td>신설 (VR 상세로 연결)</td>
</tr>
</tbody>
</table>
<blockquote>
<p>검증 중 <strong>아이콘 폰트 로드가 실패하면 하트 대신 &quot;favorite&quot; 이라는 글자가 그대로 노출</strong>되던 결함도 발견해 수정했습니다. 브라우저 표준 API가 폰트 차단 시에도 「준비 완료」를 반환하는 함정이 원인이었습니다.</p>
</blockquote>
<div class="links">
<span class="lbl">확인</span>

<a class="lnk" href="http://100.120.25.127:5174/my/notifications" target="_blank">알림함</a>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="19" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%F0%9F%97%91%EF%B8%8F-%EC%82%AD%EC%A0%9C%ED%96%88%EB%8A%94%EB%8D%B0-%EC%83%88%EB%A1%9C%EA%B3%A0%EC%B9%A8%ED%95%98%EB%A9%B4-%EB%90%98%EC%82%B4%EC%95%84%EB%82%A8-span-classbadge-date820823span"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5d1.svg" data-marp-twemoji=""/> 「삭제했는데 새로고침하면 되살아남」 <span class="badge-date">8/20~8/23</span></h2>
<p>지난주 안건이던 <strong>DB 반영 절차 적체</strong>가 해소돼, 알림 삭제가 실제로 동작하게 됐습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EC%8B%A4%EC%A7%91%ED%96%89-%EC%99%84%EB%A3%8C">실집행 완료</h3>
<ul>
<li>알림 개편(IND-5962)은 코드상 완성이었으나 <span class="hl-red">삭제 컬럼이 실 DB에 없어</span> 삭제가 전부 무효</li>
<li>승인 카드 경유로 <span class="hl-green">마이그레이션 실집행 + 서버 재시작 + 왕복 실증</span></li>
<li>새로고침 후 <span class="hl-green">미복원 확인</span> (IND-6125·6318)</li>
</ul>
</div>
<div class="col">
<h3 id="%EA%B4%80%EB%A6%AC%EC%9E%90-%EA%B0%90%EC%82%AC-%EC%A7%80%EB%A9%B4-%EB%B3%B4%EA%B0%95">관리자 감사 지면 보강</h3>
<ul>
<li>오너 확정: <span class="hl-blue">「사용자에겐 안 보이되 관리·분석용으로 데이터는 남을 것」</span></li>
<li>앞 절반은 달성됐으나 <span class="hl-red">관리자 화면이 삭제분 18건을 구분 없이 섞어 표시</span></li>
<li><span class="hl-green">삭제 컬럼·행 구분·삭제일 표시 + 삭제여부 필터</span> 신설 (IND-6350)</li>
</ul>
</div>
</div>

<p><span class="sec-num">Section 05</span></p>
<h2 id="%ED%99%94%EB%A9%B4--%ED%9D%A9%EC%96%B4%EC%A7%84-%EA%B7%9C%EA%B2%A9%EC%9D%84-%ED%95%98%EB%82%98%EB%A1%9C">화면 — 흩어진 규격을 하나로</h2>
<p>같은 요소가 화면마다 다르게 보이던 것을 정리하고, 오너 요청 화면 개편을 처리했습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="21" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="30">
<h2 id="%E2%9E%A4-%ED%99%94%EC%82%B4%ED%91%9C-%EC%95%84%EC%9D%B4%EC%BD%98-7%EA%B0%80%EC%A7%80-%EB%B0%A9%EC%8B%9D-%E2%86%92-%ED%95%98%EB%82%98%EB%A1%9C-span-classbadge-date819span-span-classbadge-newnewspan">➤ 화살표 아이콘 7가지 방식 → 하나로 <span class="badge-date">8/19</span> <span class="badge-new">NEW</span></h2>
<p>두 번의 통일 작업을 이미 했는데도 통일이 안 돼 있었습니다. <span class="hl-red">두 작업이 서로 다른 정본을 만들었기 때문</span>입니다.</p>
<table>
<thead>
<tr>
<th>축</th>
<th>방식</th>
<th>조치</th>
</tr>
</thead>
<tbody>
<tr>
<td>A</td>
<td>헤더 이미지 파일</td>
<td>실루엣을 <span class="hl-green">벡터로 재현</span>해 정본 도형으로 승격</td>
</tr>
<tr>
<td>B</td>
<td>공통 부품 60여 곳</td>
<td>크기·굵기 <span class="hl-green">3단 규격</span>으로 정규화</td>
</tr>
<tr>
<td>C</td>
<td>선택 상자 배경 이미지 12곳</td>
<td>단일 정본으로 교체</td>
</tr>
<tr>
<td>D·E</td>
<td>텍스트 문자 <code>›</code> · <code>&gt;</code> 구분자</td>
<td>벡터 구분자로 통일</td>
</tr>
<tr>
<td>F·G</td>
<td>별도 이미지 파일·인라인 도형 19곳</td>
<td>공통 부품으로 흡수</td>
</tr>
</tbody>
</table>
<blockquote>
<p>오너가 지목한 증상은 <span class="hl-blue">「같은 필터바 안에서 카테고리와 지역이 다르게 그려진다」</span>였는데, 카테고리는 벡터 화살표를, 지역은 텍스트 문자를 쓰고 있던 것이 원인이었습니다. 이미지 파일 확산안은 <span class="hl-amber">색상 상속 불가·확대 시 열화</span>를 이유로 기각했습니다.</p>
</blockquote>
<div class="links">

<h2 id="%F0%9F%91%A4-%EB%A7%88%EC%9D%B4%ED%8E%98%EC%9D%B4%EC%A7%80-3%EC%A2%85-%EA%B0%9C%ED%8E%B8-span-classbadge-date819820span"><img class="emoji" draggable="false" alt="👤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f464.svg" data-marp-twemoji=""/> 마이페이지 3종 개편 <span class="badge-date">8/19~8/20</span></h2>
<div class="cols">
<div class="col">
<h3 id="%ED%8E%98%EC%9D%B4%EC%A7%80-%EB%B2%88%ED%98%B8-%EC%A0%84%ED%99%98-ind-6223">페이지 번호 전환 (IND-6223)</h3>
<ul>
<li>오너 결정: <span class="hl-blue">「무한 스크롤은 없애는 것으로 확정」</span></li>
<li>프로필·감상기록·나의 활동 댓글탭 <span class="hl-blue">3지면</span>을 페이지 번호 방식으로 전환</li>
<li>서버 변경 <span class="hl-green">0건</span> — 화면만 수정</li>
</ul>
<h3 id="%EC%84%A4%EC%A0%95-%ED%83%AD-%EA%B0%9C%ED%8E%B8-ind-6252">설정 탭 개편 (IND-6252)</h3>
<ul>
<li><span class="hl-green">「결제 정보」 탭 분리 신설</span></li>
<li><span class="hl-green">「계정 관리」 탭 폐지</span> — 내용은 프로필 하단으로 이관</li>
</ul>
</div>
<div class="col">
<h3 id="%EA%B3%84%EC%A0%95-%EC%84%A4%EC%A0%95-%EC%9E%AC%EC%9D%B8%EC%A6%9D-%EA%B2%8C%EC%9D%B4%ED%8A%B8-ind-6262">계정 설정 재인증 게이트 (IND-6262)</h3>
<p>오너 요청 <span class="hl-blue">⟨마이페이지 접속 시 비밀번호를 한 번 더 입력⟩</span> — 3단 폴백을 오너가 채택했습니다.</p>
<table>
<thead>
<tr>
<th>계정 상태</th>
<th>재인증 수단</th>
</tr>
</thead>
<tbody>
<tr>
<td>비밀번호 있음</td>
<td>비밀번호</td>
</tr>
<tr>
<td>비번 없고 OTP 활성</td>
<td>OTP 6자리</td>
</tr>
<tr>
<td>소셜 전용</td>
<td>소셜 재로그인</td>
</tr>
</tbody>
</table>
<ul>
<li>하위 탭 이동은 자유, 나갔다 들어오면 재질문</li>
<li><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> 소셜 계정에 비밀번호 설정 <span class="hl-amber">강제하지 않음</span></li>
</ul>
</div>
</div>

<h2 id="%F0%9F%93%BA-%EC%B1%84%EB%84%90%EA%B5%AC%EB%8F%85360%ED%8F%AC%EC%8A%A4%ED%8A%B8-span-classbadge-date820span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="📺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4fa.svg" data-marp-twemoji=""/> 채널·구독·360포스트 <span class="badge-date">8/20</span> <span class="badge-new">NEW</span></h2>
<div class="cols">
<div class="col">
<h3 id="%EA%B5%AC%EB%8F%85-%EB%85%B8%EC%B6%9C-ui-ind-6261">구독 노출 UI (IND-6261)</h3>
<p>구독 <span class="hl-blue">기능 자체는 이미 있었고</span>, 볼 수 있는 곳이 없던 것이 문제였습니다.</p>

<h3 id="%EC%B1%84%EB%84%90-360%ED%8F%AC%EC%8A%A4%ED%8A%B8-%ED%83%AD-ind-6242">채널 360포스트 탭 (IND-6242)</h3>

<li>해당 채널 콘텐츠에 달린 <span class="hl-blue">포스트 전체 집계</span></li>
<li>필터·검색은 기존 포스트 목록과 동일</li>
</ul>
</div>
<div class="col">
<h3 id="360%ED%8F%AC%EC%8A%A4%ED%8A%B8-4%EC%B6%95-ind-6240">360포스트 4축 (IND-6240)</h3>
<ul>
<li>딥링크 <span class="hl-green">즉시 열림</span> — 1초 지연·부드러운 스크롤 제거</li>
<li>열린 마커 <span class="hl-green">하이라이트 유지</span></li>
<li>작성 버튼 디자인 통일</li>
<li>모바일 VR 영역 높이 <span class="hl-blue">50% 미만</span>으로 조정</li>

<li>화면 조립부는 정상이었고 <span class="hl-blue">데이터·응답 단계</span>가 원인</li>

</div>
</div>

<h2 id="%F0%9F%8E%AC-vr-%EA%B0%90%EC%83%81-%ED%99%94%EB%A9%B4-%EC%A0%95%EB%B9%84-span-classbadge-date818820span"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ac.svg" data-marp-twemoji=""/> VR 감상 화면 정비 <span class="badge-date">8/18~8/20</span></h2>
<div class="cols">
<div class="col">
<h3 id="%EC%A0%9C%EB%AA%A9-%EC%98%81%EC%97%AD-5%EB%B6%84%ED%95%A0-ind-6264">제목 영역 5분할 (IND-6264)</h3>
<p>오너 요청 1줄에 5개 요구가 엉켜 있어 쪼개서 처리했습니다(오너 승인).</p>
<ul>
<li>모바일에서 태그가 숨겨질 때 <span class="hl-green">제목 크기에 맞춰 축소</span></li>
<li>최대 크기는 펼친 상태 기준</li>
<li>구매 콘텐츠는 <span class="hl-green">남은 일자 배지</span> 때문에 너무 작아지지 않게</li>
<li><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <span class="hl-red">작성일 옆 조회수가 빠져 있던 버그</span> — 서버 응답에 필드 자체가 없었음</li>
</ul>
<h3 id="%EC%B1%95%ED%84%B0-%EB%AA%A9%EC%B0%A8-ind-61496251">챕터 목차 (IND-6149·6251)</h3>
<ul>
<li><span class="hl-green">3단 아코디언 개편</span> + 상단 탭 추가</li>
<li>디자인 시안과 불일치하던 헤더/아이템 박스 분리</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%A7%80%EC%97%ADvr-%EC%A7%80%EB%8F%84-%ED%8C%9D%EC%97%85-ind-6265">지역VR 지도 팝업 (IND-6265)</h3>
<ul>
<li>자동 위치보정 → <span class="hl-green">경계 클립 방식</span> 전환</li>
<li>스팟 클릭 시 목록이 따라 스크롤되던 문제 차단</li>
<li><span class="hl-red">모바일에서 팝업이 아예 안 뜨던</span> 버그 수정</li>
</ul>
<h3 id="%EB%AA%A9%EB%A1%9D-%ED%95%84%ED%84%B0%EB%B0%94-ind-6263">목록 필터바 (IND-6263)</h3>
<ul>
<li>콘텐츠 형식 <span class="hl-green">체크박스 다중 선택</span>(OR 조건·외부 클릭 닫힘)</li>
<li>구분자 화살표 규격 정리</li>
</ul>
<h3 id="%EA%B0%90%EC%83%81%EA%B8%B0%EB%A1%9D-ind-6241">감상기록 (IND-6241)</h3>
<ul>
<li><span class="hl-red">사이트 언어를 바꿔도 칩이 안 바뀌던</span> 버그 수정</li>
<li>「시청기록 삭제」 문구 1줄 처리</li>
</ul>
</div>
</div>

<h2 id="%F0%9F%94%80-%ED%8C%90%EB%A7%A4%EC%9E%90%EA%B0%80-%EB%81%88-%EA%B8%B0%EB%8A%A5%EC%9D%B4-%ED%99%94%EB%A9%B4%EC%97%90-%EB%B0%98%EC%98%81%EB%90%98%EC%A7%80-%EC%95%8A%EB%8D%98-%EB%AC%B8%EC%A0%9C-span-classbadge-date818819span"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> 판매자가 끈 기능이 화면에 반영되지 않던 문제 <span class="badge-date">8/18~8/19</span></h2>
<p>판매자·관리자가 <span class="hl-blue">360포스트·포스트 댓글·리뷰·VR스토리 댓글</span>을 끌 수 있는데, <strong>VR 상세 화면이 그 설정을 전혀 읽지 않고 있었습니다.</strong></p>
<table>
<thead>
<tr>
<th>축</th>
<th>상태</th>
<th>조치</th>
</tr>
</thead>
<tbody>
<tr>
<td>서버 응답</td>
<td><span class="hl-green">이미 값을 내려주고 있었음</span></td>
<td>리뷰 on/off 필드만 추가</td>
</tr>
<tr>
<td>화면 소비</td>
<td><span class="hl-red">4개 축 전부 미구현</span></td>
<td>탭·섹션·댓글 입력 게이트 신설 (IND-6151)</td>
</tr>
<tr>
<td>스튜디오 설정</td>
