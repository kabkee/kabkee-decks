<h2 id="%EC%9D%B4%EB%B2%88-%EC%A3%BC-%EC%A3%BC%EC%9A%94-%EC%9E%91%EC%97%85--%ED%95%B4%EC%99%B8-%EB%8C%80%EC%9D%91%EA%B3%BC-%EC%9C%A0%EB%A3%8C-%ED%8C%90%EB%A7%A4-%EA%B8%B0%EB%B0%98%EC%9D%84-%EB%8F%99%EC%8B%9C%EC%97%90-%EB%8B%A4%EC%A7%84-%EC%A3%BC%EA%B0%84">이번 주 주요 작업 — 해외 대응과 유료 판매 기반을 동시에 다진 주간</h2>
<div class="cols">
<div class="col">
<h3 id="%F0%9F%8C%90-%ED%95%B4%EC%99%B8-%EC%9D%B4%EC%9A%A9%EC%9E%90-%EB%8C%80%EC%9D%91--%EC%9E%90%EB%8F%99-%EB%8B%A4%EA%B5%AD%EC%96%B4-%EB%B2%88%EC%97%AD"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 해외 이용자 대응 — 자동 다국어 번역</h3>
<ul>
<li>번역 결과를 저장해 두고 다시 쓰는 구조 신설 (기존 237행 이관)</li>
<li>영어 사이트에서 제목·설명이 한국어로 나오던 결함 수정</li>
<li>사람 번역과 자동 번역을 구분해 보존 — 오너가 표기 규칙 확정</li>
<li>관리자가 고친 번역이 사용자 화면에 반영되지 않던 단절 해소</li>
</ul>
<h3 id="%F0%9F%94%92-%EC%9C%A0%EB%A3%8C-%ED%8C%90%EB%A7%A4%EC%9D%98-%EC%A0%84%EC%A0%9C--%EB%B3%B4%EC%95%88%EA%B2%B0%EC%A0%9C"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> 유료 판매의 전제 — 보안·결제</h3>
<ul>
<li>로그인 없이 유료 원본이 열려 있던 우회 경로 <span class="hl-red">4종 차단</span> (최우선 등급)</li>
<li>인증 없이 열려 있던 결제 감사기록 등 3종 추가 차단</li>
<li>금액 기호를 원화(₩)로 전역 정정 · 구매 내역에 최저가 배지·결제금액 표시</li>
</ul>
<h3 id="%F0%9F%A7%AD-%EC%BD%98%ED%85%90%EC%B8%A0-%ED%83%90%EC%83%89--%ED%95%84%ED%84%B0%EB%B6%84%EB%A5%98%EA%B2%BD%EB%A1%9C"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 콘텐츠 탐색 — 필터·분류·경로</h3>
<ul>
<li>지역·테마 필터를 <span class="hl-green">하나의 단계식 선택</span>으로 통합 + 주소↔화면 상태 규칙 확정</li>
<li>장소 카테고리 중복 3쌍 통합 + 명칭 정정 (오너 확정)</li>
</ul>
</div>
<div class="col">
<h3 id="%F0%9F%8E%AC-%EA%B0%90%EC%83%81-%ED%99%94%EB%A9%B4--%EC%B0%B8%EC%97%AC-%EA%B8%B0%EB%8A%A5"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ac.svg" data-marp-twemoji=""/> 감상 화면 · 참여 기능</h3>
<ul>
<li>예상 관람시간 재정립 — 오너가 <span class="hl-red">「전부 1분」</span> 발견해 전수 재계산</li>
<li>뷰어 팝업 겹침·가려진 버튼 정리, 댓글·답글 좋아요 신설</li>
<li>내 댓글에서 원문 VR 지점으로 바로 이동하는 링크 구현</li>
</ul>
<h3 id="%F0%9F%91%A4-%EB%82%B4-%ED%99%9C%EB%8F%99--%EB%A7%88%EC%9D%B4%ED%8E%98%EC%9D%B4%EC%A7%80%EB%B6%81%EB%A7%88%ED%81%AC360%ED%8F%AC%EC%8A%A4%ED%8A%B8"><img class="emoji" draggable="false" alt="👤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f464.svg" data-marp-twemoji=""/> 내 활동 — 마이페이지·북마크·360포스트</h3>
<ul>
<li>좋아요한 콘텐츠의 <span class="hl-red">79.7%가 검출되지 않던</span> 결함 수정</li>
<li>북마크 제목·공개 목록이 아예 보이지 않던 결함 해소</li>
<li>360포스트 소유 계정을 공식 채널로 완전 이관</li>
</ul>
<h3 id="%F0%9F%A7%B1-%EB%88%88%EC%97%90-%EC%95%88-%EB%B3%B4%EC%9D%B4%EB%8A%94-%EA%B8%B0%EB%B0%98-%EC%A0%95%EB%B9%84"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> 눈에 안 보이는 기반 정비</h3>
<ul>
<li>자동 검사 <span class="hl-green">3,064건 신설</span> + 테스트가 개발 DB를 건드리던 경로 차단</li>
<li>저장소에 올라가지 않았던 파일 19건 복구 + 자동 탐지 장치 신설</li>
</ul>
</div>
</div>

<p><span class="sec-num">Section 01</span></p>
<h2 id="%ED%95%B4%EC%99%B8-%EC%9D%B4%EC%9A%A9%EC%9E%90-%EB%8C%80%EC%9D%91--%EC%9E%90%EB%8F%99-%EB%8B%A4%EA%B5%AD%EC%96%B4-%EB%B2%88%EC%97%AD">해외 이용자 대응 — 자동 다국어 번역</h2>
<p>콘텐츠를 여러 언어로 보여주는 구조를 새로 깔고, 사람이 다듬은 번역이 기계 번역에 덮이지 않도록 했습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="4" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%8C%90-%EC%9E%90%EB%8F%99-%EB%B2%88%EC%97%AD%EC%9D%84-%EC%A0%80%EC%9E%A5%ED%95%B4-%EB%91%90%EA%B3%A0-%EB%8B%A4%EC%8B%9C-%EC%93%B0%EB%8A%94-%EA%B5%AC%EC%A1%B0-%EC%8B%A0%EC%84%A4-span-classbadge-date810811span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 자동 번역을 저장해 두고 다시 쓰는 구조 신설 <span class="badge-date">8/10~8/11</span> <span class="badge-new">NEW</span></h2>
<p>지금까지는 외국어 이용자가 콘텐츠를 볼 때마다 번역을 <span class="hl-red">매번 새로 돌려</span> 비용이 계속 나가고 결과도 그때그때 달랐습니다. 번역 결과를 전용 저장소에 보관해 두고 다시 쓰는 구조로 바꿨습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>번역 전용 저장소 신설 (IND-5687·5859)</td>
<td>콘텐츠 번역문을 따로 보관하는 표를 새로 만들고 <span class="hl-green">기존 237행을 그대로 이관</span></td>
</tr>
<tr>
<td>저장·재사용 판정 (IND-5861)</td>
<td>원문이 바뀌지 않았으면 저장해 둔 번역을 다시 사용하고, 동시 접속 시 같은 번역이 두 번 저장되지 않도록 방어 — <span class="hl-blue">오너 결정: 전량 일괄 번역이 아니라 「자동번역 버튼을 눌렀을 때만」 실행</span> (외부 번역 서비스 호출 비용 절감)</td>
</tr>
<tr>
<td>사용자 화면까지 연결 (IND-5862·5871)</td>
<td>실제로 쓰이는 상세 조회 경로가 번역을 아예 타지 않아 <span class="hl-red">이용자 도달이 0</span>이던 상태를 해소</td>
</tr>
<tr>
<td>언어코드 정합 (IND-5868)</td>
<td>화면이 보내는 표기와 서버 내부 표기가 달라 <span class="hl-red">이미 저장된 140행을 전부 놓치던</span> 결함 수정</td>
</tr>
<tr>
<td>품질 구분 정책 (오너 확정 8/10)</td>
<td><span class="hl-blue">자동번역 = 저품질 / 사람이 등록한 번역 = 고품질</span>로 구분해 저장하고, 기존 등록분은 전부 사람 번역으로 취급</td>
</tr>
<tr>
<td>범위 확정 (오너 8/10)</td>
<td>VR스토리도 자동번역 범위에 포함하되 <span class="hl-amber">스토리 본문 데이터는 이번 범위 밖</span> — 제목·설명 등 정보 항목에 우선 적용</td>
</tr>
</tbody>
</table>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="5" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%8F%B7%EF%B8%8F-%EC%9E%90%EB%8F%99-%EB%B2%88%EC%97%AD%EB%B3%B8%EC%9E%84%EC%9D%84-%ED%99%94%EB%A9%B4%EC%97%90%EC%84%9C-%EB%B0%94%EB%A1%9C-%EC%95%8C-%EC%88%98-%EC%9E%88%EA%B2%8C--%EC%98%A4%EB%84%88-%ED%91%9C%EA%B8%B0-%EA%B7%9C%EC%B9%99-%ED%99%95%EC%A0%95-span-classbadge-date810811span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3f7.svg" data-marp-twemoji=""/> 「자동 번역본」임을 화면에서 바로 알 수 있게 — 오너 표기 규칙 확정 <span class="badge-date">8/10~8/11</span> <span class="badge-new">NEW</span></h2>
<p>영어 사이트에 들어가도 제목·설명이 <span class="hl-red">한국어 그대로 나오던</span> 결함을 잡고, 이용자가 「이건 자동 번역본」임을 화면에서 즉시 구분할 수 있도록 표기 규칙을 오너가 직접 확정했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%AC%B8%EC%A0%9C%EC%98%80%EB%82%98">무엇이 문제였나</h3>
<ul>
<li>영어 사이트에서 제목·설명이 <span class="hl-red">한국어 원문 그대로 노출</span> (IND-5872·5873)</li>
<li>같은 장소를 다른 언어로 따로 만들어 둔 콘텐츠를 찾아갈 방법이 없음</li>
<li>화면에 보이는 문장이 자동 번역인지 사람이 쓴 원문인지 구분 불가</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%98%A4%EB%84%88%EA%B0%80-%ED%99%95%EC%A0%95%ED%95%9C-%ED%91%9C%EA%B8%B0-%EA%B7%9C%EC%B9%99">오너가 확정한 표기 규칙</h3>
<ul>
<li>언어 표시는 <span class="hl-blue">「한국어 → 日本語(Auto)」</span> 형식 — 사람이 넣은 번역이면 (Auto) 없이 「한국어 → 日本語」로만 표시 (IND-5861)</li>
<li>(Auto) 칩 배경은 <span class="hl-blue">브랜드 형광색으로 고정</span> — 오너가 목업을 2회 반려하며 확정했고, 실제 화면과 동일한 예시를 상세 페이지에 구현해 확인</li>
<li>다른 언어로 만들어진 별도 콘텐츠는 상세 화면 탭 위 <span class="hl-green">「다른 언어 콘텐츠」 섹션</span>에 카드로 노출 (IND-5860·5864)</li>
<li>언어 배지 색상을 <span class="hl-green">6개 지점에 동일 적용</span>하고, 표시 언어 기준을 사이트 언어로 정정 (IND-5863)</li>
</ul>
</div>
</div>
<div class="links">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="6" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%9B%A0%EF%B8%8F-%EA%B4%80%EB%A6%AC%EC%9E%90-%EB%8B%A4%EA%B5%AD%EC%96%B4-%EA%B4%80%EB%A6%AC--%EA%B3%A0%EC%B3%90%EB%8F%84-%EB%B0%98%EC%98%81%EB%90%98%EC%A7%80-%EC%95%8A%EB%8D%98-%EB%8B%A8%EC%A0%88-%ED%95%B4%EC%86%8C-span-classbadge-date810811span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 관리자 다국어 관리 — 고쳐도 반영되지 않던 단절 해소 <span class="badge-date">8/10~8/11</span> <span class="badge-new">NEW</span></h2>
<p>관리자가 다국어 관리 화면에서 번역을 고쳐도 <span class="hl-red">사용자 화면에는 반영되지 않던 단절</span>을 이어붙였습니다. 오너가 직접 등록해 보며 발견한 불편도 함께 해소했습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>관리자 수정이 반영되지 않던 문제 (IND-5877·5879)</td>
<td>관리자 저장 경로가 옛 저장소를 보고 있어 <span class="hl-red">공개 화면과 따로 놀던</span> 것을 새 저장소로 이관하고 통합 회귀 검증까지 수행</td>
</tr>
<tr>
<td>목록 사각지대 (IND-5882·5883)</td>
<td>새 저장소에만 있는 번역행이 관리자 목록에 <span class="hl-red">아예 보이지 않던</span> 것을 해소해 통합 표시 (기존 237건 + 새 저장소 신규분 = 243건)</td>
</tr>
<tr>
<td>이름으로 검색 (오너 지적 8/11)</td>
<td>「매쓰메이커」를 넣어도 결과가 없고 <span class="hl-red">내부 번호를 따로 찾아야</span> 했던 불편 → 콘텐츠 이름 검색·선택 기능 신설</td>
</tr>
<tr>
<td>출처 선택 저장 (오너 결정 8/11)</td>
<td>자동 채우기 후 저장할 때 <span class="hl-blue">사람 번역/기계 번역 중 무엇으로 남길지 관리자가 직접 선택</span></td>
</tr>
<tr>
<td>언어 선택지 불일치 (IND-5888)</td>
<td>화면 선택지는 34개인데 서버 허용은 10개뿐이라 <span class="hl-red">24개를 고르면 저장 실패</span>하던 것을 정합 (자식 IND-5890·5891)</td>
</tr>
<tr>
<td>오염 데이터 정리 (IND-5878)</td>
<td>허용 언어 목록을 넓히고 잘못 들어가 있던 행을 정리</td>
</tr>
</tbody>
</table>
<blockquote>
<p>오너가 8/11 「해결 완료」로 확인한 트랙입니다(최상위 트랙 IND-5882 는 현재 검토 중 상태). 세부 검증 항목 1건은 선행 검증(IND-5886)과 항목이 전건 겹치는 중복 발주여서 취소(IND-5894)됐습니다.</p>
</blockquote>

<p><span class="sec-num">Section 02</span></p>
<h2 id="%EC%9C%A0%EB%A3%8C-%ED%8C%90%EB%A7%A4%EC%9D%98-%EC%A0%84%EC%A0%9C--%EC%BD%98%ED%85%90%EC%B8%A0-%EB%B3%B4%EC%95%88%EA%B3%BC-%EA%B2%B0%EC%A0%9C-%ED%99%94%EB%A9%B4">유료 판매의 전제 — 콘텐츠 보안과 결제 화면</h2>
<p>돈을 내지 않고 유료 콘텐츠를 가져갈 수 있던 경로를 막고, 금액이 잘못 보이던 표기를 바로잡았습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="8" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%94%92-%EC%9C%A0%EB%A3%8C-%EC%BD%98%ED%85%90%EC%B8%A0-%EB%AC%B4%EB%8B%A8-%EB%85%B8%EC%B6%9C-%EC%B0%A8%EB%8B%A8--%EC%9D%B4%EB%B2%88-%EC%A3%BC-%EC%B5%9C%EC%9A%B0%EC%84%A0-%EB%B3%B4%EC%95%88-%EC%9E%91%EC%97%85-span-classbadge-date87810span"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> 유료 콘텐츠 무단 노출 차단 — 이번 주 최우선 보안 작업 <span class="badge-date">8/7~8/10</span></h2>
<p>유료로 판매 중인 VR의 <span class="hl-red">원본 파일 경로가 로그인 없이도 열려 있었습니다</span>. 지난주 차단한 360포스트 지면 3경로와는 <span class="hl-blue">다른 계열(VR 파노라마 원본 경로·무인증 API)</span>로, 이번엔 서버 전 경로를 전수 점검해 찾아내 당일 차단했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EC%97%B4%EB%A0%A4-%EC%9E%88%EC%97%88%EB%82%98">무엇이 열려 있었나</h3>
<ul>
<li><span class="hl-red">로그인조차 없이 유료 원본 파노라마 경로가 통째로 노출</span>되던 우회 통로 4종 (IND-5695·5715, 최우선 등급 P0)</li>
<li>유료 여부를 판정하는 코드에 <span class="hl-red">오타가 있어 360뷰 유료 차단이 사실상 무력화</span>돼 있던 상태</li>
<li>인증 없이 열려 있던 3종 — <span class="hl-red">결제 감사기록 · 외부 이미지 대리요청 · 타인 자산 목록</span> (IND-5716)</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%A1%B0%EC%B9%98">조치</h3>
<ul>
<li>우회 경로 4종 전부에 <span class="hl-green">유료 접근 검사 부착</span>, 무인증 노출 3종 차단. 외부 코드리뷰가 지적한 우회 2건도 추가 보강</li>
<li>판매중 콘텐츠 <span class="hl-green">7건 전수 차단 확인</span> + 무료·판매종료 콘텐츠가 과잉 차단되지 않는지 회귀 검증 (IND-5724)</li>
<li>관리자 화면에 잠금·경고 상태를 보이게 하고, 위험한 설정 조합으로는 유료 판매 등록 자체를 막고 해소 동선 링크 제공 (IND-5726·5727)</li>
<li>「공개 + 비밀번호」 정책 재검토는 <span class="hl-blue">이미 오너 결정(IND-4741)으로 확정된 계약</span>임을 확인하고 자체 철회 (IND-5876)</li>
</ul>
</div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="9" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%92%B3-%EA%B2%B0%EC%A0%9C%EA%B5%AC%EB%A7%A4-%ED%99%94%EB%A9%B4--%EA%B8%88%EC%95%A1-%ED%91%9C%EA%B8%B0-%EC%A0%95%EC%A0%95%EA%B3%BC-%EC%98%A4%ED%94%88-%EB%8C%80%EA%B8%B0-%ED%95%AD%EB%AA%A9-span-classbadge-date87810span"><img class="emoji" draggable="false" alt="💳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b3.svg" data-marp-twemoji=""/> 결제·구매 화면 — 금액 표기 정정과 오픈 대기 항목 <span class="badge-date">8/7~8/10</span></h2>
<p>금액 앞에 <span class="hl-red">정체불명의 「c」</span>가 붙고, 일본어·중국어 화면에서는 <span class="hl-red">원화 금액이 円·元으로 표기</span>되고 있었습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>통화 기호 정정 (IND-5709)</td>
<td>금액 기호 c → <span class="hl-green">원화(₩)로 전역 치환</span> + 공통 금액 표기 함수 신설. 일본어·중국어 화면의 円/元 오표기 13곳 정정 (IND-5792·5794)</td>
</tr>
<tr>
<td>구매 내역 카드 (IND-5710)</td>
<td><span class="hl-green">최저가 배지</span>와 「결제금액 : {금액} ({구매일자})」 라인 추가, 탭 라벨을 「감상가능」으로 변경 (IND-5804·5805·5806·5808)</td>
</tr>
<tr>
<td>결제 팝업 버튼 (IND-5711)</td>
<td>확인 버튼을 검정 배경으로 확정하고 4가지 상태(기본·마우스오버·누름·비활성) 정의 (IND-5807·5809)</td>
</tr>
<tr>
<td>결제 안전장치 (IND-5034)</td>
<td>결제 지연 통보가 두 번 도착해도 <span class="hl-green">한 번만 처리</span>되도록 1회성 사용 기록 신설</td>
</tr>
<tr>
<td><span class="hl-amber">실 카드 결제 오픈 대기</span> (IND-4997)</td>
<td>이번 주 결제 화면 작업(통화 기호·구매 내역 카드·결제 팝업)은 모두 이 트랙 아래에서 진행 — 오픈 판단 항목은 뒤의 「이번 주 안건」 참조</td>
</tr>
<tr>
<td>결제 정보 재입력 (IND-5079)</td>
<td>결제할 때마다 휴대폰·이름을 다시 입력해야 해 재구매 이탈 요인. <span class="hl-blue">8/8 오너가 「프로필에 저장 후 자동 채움」(C안) 확정</span>, 착수 지시 대기</td>
</tr>
<tr>
<td>구매자 정보 실검증 (IND-5461)</td>
<td>영수증·관리자 결제목록에 구매자 정보가 실제로 채워지는지 1회 확인. 사용자 화면 배포 후 가능</td>
</tr>
</tbody>
</table>

<p><span class="sec-num">Section 03</span></p>
<h2 id="%EC%BD%98%ED%85%90%EC%B8%A0%EB%A5%BC-%EC%B0%BE%EC%95%84%EA%B0%80%EB%8A%94-%EA%B8%B8--%ED%95%84%ED%84%B0%EB%B6%84%EB%A5%98%EA%B2%BD%EB%A1%9C">콘텐츠를 찾아가는 길 — 필터·분류·경로</h2>
<p>원하는 VR을 찾아가는 기본 동선이 화면마다 다르게 동작하던 것을 하나의 규칙으로 묶었습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="11" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%A7%AD-%EC%A7%80%EC%97%AD%EC%B9%B4%ED%85%8C%EA%B3%A0%EB%A6%AC-%ED%95%84%ED%84%B0%EB%A5%BC-%ED%95%98%EB%82%98%EC%9D%98-%EB%8B%A8%EA%B3%84%EC%8B%9D-%EC%84%A0%ED%83%9D%EC%9C%BC%EB%A1%9C-%ED%86%B5%ED%95%A9-span-classbadge-date8488span"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 지역·카테고리 필터를 하나의 단계식 선택으로 통합 <span class="badge-date">8/4~8/8</span></h2>
<p>지난주 원인을 잡은 <span class="hl-red">카테고리 0건</span> 결함의 화면 반영과 검증을 이번 주 완주하고, 나아가 필터바 카테고리 축까지 지역 축과 같은 「단계식 선택」 방식으로 통일했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%AC%B8%EC%A0%9C%EC%98%80%EB%82%98-1">무엇이 문제였나</h3>
<ul>
<li>카테고리·테마 필터를 누르면 <span class="hl-red">결과가 항상 0건</span>만 반환 (IND-5587)</li>
<li>지역 필터가 화면마다 <span class="hl-red">서로 다른 4가지 표기 방식</span>을 써서, 필터가 걸린 주소를 공유하거나 뒤로가기를 하면 선택이 풀림</li>
<li>모바일 지역 버튼에 <span class="hl-red">내부 식별번호가 그대로 노출</span> (오너 지적, IND-5641)</li>
</ul>
</div>
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%8B%AC%EB%9D%BC%EC%A1%8C%EB%82%98">무엇이 달라졌나</h3>
<ul>
<li>장소·테마 <span class="hl-green">2단 단계식 선택</span>으로 전환 — 지역VR은 시·도 → 시·군·구, 테마VR은 대분류 → 소분류 (IND-5587, 자식 IND-5604·5605·5610)</li>
<li>필터바의 카테고리 축을 <span class="hl-green">지역과 똑같은 단일 드롭다운</span>으로 통합하고, 모바일 전체화면 선택까지 동일하게 적용 (IND-5659, 자식 4건)</li>
<li><span class="hl-blue">주소창 값과 화면 상태가 어긋나지 않는 규칙을 계약으로 확정</span>하고 4가지 표기를 하나로 통일, 왕복 검증을 자동 검사로 고정 (IND-5619, 자식 7건)</li>
<li>내부 식별번호 노출은 <span class="hl-green">지역 이름으로 교체</span></li>
<li>같은 작업이 병렬로 중복 발주된 5건 정리 (IND-5624·5626~5629 — 작업 실패가 아닌 발주 중복본)</li>
</ul>
</div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="12" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%94%97-%EA%B2%BD%EB%A1%9C-%ED%91%9C%EC%8B%9C%EC%99%80-%EB%A7%81%ED%81%AC-%EA%B3%B5%EC%9C%A0--%EB%88%8C%EB%9F%AC%EC%84%9C-%EB%8F%8C%EC%95%84%EA%B0%80%EB%A9%B4-%EA%B7%B8%EB%8C%80%EB%A1%9C-%EB%B3%B5%EC%9B%90%EB%90%98%EB%8F%84%EB%A1%9D-span-classbadge-date8589span"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> 경로 표시와 링크 공유 — 눌러서 돌아가면 그대로 복원되도록 <span class="badge-date">8/5~8/9</span></h2>
<p>상세 화면 위쪽의 경로 표시가 콘텐츠 종류와 맞지 않고, <span class="hl-red">지역 링크를 눌러도 잘못된 주소가 만들어지던</span> 문제를 오너가 직접 발견했습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>오너 지적 (8/5, IND-5281)</td>
<td>상세에서 「강남구」를 누르면 <span class="hl-red">잘못된 주소가 만들어지고</span>, 이동한 뒤 필터 팝업을 열어도 서울조차 선택돼 있지 않던 문제</td>
</tr>
<tr>
<td>경로 표시 기준 확정 (IND-5698)</td>
<td>VR 상세 상단 경로를 <span class="hl-green">콘텐츠 종류(지역 계층 / 테마 계층) 기준으로 확정</span>하고, 눌렀을 때 목록 필터가 그대로 복원되도록 연결 (자식 IND-5813·5814·5815·5817)</td>
</tr>
<tr>
<td>오너 결정 (8/8)</td>
<td>경로 표시 기준은 <span class="hl-blue">「이용자가 들어온 경로」를 우선</span>하고, 없으면 장소 기준으로 표시하도록 확정</td>
</tr>
<tr>
<td>지역VR 탭 포함 판정 (IND-5712)</td>
<td>어떤 콘텐츠가 지역VR 목록에 들어와야 하는지 <span class="hl-green">판정 기준을 새로 세움</span> (자식 IND-5810·5811·5812)</td>
</tr>
<tr>
<td>VRSTORY 지역 링크 복구 (IND-5651)</td>
<td>과거 보드 결정이 상세 화면에는 전파되지 않아 <span class="hl-red">사라져 있던 지역 링크</span> 회수 (자식 IND-5654·5656)</td>
</tr>
<tr>
<td>링크로 특정 장면 열기 (IND-5677)</td>
<td>VR스토리 주소 체계를 <span class="hl-green">「공개된 항목 순번」 기준으로 통일</span>해, 특정 장면을 직접 여는 주소(딥링크)를 복구. 주소 규칙 최종안은 <span class="hl-amber">오너가 「회의 후 논의」로 보류</span> (자식 IND-5680·5681·5717)</td>
</tr>
</tbody>
</table>

</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="13" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%97%82%EF%B8%8F-%EC%B9%B4%ED%85%8C%EA%B3%A0%EB%A6%AC-%EC%B2%B4%EA%B3%84-%EC%A0%95%EB%A6%AC--%EA%B4%80%EB%A6%AC%EC%9E%90-%EB%93%B1%EB%A1%9D%ED%99%94%EB%A9%B4-span-classbadge-date88811span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🗂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c2.svg" data-marp-twemoji=""/> 카테고리 체계 정리 + 관리자 등록화면 <span class="badge-date">8/8~8/11</span> <span class="badge-new">NEW</span></h2>
<p>장소 카테고리 목록에 <span class="hl-red">같은 뜻의 항목이 3쌍 중복</span>으로 들어 있었고, 관리자 등록화면은 새 카테고리 체계를 따라가지 못해 <span class="hl-red">테마가 저장되지 않았습니다</span>.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>중복 카테고리 통합 (IND-5803)</td>
<td>미디어스튜디오·선착장·쇼핑몰 <span class="hl-green">3쌍을 하나로 합치고</span> 명칭 1건 정정. 되돌릴 수 있는 형태로 진행하고 검증 절차를 함께 두었습니다 (자식 IND-5818·5819). 기준은 <span class="hl-blue">오너가 제시한 슬라이드 자료(5~13쪽)</span></td>
</tr>
<tr>
<td>관리자 등록화면 카테고리 선택 (IND-5845)</td>
<td>vrstory·360view 편집화면에 <span class="hl-green">테마·장소 2축 단계식 선택을 신설</span>하고 옛 규격을 제거 (자식 IND-5849·5850)</td>
</tr>
<tr>
<td>저장 중 값 오염 차단 (IND-5853·5854)</td>
<td>저장 도중 <span class="hl-red">직전 콘텐츠의 카테고리 값이 섞여 들어가던</span> 구간을 차단하고, 저장 중 잠금과 미저장 경고를 추가</td>
</tr>
<tr>
<td>오너 확인 (8/10)</td>
<td>VR스토리 편집화면 테마 탭에 테마1·테마2가 선택돼 있지 않은 것을 오너가 직접 발견. <span class="hl-blue">「값이 비어 있는 건 맞지만, 설정할 수 있는 화면과 기능은 반드시 있어야 한다」</span>고 확정</td>
</tr>
<tr>
<td>남은 일</td>
<td>최종 동작검증(IND-5852)만 남았습니다 — 판단 요청 사항은 「이번 주 안건」 참조</td>
</tr>
<tr>
<td>발주 중복 정리</td>
<td>중복으로 발주된 검증 이슈 1건 취소 (IND-5820)</td>
</tr>
</tbody>
</table>

</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="sec" data-theme="clean" lang="ko-KR" class="sec" data-marpit-pagination="14" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="34">
<p><span class="sec-num">Section 04</span></p>
<h2 id="%EA%B0%90%EC%83%81-%ED%99%94%EB%A9%B4--vr-%EB%B7%B0%EC%96%B4%EC%99%80-%EC%BD%98%ED%85%90%EC%B8%A0-%ED%91%9C%EC%8B%9C">감상 화면 — VR 뷰어와 콘텐츠 표시</h2>
<p>실제로 VR을 보는 화면에서 버튼이 가려지거나 정보가 틀리게 보이던 문제를 정리했습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="15" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%8E%AC-%EB%B7%B0%EC%96%B4-%EC%A1%B0%EC%9E%91-%EC%A0%95%EB%B9%84--%EA%B2%B9%EC%B9%A8%EA%B0%80%EB%A0%A4%EC%A7%90%EC%95%84%EC%9D%B4%EC%BD%98-%EC%98%A4%ED%95%B4-%ED%95%B4%EC%86%8C-span-classbadge-date730811span"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ac.svg" data-marp-twemoji=""/> 뷰어 조작 정비 — 겹침·가려짐·아이콘 오해 해소 <span class="badge-date">7/30~8/11</span></h2>
<p>VR을 감상하는 화면에서 <span class="hl-red">버튼이 가려지거나 겹쳐 눌리지 않던</span> 문제를 모아 정리했습니다. 대부분 <span class="hl-blue">오너가 직접 사용하며 발견한 건</span>입니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>팝업 겹침 (IND-5686)</td>
<td>여러 팝업이 서로 가려 클릭이 되지 않던 것을 <span class="hl-green">「최근에 연 것이 위」 규칙</span>으로 정리 · 지도 전체화면에서 팝업이 아예 눌리지 않던 결함도 해소 (IND-5750·5755)</td>
</tr>
<tr>
<td>「VR로 이동」 버튼 (IND-5668)</td>
<td>파노라마 정보 팝업의 이동 버튼이 <span class="hl-red">하단 탭바에 가려 보이지 않던</span> 결함 해소 + 문구·아이콘 변경 — 오너 요청 (IND-5771·5773·5775)</td>
</tr>
<tr>
<td>재생 컨트롤·액션 버튼 (IND-5702)</td>
<td>정지(■) 아이콘을 <span class="hl-green">일시정지(❚❚)로 교체</span> · 액션 버튼 디자인·배치를 360뷰 기준으로 통일 · VR모드 아이콘은 더보기로 이동 (오너 지시, IND-5785·5786)</td>
</tr>
<tr>
<td>제목 겹침·팝업 연출 (IND-5701·5703)</td>
<td>긴 제목이 <span class="hl-red">닫기(X) 버튼과 겹치던</span> 구조 제거 · 탭 헤더 글자·여백 정합 · PC 스크립트 팝업에 등장/사라짐 연출과 배경 반투명 적용 (IND-5796~5800)</td>
</tr>
<tr>
<td>헤더 회귀 (IND-5936)</td>
<td>VR 감상 중 <span class="hl-red">전역 헤더가 다시 나타나던</span> 문제를 오너가 8/9 발견 — 저장소에 올라가지 않은 채 남아 있던 코드를 정리해 해소</td>
</tr>
<tr>
<td>문구·아이콘 통일</td>
<td>「고장 신고」를 「오류 신고」로 전 화면 통일(오너 확정, 사용자·관리자 양쪽 전수 검사) · 전시도록형 콘텐츠의 「전시회로 돌아가기」 아이콘 변경 (IND-5215)</td>
</tr>
<tr>
<td>모바일 태그·칩 접기 (IND-5704)</td>
<td>오너 요구대로 <span class="hl-amber">시안을 먼저 제출한 상태 — 오너 확인 전 구현 착수 보류</span></td>
</tr>

<h2 id="%E2%8F%B1%EF%B8%8F-%EC%98%88%EC%83%81-%EA%B4%80%EB%9E%8C%EC%8B%9C%EA%B0%84--%EC%98%A4%EB%84%88%EA%B0%80-%EC%A0%84%EB%B6%80-1%EB%B6%84%EC%9D%84-%EB%B0%9C%EA%B2%AC%ED%95%B4-%EC%A0%84%EC%88%98-%EC%9E%AC%EA%B3%84%EC%82%B0-span-classbadge-date85810span"><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 예상 관람시간 — 오너가 「전부 1분」을 발견해 전수 재계산 <span class="badge-date">8/5~8/10</span></h2>
<p>오너가 VR스토리 예상 관람시간이 <span class="hl-red">사실상 「전부 1분」으로 표시되는 것</span>을 직접 발견해 전수 검사를 지시했습니다. 계산에서 빠진 항목이 여럿이었습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%B9%A0%EC%A0%B8-%EC%9E%88%EC%97%88%EB%82%98">무엇이 빠져 있었나</h3>
<ul>
<li><span class="hl-red">동영상 재생시간이 아예 계산에 들어가지 않음</span></li>
<li>화면 이동·장면 전환 대기시간이 0으로 계산 (IND-5658)</li>
<li>나레이션 음성 길이 조회가 실패해 0초로 처리</li>
<li>계산 결과가 0초인 콘텐츠가 <span class="hl-red">「약 1분」으로 둘러대져</span> 표시</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%98%A4%EB%84%88%EA%B0%80-%ED%99%95%EC%A0%95%ED%95%9C-%EA%B7%9C%EC%B9%99%EA%B3%BC-%EC%A1%B0%EC%B9%98">오너가 확정한 규칙과 조치</h3>
<ul>
<li>이용자가 직접 다음을 눌러야 하는 지점마다 <span class="hl-blue">20초 가산</span> — 상황별 차등안은 오너가 &quot;기준이 모호하다&quot;며 철회해 20초 고정 유지 (IND-5665 취소)</li>
<li>동영상 재생시간 편입, 화면 이동·장면 전환 대기 항목 신설 (IND-5625·5634·5660)</li>
<li>0초는 「약 1분」이 아니라 <span class="hl-green">「산정 불가」로 구분 표시</span> (IND-5661·5663)</li>
<li>개발 DB 전량 재계산 — 작업이 중간에 멈춰 <span class="hl-red">40행(공개 37건)이 갱신되지 않은 채 남아 있던</span> 것을 적발해 완주 (IND-5748)</li>
<li>오너 후속 지시(8/10) — 같은 콘텐츠의 짧은 버전 시간을 쓰는 특수 건 처리, 동영상 보유 5건이 0초로 잡히던 문제를 실제 영상 길이로 반영</li>
</ul>
</div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="17" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%83%8F-vr-%EC%B9%B4%EB%93%9C-%ED%91%9C%EB%A9%B4-%ED%86%B5%EC%9D%BC--%ED%8E%98%EC%9D%B4%EC%A7%80-%EB%B2%88%ED%98%B8-%EC%A0%84-%ED%99%94%EB%A9%B4-%EC%A0%95%ED%95%A9-span-classbadge-date83811span"><img class="emoji" draggable="false" alt="🃏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f0cf.svg" data-marp-twemoji=""/> VR 카드 표면 통일 + 페이지 번호 전 화면 정합 <span class="badge-date">8/3~8/11</span></h2>
<p>목록에 뜨는 VR 카드의 겉모습을 <span class="hl-green">한 벌의 공용 규격</span>으로 묶어, 같은 종류의 콘텐츠가 화면마다 다르게 보이던 것을 없앴습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>카드에서 뺄 것 정리 (IND-5521)</td>
<td>오너 요청에 따라 VR 카드에서 <span class="hl-green">콘텐츠 종류 칩 · 관람 눈 아이콘 · 좋아요 수를 제거</span></td>
</tr>
<tr>
<td>종류 칩 공용 규격 신설 (IND-5674)</td>
<td>Figma 정본 아이콘 4종 적용 · 관람 배지를 카드 우상단으로 재배치 (IND-5675·5676)</td>
</tr>
<tr>
<td>전 화면 전파</td>
<td>VR 상세 · 뷰어 제목 · 뷰어 소개탭 → 360포스트 목록·상세(IND-5790) → 마이페이지 내 댓글 카드 · 북마크 컬렉션 상세까지 <span class="hl-green">동일 규격 적용</span></td>
</tr>
<tr>
<td>오너 지적 (8/11)</td>
<td>「내 댓글」 화면의 360뷰·VR스토리 칩이 <span class="hl-red">구식으로 남아 있는 것</span>을 발견 — 같은 패턴이 다른 화면에도 있는지 전수 확인 지시 → 북마크 컬렉션 상세까지 회수</td>
</tr>
<tr>
<td>페이지 번호 통일 (IND-5921)</td>
<td><span class="hl-red">1페이지뿐일 때 페이지 표시가 아예 사라지던</span> 화면들을 전부 항상 보이도록 통일 (잔여 15개 위치를 실제 화면에서 확인 + 4개 화면 크기 검증)</td>
</tr>
<tr>
<td>360포스트 댓글 (IND-5922·5924)</td>
<td>「더보기」 방식을 <span class="hl-green">페이지 번호 방식으로 교체</span> — 오너가 &quot;오래된 댓글을 찾을 수 없다&quot;고 지적한 건의 후속으로, 페이지 이동 후 해당 글까지 자동 스크롤 처리</td>
</tr>
</tbody>
</table>

<p><span class="sec-num">Section 05</span></p>
<h2 id="%EC%B0%B8%EC%97%AC-%EA%B8%B0%EB%8A%A5--%EB%8C%93%EA%B8%80%EB%8B%B5%EA%B8%80-%EA%B7%B8%EB%A6%AC%EA%B3%A0-%ED%95%9C%EA%B8%80-%EC%9E%85%EB%A0%A5">참여 기능 — 댓글·답글, 그리고 한글 입력</h2>
<p>이용자가 글을 남기고 다시 찾아오는 경로를 유튜브에 가까운 사용감으로 다듬었습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="19" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%92%AC-%EB%8C%93%EA%B8%80-%EA%B8%B0%EB%8A%A5-%EC%A0%84%EB%B0%98--%EC%A2%8B%EC%95%84%EC%9A%94-%EC%8B%A0%EC%84%A4%EA%B3%BC-%EC%BD%98%ED%85%90%EC%B8%A0%EB%B3%84-%EC%BC%9C%EA%B3%A0-%EB%81%84%EA%B8%B0-span-classbadge-date8488span"><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ac.svg" data-marp-twemoji=""/> 댓글 기능 전반 — 좋아요 신설과 콘텐츠별 켜고 끄기 <span class="badge-date">8/4~8/8</span></h2>
<p>VR스토리 댓글을 <span class="hl-green">유튜브에 가까운 사용감</span>으로 다듬고, 콘텐츠 단위로 댓글을 열고 닫는 운영 통제 기능을 새로 만들었습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>댓글 입력창·기본 정렬 마무리 (IND-5555·5613)</td>
<td>지난주 완성한 페이지 번호·정렬·표시 개수 UI 위에, 입력창을 화면에 떠 있는 형태로 전환하고 기본 정렬을 최신순으로 확정 (오너 지시). 이로써 IND-5555 트랙은 오너 검수까지 종결</td>
</tr>
<tr>
<td>댓글·답글 좋아요 신설 (IND-5615·5616)</td>
<td><span class="hl-green">서버 기능과 하트 UI·개수 표시·누름 토글</span> 신설</td>
</tr>
<tr>
<td>좋아요 색상 정정 (IND-5713)</td>
<td>형광색을 빨간색으로 교체, 개수는 검정 계열로 분리</td>
</tr>
<tr>
<td>입력창 통일 (IND-5652·5735)</td>
<td>답글·수정 입력창을 여러 줄 입력(4줄 상한·멘션 표시 포함)으로 전환하고, 수정창을 「새로 쓸 때」와 똑같은 형태로 통일. <span class="hl-blue">오너가 「수정 전용 화면은 더 혼란스럽다」고 확정</span></td>
</tr>
<tr>
<td>소개탭 버튼 결함 (IND-5614·5618)</td>
<td>VR스토리 소개탭에서 <span class="hl-red">「상세페이지로 이동」 버튼이 아예 뜨지 않던</span> 결함 해소</td>
</tr>
<tr>
<td>댓글 허용 스위치 (IND-5696)</td>
<td>관리자 편집화면에 <span class="hl-green">콘텐츠별 「댓글 허용」 토글</span>을 신설하고, 껐을 때 사용자 화면 12개 지점에서 댓글이 전부 숨겨지도록 적용</td>
</tr>
<tr>
<td>답글 멘션 칩 겹침 (IND-5697·5749)</td>
<td>오너가 8/7 직접 발견한 건으로, 답글 수정창에서 멘션 표시에 가려져 <span class="hl-red">입력한 글자가 보이지 않던</span> 구조 수정. 함께 <span class="hl-green">바로 아래 답글에는 멘션 표시를 넣지 않고</span> 더 깊은 답글에서만 유지</td>
</tr>
</tbody>
</table>
<blockquote>
<p>댓글 허용 스위치는 오너가 기존 360포스트 댓글 설정과 「이름만 비슷할 뿐 다른 기능」이라 판정해 별도 항목으로 분리한 건입니다</p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="20" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%94%8E-%EB%8C%93%EA%B8%80%EC%97%90%EC%84%9C-%EC%9B%90%EB%AC%B8%EC%9C%BC%EB%A1%9C--%ED%95%9C%EA%B8%80-%EC%9E%85%EB%A0%A5-%EC%9D%BC%EA%B4%80%EC%84%B1-%EB%B3%B5%EA%B5%AC-span-classbadge-date86811span"><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> 댓글에서 원문으로 · 한글 입력 일관성 복구 <span class="badge-date">8/6~8/11</span></h2>
<p>「내 댓글」 목록이 <span class="hl-red">맥락 없는 글자 목록</span>이라 어디에 쓴 댓글인지 알 수 없었습니다. 동시에, 한글을 칠 때 <span class="hl-red">마지막 글자가 잘리던</span> 오래된 불편도 함께 정리했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EB%8C%93%EA%B8%80%EC%97%90%EC%84%9C-%EC%9B%90%EB%AC%B8%EC%9C%BC%EB%A1%9C-%EC%98%A4%EB%84%88-%EC%A0%84%EB%B0%A9%EC%9C%84-%EC%A7%80%EC%8B%9C-811">댓글에서 원문으로 (오너 전방위 지시 8/11)</h3>
<ul>
<li>댓글 목록에 <span class="hl-green">원문 일부를 인용해 보여주고</span>, 누르면 VR 뷰어의 해당 지점으로 바로 이동하도록 연결</li>
<li>답글로 진입할 때 「답글 숨기기」에 접혀 있던 문제를 펼쳐진 상태로 도착하도록 수정 (오너가 실제 링크로 재현해 지적)</li>
<li>페이지 이동 후 대상 글이 화면에 보이도록 위치 이동까지 처리</li>
<li><span class="hl-amber">「좋아요한 댓글 및 답글」 메뉴 신설 (IND-5714)</span> — 원본 맥락을 어떻게 보여줄지 3개 시안과 정책 5건을 제출했습니다 (택1은 「이번 주 안건」)</li>
<li>나의 활동 댓글탭 VR스토리 하위탭 (IND-5904) — <span class="hl-green">8/11 서버·화면 양쪽 구현·반영 완료</span>. 다만 발주 근거가 없는 기능이라 <span class="hl-amber">존치 여부만 확인 대기</span></li>
</ul>
</div>
<div class="col">
<h3 id="%ED%95%9C%EA%B8%80-%EC%9E%85%EB%A0%A5-%EC%9D%BC%EA%B4%80%EC%84%B1-%EB%B3%B5%EA%B5%AC">한글 입력 일관성 복구</h3>
<ul>
<li><span class="hl-red">마지막 글자가 빠진 채 전송되거나, 다 썼는데도 등록 버튼이 켜지지 않던</span> 문제가 여러 화면에 흩어져 있던 상태였습니다</li>
<li>공통 처리 방식을 만들어 <span class="hl-green">360포스트 작성·수정, VR스토리 댓글, 뷰어 고정 댓글바에 일괄 적용</span> (IND-5670·5671·5672·5673)</li>
<li>관리자 화면 입력 지점을 전수 조사한 뒤 공통 도구를 만들고, 대표 2개 화면에 적용해 동작 검증 (IND-5679·5700·5718·5719)</li>
<li>사용자 화면 입력 지점은 전수 조사표로 남겼습니다 — 조사 전용이며 코드 적용은 제외했습니다 (IND-5731)</li>
</ul>
</div>
</div>

<p><span class="sec-num">Section 06</span></p>
<h2 id="%EB%82%B4-%ED%99%9C%EB%8F%99--%EB%A7%88%EC%9D%B4%ED%8E%98%EC%9D%B4%EC%A7%80--%EB%B6%81%EB%A7%88%ED%81%AC--360%ED%8F%AC%EC%8A%A4%ED%8A%B8">내 활동 — 마이페이지 · 북마크 · 360포스트</h2>
<p>내가 본 것·좋아요한 것·저장한 것을 실제로 찾아볼 수 있게 만들었습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="22" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%91%A4-%EB%82%98%EC%9D%98-%EA%B8%B0%EB%A1%9D%EB%82%98%EC%9D%98-%ED%99%9C%EB%8F%99--%EC%9D%BC%EB%B0%98-%EB%AA%A9%EB%A1%9D%EA%B3%BC-%EA%B0%99%EC%9D%80-%EA%B7%9C%EA%B2%A9%EC%9C%BC%EB%A1%9C-%ED%86%B5%ED%95%A9-span-classbadge-date86811span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="👤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f464.svg" data-marp-twemoji=""/> 나의 기록·나의 활동 — 일반 목록과 같은 규격으로 통합 <span class="badge-date">8/6~8/11</span> <span class="badge-new">NEW</span></h2>
<p>마이페이지의 「나의 기록」이 일반 VR 목록과 <span class="hl-red">전혀 다른 화면</span>이라 검색도 정렬도 되지 않았습니다. 카드·검색·정렬을 일반 목록과 같은 규격으로 통합했습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%AC%B8%EC%A0%9C%EC%98%80%EB%82%98-2">무엇이 문제였나</h3>
<ul>
<li>감상 기록·좋아요한 VR 화면에 <span class="hl-red">검색·정렬·필터가 아예 없음</span></li>
<li>좋아요한 콘텐츠의 <span class="hl-red">79.7%가 좋아요 표시로 검출되지 않음</span> (IND-5765)</li>
<li>화면이 언어 정보를 서버에 보내지 않아 지역명 번역이 도달하지 않던 상태 (IND-5768)</li>
<li>탭마다 개수 표기가 중복·불일치 — 오너가 「총 10건」과 「좋아요 10개」가 함께 뜨는 것을 직접 지적</li>
</ul>
</div>
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%8B%AC%EB%9D%BC%EC%A1%8C%EB%82%98-1">무엇이 달라졌나</h3>
<ul>
<li>감상 기록·좋아요한 VR을 <span class="hl-green">일반 VR 목록 카드와 동일 규격(정보 항목 32개)</span>으로 맞추고 검색·정렬·형식·가격 조건 지원 (IND-5688·5757·5758)</li>
<li>좋아요 검출 결함 수정 + 지역명 다국어 연결 (IND-5765·5768)</li>
<li>좋아요 목록에 <span class="hl-green">서버측 필터 4종과 카테고리별 개수</span> 제공, 중복 노출 제거 (IND-5760)</li>
<li><span class="hl-blue">오너 확정 표기 정책</span> — 「나의 활동」 4개 탭 문구를 「총 N건」으로 통일하고, 좋아요한 포스트 탭은 「좋아요 N개」로 정리해 중복 표기 제거 (IND-5896·5900·5905·5908)</li>
<li>「내 댓글」에 VR스토리 댓글이 한 건도 뜨지 않던 누락도 오너가 발견해 수정</li>
</ul>
</div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="23" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%94%96-%EB%B6%81%EB%A7%88%ED%81%AC--%EB%A7%8C%EB%93%A4%EC%96%B4-%EB%91%AC%EB%8F%84-%EB%B3%B4%EC%9D%B4%EC%A7%80-%EC%95%8A%EB%8D%98-%EC%83%81%ED%83%9C-%ED%95%B4%EC%86%8C-span-classbadge-date85811span"><img class="emoji" draggable="false" alt="🔖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f516.svg" data-marp-twemoji=""/> 북마크 — 만들어 둬도 보이지 않던 상태 해소 <span class="badge-date">8/5~8/11</span></h2>
<p>북마크는 <span class="hl-red">만들어 두면 보이지 않는</span> 상태였습니다. 카드 제목이 표시되지 않고, 공개 북마크 목록은 항상 비어 보였습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>카드 제목 미표시 (IND-5638·5644)</td>
<td>북마크 카드에 <span class="hl-red">제목이 아예 표시되지 않던</span> 결함 — 오너가 8/5에 채널·마이페이지 두 화면에서 동시 지적</td>
</tr>
<tr>
<td>자동 썸네일 오류 (IND-5643)</td>
<td>처음 북마크를 만들 때 자동으로 잡히는 대표 이미지가 <span class="hl-red">엉뚱한 콘텐츠 것</span>으로 잡히던 문제 교정 + 오염된 3건 데이터 수정 (오너가 실제 이미지 주소를 대조해 발견)</td>
</tr>
<tr>
<td>공개 북마크 목록 (IND-5910)</td>
<td>서버 응답 형식과 화면이 기대하는 형식이 달라 <span class="hl-red">목록이 항상 비어 보이던</span> 결함 수정</td>
</tr>
<tr>
<td>다국어 전환 (IND-5906)</td>
<td>북마크 3개 화면의 한국어 직접 입력 문구를 <span class="hl-green">4개 언어 키로 전환</span> + 카테고리 필터 언어 미전달·해제 버튼 오작동 수정 (IND-5909·5911·5914·5915)</td>
</tr>
<tr>
<td>회귀 재발 (오너 지적 8/11)</td>
<td>「내 북마크 목록」 화면이 「내가 북마크했던 기록」으로 다시 바뀌어 있던 것을 오너가 발견하고 「이번이 처음이 아니다」라고 지적 → <span class="hl-green">원인 파일 제거로 재발 차단</span>, 비로그인 진입 시 로그인 유도 화면 노출</td>
</tr>
<tr>
<td>컬렉션 상세 (오너 결정)</td>
<td>더보기 없이 <span class="hl-blue">전 항목을 위에서 아래로 나열</span>하는 방식으로 확정, 카드에 항상 비어 있던 종류 칩 복구</td>
</tr>
</tbody>
</table>
<div class="links">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="24" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%93%8D-360%ED%8F%AC%EC%8A%A4%ED%8A%B8--%EB%AA%A9%EB%A1%9D-%ED%83%90%EC%83%89%EB%A7%88%EC%BB%A4%EC%86%8C%EC%9C%A0-%EA%B3%84%EC%A0%95-%EC%A0%95%EB%A6%AC-span-classbadge-date84811span"><img class="emoji" draggable="false" alt="📍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cd.svg" data-marp-twemoji=""/> 360포스트 — 목록 탐색·마커·소유 계정 정리 <span class="badge-date">8/4~8/11</span></h2>
<p>360포스트(파노라마 게시물)는 <span class="hl-red">빈 카테고리를 눌러도 결과가 없던</span> 탐색 문제와, 게시물이 관리자 개인 계정 명의로 남아 있던 문제를 정리했습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>목록 탐색 통합 (IND-5694)</td>
<td>콘텐츠가 0건인 카테고리는 <span class="hl-green">눌리지 않게 비활성 처리</span>하고 개수를 실제 데이터와 연동, 마이페이지 2개 화면에도 같은 필터 확장, 서버측 필터·정렬 4종 신설 (IND-5753·5754·5760·5762). 이 과정에서 <span class="hl-red">「내 포스트」 목록의 마지막 페이지를 넘기면 오류가 나던</span> 결함도 함께 수정</td>
</tr>
<tr>
<td>마커 디자인 (IND-5685·5708)</td>
<td>공지 마커를 「공지」 글자에서 <span class="hl-green">원형 메가폰 아이콘 배지</span>로 교체(<span class="hl-blue">오너가 적용 범위를 「상세 화면 마커 안」으로 한정</span>), 마커 배경 투명도를 전 사용처 통일 (IND-5826·5801·5802)</td>
</tr>
<tr>
<td>카드 강조 (IND-5706)</td>
<td>상세의 VR 콘텐츠 카드에 마우스를 올리면 그림자가 진해지도록 해 「누를 수 있다」는 것을 시각화 (오너 요청)</td>
</tr>
<tr>
<td>썸네일 전멸 (IND-5707·5789)</td>
<td>유료 콘텐츠 상세의 360포스트 목록 썸네일이 <span class="hl-red">전부 보이지 않던</span> 원인(접근권한 정보 6개 항목 유실)을 규명·복구</td>
</tr>
<tr>
<td>소유 계정 이관 (IND-5678)</td>
<td>관리자 개인 지메일로 작성돼 있던 포스트를 <span class="hl-green">공식 채널 계정(<a href="mailto:cs@look360.kr">cs@look360.kr</a>)으로 완전 이관</span> — 되돌릴 수 있는 형태 + 5축 검증, 8/11 오너 완료 확인 (IND-5682·5683·5738)</td>
</tr>
<tr>
<td>소실 이미지 방침 (IND-5566)</td>
<td>외부 서버 소실 이미지 125건(실노출 57건)에 대해 오너가 「현행 유지」(빈 영역 + 대체 이미지)로 확정 → 데이터 변경 0건으로 종결</td>
</tr>
<tr>
<td>소유자 정규화 검토 (IND-5705)</td>
<td>포스트 소유자를 「각 채널의 주인 계정」으로 바꿀지 <span class="hl-amber">검토 보고서 제출 후 오너 결정 대기</span></td>
</tr>
</tbody>
</table>

<p><span class="sec-num">Section 07</span></p>
<h2 id="%EA%B4%80%EB%A6%AC%EC%9E%90-%EC%9A%B4%EC%98%81-%EB%8F%84%EA%B5%AC">관리자 운영 도구</h2>
<p>관리자가 보는 화면과 실제 결과가 어긋나던 구조를 바로잡았습니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="26" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%94%94-%EC%95%8C%EB%A6%BC%ED%95%A8-%EC%8B%A0%EA%B5%AC-%EA%B5%90%EC%B2%B4--%ED%8E%B8%EC%A7%91%ED%99%94%EB%A9%B4-%EB%AF%B8%EB%A6%AC%EB%B3%B4%EA%B8%B0-%EC%A0%95%ED%95%A9-span-classbadge-date89810span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🔔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f514.svg" data-marp-twemoji=""/> 알림함 신·구 교체 + 편집화면 미리보기 정합 <span class="badge-date">8/9~8/10</span> <span class="badge-new">NEW</span></h2>
<p>관리자 알림 목록을 새 방식으로 <span class="hl-green">완전히 교체</span>하고, 편집화면 미리보기가 <span class="hl-red">실제 적용 결과와 달라 보이던</span> 구조를 바로잡았습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EC%95%8C%EB%A6%BC%ED%95%A8-%EC%8B%A0%EA%B5%AC-%EA%B5%90%EC%B2%B4-ind-4941">알림함 신·구 교체 (IND-4941)</h3>
<ul>
<li>옛 알림 저장소와 새 알림함이 <span class="hl-red">함께 남아 어느 쪽이 진짜인지 모호하던</span> 상태였습니다</li>
<li>관리자 전용 알림 조회 기능을 신설하고 <span class="hl-green">목록·검색·상세 화면을 전부 새 방식으로 전환</span>했습니다 (IND-5830~5833·5839·5858)</li>
<li>옛 알림 코드를 3개 저장소에서 전수 제거하고, 백업 후 표까지 삭제했습니다 (IND-5832·5833)</li>
<li>사용하지 않던 인증 라이브러리 5종도 함께 제거해 옛 로그인 체계의 잔재를 정리했습니다 (IND-5040)</li>
</ul>
</div>
<div class="col">
<h3 id="%ED%8E%B8%EC%A7%91%ED%99%94%EB%A9%B4-%EB%AF%B8%EB%A6%AC%EB%B3%B4%EA%B8%B0-%EC%A0%95%ED%95%A9-ind-5844">편집화면 미리보기 정합 (IND-5844)</h3>
<ul>
<li>파노라마 바닥 로고는 콘텐츠 → 채널 → 기본값 순으로 상속되는데, 관리자 미리보기가 <span class="hl-red">규칙을 따로 계산해 실제 적용값과 영구히 어긋나던</span> 구조였습니다 — 8/10 오너가 직접 발견</li>
<li><span class="hl-green">서버가 계산한 최종 결과 1건을 그대로 받아 보여주는 방식</span>으로 전환하고, 「어디서 상속됐는지」 출처를 함께 표기했습니다 (IND-5846·5847·5848)</li>
<li>편집 탭을 주소와 연결해 새로고침·뒤로가기에도 탭이 유지되도록 수정했습니다 (오너 요청)</li>
<li>View360 편집화면에도 동일 적용했으며(IND-5857), <span class="hl-amber">잔여 1건은 범위 밖으로 분리해 대기</span> 중입니다 (IND-5855)</li>
</ul>
</div>
</div>

<p><span class="sec-num">Section 08</span></p>
<h2 id="%EB%88%88%EC%97%90-%EB%B3%B4%EC%9D%B4%EC%A7%80-%EC%95%8A%EB%8A%94-%EA%B8%B0%EB%B0%98-%EC%A0%95%EB%B9%84">눈에 보이지 않는 기반 정비</h2>
<p>화면에는 안 보이지만, 「고쳤는데 다른 데가 깨지는」 사고를 줄이는 작업입니다</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="28" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%A7%B1-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EA%B5%AC%EC%A1%B0-%EC%A0%95%ED%95%A9--%EA%B3%A0%EC%B3%A4%EB%8A%94%EB%8D%B0-%EB%B0%98%EC%98%81%EC%9D%B4-%EC%95%88-%EB%90%9C%EB%8B%A4%EC%9D%98-%EA%B7%BC%EB%B3%B8-%EC%9B%90%EC%9D%B8-span-classbadge-date85811span"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> 데이터 구조 정합 — 「고쳤는데 반영이 안 된다」의 근본 원인 <span class="badge-date">8/5~8/11</span></h2>
<p>화면에 직접 보이지는 않지만, <span class="hl-red">같은 정보가 여러 곳에 중복 저장돼 값이 서로 어긋나던</span> 구조를 정리했습니다. 값이 어긋나면 사용자에게는 &quot;관리자에서 고쳤는데 사용자 화면은 그대로&quot;로 나타납니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>대표 표 구조 정리 (IND-5725)</td>
<td>보안·저사용 4개 항목 제거, 장소·사용자 정보 승격, 목록 조회 시 불필요한 결합 제거 — <span class="hl-blue">오너가 「서버·사용자화면·관리자 전수 검사 후 적용」 조건을 달아 승인</span></td>
</tr>
<tr>
<td>값 어긋남 자동 검출 (IND-5918·5919)</td>
<td>이관 후 검증 절차에 <span class="hl-green">「대표 표 ↔ 종류별 표 값 일치」 검사 13개 항목을 편입</span> + 일부러 오염을 넣어 실제로 검출되는지 증빙</td>
</tr>
<tr>
<td>종류 판정 오타·경로 어긋남 (IND-5721)</td>
<td>콘텐츠 종류 판정에 오타 문자열이 쓰이던 3곳 제거, VR스토리 썸네일 경로 어긋남 11건 정규화, 여러 표에 걸친 이관 체크리스트 성문화</td>
</tr>
<tr>
<td>채널 귀속 (IND-5746·5744)</td>
<td>콘텐츠가 「어느 채널 소유인지」를 <span class="hl-blue">오너가 확정한 기준(레거시 관리자 값 일괄 적용)</span>에 맞춰 재계산하고 실시간 반영 경로 복구 — <span class="hl-amber">관리자 정보가 없는 장소 859건은 오너 검수 요청</span></td>
</tr>
<tr>
<td>파일 주소 규칙 (IND-5734)</td>
<td>코드 30곳에 복제돼 있던 파일 주소 조립 규칙을 공통 함수 하나로 통일, 슬래시 처리 누락 위험 13곳 해소</td>
</tr>
<tr>
<td>소개글 정규화 (IND-5699)</td>
<td>VR 콘텐츠 소개글에 남아 있던 옛 HTML 표기를 순수 텍스트로 변환하고 검증 절차를 함께 신설</td>
</tr>
<tr>
<td>삭제 정합·조회 성능 (8/10)</td>
<td>콘텐츠를 지워도 저장소에 파일만 남던 경로를 하나로 통일하고 고아 파일 정리, 댓글 좋아요 조회의 반복 질의를 없애 <span class="hl-green">댓글 많은 콘텐츠의 응답 지연 감소</span></td>
</tr>
<tr>
<td>1년간 방치된 버그 (IND-5631)</td>
<td>외부 VR 콘텐츠 검색 기능이 <span class="hl-red">2025-07-26 도입 이후 1년간 상시 오류</span>였던 것을 이 과정에서 발견·수정</td>
</tr>
</tbody>
</table>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="29" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%A7%AA-%EC%9E%90%EB%8F%99-%EA%B2%80%EC%82%AC-3064%EA%B1%B4-%EC%8B%A0%EC%84%A4--%EC%8B%9C%ED%97%98-%ED%99%98%EA%B2%BD-%EC%A0%95%EB%B9%84-span-classbadge-date85--89811span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 자동 검사 3,064건 신설 + 시험 환경 정비 <span class="badge-date">8/5 · 8/9~8/11</span> <span class="badge-new">NEW</span></h2>
<p>서버 코드 상당 부분에 <span class="hl-red">자동 검사가 아예 없어</span>, 한 곳을 고치면 다른 곳이 깨지는 사고를 배포 전에 잡을 수 없었습니다. 이번 주 <span class="hl-green">3,064건을 새로 만들었습니다.</span></p>
<div class="cols">
<div class="col">
<h3 id="%EC%83%88%EB%A1%9C-%EB%A7%8C%EB%93%A0-%EC%9E%90%EB%8F%99-%EA%B2%80%EC%82%AC-3064%EA%B1%B4">새로 만든 자동 검사 3,064건</h3>
<ul>
<li>순수 계산 로직 24종 — 378건</li>
<li>데이터 조회 계층 10종 — 159건</li>
<li>외부 요청 처리 42종 — 467건</li>
<li>서비스 로직 60여 종 — <span class="hl-green">2,049건</span> (접근 권한·보안·결제 감사·포인트 지갑·북마크·나의 활동·VR스토리·스토어 전 영역)</li>
<li>채널 귀속 회귀 방지 11건 (IND-5040)</li>
<li>그동안 <span class="hl-red">격리해 두고 돌리지 않던 검사 18건</span> 전수 해소 — 검사 묶음 143 → 161개로 확대 (IND-5121·5141)</li>
<li>검사를 만드는 과정에서 <span class="hl-green">실결함도 적발</span> — 관리자가 파노라마 순서 목록을 「전부 비우고」 저장하면 사용자 화면에 옛 목록이 남던 결함 수정 (8/10)</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%8B%9C%ED%97%98-%ED%99%98%EA%B2%BD-%EC%A0%95%EB%B9%84%EC%99%80-%EC%98%A4%EB%84%88-%EA%B2%B0%EC%A0%95">시험 환경 정비와 오너 결정</h3>
<ul>
<li><span class="hl-red">테스트가 개발 DB에 직접 붙어 사고를 내던</span> 경로 차단 — 테스트 전용 DB 분리 + 비테스트 DB 차단 장치 + 테스트 중 예약작업 정지 (IND-5592, 검수 IND-5612·5617 통과)</li>
<li>사용자 화면 쪽 검사 공백 전수 조사 + 우선순위 보고 (IND-5929)</li>
<li><span class="hl-amber">「빌드가 깨져도 검사는 통과」하던 구멍</span>은 아직 열려 있습니다 (IND-5892 — 방침은 「이번 주 안건」에서 확인)</li>
<li><span class="hl-blue">오너 결정(8/11): 자동 검사를 매번 돌리지 않고 「필요할 때만」 수동 실행하도록 전환</span> — 서버·사용자화면 양쪽에서 자동 실행 장치 제거</li>
</ul>
</div>
</div>
<div class="links">
<span class="lbl">확인</span>
<a class="lnk" href="http://100.120.25.127:3100/IND/issues/IND-5592" target="_blank">IND-5592 테스트 DB 분리</a>

</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="30" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%93%A6-%EC%A0%80%EC%9E%A5%EC%86%8C%EC%97%90-%EC%95%88-%EC%98%AC%EB%9D%BC%EA%B0%84-%ED%8C%8C%EC%9D%BC-%EB%B3%B5%EA%B5%AC--%EC%9D%B8%ED%94%84%EB%9D%BC%EC%9A%B4%EC%98%81%EB%B9%84-%EA%B2%B0%EC%A0%95-span-classbadge-date86811span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> 저장소에 안 올라간 파일 복구 + 인프라·운영비 결정 <span class="badge-date">8/6~8/11</span> <span class="badge-new">NEW</span></h2>
<p>작업한 파일이 <span class="hl-red">저장소에 올라가지 않은 채 남아 있어</span>, 다른 사람이 코드를 받으면 화면이 깨지거나 스크립트가 없는 상태가 되는 문제를 발견했습니다. 함께 인프라·운영비 결정도 정리했습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>누락 복구 (오너 지시 8/11)</td>
<td>올라가지 않았던 <span class="hl-green">파일 19건을 소급 복구</span> — 댓글 링크 관련 화면 코드, 과거 이관·검증 스크립트 7건(환불 검증 스크립트 포함) 등</td>
</tr>
<tr>
<td>재발 방지 장치 (IND-5927·5932)</td>
<td><span class="hl-green">저장소에 등록되지 않은 소스 파일을 자동으로 찾아내는 검사</span>를 사용자 화면·서버 양쪽에 신설 — 오너 승인 전에는 강제 차단하지 않도록 분리</td>
</tr>
<tr>
<td>「반쪽 커밋」 4건 (IND-5933~5936)</td>
<td>코드 일부만 올라가 깨끗한 환경에서 기능이 깨지던 유형으로, 이번 주에만 4건 적발·해소</td>
</tr>
<tr>
<td>서버 저장소 반영 차단 사고 (IND-5895)</td>
<td>접근 권한 부족으로 서버 저장소에 코드를 올릴 수 없던 사고 — 원인 규명 완료, 오너 조치 필요 건</td>
</tr>
<tr>
<td>Azure 구 서버 해체 (IND-5669)</td>
<td>AWS 전환은 끝났으나 <span class="hl-red">구 서버·1TB 디스크·백업 비용이 계속 발생 중</span> — <span class="hl-amber">실행은 보드 승인 대기</span></td>
</tr>
<tr>
<td>AI 운영비 절감 (오너 결정 8/7)</td>
<td><span class="hl-blue">개발 에이전트 추론 강도 하향, 동시 실행 2 → 1, 한도 초과 시 무한 재시도 차단, 매 실행마다 주입되던 지침 문서 축소</span>를 모두 적용</td>
</tr>
<tr>
<td>발주 원칙 확정 (오너 8/10)</td>
<td>잘게 쪼개 발주하면 순서가 꼬이고 중복 발주가 생기므로, <span class="hl-blue">큰 단위 1건으로 발주하고 내부에서 나누도록</span> 변경</td>
</tr>
</tbody>
</table>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="31" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="34">
<h2 id="%F0%9F%8E%AF-%EC%9D%B4%EB%B2%88-%EC%A3%BC-%EC%95%88%EA%B1%B4--%EC%98%A4%EB%84%88-%EA%B2%B0%EC%A0%95-%EB%8C%80%EA%B8%B0"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 이번 주 안건 — 오너 결정 대기</h2>
<p>이번 주 회의에서 오너 판단이 필요한 항목은 <span class="hl-blue">경영 판단 2건 · 실행·검증 대기 3건 · 시안·스펙 확인 3건</span>입니다 (결제 오픈·결제 정보 저장·구 서버 해체는 지난주부터 이어지는 항목입니다).</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>상태</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 실 카드 결제 오픈 (IND-4997)</td>
<td>경영 판단</td>
<td>서버측 실 결제 경로는 <span class="hl-green">이미 완성</span>, 남은 것은 사용자 화면 연동 하나. PG 키 발급·오픈 시점이 경영 판단 대기 (하위 현금영수증·세금계산서 발급 IND-5203은 선행조건 미해제로 취소)</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> Azure 구 서버 해체 (IND-5669)</td>
<td><span class="hl-red">보드 승인 필요</span></td>
<td>오너가 「안전한 방법으로 진행하고 이해 안 되는 부분은 반드시 물어볼 것」을 지시하고 백업 유지비를 공식 가격표 기준으로 산출하도록 요구 — 실행 착수에 보드 승인이 필요합니다</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🟡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e1.svg" data-marp-twemoji=""/> 결제 정보 프로필 저장 (IND-5079)</td>
<td>착수 지시 대기</td>
<td>8/8 오너가 C안(휴대폰 번호를 프로필에 저장하고 결제 시 자동 채움) 확정. 활성 계정 420건 중 <span class="hl-blue">이메일 부재 194건(46.19%)</span>이 소셜 가입에 몰려 있어 재구매 이탈과 직결</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 관리자 카테고리 등록화면 (IND-5845·5852)</td>
<td>최종 검증 대기</td>
<td>구현은 끝났고 최종 동작검증만 남은 상태 — 다음 주로 넘어가는 미완 축입니다</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 자동 검사에 빌드 확인 추가 (IND-5892)</td>
<td>방침 재확인</td>
<td>현재 <span class="hl-red">「빌드가 깨져도 검사는 통과」</span>하는 구멍이 열려 있음. 8/11 오너 결정으로 자동 실행 장치를 걷어냈으므로, 수동 실행 체제에서 이 구멍을 어떻게 막을지 방침 확인 필요</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🟡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e1.svg" data-marp-twemoji=""/> 시안·스펙 확인 5건 (IND-5714·5677·5704·5904·5705)</td>
<td>오너 택1·확인 대기</td>
<td>좋아요한 댓글의 원본 맥락 <span class="hl-blue">3개 시안 + 정책 5건</span> / VR 주소 규칙은 「회의 후 논의」 보류 / 모바일 태그·칩 접기는 A/B안 제출 후 착수 보류 / 댓글탭 하위탭은 존치 여부 / 360포스트 소유자 정규화는 검토 보고서 제출 완료</td>
</tr>
</tbody>
</table>
<blockquote>
<p>별건 확인 1건 — 관리자 정보가 없는 장소 <span class="hl-blue">859건</span>은 소유 채널을 정확히 지정하려면 사람 판정이 필요합니다(IND-5744). 관리자·오너 계정 자격증명 교체(IND-5063)는 7/28 회수 집행(미사용 계정 2건 권한 강등·인증 시드 제거)과 7/29 오너의 「추가 인증 재등록 보류」 결정에 따라 취소 처리됐습니다.</p>
</blockquote>
<blockquote>
<p>지난주 안건 처리 결과 — <span class="hl-green">IND-5566 소실 이미지는 오너 「현행 유지」 확정으로 데이터 변경 0건 종결</span> · IND-5555 댓글 검수 완료 · IND-5592 테스트 DB 분리 완료.</p>
</blockquote>
