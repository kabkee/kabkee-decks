<h2 id="%F0%9F%94%A4-%EC%82%AC%EC%9D%B4%ED%8A%B8-%ED%99%94%EB%A9%B4-%EB%8B%A4%EA%B5%AD%EC%96%B4--%EB%AF%B8%EB%B2%88%EC%97%AD-%EC%A0%84%EC%88%98-%EC%A0%95%EB%A6%AC-span-classbadge-date10141019span"><img class="emoji" draggable="false" alt="🔤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f524.svg" data-marp-twemoji=""/> 사이트 화면 다국어 — 미번역 전수 정리 <span class="badge-date">10/14~10/19</span></h2>
<p>언어를 바꿔도 헤더·사이드패널에 한국어가 남는다는 오너 지적(10/14)에서 출발해, 화면 전체의 하드코딩 한국어를 전수 조사하고 고쳤습니다.</p>
<table>
<thead>
<tr>
<th>항목</th>
<th>결과</th>
<th>상태</th>
</tr>
</thead>
<tbody>
<tr>
<td>전수 조사</td>
<td>템플릿·속성·스크립트·서버 문구 등 「고칠 것」 1,300여 건 · en·ja 48화면 실측</td>
<td><span class="hl-green">잔여 0</span></td>
</tr>
<tr>
<td>브라우저 탭 제목</td>
<td>60개 화면 제목이 사이트 언어를 따름(분석용 GA4 제목은 한국어 고정)</td>
<td><span class="hl-green">QC PASS</span></td>
</tr>
<tr>
<td>서버 오류 문구</td>
<td>로그인 실패·비밀번호 재설정 등 150종에 코드 부여 → 사이트 언어로 표시</td>
<td><span class="hl-green">QC PASS</span></td>
</tr>
<tr>
<td>재발 방지</td>
<td>한글 문구를 새로 넣으면 <code>yarn lint</code> 실패</td>
<td><span class="hl-green">적용</span></td>
</tr>
<tr>
<td>콘텐츠 번역</td>
<td>VR 스토리 챕터·컨트롤러 제목 번역 · 홈에서 언어를 바꿔도 VR 재로딩 없음</td>
<td><span class="hl-green">QC PASS</span></td>
</tr>
<tr>
<td>후속 7곳(10/19)</td>
<td>홈 첫 슬라이드·마이페이지 지역/카테고리·지갑 상품명 등</td>

<blockquote>
<p>자동번역 확인 팝업은 「자동번역이 꺼져 있을 때만」 뜨도록 바꿨고, 바깥 클릭·ESC·새로 넣은 X 버튼은 모두 취소로 처리합니다. 예전 알림은 한국어로 남습니다(오너 결정).</p>
</blockquote>

<h2 id="%E2%9D%93-faq--%EA%B3%B5%EC%A7%80%EC%82%AC%ED%95%AD-%C2%AB%EB%B3%B8%EB%AC%B8%C2%BB%EB%8F%84-%EB%8B%A4%EA%B5%AD%EC%96%B4%EB%A1%9C-span-classbadge-date%ED%9A%8C%EC%9D%98-%EC%95%88%EA%B1%B4span"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> FAQ · 공지사항 «본문»도 다국어로? <span class="badge-date">회의 안건</span></h2>
<p>사이트 다국어 작업은 <strong>화면 문구</strong>(메뉴·버튼·표 머리글·탭 제목·서버 오류)만 번역했습니다. FAQ(<code>/faq</code>)·공지사항(<code>/notice</code>)의 제목·본문은 DB 에 한국어로만 있어 언어를 바꿔도 한국어로 나옵니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EC%98%A4%EB%84%88-%EC%9D%98%EA%B2%AC-1019">오너 의견 (10/19)</h3>
<ul>
<li>FAQ·공지는 운영자가 쓰는 글이라 <strong>다국어로 제공해도 좋겠다</strong></li>
<li>1:1 문의는 사용자가 자기 언어로 쓰므로 <strong>화면 문구만 번역</strong>, 본문은 그대로</li>
</ul>
</div>
<div class="col">
<h3 id="%ED%9A%8C%EC%9D%98%EC%97%90%EC%84%9C-%EC%A0%95%ED%95%A0-%EA%B2%83">회의에서 정할 것</h3>
<ol>
<li>FAQ·공지 본문 다국어 여부</li>
<li>방식 — <span class="hl-blue">운영자 직접 작성</span>(관리자 입력란 추가) / <span class="hl-blue">자동번역</span>(기존 콘텐츠 자동번역 재사용) / <span class="hl-blue">혼합</span>(자동번역 후 검수)</li>
<li>대상 언어 — 7개 전부 또는 영어 우선</li>
</ol>
</div>
</div>
<blockquote>
<p>함께 결정이 필요한 것: 중요 메일 다국어(한·영 병기 제안) · 번역 품질(「시작→startup」 등 어색한 기계 번역) 처리 방침.</p>
</blockquote>

<p><span class="sec-num">Section 03</span></p>
<h2 id="l3-%ED%94%8C%EB%9E%AB%ED%8F%BC--360%EB%8F%99%EC%98%81%EC%83%81--vr-%EC%8A%A4%ED%86%A0%EB%A6%AC">l3 플랫폼 · 360동영상 · VR 스토리</h2>
<p>YouTube형 360동영상의 조작을 운영까지 반영했고, iPhone 실기 결과에 따라 지원 범위를 확정했습니다. VR 스토리에는 360동영상과 화질 선택이 들어갔습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="clean" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="63">
<h2 id="%F0%9F%8E%AC-youtube%ED%98%95-360%EB%8F%99%EC%98%81%EC%83%81--%EB%93%9C%EB%9E%98%EA%B7%B8%EC%9E%90%EC%9D%B4%EB%A1%9C-%EC%9A%B4%EC%98%81-%EB%B0%98%EC%98%81-span-classbadge-date10131016span"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ac.svg" data-marp-twemoji=""/> YouTube형 360동영상 — 드래그·자이로 운영 반영 <span class="badge-date">10/13~10/16</span></h2>
<p>YouTube 임베드는 원래 손가락·마우스로 시점을 돌릴 수 없어, 위에 입력 레이어를 얹어 우회했습니다. 이번 주 오너 실기 후 <strong>운영(Netlify)에 반영</strong>했습니다.</p>
<table>
<thead>
<tr>
<th>단계</th>
<th>내용</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>1차 실기(오너)</td>
<td>모바일 드래그 불가 · 자이로 부정확 · 아이콘 겹침</td>
<td><span class="hl-red">FAIL</span></td>
</tr>
<tr>
<td>원인·수정</td>
<td>모바일 YouTube 의 방향 센서가 드래그를 덮어씀 → 끄고 전달 · 재생 중 제목 숨김</td>
<td><span class="hl-green">QC PASS</span></td>
</tr>
<tr>
<td>운영 배포</td>
<td>이 수정 3커밋만 골라 Netlify 반영(<code>ef619978</code>)</td>
<td><span class="hl-green">반영</span></td>
</tr>
<tr>
<td>2차 실기(오너)</td>
<td>Android Chrome — 드래그·자이로·겹침·제목 숨김 전부 정상</td>
<td><span class="hl-green">정상</span></td>
</tr>
<tr>
<td>YouTube 자체 UI</td>
<td>설정·공유 메뉴가 입력 레이어에 가려 안 눌림 → YouTube UI 를 끄고 <strong>우리 컨트롤바</strong>로 제어</td>
<td><span class="hl-green">dev 반영</span></td>
</tr>
<tr>
<td>자이로 아이콘</td>
<td>오너 요청대로 「지구본 + 대각선 축」 모양</td>
<td><span class="hl-green">dev 반영</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>「드래그가 필요하면 업로드형으로」라는 임시 방침은 종료됐습니다. YouTube 영상에는 화질 메뉴가 없습니다(YouTube 가 화질 지정을 막음).</p>
</blockquote>

<p>YouTube iframe 은 다른 사이트 영역이라 우리 코드로 영상 픽셀을 가져와 구에 입힐 수 없습니다. iOS Chrome 도 엔진이 WebKit 이라 같은 제약입니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EA%B5%AC%ED%98%84-dev--qc-%EC%A7%84%ED%96%89-%EC%A4%91">구현 (dev · QC 진행 중)</h3>
<ul>
<li>iOS + YouTube형 장면에서만 <strong>안내 배너 + 「YouTube 앱에서 보기」</strong> 버튼</li>
<li>누르면 YouTube 앱으로 <strong>보던 시각부터</strong> 이어서 열림 · 앱은 360 드래그·자이로 지원</li>
<li>iOS 에선 드래그 레이어·자이로 버튼 숨김 · Android·PC 는 그대로</li>
<li>업로드형 360동영상은 iOS 에서도 정상(우리 엔진으로 렌더링)</li>
</ul>
</div>
<div class="col">

<ol>
<li>iOS 미지원 + YouTube 앱 우회 방향 <strong>최종 확정</strong></li>
<li>관리자 360 영상 등록 화면에 「iOS 에서도 둘러보려면 업로드형으로」 안내를 넣을지(별도 발주)</li>
<li>Android 는 10/15 정상 확인 → 감지 조건을 <strong>iOS 로 한정</strong>하는 것이 맞는지</li>
</ol>
</div>

<blockquote>
<p>에뮬레이션으로만 확인했습니다. 버튼이 iPhone 에서 실제로 YouTube 앱을 여는지는 오너 실기 확인이 필요합니다.</p>

<p>레거시 XML 은 CloudFront 가 주소 뒤 버전값을 무시해, 배포 후 약 15시간 옛 파일이 나갔습니다. 앞으로 레거시 XML 배포에는 캐시 무효화를 함께 합니다. 남한산성 개선 선택지 5개(클릭 시 회전 건너뛰기 등)는 보류 상태입니다.</p>
</blockquote>

<p>A = 현행(라임 원 · 곡선 화살표 · 흰 글자+그림자) · B = 반투명 다크 원 · 꺾쇠 · 라벨 다크 pill · C = 화살표+이름 통합 라임 캡슐. <strong>오너 1차 의견: A안이 가장 좋아 보임.</strong></p>
<div style="display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center">

<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 포함하면 오토투어를 오래 틀어 둔 뒤 브라우저 뒤로가기로 VR 페이지를 나가기까지 누를 횟수가 늘어납니다(무한 순환).</p>
<p>C안은 모바일에서 오른쪽 캡슐이 액션 아이콘 줄에 닿습니다.</p>

<p>10/19 오너가 운영 weeklykpop.com 사이드 패널 20행을 확인해 보니, 행마다 가수만 나오거나 곡만 나오거나 줄이 아예 없어 일관성이 없었습니다. 그래서 Q3(b) 규칙을 폐기하고 다시 정했습니다.</p>
<table>
<thead>
<tr>
<th>새 규칙(오너 결정)</th>
<th>예시</th>
</tr>
</thead>
<tbody>
<tr>
<td>가수·곡 원문이 <strong>둘 다 영문</strong>이면 영문 줄 없음</td>
<td>PLAVE · Star Trace 등 — 지금 그대로</td>
</tr>
<tr>
<td><strong>한글이 하나라도</strong> 섞이면 원문과 겹치더라도 <code>[가수]곡</code> 둘 다 표시</td>
<td><code>[RESCENE]Pinball</code> · <code>[NCT WISH]Like A Dream</code></td>
</tr>
<tr>
<td>영문 값 우선순위 = <strong>① 공식 → ② 번역 → ③ 자동 로마자</strong></td>
<td>부디 행복해질 것 → <code>Please Be Happy</code>(공식) · 꾼 → <code>Kkun</code></td>
</tr>
<tr>
<td>적용 범위</td>
<td>사이드 패널·차트 목록·가수 페이지·Top Songs · SEO·내보내기는 영향 없음 · pop 은 변경 없음</td>
</tr>
<tr>
<td>함께 확인할 결함</td>
<td>운영에서 아이유 가수 영문 <code>IU</code> 가 안 나옴(로컬 DB 에는 있음) → 원인 실측 + 누락 가수 전수 집계</td>
</tr>
</tbody>
</table>
<blockquote>
<p>로컬 DB 실측: 곡 영문 값 중 LLM 번역이 4,151행으로 공식(iTunes) 3,162행보다 많습니다. 9/14 이후 로컬과 운영의 가수 매칭 데이터가 갈라져 있어 테이블 통째 재이관은 금지합니다(운영 신규 확정분 소실).</p>
</blockquote>

<h2 id="%F0%9F%86%95-%EC%9C%A0%ED%8A%9C%EB%B8%8C-%EC%97%91%EB%B0%95-%EC%9E%90%EB%8F%99-%EB%B3%B5%EA%B5%AC-%EC%9A%B4%EC%98%81-%ED%99%9C%EC%84%B1%ED%99%94--1019-%EB%B0%9C%EC%A3%BC-span-classbadge-date1019span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f195.svg" data-marp-twemoji=""/> 유튜브 엑박 자동 복구 운영 활성화 — 10/19 발주 <span class="badge-date">10/19</span> <span class="badge-new">NEW</span></h2>
<p>지금 운영은 「감지 + 메일만」 축소 모드라서 삭제된 영상만 잡힙니다. 오너 결정(10/19): <strong>실제로 돌려 보고 판단한다</strong> · 자동 승인은 코드 수정 QC 후 · 알림은 기존 메일을 개편해 통합.</p>
<table>
<thead>
<tr>
<th>단계</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>A. 운영 설정</td>
<td>서버 YouTube 키·AI 키 반영 · <code>yt-dlp</code> 설치 · 크론의 후보 탐색 건너뛰기(<code>--skip-find</code>) 제거 → 승인 대기열에 후보가 쌓이기 시작</td>
</tr>
<tr>
<td>B. 자동 승인 전 수정</td>
<td>점수 높은 순으로 적용 · <strong>같은 곡인지 판정</strong> 추가(QC 때 다른 곡을 통과시킨 사례)</td>
</tr>
<tr>
<td>C. 메일 개편</td>
<td>한 통에 「자동 적용 · 승인 대기 · 수동 처리」 곡과 사유별 집계 · 제목에 건수 요약</td>
</tr>
<tr>
<td>D. 자동 승인 ON</td>
<td>B 가 QC PASS 되면 켬(첫 주 보수적) — <strong>켜기 직전 오너 확인 1회</strong>(추가 코멘트)</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 규모 주의</td>
<td>1990년대 kpop 1,427곡만 API 로 판정해도 엑박 463곡(32%) vs 운영 메일은 전체 13,972곡 중 3곡 → 비공개 전환 영상을 지금 방식이 못 잡는 것으로 추정</td>
</tr>
</tbody>
</table>
<blockquote>
<p>API 판정을 켜는 첫날 엑박이 수천 곡 단위로 늘 수 있어 「첫 실행 규모 추정 · 요약형 메일 · 백로그 소진 계획」을 EM 에 함께 요청했습니다. 지난주 「키 발급 · 실판정 완료」는 dev QC 기준이며, 운영에는 아직 키가 들어가지 않았습니다.</p>
</blockquote>
