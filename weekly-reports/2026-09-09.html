<h2 id="%EC%9D%B4%EB%B2%88-%EC%A3%BC-%EC%A3%BC%EC%9A%94-%EC%9E%91%EC%97%85--%EC%97%B4%EB%A0%A4-%EC%9E%88%EB%8D%98-%EB%92%B7%EB%AC%B8%EC%9D%84-%EB%8B%AB%EA%B3%A0-7%EA%B0%9C-%EC%96%B8%EC%96%B4%EB%A5%BC-%ED%99%94%EB%A9%B4%EA%B9%8C%EC%A7%80-%EB%82%B4%EB%B3%B4%EB%82%B8-%EC%A3%BC%EA%B0%84">이번 주 주요 작업 — 「열려 있던 뒷문을 닫고, 7개 언어를 화면까지 내보낸」 주간</h2>
<div class="cols">
<div class="col">
<h3 id="%F0%9F%94%92-%EB%B3%B4%EC%95%88--%EB%A1%9C%EA%B7%B8%EC%9D%B8-%EC%97%86%EC%9D%B4-%ED%86%B5%ED%95%98%EB%8D%98-%EB%AC%B8-40%EA%B3%B3"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> 보안 — 로그인 없이 통하던 문 40곳</h3>
<ul>
<li>인증 없이 <span class="hl-red">데이터를 지우고 고칠 수 있던 경로</span>를 전수 점검해 <span class="hl-green">31곳 차단</span></li>
<li>소셜 로그인에서 <span class="hl-red">남의 계정으로 로그인 가능</span>하던 결함 차단</li>
<li>나머지 <span class="hl-gray">9곳</span>은 <span class="hl-gray">공개가 정상</span>임을 확인해 그대로 유지</li>
</ul>
<h3 id="%F0%9F%8C%90-%EB%8B%A4%EA%B5%AD%EC%96%B4--7%EA%B0%9C-%EC%96%B8%EC%96%B4%EB%A5%BC-%ED%99%94%EB%A9%B4%EA%B9%8C%EC%A7%80"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 다국어 — 7개 언어를 화면까지</h3>
<ul>
<li>지역명 <span class="hl-blue">8,273건</span> 7개 언어 채움 · 게시판 분류 7개 언어 완비</li>
<li>감상 화면에서 <span class="hl-red">번역되지 않던 파노라마 이름</span> 해소</li>
<li>관리자 번역 화면에 <span class="hl-green">진행도 표시 + 자동번역 초안</span> 신설</li>
</ul>
<h3 id="%E2%9A%A1-%EC%84%B1%EB%8A%A5--%EC%97%85%EB%A1%9C%EB%93%9C-%EB%8C%80%EA%B8%B0-5%EB%B6%84-22%EC%B4%88-%E2%86%92-4%EC%B4%88"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 성능 — 업로드 대기 5분 22초 → 4초</h3>
<ul>
<li>파노라마 압축파일 업로드가 <span class="hl-red">5분 넘게 멈춰 있던</span> 원인 규명 후 재설계</li>
<li>운영 서버 <span class="hl-red">오류 경보</span> 원인 특정 · 콘텐츠 삭제 시 <span class="hl-green">딸린 데이터 정리 구조</span> 신설</li>
</ul>
</div>
<div class="col">
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%EA%B4%80%EB%A6%AC%EC%9E%90-%ED%99%94%EB%A9%B4--%EC%86%90%EC%9D%B4-%EB%8B%BF%EC%A7%80-%EC%95%8A%EB%8D%98-%EA%B3%B3"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 관리자 화면 — 손이 닿지 않던 곳</h3>
<ul>
<li>게시판 관리에서 <span class="hl-red">실사용 게시판 9건이 아예 안 보이던</span> 문제 해소</li>
<li>장소 수정·필터가 <span class="hl-red">누르면 무조건 오류</span>나던 것 2건 복구</li>
<li><span class="hl-green">지역 정보가 빠진 장소</span>를 찾아 고치는 화면 신설</li>
</ul>
<h3 id="%F0%9F%93%B1-360%ED%8F%AC%EC%8A%A4%ED%8A%B8--%EB%AA%A8%EB%B0%94%EC%9D%BC-%EC%82%AC%EC%9A%A9%EC%84%B1"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> 360포스트 — 모바일 사용성</h3>
<ul>
<li>작성 중 <span class="hl-red">아무 버튼도 없이 갇히던</span> 상태 해소</li>
<li>비로그인도 작성 버튼이 보이고 <span class="hl-green">누르면 바로 로그인</span></li>
<li>화면 방향 <span class="hl-green">잠금·다시 잡기</span>가 실제로 동작하도록 재구현</li>
</ul>
<h3 id="%F0%9F%9A%A7-%EC%A7%84%ED%96%89-%EC%A4%91-%EB%8B%A4%EC%9D%8C-%EC%A3%BC-%EC%9D%B4%EC%9B%94"><img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a7.svg" data-marp-twemoji=""/> 진행 중 (다음 주 이월)</h3>
<ul>
<li>지역 <span class="hl-amber">5단계 주소 체계 재정비</span> — 기존 데이터 <span class="hl-blue">1,448건</span> 재배치 대기</li>
<li>러시아어 지역명 <span class="hl-blue">1,880건</span> 번역 · 사진 촬영일자 정정 범위 <span class="hl-amber">조사 중</span></li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="sec" data-theme="clean" lang="ko-KR" class="sec" data-marpit-pagination="3" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="38">
<p><span class="sec-num">Section 01</span></p>
<h2 id="%EB%B3%B4%EC%95%88--%EB%A1%9C%EA%B7%B8%EC%9D%B8-%EC%97%86%EC%9D%B4-%EC%A7%80%EB%82%98%EA%B0%80%EB%8D%98-%EB%AC%B8%EC%9D%84-%EB%8B%AB%EB%8B%A4">보안 — 로그인 없이 지나가던 문을 닫다</h2>
<p>작업 중 우연히 발견된 결함 하나가, 같은 성격의 문제 40곳을 찾아내는 전수 점검으로 이어졌습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="4" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="38">
<h2 id="%F0%9F%94%92-%EC%9D%B8%EC%A6%9D-%EC%97%86%EC%9D%B4-%EB%8D%B0%EC%9D%B4%ED%84%B0%EB%A5%BC-%EC%A7%80%EC%9A%B8-%EC%88%98-%EC%9E%88%EC%97%88%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge-date9394span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> 인증 없이 데이터를 지울 수 있었습니다 <span class="badge-date">9/3~9/4</span> <span class="badge-new">NEW</span></h2>
<p>테스트 장소를 지우려다 <span class="hl-red">오류 원인을 파고든 것</span>이 출발점이었습니다. 로그인 정보를 <strong>전혀 붙이지 않은 요청</strong>이 거부되지 않고 데이터베이스 삭제 명령까지 도달하고 있었습니다.</p>
<table>
<thead>
<tr>
<th>단계</th>
<th>발견한 것</th>
</tr>
</thead>
<tbody>
<tr>
<td>① 최초 발견</td>
<td>장소 삭제 경로가 <span class="hl-red">무인증으로 삭제까지 도달</span> — 우연히 걸린 데이터 제약이 막았을 뿐</td>
</tr>
<tr>
<td>② 같은 유형 확인</td>
<td>삭제 계열에서 <span class="hl-red">6곳 추가</span> 발견</td>
</tr>
<tr>
<td>③ <span class="hl-green">전수 재점검</span></td>
<td>「삭제만 세었다」는 점을 깨닫고 <span class="hl-green">등록·수정 계열 전체</span>를 다시 조사 — <span class="hl-red">33곳</span> 추가 발견</td>
</tr>
</tbody>
</table>
<blockquote>
<p>판정 기준은 <strong>실제 호출 결과</strong>입니다. 정상이라면 「권한 없음(401)」이 돌아와야 하는데, 문제 지점들은 <span class="hl-red">「없는 데이터(404)」·「잘못된 요청(400)」</span>을 돌려주었습니다. 요청이 이미 <span class="hl-red">인증 관문을 통과해 내부 로직까지 들어갔다</span>는 뜻입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="5" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="38">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="6" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="38">
<h2 id="%F0%9F%9A%A8-%EB%82%A8%EC%9D%98-%EA%B3%84%EC%A0%95%EC%9C%BC%EB%A1%9C-%EB%A1%9C%EA%B7%B8%EC%9D%B8%ED%95%A0-%EC%88%98-%EC%9E%88%EC%97%88%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge-date94span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> 남의 계정으로 로그인할 수 있었습니다 <span class="badge-date">9/4</span> <span class="badge-new">NEW</span></h2>
<p>가장 위험도가 높았던 건입니다. 페이스북·네이버 간편 로그인에서 <span class="hl-red">해당 회사에 「이 사람이 맞느냐」고 확인하는 절차가 통째로 빠져</span> 있었습니다.</p>
<div class="cols">
<div class="col">
<h3 id="%EB%AC%B4%EC%97%87%EC%9D%B4-%EB%AC%B8%EC%A0%9C%EC%98%80%EB%82%98">무엇이 문제였나</h3>
<ul>
<li>정상 절차는 <span class="hl-green">페이스북·네이버에 되물어 본인 확인</span>을 받는 것입니다</li>
<li>그런데 이 경로는 <span class="hl-red">전달받은 아이디 값만 보고</span> 곧바로 로그인 처리했습니다</li>
<li>즉 <strong>피해자의 소셜 아이디만 알면 그 계정에 들어갈 수 있는</strong> 상태였습니다</li>
<li>없는 아이디를 보내면 <span class="hl-red">무단으로 새 계정까지 생성</span>됐습니다</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%96%B4%EB%96%BB%EA%B2%8C-%EC%B2%98%EB%A6%AC%ED%96%88%EB%82%98">어떻게 처리했나</h3>
<ul>
<li>사전 조사에서 <span class="hl-green">우리 화면 어디에서도 이 경로를 쓰지 않는 것</span>을 확인했습니다</li>
<li>정상 로그인은 <span class="hl-green">본인 확인을 거치는 별도 경로</span>로 이미 동작 중이었습니다</li>
<li>따라서 <span class="hl-green">해당 경로를 막는 것으로 처리</span> — 사용자 영향 없음</li>
<li>실사용 여부를 먼저 확인했기에 <span class="hl-blue">복잡한 개조 없이</span> 끝났습니다</li>
</ul>
</div>
</div>
<blockquote>
<p>실제 피해 흔적은 확인되지 않았습니다. 다만 <strong>가능한 상태였다</strong>는 점에서 이번 주 최우선으로 처리했습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-class="sec" data-theme="clean" lang="ko-KR" class="sec" data-marpit-pagination="7" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="38">
<p><span class="sec-num">Section 02</span></p>
<h2 id="%EB%8B%A4%EA%B5%AD%EC%96%B4--7%EA%B0%9C-%EC%96%B8%EC%96%B4%EB%A5%BC-%ED%99%94%EB%A9%B4%EA%B9%8C%EC%A7%80-%EB%82%B4%EB%B3%B4%EB%82%B4%EB%8B%A4">다국어 — 7개 언어를 화면까지 내보내다</h2>
<p>지난주 「데이터를 채우는」 단계였다면, 이번 주는 그 데이터가 <strong>실제 화면에 나오게</strong> 하는 단계였습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="8" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="38">
<h2 id="%F0%9F%8C%90-7%EA%B0%9C-%EC%96%B8%EC%96%B4-%EC%A7%84%ED%96%89-%ED%98%84%ED%99%A9-span-classbadge-date9298span"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 7개 언어 진행 현황 <span class="badge-date">9/2~9/8</span></h2>
<p>대상은 <span class="hl-blue">한국어 · 영어 · 일본어 · 중국어 · 스페인어 · 독일어 · 러시아어</span> 7종입니다.</p>

<td>일부 항목만 채워짐</td>
<td><span class="hl-green">빠진 항목만 골라 자동 보강</span></td>

<tr>

</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="9" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="38">
<h2 id="%F0%9F%97%82%EF%B8%8F-%EA%B2%8C%EC%8B%9C%ED%8C%90-%EB%B6%84%EB%A5%98%EB%A5%BC-7%EA%B0%9C-%EC%96%B8%EC%96%B4%EB%A1%9C-%ED%95%9C-%ED%99%94%EB%A9%B4%EC%97%90%EC%84%9C-span-classbadge-date98span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🗂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c2.svg" data-marp-twemoji=""/> 게시판 분류를 7개 언어로 한 화면에서 <span class="badge-date">9/8</span> <span class="badge-new">NEW</span></h2>
<p>7개 언어가 한 줄에 펼쳐져 읽히지 않던 화면을 <span class="hl-green">요약 행 + 펼침 편집</span>으로 다시 만들었습니다.</p>
<p><img src="assets/2026-09-09/07-admin-bbs-category.jpg" alt="" style="width:650px;" /></p>

<h2 id="%F0%9F%8E%A8-%EB%AC%B4%EC%97%87%EC%9D%B4-%EC%A2%8B%EC%95%84%EC%A1%8C%EB%82%98-span-classbadge-date98span"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> 무엇이 좋아졌나 <span class="badge-date">9/8</span></h2>
<div class="cols">
<div class="col">
<h3 id="%ED%95%9C%EB%88%88%EC%97%90-%EB%B3%B4%EC%9D%B4%EB%8A%94-%EC%A7%84%ED%96%89%EB%8F%84">한눈에 보이는 진행도</h3>
<ul>
<li>분류마다 <span class="hl-blue">KO EN JA ZH ES DE RU</span> 표시가 붙고, <span class="hl-blue">7/7</span>처럼 채움 개수가 나옵니다</li>
<li>색으로 상태를 구분합니다 — <span class="hl-green">사람이 입력</span> / <span class="hl-blue">자동 번역</span> / <span class="hl-amber">미입력</span></li>
<li>「<span class="hl-green">다음 미입력 분류 →</span>」 버튼으로 빈 곳만 이어서 채울 수 있습니다</li>
</ul>
</div>
<div class="col">
<h3 id="%EC%9E%90%EB%8F%99-%EB%B2%88%EC%97%AD%EC%9D%80-%C2%AB%EC%B4%88%EC%95%88%C2%BB%EA%B9%8C%EC%A7%80%EB%A7%8C">자동 번역은 «초안»까지만</h3>
<ul>
<li>버튼을 눌렀을 때만 동작하고, <span class="hl-green">빈 언어에만 초안을 채웁니다</span></li>
<li>결과는 입력칸에 들어올 뿐 <span class="hl-red">저장을 누르기 전까지 반영되지 않습니다</span></li>
<li><span class="hl-green">기존에 사람이 넣은 번역은 덮어쓰지 않습니다</span></li>
<li>저장하지 않고 나가면 <span class="hl-amber">확인창</span>으로 되묻습니다</li>
</ul>
</div>
</div>
<blockquote>
<p>「번역이 <span class="hl-red">사람 모르게 자동으로 저장되는 것</span>은 금지, <span class="hl-green">버튼을 눌러 초안을 받아 확인 후 저장하는 것</span>은 허용」이라는 오너 결정을 그대로 구현했습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="11" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="38">
<h2 id="%F0%9F%96%BC%EF%B8%8F-%EA%B0%90%EC%83%81-%ED%99%94%EB%A9%B4--%ED%8C%8C%EB%85%B8%EB%9D%BC%EB%A7%88-%EC%9D%B4%EB%A6%84%EC%9D%B4-%EB%B2%88%EC%97%AD%EB%90%98%EC%A7%80-%EC%95%8A%EB%8D%98-%EB%AC%B8%EC%A0%9C-span-classbadge-date98span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> 감상 화면 — 파노라마 이름이 번역되지 않던 문제 <span class="badge-date">9/8</span> <span class="badge-new">NEW</span></h2>
<p>사이트 언어를 영어로 두고 자동 번역을 켜도 <span class="hl-red">파노라마 이름만 한국어로 남았습니다.</span> 아래는 수정 후 화면입니다.</p>
<p><img src="assets/2026-09-09/03-vr-detail-en.jpg" alt="" style="width:640px;" /></p>
<div class="links"><span class="lbl">직접 확인</span>
<a class="lnk" href="http://100.120.25.127:5174/vr-info/v47cpxre" target="_blank">http://100.120.25.127:5174/vr-info/v47cpxre</a></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="12" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="38">
<h2 id="%F0%9F%94%8D-%EC%9B%90%EC%9D%B8%EC%9D%80-%EB%B2%88%EC%97%AD%EC%9D%B4-%EC%97%86%EC%96%B4%EC%84%9C%EA%B0%80-%EC%95%84%EB%8B%88%EC%97%88%EC%8A%B5%EB%8B%88%EB%8B%A4-span-classbadge-date98span"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 원인은 「번역이 없어서」가 아니었습니다 <span class="badge-date">9/8</span></h2>
<table>
<thead>
<tr>
<th>확인한 것</th>
<th>결과</th>
</tr>
</thead>
<tbody>
<tr>
<td>같은 콘텐츠를 <span class="hl-blue">VR 뷰어</span>에서 조회</td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 영어로 정상 반환 (<code>Dooley Museum entrance</code>)</td>
</tr>
<tr>
<td>같은 콘텐츠를 <span class="hl-blue">상세 지면</span>에서 조회</td>
<td><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> 한국어 고정 (<code>둘리뮤지엄 입구</code>)</td>
</tr>
<tr>
<td>판정</td>
<td><span class="hl-green">번역 데이터는 이미 있었고</span>, <span class="hl-red">상세 지면이 그것을 읽지 않았습니다</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>데이터를 새로 만드는 작업이 아니라 <span class="hl-green">읽어오는 연결을 잇는</span> 수정이었습니다. 같은 유형으로 <strong>VR 뷰어에서 자동 번역을 켰을 때 분류·지역·테마 표시까지 함께 번역</strong>되도록 하는 작업(오너 신규 요구)도 이번 주에 반영했습니다. 뷰어 밖 화면은 기존대로 사이트 언어를 따릅니다.</p>
</blockquote>
</section>

<p><span class="sec-num">Section 05</span></p>
<h2 id="%EC%84%B1%EB%8A%A5%EC%9D%B8%ED%94%84%EB%9D%BC--5%EB%B6%84%EC%9D%84-4%EC%B4%88%EB%A1%9C">성능·인프라 — 5분을 4초로</h2>
<p>「체감상 너무 느리다」는 현장 의견을, 실제 서버에서 측정해 원인을 확정했습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="25" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="38">

<table>
<thead>
<tr>
<th>처리 방식</th>
<th>실측 시간 (17,000장 기준 환산)</th>

</thead>
<tbody>
<tr>
<td><span class="hl-red">현재 — 저장소에 직접 하나씩 풀기</span></td>
<td><span class="hl-red">5분 22초</span></td>
</tr>
<tr>
<td>내려받아 풀고 하나씩 옮기기</td>
<td>3분 31초</td>
</tr>
<tr>
<td><span class="hl-green">내려받아 풀고 8개씩 동시에 옮기기</span></td>
<td><span class="hl-green">1분 37초</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>압축을 푸는 것 자체는 <span class="hl-blue">0.5초</span>면 끝납니다. 느렸던 건 파일을 <span class="hl-red">한 개씩 차례로</span> 옮기고 있었기 때문이고, 저장소 성능의 <span class="hl-blue">0.15%</span>밖에 쓰지 못하고 있었습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="26" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="38">

<p>완료되지 않았지만 이번 주에 계속 진행된 작업들입니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="33" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="38">
<h2 id="%F0%9F%9A%A7-%EC%A7%80%EC%97%AD-%EC%A3%BC%EC%86%8C-%EC%B2%B4%EA%B3%84-5%EB%8B%A8%EA%B3%84-%EC%9E%AC%EC%A0%95%EB%B9%84-span-classbadge-date%EC%A7%84%ED%96%89-%EC%A4%91span"><img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a7.svg" data-marp-twemoji=""/> 지역 주소 체계 5단계 재정비 <span class="badge-date">진행 중</span></h2>

<th>단계</th>
<th>대상</th>
<th>상태</th>
</tr>

<td>5단계 체계 정의</td>

</tr>
<tr>
<td>화면 대응</td>
<td>관리자 5단계 표시·별칭 관리</td>

</tr>
<tr>
<td>신규 유입 차단</td>

<td><span class="hl-green">완료</span></td>
</tr>
<tr>
<td>기존 데이터 재편</td>

</tr>
<tr>
<td>사용하지 않는 데이터 정리</td>
<td>잔여 <span class="hl-blue">2건</span> + 연결 복구</td>
<td><span class="hl-amber">진행 중</span></td>
</tr>
</tbody>
</table>
<blockquote>
<p>순서를 지켜야 하는 작업입니다. 앞 단계를 건너뛰면 <span class="hl-red">오류 대상이 오히려 늘어나는 것</span>을 실제로 확인해(148건 → 489건), 현재는 단계별로 확인하며 진행하고 있습니다.</p>
