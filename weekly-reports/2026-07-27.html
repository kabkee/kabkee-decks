<tbody>
<tr>

</tr>
<tr>

</tr>

</tr>
</tbody>
</table>
<ul>
<li>검증: 4개 뷰포트(390/800/1200/1440px) × 5개 매체(가로/세로/4:1 파노/YouTube/Vimeo) — <span class="hl-green">20/20 QC 매트릭스 PASS</span></li>
