<h3 id="%F0%9F%92%B0-%ED%8C%90%EB%A7%A4-%EC%83%81%ED%92%88-%EB%B3%B4%ED%98%B8"><img class="emoji" draggable="false" alt="💰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b0.svg" data-marp-twemoji=""/> 판매 상품 보호</h3>

<td>재생 버튼을 <span class="hl-red">눌러야</span> 시작</td>
<td><span class="hl-green">자동재생</span> (버튼 제거)</td>

</tr>
<tr>
<td>표시 정보</td>
<td>제목만</td>
<td>제목 · 채널 · 카테고리 · <span class="hl-green">지역 · 테마</span> 3줄</td>
</tr>
<tr>
<td>조작</td>
<td>불가</td>
<td><span class="hl-green">화면을 직접 돌려볼 수 있음</span> + 전체화면</td>
</tr>
</tbody>
</table>
<blockquote>
<p>모바일에서 슬라이드 위에 손가락이 닿으면 페이지 스크롤이 막혀 <span class="hl-red">아래로 내려갈 수 없던 문제</span>(일명 개미지옥)도 함께 해소했습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="6" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="35">
<h2 id="%F0%9F%9B%A1%EF%B8%8F-%ED%99%88%EC%97%90-%EB%82%98%EC%98%A4%EB%A9%B4-%EC%95%88-%EB%90%98%EB%8A%94-%EC%BD%98%ED%85%90%EC%B8%A0-%EC%B0%A8%EB%8B%A8-span-classbadge-date829span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 홈에 나오면 안 되는 콘텐츠 차단 <span class="badge-date">8/29</span> <span class="badge-new">NEW</span></h2>
<p>랜덤 노출이 도입되면서 <span class="hl-red">아무 콘텐츠나 첫 화면에 뜰 수 있는 위험</span>이 생겼습니다. 노출 자격을 서버에서 다시 판정하도록 했습니다.</p>
<table>
<thead>
<tr>
<th>보호 장치</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td><span class="hl-red">유료 콘텐츠 전면 차단</span></td>
<td>돈을 받고 파는 콘텐츠는 홈에서 무료로 보이지 않습니다</td>
</tr>
<tr>
<td><span class="hl-green">사이트 언어판 우선 노출</span></td>
<td>같은 콘텐츠에 여러 언어판이 있으면 <span class="hl-green">지금 보고 있는 사이트 언어의 판을 먼저</span> 고릅니다. 없으면 원본, 그것도 없으면 나머지 순 — <span class="hl-blue">콘텐츠당 1건</span>만 노출해 중복도 함께 제거</td>
</tr>
<tr>
<td>관리자 구성 단계 차단</td>
<td>부적격 콘텐츠는 <span class="hl-green">담는 시점에 사유와 함께 거부</span></td>
</tr>
<tr>
<td>회귀 시험</td>
<td>이 필터에 대한 자동 시험이 <span class="hl-red">0건</span>이던 것을 신규 작성</td>
</tr>
</tbody>
</table>
<blockquote>
<p>언어 우선순위는 화면에서 서버까지 이어져 있습니다 — 홈이 <span class="hl-blue">현재 사이트 언어를 서버에 함께 전달</span>하고, 서버가 <span class="hl-green">①사이트 언어판 → ②원본 → ③그 외</span> 순으로 콘텐츠당 1건을 고릅니다.</p>
<p>감상 기록 오염도 함께 발견해 처리 중입니다 — 홈 슬라이드가 로그인 사용자의 <span class="hl-red">「내가 본 콘텐츠」에 자동 기록</span>되고 있었습니다. 수정은 완료되어 <span class="hl-amber">검토 단계</span>입니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="7" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="35">
<h2 id="%F0%9F%A7%A9-%ED%99%88-%ED%99%94%EB%A9%B4-%EB%82%98%EB%A8%B8%EC%A7%80-%EA%B2%B0%ED%95%A8-3%EA%B1%B4-span-classbadge-date83191span"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 홈 화면 나머지 결함 3건 <span class="badge-date">8/31~9/1</span></h2>
<div class="cols">
<div class="col">
<h3 id="%EC%B6%94%EC%B2%9C-vr--%EC%84%A4%EC%A0%95%EA%B3%BC-%EC%8B%A4%EC%A0%9C%EA%B0%80-%EB%8B%AC%EB%9E%90%EC%9D%8C">추천 VR — 설정과 실제가 달랐음</h3>
<ul>
<li>관리자가 바꾼 설정과 <span class="hl-red">홈에 실제로 나오는 목록이 서로 달랐습니다</span></li>
<li>원인은 과거 <span class="hl-blue">2026-06-24 시점 목록</span>이 계속 우선 노출되던 것</li>
<li>관리자 화면에 <span class="hl-green">차이를 알려주는 경고 배너</span>와 상태 배지를 신설</li>
</ul>
</div>
<div class="col">
<h3 id="%EB%A9%94%EC%9D%B8-%EC%84%A4%EC%A0%95--%ED%83%80%EC%9D%B4%ED%8B%80">메인 설정 · 타이틀</h3>
<ul>
<li>관리자 메인 설정 4종 중 <span class="hl-red">실제로 동작하지 않던 항목</span> 배선 복구</li>
<li>쓰이지 않는 <span class="hl-gray">「고객사 개수」 입력란</span> 제거</li>
<li>홈 「추천VR·최신VR」 <span class="hl-red">제목을 눌러도 아무 일도 없던 것</span>을 클릭 차단 처리하고, 더보기에 <span class="hl-green">정렬이 유지되는 링크</span> 적용</li>
</ul>
</div>
</div>
<blockquote>
<p>미리보기 썸네일이 <span class="hl-red">깨진 경우 무한 로딩 표시</span>로 위장되던 문제도 함께 수정했습니다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-class="sec" data-theme="clean" lang="ko-KR" class="sec" data-marpit-pagination="8" style="--paginate:true;--class:sec;--theme:clean;" data-marpit-pagination-total="35">
<p><span class="sec-num">Section 02</span></p>
<h2 id="vr-%EA%B0%90%EC%83%81-%ED%99%94%EB%A9%B4--%EC%96%B8%EC%96%B4%EB%A5%BC-%EB%B0%94%EA%BF%A8%EB%8A%94%EB%8D%B0-%EC%95%88-%EB%B0%94%EB%80%8C%EB%8A%94-%EA%B2%83%EB%93%A4">VR 감상 화면 — 「언어를 바꿨는데 안 바뀌는 것들」</h2>
<p>콘텐츠 언어를 전환했을 때 따라 바뀌지 않던 표시를 전수 정리했습니다.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="9" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="35">
<h2 id="%F0%9F%88%AF-vr-%EA%B0%90%EC%83%81-%ED%99%94%EB%A9%B4--%EC%96%B8%EC%96%B4%EB%A5%BC-%EB%B0%94%EA%BF%94%EB%8F%84-%EC%95%88-%EB%B0%94%EB%80%8C%EB%8D%98-%ED%91%9C%EC%8B%9C-span-classbadge-date826827span-span-classbadge-newnewspan"><img class="emoji" draggable="false" alt="🈯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f22f.svg" data-marp-twemoji=""/> VR 감상 화면 — 언어를 바꿔도 안 바뀌던 표시 <span class="badge-date">8/26~8/27</span> <span class="badge-new">NEW</span></h2>
<p><span class="hl-blue">VR 감상 화면(<code>/vr/…</code>)</span>에서 오너가 직접 언어를 바꿔 보며 발견한 결함입니다. <span class="hl-blue">이 한 건에서만 23개 작업</span>이 나왔습니다.</p>
<table>
<thead>
<tr>
<th>무엇이 문제였나</th>
<th>어떻게 해결했나</th>
</tr>
</thead>
<tbody>
<tr>
<td>카테고리 자리에 <span class="hl-red"><code>education</code>, <code>experience_center</code></span> 같은 개발용 코드가 그대로 노출</td>
<td>번역이 없으면 <span class="hl-green">요청 언어 → 한국어 → 코드</span> 순으로 대체하도록 변경</td>
</tr>
<tr>
<td>「콘텐츠 종류 / 지역 / 주소 / 언어」 칩이 <span class="hl-red">한국어 고정</span></td>
<td>이 표시들을 <span class="hl-green">콘텐츠 언어 축</span>에 연결</td>
</tr>
<tr>
<td>국가명이 <span class="hl-red">브라우저 언어로 새어 나옴</span> (일부 언어에서)</td>
<td>브라우저가 모르는 언어 4종에 대한 <span class="hl-green">3단계 대체 규칙</span> 신설</td>
</tr>
<tr>
<td>파노라마 경로 표시가 <span class="hl-red">서로 겹쳐 읽을 수 없음</span></td>
<td>가운데 줄임 + 모바일은 전체 경로 팝업</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="10" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="35">
<h2 id="%F0%9F%94%A4-%EC%96%B8%EC%96%B4-%EC%A0%84%ED%99%98-%EB%8F%99%EC%9E%91-%EC%9E%90%EC%B2%B4%EC%9D%98-%EA%B2%B0%ED%95%A8-span-classbadge-date825828span"><img class="emoji" draggable="false" alt="🔤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f524.svg" data-marp-twemoji=""/> 언어 전환 동작 자체의 결함 <span class="badge-date">8/25~8/28</span></h2>
<div class="cols">
<div class="col">
<h3 id="%EC%83%81%ED%83%9C%EA%B0%80-%EB%90%98%EB%8F%8C%EC%95%84%EC%98%A4%EC%A7%80-%EC%95%8A%EB%8D%98-%EB%AC%B8%EC%A0%9C">상태가 되돌아오지 않던 문제</h3>
<ul>
<li>언어 선택을 <span class="hl-red">취소해도 원문으로 돌아오지 않음</span></li>
<li>언어 칩이 <span class="hl-red">항상 「한국어」로 표시</span> (VRSTORY 포함)</li>
<li>360포스트가 <span class="hl-red">실시간으로 반영되지 않음</span></li>
</ul>
</div>
<div class="col">
<h3 id="%EB%B6%88%ED%95%84%EC%9A%94%ED%95%9C-%EC%84%9C%EB%B2%84-%EC%9A%94%EC%B2%AD-%EC%A0%9C%EA%B1%B0">불필요한 서버 요청 제거</h3>
<ul>
<li>「선택 → 적용」 시 같은 요청이 <span class="hl-red">2회 중복 발신</span>되던 것 3개 지점에서 제거</li>
<li><span class="hl-amber">비용 정책 판정 완료</span> — 「적용」 전에 언어를 고르기만 해도 번역이 발신되던 건은 <span class="hl-green">정산 기준을 확정</span></li>
</ul>
</div>
</div>
<table>
<thead>
<tr>
<th>부가 수정</th>
<th>내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>자동번역 태그</td>
<td>VR 상세에서 <span class="hl-red">태그만 한국어로 남던</span> 것 교정 + 잠긴 <span class="hl-blue">138건</span> 백필</td>
</tr>
<tr>
<td>일본어·중국어</td>
<td>「번역 중」 문구가 <span class="hl-red">한국어로 노출</span>되던 키 보강</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="11" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="35">
<h2 id="%F0%9F%A7%AD-%ED%97%B7%EA%B0%88%EB%A6%AC%EA%B8%B0-%EC%89%AC%EC%9A%B4-%EC%A0%90--%EB%91%90-%ED%99%94%EB%A9%B4%EC%9D%80-%EC%96%B8%EC%96%B4-%EA%B8%B0%EC%A4%80%EC%9D%B4-%EB%8B%A4%EB%A6%85%EB%8B%88%EB%8B%A4-span-classbadge-date826828span"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 헷갈리기 쉬운 점 — 두 화면은 언어 기준이 다릅니다 <span class="badge-date">8/26~8/28</span></h2>
<p>비슷해 보이지만 <span class="hl-red">같은 문제가 아닙니다.</span> 어느 화면 이야기인지 구분해 두었습니다.</p>
<table>
<thead>
<tr>
<th>화면</th>
<th>경로</th>
<th>무엇을 기준으로 언어를 정하나</th>
<th>이번 주 작업</th>
</tr>
</thead>
<tbody>
<tr>
<td><span class="hl-green">VR 감상 화면</span></td>
<td><code>/vr/…</code></td>
<td><span class="hl-blue">콘텐츠 언어</span> — 감상 화면 안에서 <span class="hl-green">사용자가 직접 고릅니다.</span> 고르지 않으면 <span class="hl-amber">원문 그대로</span></td>
<td>칩 4축 전면 교정 <span class="hl-blue">(23건)</span></td>
</tr>
<tr>
<td><span class="hl-green">VR 상세 화면</span></td>
<td><code>/vr-info/…</code></td>
<td><span class="hl-blue">사이트 언어</span> — 화면 상단 언어 설정을 <span class="hl-green">그대로 따릅니다</span></td>
<td>태그 번역 누락 · 터키어 라벨 교정</td>
</tr>
</tbody>
</table>
<blockquote>
<p>상세 화면은 <span class="hl-green">이미 사이트 언어를 따라가고 있어</span> 같은 증상이 아니었습니다 — 카테고리가 <span class="hl-blue">「자동차」 · 「自動車」 · 「Automotive」</span> 로 정상 표시됨을 실측 확인했습니다.</p>
<p><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>오너 결정 (9/2)</strong> — 지역·카테고리는 <span class="hl-green">사이트 언어 축으로 통일</span>합니다. 홈·목록·상세 <span class="hl-blue">3개 화면이 이미 사이트 언어</span>인데 <span class="hl-red">감상 화면만 콘텐츠 언어</span>라, 목록에서 「자동차」로 찾아 들어가면 감상 화면엔 「自動車」로 보이는 어긋남이 있었습니다. <span class="hl-amber">IND-6710 발주 완료</span></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="clean" lang="ko-KR" data-marpit-pagination="12" style="--paginate:true;--theme:clean;" data-marpit-pagination-total="35">
<h2 id="%F0%9F%8E%9B%EF%B8%8F-%EA%B0%90%EC%83%81-%ED%99%94%EB%A9%B4-%EC%82%AC%EC%9A%A9%EC%84%B1-5%EA%B1%B4-span-classbadge-date827828span"><img class="emoji" draggable="false" alt="🎛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f39b.svg" data-marp-twemoji=""/> 감상 화면 사용성 5건 <span class="badge-date">8/27~8/28</span></h2>
<table>
<thead>
<tr>
<th>항목</th>
<th>변경 내용</th>
</tr>
</thead>
<tbody>
<tr>
<td>「보기 방식」 6종</td>
<td><span class="hl-red">한국어 고정</span>이던 표시를 다국어화 + <span class="hl-green">ⓘ 아이콘 설명 툴팁</span> 신설</td>
</tr>
<tr>
<td>브라우저 뒤로가기</td>
<td>파노라마를 이동한 뒤 <span class="hl-red">뒤로 가면 화면 밖으로 튕기던</span> 것을 <span class="hl-green">파노라마 단위 뒤로/앞으로</span>로 변경</td>
</tr>
<tr>
<td>푸터 링크</td>
<td>LOOK360 표기 가독성 개선 + 이용약관 <span class="hl-green">새 창 연결</span></td>
</tr>
