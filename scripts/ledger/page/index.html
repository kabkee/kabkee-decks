<title>요청 원장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃: 결재 대장 — 요청 1건 = 1행, 오른쪽에 6칸 결재란(요청·발주·구현·QC·확인·보고). 확인 칸에 인주 도장. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunk: #f6f8fa; --ink: #17202a; --muted: #5b6875; --faint: #8794a0; --line: #d6dde4;
  --blue: #1f5288; --blue-soft: #e3edf8;
  --seal: #c3352b; --seal-soft: #fbe9e7;
  --ok: #2b7a4b; --ok-soft: #e2f3e8;
  --warn: #a8670f; --warn-soft: #fbf0dc;
  --loop: #6f45b8; --loop-soft: #efe8fa;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161b; --surface: #182027; --sunk: #141b21; --ink: #e5eaef; --muted: #9aa7b3; --faint: #6f7d89; --line: #2a343e;
  --blue: #86b7ea; --blue-soft: #1c2c3d; --seal: #ff6f60; --seal-soft: #3a1e1b; --ok: #62c88e; --ok-soft: #173025;
  --warn: #e6ae52; --warn-soft: #33281a; --loop: #b89cf2; --loop-soft: #2a2140; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #182027; --sunk: #141b21; --ink: #e5eaef; --muted: #9aa7b3; --faint: #6f7d89; --line: #2a343e;
  --blue: #86b7ea; --blue-soft: #1c2c3d; --seal: #ff6f60; --seal-soft: #3a1e1b; --ok: #62c88e; --ok-soft: #173025;
  --warn: #e6ae52; --warn-soft: #33281a; --loop: #b89cf2; --loop-soft: #2a2140; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--font); margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 72ch }
.meta { color: var(--faint); font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums }
a { color: var(--blue) }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }

.banner { margin-top: 16px; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px }

/* 단계 요약 — 필터 겸용 */
.stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 22px }
.stage { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 8px; cursor: pointer; min-width: 0 }
.stage .n { font: 600 22px/1.1 var(--mono); font-variant-numeric: tabular-nums }
.stage .l { font-size: 12.5px; color: var(--muted) }
.stage[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c) }
.stage .n { color: var(--c) }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px }
.tools input[type=search], .tools select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); min-width: 0 }
.tools input[type=search] { flex: 1 1 220px }
.tools label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer }
.btn { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 13px }
.btn:hover { border-color: var(--blue) }
.btn.primary { background: var(--seal); border-color: var(--seal); color: #fff }
.btn:disabled { opacity: .45; cursor: not-allowed }
.count { color: var(--faint); font-size: 12.5px; margin-left: auto; font-variant-numeric: tabular-nums }

/* 대장 */
.week { margin-top: 26px; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--faint); text-transform: uppercase;
  display: flex; gap: 10px; align-items: center }
.week::after { content: ""; flex: 1; height: 1px; background: var(--line) }
.list { display: grid; gap: 6px; margin-top: 8px }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
.row.open { border-color: var(--blue) }
.head { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 10px 12px; cursor: pointer }
.ind { font: 600 12.5px var(--mono); color: var(--blue); white-space: nowrap }
.ttl { min-width: 0 }
.ttl b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; font-size: 11.5px; color: var(--muted) }
.tag { padding: 0 6px; border-radius: 4px; background: var(--sunk); border: 1px solid var(--line) }
.tag.loop { color: var(--loop); background: var(--loop-soft); border-color: transparent }
.tag.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; color: var(--c); background: var(--cs) }

/* 결재란 */
.sign { display: grid; grid-template-columns: repeat(6, 50px); border: 1px solid var(--line); border-radius: 4px; overflow: hidden }
.cell { border-left: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; min-width: 0 }
.cell:first-child { border-left: 0 }
.cell .k { font-size: 10px; color: var(--faint); border-bottom: 1px solid var(--line); background: var(--sunk); padding: 1px 0 }
.cell .v { height: 30px; display: grid; place-items: center; font: 500 11px var(--mono); color: var(--muted); position: relative }
.cell.on .v { color: var(--ink) }
.cell.bad .v { color: var(--seal) }
.cell.warn .v { color: var(--warn) }
.cell.loop .v { color: var(--loop) }
.seal { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--seal); color: var(--seal); display: grid; place-items: center;
  font: 700 10px/1 var(--font); transform: rotate(-12deg); letter-spacing: -0.02em }
.seal.ghost { border-style: dashed; opacity: .75 }

/* 펼침 */
.body { border-top: 1px solid var(--line); padding: 14px 16px 16px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px }
.body h3 { font-size: 12px; letter-spacing: .05em; color: var(--faint); margin: 0 0 8px; font-weight: 600 }
.req { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere }
.tl { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 0 }
.tl li { display: grid; grid-template-columns: 46px 12px minmax(0, 1fr); gap: 8px; font-size: 12.5px; padding: 3px 0 }
.tl time { color: var(--faint); font: 500 11.5px var(--mono); font-variant-numeric: tabular-nums; padding-top: 1px }
.tl .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dc, var(--faint)); margin-top: 5px }
.tl .txt { overflow-wrap: anywhere; color: var(--muted) }
.tl .txt strong { color: var(--dc, var(--ink)); font-weight: 600; margin-right: 6px }
.tl li.material .txt { color: var(--ink) }
.chain { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; margin-top: 10px; color: var(--muted) }
.act { display: grid; gap: 10px; align-content: start }
.act .now { padding: 10px 12px; border-radius: 6px; background: var(--cs); color: var(--c); font-size: 13px }
.act textarea { font: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); min-height: 64px; resize: vertical; width: 100% }
.act .btns { display: flex; flex-wrap: wrap; gap: 6px }
.hist { font-size: 12px; color: var(--faint); display: grid; gap: 3px }
.toggle { font-size: 12px; color: var(--blue); background: none; border: 0; padding: 0; cursor: pointer; margin-top: 6px }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; margin-top: 18px }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 26px }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dc); margin-right: 6px }

@media (max-width: 900px) {
  .head { grid-template-columns: 76px minmax(0, 1fr); }
  .head .sign { grid-column: 1 / -1; grid-template-columns: repeat(6, minmax(0, 1fr)) }
  .head .pill { grid-column: 1 / -1; justify-self: start }
  .body { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: no-preference) { .row { transition: border-color .15s } }
</style>

<div class="wrap">
  <header>
    <h1>요청 원장</h1>
    <p class="sub">오빠가 요청한 일이 발주·구현·QC·오너 확인·회의 보고 중 어디까지 왔는지 한 줄로 보는 대장. 확인 후에 재수정·방향 변경·재발주가 생기면 도장이 «재확인 필요»로 돌아간다.</p>
    <div class="meta" id="meta">원장 불러오는 중…</div>
  </header>
  <div class="banner" id="nodb" hidden>오너 확인 체크는 claude.ai 에서 이 페이지를 열었을 때만 저장돼. 지금은 읽기 전용이야.</div>

  <section class="stages" id="stages" aria-label="단계별 건수"></section>

  <div class="tools">
    <input type="search" id="q" placeholder="IND 번호·제목·요청 원문 검색" aria-label="검색">
    <select id="proj" aria-label="프로젝트"><option value="">전체 프로젝트</option></select>
    <select id="orig" aria-label="요청 출처">
      <option value="">전체 출처</option>
      <option value="request">요청함 기록</option>
      <option value="chat">대화 발주</option>
      <option value="owner">오너 직접 생성</option>
      <option value="derived">에이전트 파생</option>
    </select>
    <label><input type="checkbox" id="loopOnly"> 왕복 있는 것만</label>
    <button class="btn" id="copy" type="button">보고 대기 목록 복사</button>
    <span class="count" id="count"></span>
  </div>

  <div id="out"></div>

  <div class="legend" aria-label="타임라인 색">
    <span style="--dc: var(--blue)">요청·발주</span><span style="--dc: var(--ink)">구현</span><span style="--dc: var(--ok)">QC·확인</span>
    <span style="--dc: var(--loop)">재작업·방향 변경·재발주</span><span style="--dc: var(--seal)">반려·QC FAIL·취소</span><span style="--dc: var(--warn)">회의</span>
  </div>
</div>

<script>
const STAGES = {
  recheck:   { l: "재확인 필요",        c: "var(--seal)", cs: "var(--seal-soft)", d: "확인한 뒤에 재작업·방향 변경·재완료가 생겼어. 다시 봐줘." },
  to_check:  { l: "확인 대기",          c: "var(--warn)", cs: "var(--warn-soft)", d: "구현이 끝났고 오빠 확인만 남았어." },
  unchecked: { l: "보고됨 · 확인 미기록", c: "var(--warn)", cs: "var(--warn-soft)", d: "회의엔 올라갔지만 확인 기록이 없어. 확인됐으면 도장만 찍어줘." },
  rework:    { l: "재수정 요청됨",       c: "var(--loop)", cs: "var(--loop-soft)", d: "오빠가 돌려보냈어. 다음 변경이 생기면 다시 확인 대기로 와." },
  to_report: { l: "보고 대기",          c: "var(--blue)", cs: "var(--blue-soft)", d: "확인 끝. 다음 회의 자료에 넣으면 돼." },
  active:    { l: "진행 중",            c: "var(--blue)", cs: "var(--blue-soft)", d: "아직 작업 중이야." },
  closed:    { l: "완료",              c: "var(--ok)",   cs: "var(--ok-soft)",   d: "확인하고 회의 보고까지 끝났어." },
  replaced:  { l: "취소 · 재발주됨",     c: "var(--loop)", cs: "var(--loop-soft)", d: "취소되고 다른 EPIC 으로 이어졌어." },
  cancelled: { l: "취소",              c: "var(--faint)", cs: "var(--sunk)",     d: "취소된 요청이야." },
};
const EV = {
  request: ["요청", "var(--blue)", 0], order: ["발주", "var(--blue)", 0], work: ["작업", "var(--ink)", 0],
  done: ["완료", "var(--ink)", 1], qc: ["QC", "var(--ok)", 0], qc_fail: ["QC 지적", "var(--seal)", 1],
  rework: ["재작업", "var(--loop)", 1], reject: ["오너 반려", "var(--seal)", 1], redirect: ["방향 변경", "var(--loop)", 1],
  added: ["추가 지시", "var(--loop)", 1], decision: ["오너 결정", "var(--blue)", 0], reopen: ["재오픈", "var(--seal)", 1],
  cancel: ["취소", "var(--seal)", 1], child_cancel: ["하위 취소", "var(--faint)", 0], follow: ["재발주", "var(--loop)", 1],
  owner_ok: ["오너 확인", "var(--ok)", 0], owner_ok_note: ["오너 확인", "var(--ok)", 0],
  agenda_set: ["회의 지정", "var(--warn)", 0], agenda: ["회의 안건", "var(--warn)", 0], report: ["회의 보고", "var(--warn)", 0],
  report_guess: ["보고 추정", "var(--warn)", 0], report_maybe: ["덱 미확인", "var(--faint)", 0],
  check: ["도장", "var(--seal)", 0],
};
const ORIGIN = { request: "요청함 기록", chat: "대화 발주", owner: "오너 직접", derived: "에이전트 파생" };
const VERDICT = { ok: "확인 완료", rework: "재수정 필요", redirect: "방향 변경", cancel: "취소 확인" };

let rows = [], checks = {}, db = null, filter = { stage: "", q: "", proj: "", orig: "", loop: false }, open = new Set(), showWork = new Set();
const $ = s => document.querySelector(s);
const kst = t => new Date(new Date(t).getTime() + 9 * 3600e3);
const md = t => { if (!t) return ""; const d = kst(t); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const last = (r, types) => r.events.filter(e => types.includes(e.type)).map(e => e.t).sort().pop() || null;

function judge(r) {
  const c = checks[r.id];
  const lc = r.lastChangeAt;
  const autoOk = last(r, ["owner_ok"]);
  const okAt = c?.verdict === "ok" ? c.at : (c?.verdict ? null : autoOk);
  const rep = [last(r, ["report"]), c?.reported?.at].filter(Boolean).sort().pop() || null;
  const guess = last(r, ["report_guess"]);
  const out = { okAt, okManual: c?.verdict === "ok", rep, guess, c };
  if (c && (c.verdict === "rework" || c.verdict === "redirect") && c.at >= lc) return { ...out, s: "rework" };
  if (r.status === "cancelled") return { ...out, s: r.next.length ? "replaced" : "cancelled" };
  if (c?.verdict === "cancel") return { ...out, s: "cancelled" };
  if (r.status !== "done") return { ...out, s: "active" };
  if (okAt && okAt >= lc) return { ...out, s: rep && rep >= lc ? "closed" : "to_report" };
  if (okAt || (c && c.at < lc)) return { ...out, s: "recheck" };
  if ((rep && rep >= lc) || (guess && guess >= lc)) return { ...out, s: "unchecked" };
  return { ...out, s: "to_check" };
}

function cells(r, j) {
  const k = r.kids, ev = r.events;
  const reqT = r.requestedAt, ordT = r.createdAt;
  const implTxt = k.impl ? `${k.implDone}/${k.impl}` : (r.status === "done" ? md(r.completedAt) : "—");
  const implCls = r.status === "done" ? "on" : (k.implDone ? "warn" : "");
  const qcTxt = k.qc ? `${k.qcDone}/${k.qc}` : "없음";
  const qcCls = k.qcFail ? "loop" : (k.qc && k.qcDone === k.qc ? "on" : (k.qc ? "warn" : ""));
  let chk = `<span>—</span>`, chkCls = "";
  if (j.s === "recheck") { chk = `<span class="seal ghost" title="확인 뒤 변경 생김">재확인</span>`; chkCls = "bad"; }
  else if (j.s === "rework") { chk = `<span>반려</span>`; chkCls = "loop"; }
  else if (j.okAt) chk = `<span class="seal" title="${esc(md(j.okAt))} 확인">${esc(md(j.okAt))}</span>`;
  let rep = "—", repCls = "";
  if (j.rep) { rep = md(j.rep); repCls = j.rep >= r.lastChangeAt ? "on" : "warn"; }
  else if (j.guess) { rep = "추정"; repCls = "warn"; }
  const c = (key, v, cls = "") => `<div class="cell ${cls}"><div class="k">${key}</div><div class="v">${v}</div></div>`;
  return `<div class="sign" aria-label="결재란">${c("요청", md(reqT), "on")}${c("발주", md(ordT), "on")}${c("구현", implTxt, implCls)}${c("QC", qcTxt, qcCls)}${c("확인", chk, chkCls)}${c("보고", rep, repCls)}</div>`;
}

function weekOf(t) {
  const d = kst(t); const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
}

function rowHtml(r, j) {
  const st = STAGES[j.s];
  const tags = [`<span class="tag">${esc(r.project)}</span>`, `<span class="tag">${ORIGIN[r.origin]}</span>`];
  if (r.loops) tags.push(`<span class="tag loop">왕복 ${r.loops}회</span>`);
  if (r.prev.length) tags.push(`<span class="tag loop">← ${r.prev.join(", ")}</span>`);
  if (r.next.length) tags.push(`<span class="tag loop">→ ${r.next.join(", ")}</span>`);
  if (r.status === "done" && !r.kids.qc) tags.push(`<span class="tag warn">QC 없음</span>`);
  if (j.rep && last(r, ["redirect", "reject", "rework", "reopen", "follow"]) > j.rep) tags.push(`<span class="tag warn">회의 후 변경</span>`);
  if (!["done", "cancelled"].includes(r.status)) tags.push(`<span class="tag">${esc(r.status)}</span>`);
  const isOpen = open.has(r.id);
  return `<article class="row ${isOpen ? "open" : ""}" data-id="${r.id}">
    <div class="head" role="button" tabindex="0" aria-expanded="${isOpen}">
      <span class="ind">${r.id}</span>
      <div class="ttl"><b title="${esc(r.title)}">${esc(r.title.replace(/^\[EPIC\]\s*/, ""))}</b><div class="tags">${tags.join("")}</div></div>
      ${cells(r, j)}
      <span class="pill" style="--c:${st.c};--cs:${st.cs}">${st.l}</span>
    </div>
    ${isOpen ? bodyHtml(r, j) : ""}
  </article>`;
}

function bodyHtml(r, j) {
  const st = STAGES[j.s], c = j.c;
  const all = showWork.has(r.id);
  const evs = r.events.filter(e => all || !["work", "qc", "decision", "child_cancel", "report_maybe"].includes(e.type));
  const hidden = r.events.length - evs.length;
  const mine = [];
  if (c) for (const h of [...(c.history || []), c]) if (h.verdict || h.reportedAt) mine.push(h);
  const tl = [...evs.map(e => ({ ...e })),
    ...mine.filter(h => h.verdict).map(h => ({ t: h.at, type: "check", text: `${VERDICT[h.verdict]}${h.note ? " — " + h.note : ""}` }))]
    .sort((a, b) => a.t < b.t ? -1 : 1);
  const li = tl.map(e => {
    const m = EV[e.type] || [e.type, "var(--faint)", 0];
    const link = e.ref && e.ref !== r.id ? ` <a href="https://kabkee-main.tailfe017f.ts.net:8443/IND/issues/${e.ref}" target="_blank" rel="noopener">${e.ref}</a>` : "";
    return `<li class="${m[2] ? "material" : ""}" style="--dc:${m[1]}"><time>${md(e.t)}</time><span class="dot"></span><span class="txt"><strong>${m[0]}</strong>${esc(e.text)}${link}${e.src && e.src !== "paperclip" ? ` <span style="color:var(--faint)">· ${esc(e.src)}</span>` : ""}</span></li>`;
  }).join("");
  const req = r.requestLine || r.requestText;
  const ro = !db;
  return `<div class="body">
    <div>
      <h3>요청</h3>
      <div class="req">${req ? esc(req) : "요청 원문이 따로 남아 있지 않아. EPIC 본문을 봐줘."}</div>
      <div class="chain"><a href="${r.url}" target="_blank" rel="noopener">paperclip 에서 열기</a>
        · 하위 ${r.kids.total}건 (구현 ${r.kids.implDone}/${r.kids.impl} · QC ${r.kids.qcDone}/${r.kids.qc}${r.kids.qcFail ? ` · 지적 ${r.kids.qcFail}` : ""})
        ${r.prev.length ? ` · 앞선 요청 ${r.prev.map(x => `<a href="#" data-jump="${x}">${x}</a>`).join(", ")}` : ""}
        ${r.next.length ? ` · 이어진 요청 ${r.next.map(x => `<a href="#" data-jump="${x}">${x}</a>`).join(", ")}` : ""}</div>
      <h3 style="margin-top:16px">흐름</h3>
      <ol class="tl">${li}</ol>
      ${hidden || all ? `<button class="toggle" data-work="${r.id}">${all ? "핵심만 보기" : `작업·QC 통과·결정 ${hidden}건 더 보기`}</button>` : ""}
    </div>
    <div class="act">
      <h3>오너 확인</h3>
      <div class="now" style="--c:${st.c};--cs:${st.cs}"><b>${st.l}</b> — ${st.d}${j.okAt && !j.okManual ? ` (must-include 기록 ${md(j.okAt)})` : ""}</div>
      <textarea id="note-${r.id}" placeholder="메모 (재수정 사유, 확인한 화면 등)" ${ro ? "disabled" : ""}>${esc(c?.note || "")}</textarea>
      <div class="btns">
        <button class="btn primary" data-v="ok" data-id="${r.id}" ${ro ? "disabled" : ""}>확인 완료</button>
        <button class="btn" data-v="rework" data-id="${r.id}" ${ro ? "disabled" : ""}>재수정 필요</button>
        <button class="btn" data-v="redirect" data-id="${r.id}" ${ro ? "disabled" : ""}>방향 변경</button>
        <button class="btn" data-v="cancel" data-id="${r.id}" ${ro ? "disabled" : ""}>취소 확인</button>
      </div>
      <div class="btns">
        <button class="btn" data-rep="${r.id}" ${ro ? "disabled" : ""}>회의 보고함 표시</button>
        ${c?.verdict ? `<button class="btn" data-clear="${r.id}" ${ro ? "disabled" : ""}>도장 지우기</button>` : ""}
      </div>
      ${mine.length ? `<div class="hist">${mine.slice().reverse().map(h => `<span>${md(h.at || h.reportedAt)} · ${h.verdict ? VERDICT[h.verdict] : "회의 보고"}${h.note ? " — " + esc(h.note) : ""}</span>`).join("")}</div>` : ""}
    </div>
  </div>`;
}

function render() {
  const judged = rows.map(r => [r, judge(r)]);
  const counts = {};
  for (const [, j] of judged) counts[j.s] = (counts[j.s] || 0) + 1;
  $("#stages").innerHTML = Object.entries(STAGES).map(([k, s]) =>
    `<button class="stage" type="button" data-stage="${k}" aria-pressed="${filter.stage === k}" style="--c:${s.c}" title="${s.d}"><span class="n">${counts[k] || 0}</span><span class="l">${s.l}</span></button>`).join("");
  const q = filter.q.trim().toLowerCase();
  const shown = judged.filter(([r, j]) =>
    (!filter.stage || j.s === filter.stage) && (!filter.proj || r.project === filter.proj) &&
    (!filter.orig || r.origin === filter.orig) && (!filter.loop || r.loops > 0) &&
    (!q || (r.id + " " + r.title + " " + r.requestLine + " " + r.requestText).toLowerCase().includes(q)));
  $("#count").textContent = `${shown.length} / ${rows.length}건`;
  if (!shown.length) { $("#out").innerHTML = `<div class="empty">조건에 맞는 요청이 없어. 위 단계 칸을 다시 눌러 필터를 풀어줘.</div>`; return; }
  let html = "", wk = null, buf = [];
  const flush = () => { if (buf.length) html += `<div class="week">${wk.slice(5).replace("-", "/")} 주 요청 · ${buf.length}건</div><div class="list">${buf.join("")}</div>`; buf = []; };
  for (const [r, j] of shown) { const w = weekOf(r.requestedAt); if (w !== wk) { flush(); wk = w; } buf.push(rowHtml(r, j)); }
  flush();
  $("#out").innerHTML = html;
}

async function writeCheck(id, patch) {
  if (!db) return;
  const r = rows.find(x => x.id === id), prev = checks[id] || {};
  const history = [...(prev.history || [])];
  if (prev.verdict && (patch.verdict !== undefined)) history.push({ verdict: prev.verdict, note: prev.note || "", at: prev.at, basis: prev.basis });
  const doc = { ...prev, ...patch, history: history.slice(-20) };
  if (patch.verdict !== undefined) { doc.at = new Date().toISOString(); doc.basis = r.lastChangeAt; }
  try { await db.doc("checks/" + id).set(JSON.parse(JSON.stringify(doc))); }
  catch (e) { alertBar(`저장 못 했어 (${e.code || "error"}). 잠시 뒤 다시 눌러줘.`); }
}
function alertBar(msg) { const b = $("#nodb"); b.textContent = msg; b.hidden = false; }

document.addEventListener("click", async ev => {
  const t = ev.target.closest("button, a, .head");
  if (!t) return;
  if (t.dataset.stage) { filter.stage = filter.stage === t.dataset.stage ? "" : t.dataset.stage; render(); return; }
  if (t.dataset.jump) { ev.preventDefault(); filter = { ...filter, stage: "", q: t.dataset.jump }; $("#q").value = t.dataset.jump; open.add(t.dataset.jump); render(); return; }
  if (t.dataset.work) { showWork.has(t.dataset.work) ? showWork.delete(t.dataset.work) : showWork.add(t.dataset.work); render(); return; }
  if (t.dataset.v) { const id = t.dataset.id; await writeCheck(id, { verdict: t.dataset.v, note: $(`#note-${id}`).value.trim() }); return; }
  if (t.dataset.rep) { await writeCheck(t.dataset.rep, { reported: { at: new Date().toISOString() } }); return; }
  if (t.dataset.clear) { await writeCheck(t.dataset.clear, { verdict: null, note: "" }); return; }
  if (t.id === "copy") { copyReport(t); return; }
  if (t.classList.contains("head")) { const id = t.closest(".row").dataset.id; open.has(id) ? open.delete(id) : open.add(id); render(); }
});
document.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList?.contains("head")) { ev.preventDefault(); ev.target.click(); } });
$("#q").addEventListener("input", e => { filter.q = e.target.value; render(); });
$("#proj").addEventListener("change", e => { filter.proj = e.target.value; render(); });
$("#orig").addEventListener("change", e => { filter.orig = e.target.value; render(); });
$("#loopOnly").addEventListener("change", e => { filter.loop = e.target.checked; render(); });

function copyReport(btn) {
  const list = rows.filter(r => judge(r).s === "to_report");
  const text = list.length ? list.map(r => `- ${r.id} ${r.title.replace(/^\[EPIC\]\s*/, "")} — ${r.url}${checks[r.id]?.note ? `\n  - 오너 메모: ${checks[r.id].note}` : ""}`).join("\n") : "(보고 대기 없음)";
  const done = ok => { btn.textContent = ok ? `${list.length}건 복사됨` : "복사 실패 — 다시 눌러줘"; setTimeout(() => btn.textContent = "보고 대기 목록 복사", 2200); };
  try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch { done(false); }
}

(async function start() {
  try {
    const d = await (await fetch("ledger.json")).json();
    rows = d.rows;
    const b = kst(d.meta.builtAt);
    $("#meta").textContent = `${d.meta.since} 이후 EPIC ${d.meta.count}건 · 원장 갱신 ${b.getUTCMonth() + 1}/${b.getUTCDate()} ${String(b.getUTCHours()).padStart(2, "0")}:${String(b.getUTCMinutes()).padStart(2, "0")} KST · 출처: ${d.meta.sources.join(" · ")}`;
    const projs = [...new Set(rows.map(r => r.project))].sort();
    $("#proj").insertAdjacentHTML("beforeend", projs.map(p => `<option>${esc(p)}</option>`).join(""));
  } catch (e) { $("#meta").textContent = "원장 데이터를 못 불러왔어. 페이지를 다시 열어줘."; return; }
  render();
  db = await window.claude?.use?.("db") ?? null;
  if (!db) { $("#nodb").hidden = false; return; }
  db.collection("checks").onSnapshot(snap => {
    checks = {}; for (const d of snap.docs) if (d.exists) checks[d.id] = d.data();
    render();
  }, e => alertBar(`확인 기록 연결이 끊겼어 (${e.code}). 페이지를 다시 열어줘.`));
  render();
})();
</script>
